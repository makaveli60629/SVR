<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090510">
<meta name="description" content="SVR Poker Mobile — standalone play-money poker for Android and iPhone.">
<title>SVR Poker Mobile</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="../logo.png">
<link rel="stylesheet" href="./app.css">
</head>
<body>
<div class="app-shell">
<header class="topbar">
<a class="brand" href="./"><img src="../logo.png" alt="SVR Poker"><span>SVR POKER <b>MOBILE</b></span></a>
<div class="wallet"><span>PLAY CHIPS</span><strong id="chipBalance">25,000</strong></div>
</header>
<main id="view" class="view"></main>
<nav class="bottom-nav" aria-label="Mobile navigation">
<button class="active" data-tab="home">Home</button>
<button data-tab="tournaments">Events</button>
<button data-tab="avatar">Avatar</button>
<button data-tab="shop">Shop</button>
<button data-tab="account">Account</button>
</nav>
</div>
<div id="toast" class="toast" role="status"></div>
<script src="./bridge.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
