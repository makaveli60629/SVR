name: Phase 347 Android Check

on:
  pull_request:
    paths:
      - 'game/modules/phase347_android_single_controller_seated_gameplay_apk_release_lock.js'
      - 'game/modules/phase340_platform_manifest.js'
      - 'game/android.html'
      - 'game/manifest.json'
      - 'game/android-release.json'
      - 'game/tools/phase347-android-static-test.mjs'
      - 'app-update-checker.js'
      - 'site/android/index.html'
      - 'site/downloads/index.html'
      - '.github/workflows/phase347-android-check.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check game/modules/phase347_android_single_controller_seated_gameplay_apk_release_lock.js
          node --check game/modules/phase340_platform_manifest.js
          node --check app-update-checker.js
          node --check game/tools/phase347-android-static-test.mjs
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('game/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('game/android-release.json','utf8'))"
      - name: Validate Android authority and APK gate
        run: node game/tools/phase347-android-static-test.mjs
