name: Build Retro Vault v2 APK

on:
  push:
    branches:
      - retro-vault-v2-build
    paths:
      - 'retro-vault-android-v2/**'
      - '.github/workflows/retro-vault-v2-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle -p retro-vault-android-v2 assembleDebug --stacktrace

      - name: Verify APK exists
        run: |
          test -s retro-vault-android-v2/app/build/outputs/apk/debug/app-debug.apk
          unzip -t retro-vault-android-v2/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: retro-vault-v2-android-test
          path: retro-vault-android-v2/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
