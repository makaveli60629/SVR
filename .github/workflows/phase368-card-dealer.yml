name: Phase 368 Card Dealer Check

on:
  pull_request:
    paths:
      - 'game/index.html'
      - 'game/android.html'
      - 'game/camera3.html'
      - 'game/modules/phase368_card_dealer_animation_lock.js'
      - 'game/modules/phase368_card_dealer_motion.js'
      - 'game/tools/phase368-card-dealer-static-test.mjs'
      - 'game/docs/PHASE_368_CARD_DEALER_ANIMATION_LOCK.md'
      - '.github/workflows/phase368-card-dealer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase368-card-dealer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate dealer runtime
        run: |
          node --check game/modules/phase368_card_dealer_animation_lock.js
          node --check game/modules/phase368_card_dealer_motion.js
          node game/tools/phase368-card-dealer-static-test.mjs
      - name: Preserve protected runtime contracts
        run: |
          node game/tools/phase364-device-xr-geometry-static-test.mjs
          node game/tools/phase365-android-seated-ux-branding-static-test.mjs
          node game/tools/phase367-android-physical-device-static-test.mjs
