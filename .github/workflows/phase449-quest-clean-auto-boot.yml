name: Phase 449 Quest Table Room Safety

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quest-table-room:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Audit protected table room
        shell: bash
        run: |
          set -euo pipefail
          node --check game/modules/phase446_quest_lab_table_seat_lock.js
          node --check game/modules/phase449_quest_clean_boot_teleport_height_lock.js
          node --check game/tools/phase449-quest-clean-boot-audit.mjs
          node game/tools/phase449-quest-clean-boot-audit.mjs
      - name: Validate lobby and table movement separation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SVR_TELEPORT_ENABLED=true' game/quest-lobby.html
          grep -q 'SVR_TELEPORT_DISABLED = true' game/modules/phase453_quest_direct_table_room_lock.js
          grep -q 'PHASE-467-QUEST-LOBBY-TABLE-DEALER-ENTRY' game/quest.html
