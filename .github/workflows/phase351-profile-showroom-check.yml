name: Phase 351 Profile Showroom Check

on:
  pull_request:
    paths:
      - 'site/profile.html'
      - 'site/css/phase351-profile-showroom.css'
      - 'site/js/phase351-profile-showroom.js'
      - 'site/js/phase346-avatar-viewer.js'
      - 'site/data/avatar-catalog.json'
      - 'site/tools/phase351-profile-showroom-test.mjs'
      - 'site/roadmap.html'
      - 'game/manifest.json'
      - 'game/android-release.json'
      - '.github/workflows/phase351-profile-showroom-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate showroom modules
        run: |
          node --check site/js/phase351-profile-showroom.js
          node --check site/js/phase346-avatar-viewer.js
          node --check site/tools/phase351-profile-showroom-test.mjs
      - name: Validate showroom contract
        run: node site/tools/phase351-profile-showroom-test.mjs
      - name: Validate canonical site navigation
        run: node site/tools/phase350-site-integrity-audit.mjs
