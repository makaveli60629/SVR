name: Phase 356 Android Site AI Check

on:
  pull_request:
    paths:
      - 'game/android.html'
      - 'game/android-release.json'
      - 'game/manifest.json'
      - 'game/modules/phase340_platform_*.js'
      - 'game/modules/phase356_*.js'
      - 'game/tools/phase356-android-real-device-static-test.mjs'
      - 'matrix.js'
      - 'support-chat-bot.js'
      - 'site/js/phase356-profile-legend-pedestal.js'
      - 'backend/phase345/**'
      - 'docs/PHASE-356-**'
      - 'sw.js'
      - '.github/workflows/phase356-android-site-ai-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check game/modules/phase340_platform_manifest.js
          node --check game/modules/phase340_platform_core_loader.js
          node --check game/modules/phase356_android_real_device_freeze_recovery_lock.js
          node --check game/tools/phase356-android-real-device-static-test.mjs
          node --check matrix.js
          node --check support-chat-bot.js
          node --check site/js/phase356-profile-legend-pedestal.js
          node --check backend/phase345/src/server.js
          node --check sw.js
      - name: Validate Phase 356 contracts
        run: node game/tools/phase356-android-real-device-static-test.mjs
      - name: Validate JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('game/android-release.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('game/manifest.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('backend/phase345/package.json','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('docs/PHASE-356-PLATFORM-UNITY-BLUEPRINT.json','utf8'))"
      - name: Validate backend dependency graph
        working-directory: backend/phase345
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
