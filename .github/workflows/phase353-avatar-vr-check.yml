name: Phase 353 VR Avatar Check

on:
  pull_request:
    paths:
      - 'game/avatar.html'
      - 'game/avatar-vr.html'
      - 'game/modules/phase353_**'
      - 'game/tools/phase353-avatar-vr-static-test.mjs'
      - 'site/data/avatar-catalog.json'
      - 'site/data/public-page-registry.json'
      - 'game/manifest.json'
      - 'game/android-release.json'
      - '.github/workflows/phase353-avatar-vr-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check game/modules/phase353_vr_avatar_dressing_room_live_pedestal_lock.js
          node --check game/tools/phase353-avatar-vr-static-test.mjs
      - name: Validate VR dressing room contract
        run: node game/tools/phase353-avatar-vr-static-test.mjs
      - name: Verify avatar assets
        run: |
          test -f game/assets/models/eric/eric.fbx
          test -f game/assets/models/claudia/claudia.fbx
          test -f game/avatar-vr.html
