name: Phase 411 Tournament Bot Action Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase411-tournament-bot-action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Validate tournament page replacement
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-411-TOURNAMENT-100-FIELD-ROTATION-LOCK' game/tournaments.html
          grep -q 'NEXT TOURNAMENT SLOT' game/tournaments.html
          grep -q 'LAST TOURNAMENT RESULT' game/tournaments.html
          grep -q 'REIKI OPEN 100' game/tournaments.html
          grep -q '100 PLAYER LOCAL TEST FIELD' game/tournaments.html
          grep -q 'SHARE TEST TOURNAMENT' game/tournaments.html
          ! grep -q '>PLAY PRACTICE<' game/tournaments.html
          ! grep -q '>PLAY REGULAR<' game/tournaments.html
          grep -q 'phase411_tournament_field_rotation.js?v=phase411' game/tournaments.html
          grep -q 'phase411_tournament_flow.css?v=phase411' game/tournaments.html

      - name: Validate 100-player field and five-hour schedule
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-411-TOURNAMENT-100-FIELD-ROTATION-LOCK' game/modules/phase411_tournament_field_rotation.js
          grep -q "svr411_tournament_field_size.*100" game/modules/phase411_tournament_field_rotation.js
          grep -q 'Math.min(199' game/modules/phase411_tournament_field_rotation.js
          grep -q 'FIELD-1' game/modules/phase411_tournament_field_rotation.js
          grep -q 'SLOT_MS=5\*60\*60\*1000' game/modules/phase411_tournament_field_rotation.js
          grep -q 'GATHERING TABLE' game/modules/phase411_tournament_field_rotation.js
          grep -q 'FINAL TABLE' game/modules/phase411_tournament_field_rotation.js
          grep -q 'localSimulationOnly:true' game/modules/phase411_tournament_field_rotation.js
          grep -q 'liveMultiplayer:false' game/modules/phase411_tournament_field_rotation.js
          node --check game/modules/phase411_tournament_field_rotation.js
          node <<'NODE'
          const first=20,last=10,field=100;
          const names=new Set();
          for(let i=0;i<field-1;i++)names.add(`${i%first}:${Math.floor(i/first)%last}:${Math.floor(i/(first*last))+1}`);
          if(names.size!==99)throw new Error(`expected 99 unique bot slots, got ${names.size}`);
          if(5*60*60*1000!==18000000)throw new Error('five-hour cadence wrong');
          console.log('100-player local field and five-hour cadence passed.');
          NODE

      - name: Validate independent bot strategy guard
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-411-BOT-INDEPENDENCE-RAISE-CASCADE-GUARD-LOCK' game/modules/phase411_bot_independence_guard.js
          grep -q "Claudia.*CONSERVATIVE" game/modules/phase411_bot_independence_guard.js
          grep -q "Eric.*BALANCED" game/modules/phase411_bot_independence_guard.js
          grep -q "Maya.*PRESSURE" game/modules/phase411_bot_independence_guard.js
          grep -q "Darius.*LOOSE AGGRESSIVE" game/modules/phase411_bot_independence_guard.js
          grep -q "Nova.*TRICKY" game/modules/phase411_bot_independence_guard.js
          grep -q 'raiseLocked=true' game/modules/phase411_bot_independence_guard.js
          grep -q 'otherRaises.length>=2' game/modules/phase411_bot_independence_guard.js
          grep -q 'SVR_PHASE411_BOT_QA' game/modules/phase411_bot_independence_guard.js
          node --check game/modules/phase411_bot_independence_guard.js

      - name: Validate action readability and player box fit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-411-MOBILE-ACTION-READABILITY-LOCK' game/modules/phase411_mobile_action_readability.js
          grep -q 'phase411-action-toast' game/modules/phase411_mobile_action_readability.js
          grep -q 'phase411-action-ticker' game/modules/phase411_mobile_action_readability.js
          grep -q 'WINS POT' game/modules/phase411_mobile_action_readability.js
          grep -q 'SVR_PHASE411_ACTION_QA' game/modules/phase411_mobile_action_readability.js
          grep -q 'font:1000 clamp(15px,4.8vw,22px)' game/styles/phase411_mobile_action_readability.css
          grep -q '.player-meta strong{font-size:10px' game/styles/phase411_mobile_action_readability.css
          node --check game/modules/phase411_mobile_action_readability.js

      - name: Validate active mobile loader
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ensurePhase411Layer' game/modules/phase407_mobile_fit_login.js
          grep -q 'phase411_tournament_field_rotation.js?v=phase411' game/modules/phase407_mobile_fit_login.js
          grep -q 'phase411_bot_independence_guard.js?v=phase411' game/modules/phase407_mobile_fit_login.js
          grep -q 'phase411_mobile_action_readability.js?v=phase411' game/modules/phase407_mobile_fit_login.js
          grep -q 'phase411_mobile_action_readability.css?v=phase411' game/modules/phase407_mobile_fit_login.js
          node --check game/modules/phase407_mobile_fit_login.js

      - name: Preserve poker engine human input Quest and APK
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK' game/modules/phase403_android_gameplay.js
          grep -q 'VISUAL_LEFT_SEAT_ORDER=Object.freeze(\[0,5,1,2,3,4\])' game/modules/phase403_android_gameplay.js
          grep -q 'PHASE-410-MOBILE-HUMAN-INPUT-LOCK' game/modules/phase410_mobile_human_input_lock.js
          grep -q 'PHASE-409-MOBILE-PLAYER-TURN-GUARD-LOCK' game/modules/phase409_mobile_player_turn_guard.js
          grep -q 'PHASE-408-HOLDEM-STREET-CALL-TRUTH-LOCK' game/modules/phase408_holdem_street_call_truth.js
          grep -q 'PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK' game/quest.html
          git fetch origin main --depth=1
          test -z "$(git diff origin/main -- game/modules/phase403_android_gameplay.js game/modules/phase403_android_pot_rules.js game/modules/phase398_android_raise_rules.js game/modules/phase410_mobile_human_input_lock.js game/modules/phase409_mobile_player_turn_guard.js game/quest.html game/modules/phase396_quest_seated_clean_table_deal_lock.js)"
          grep -q '"apkVersionName": "0.1.0-rc2"' game/android-release.json
          grep -q '"apkVersionCode": 2' game/android-release.json
          grep -q '"forceUpdate": false' game/android-release.json
          grep -q '"showUpdatePrompt": false' game/android-release.json
          grep -q '"nativeApkRebuild": false' game/android-release.json
