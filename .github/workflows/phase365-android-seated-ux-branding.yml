name: Phase 365 Android Seated UX Branding Check

on:
  pull_request:
    paths:
      - 'game/android.html'
      - 'game/manifest.json'
      - 'game/android-release.json'
      - 'game/modules/phase340_platform_manifest.js'
      - 'game/modules/phase365_android_seated_ux_branding_gyro_alignment_lock.js'
      - 'game/tools/phase365-android-seated-ux-branding-static-test.mjs'
      - 'site/profile.html'
      - 'site/avatar.html'
      - 'game/avatar-vr.html'
      - '.github/workflows/phase365-android-seated-ux-branding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase365-static:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Phase 365 module syntax
        run: node --check game/modules/phase365_android_seated_ux_branding_gyro_alignment_lock.js

      - name: Validate platform manifest syntax
        run: node --check game/modules/phase340_platform_manifest.js

      - name: Run Phase 365 static acceptance
        run: node game/tools/phase365-android-seated-ux-branding-static-test.mjs

      - name: Validate release JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('game/manifest.json','utf8')); JSON.parse(require('fs').readFileSync('game/android-release.json','utf8'));"

      - name: Preserve Phase 364 device geometry contract
        run: node game/tools/phase364-device-xr-geometry-static-test.mjs

      - name: Preserve Phase 363 Android integrated contract
        run: node game/tools/phase363-android-integrated-core-static-test.mjs
