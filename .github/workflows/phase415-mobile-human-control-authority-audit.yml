name: Phase 415 Mobile Human Control Authority Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase415-mobile-human-control-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Validate Phase 415 authority is active
        shell: bash
        run: |
          set -euo pipefail
          test -s game/modules/phase415_mobile_human_control_authority.js
          grep -q 'PHASE-415-MOBILE-HUMAN-CONTROL-AUTHORITY-LOCK' game/modules/phase415_mobile_human_control_authority.js
          grep -q "import './phase415_mobile_human_control_authority.js?v=phase415'" game/modules/phase414_human_turn_rotation_authority.js
          grep -q 'SVR_PHASE415_HUMAN_CONTROL_QA' game/modules/phase415_mobile_human_control_authority.js
          grep -q 'nullHandoffRecovery:true' game/modules/phase415_mobile_human_control_authority.js
          grep -q 'touchDownNormalization:true' game/modules/phase415_mobile_human_control_authority.js
          grep -q "document.addEventListener('pointerdown',normalizeBeforePress,true)" game/modules/phase415_mobile_human_control_authority.js
          grep -q "document.addEventListener('touchstart',normalizeBeforePress" game/modules/phase415_mobile_human_control_authority.js
          node --check game/modules/phase415_mobile_human_control_authority.js
          node --check game/modules/phase414_human_turn_rotation_authority.js

      - name: Simulate deterministic human turn recovery
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const ORDER=[0,5,1,2,3,4];
          const pending=(g,p)=>!!p&&!p.folded&&!p.allIn&&p.stack>0&&(!p.acted||p.streetBet<g.currentBet);
          const nextPendingAfter=(g,from)=>{const pos=ORDER.indexOf(from);if(pos<0)return null;for(let step=1;step<=ORDER.length;step++){const i=ORDER[(pos+step)%ORDER.length];if(pending(g,g.players[i]))return i}return null};
          const candidate=g=>{if(Number.isInteger(g.lastActor)){const x=nextPendingAfter(g,g.lastActor);if(x!==null)return x}const anchor=Number.isInteger(g.roundAnchor)?g.roundAnchor:(g.street===0?g.bigBlind:g.dealer);if(Number.isInteger(anchor)){const x=nextPendingAfter(g,anchor);if(x!==null)return x}if(Number.isInteger(g.expectedActor)&&pending(g,g.players[g.expectedActor]))return g.expectedActor;if(Number.isInteger(g.activePlayer)&&pending(g,g.players[g.activePlayer]))return g.activePlayer;return null};
          const players=()=>Array.from({length:6},(_,index)=>({index,stack:15000,streetBet:100,acted:true,folded:false,allIn:false}));
          {
            const p=players();p[0].acted=false;const g={players:p,currentBet:100,street:0,bigBlind:1,roundAnchor:1,lastActor:4,activePlayer:null,expectedActor:null};
            if(candidate(g)!==0)throw new Error('null active-player handoff must recover user after Darius');
          }
          {
            const p=players();p[0].acted=false;const g={players:p,currentBet:100,street:0,bigBlind:1,roundAnchor:1,lastActor:4,activePlayer:5,expectedActor:5};
            if(candidate(g)!==0)throw new Error('wrong bot handoff must recover user');
          }
          {
            const p=players();p[0].acted=false;p[4].folded=true;p[3].acted=true;const g={players:p,currentBet:100,street:0,bigBlind:1,roundAnchor:1,lastActor:3,activePlayer:null,expectedActor:null};
            if(candidate(g)!==0)throw new Error('folded Darius must not prevent user turn after Maya');
          }
          {
            const p=players();p[0].acted=false;p[0].streetBet=100;p[5].acted=false;p[5].streetBet=100;const g={players:p,currentBet:300,street:1,dealer:4,roundAnchor:4,lastActor:4,activePlayer:5,expectedActor:5};
            p[0].streetBet=100;p[5].streetBet=300;
            if(candidate(g)!==0)throw new Error('user owing a later raise must be next after preceding responder is complete');
          }
          {
            const p=players();p[0].acted=true;p[0].streetBet=100;const g={players:p,currentBet:100,street:0,bigBlind:1,roundAnchor:1,lastActor:4,activePlayer:5,expectedActor:5};
            if(candidate(g)===0)throw new Error('matched user who already acted must not get duplicate turn');
          }
          console.log('Phase 415 deterministic mobile human-turn recovery scenarios passed.');
          NODE

      - name: Preserve real action path and protected poker rules
        shell: bash
        run: |
          set -euo pipefail
          grep -q "all('.actions button\[data-a\]').forEach(button=>button.addEventListener('click',()=>action(button.dataset.a)))" game/modules/phase403_android_gameplay.js
          grep -q 'PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK' game/modules/phase403_android_gameplay.js
          grep -q 'PHASE-403-ANDROID-SIDE-POT-RULES-LOCK' game/modules/phase403_android_pot_rules.js
          grep -q 'PHASE-398-ANDROID-RAISE-SIZING-RULES-LOCK' game/modules/phase398_android_raise_rules.js
          grep -q 'PHASE-404-ANDROID-MOBILE-DECISION-SAFETY-LOCK' game/modules/phase404_android_mobile_safety.js
          grep -q 'PHASE-413-MOBILE-HUMAN-ACTION-HARD-LOCK' game/modules/phase413_mobile_human_action_hard_lock.js
          grep -q 'PHASE-414-HUMAN-TURN-ROTATION-AUTHORITY-LOCK' game/modules/phase414_human_turn_rotation_authority.js
          grep -q 'PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK' game/quest.html
          git fetch origin main --depth=1
          test -z "$(git diff origin/main -- game/modules/phase403_android_gameplay.js game/modules/phase403_android_pot_rules.js game/modules/phase398_android_raise_rules.js game/modules/phase404_android_mobile_safety.js game/modules/phase413_mobile_human_action_hard_lock.js game/quest.html)"

      - name: Preserve APK policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"apkVersionName": "0.1.0-rc2"' game/android-release.json
          grep -q '"apkVersionCode": 2' game/android-release.json
          grep -q '"forceUpdate": false' game/android-release.json
          grep -q '"showUpdatePrompt": false' game/android-release.json
          grep -q '"nativeApkRebuild": false' game/android-release.json
