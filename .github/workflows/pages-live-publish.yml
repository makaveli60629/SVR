name: SVR Pages Live Publish

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
  workflow_run:
    workflows: ['SVR Production Auto Deploy']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svr-pages-live
  cancel-in-progress: true

jobs:
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Verify Phase 392 payload
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-392-PUBLIC-ANDROID-SHOWCASE-POLISH-LOCK' index.html
          test "$(grep -o 'class=\"btn ' index.html | wc -l)" -eq 3
          grep -q 'PHASE-392-SITE-PRESENTATION-POLISH-LOCK' site/phase392-site-polish.js
          grep -q 'PHASE-392-MARKET-ADS-NO-DUPLICATE-NAV-LOCK' site/js/market-ads.js
          grep -q 'PHASE-392-ANDROID-CONTINUOUS-PLAY-RANKING-LOCK' game/android-stable.html
          grep -q 'SVR_PHASE392_ANDROID_QA' game/modules/phase392_android_gameplay.js
          test -s game/styles/phase392_android_gameplay.css
          grep -q 'PHASE-392-CAMERA3-TABLE-SHOWCASE-LOCK' game/camera3-showcase.html
          grep -q 'PHASE-392-AVATAR-PEDESTAL-UPRIGHT-LOCK' site/avatar.html
          test -s support-chat-bot.js
          test -s site-local-counter.js
          test -s downloads/svr-poker-android-rc2.apk
          grep -q 'PHASE-392-PUBLIC-ANDROID-SHOWCASE-POLISH-LOCK' deploy-health.json
          grep -q '"androidContinuousPlay": true' deploy-health.json
          grep -q '"duplicateFloatingMenuRemoved": true' deploy-health.json
          test -f CNAME
          grep -qx 'svrpoker.com' CNAME
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4