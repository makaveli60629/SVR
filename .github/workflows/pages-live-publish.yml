name: SVR Pages Live Publish

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
  workflow_run:
    workflows: ['SVR Production Auto Deploy']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svr-pages-live
  cancel-in-progress: true

jobs:
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Verify Phase 389 production payload
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-389-FULL-AUDIT-VISIBLE-FIXES-LOCK' index.html
          grep -q 'site-public-hooks.js?v=phase389' index.html
          grep -q 'game/quest.html?v=phase389' index.html
          grep -q 'game/android.html?channel=stable&amp;v=phase389' index.html
          grep -q 'site/avatar.html?v=phase389' index.html
          grep -q 'site/profile.html?v=phase389' index.html
          test -s launch.css
          test -s matrix.js
          test -s site-public-hooks.js
          test -s logo.png
          grep -q 'phase389-full-audit-visible-fixes' site-public-hooks.js
          grep -q 'PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK' site/index.html
          grep -q 'camera3-live.html?v=phase389' site/phase383-home-restore.js
          test -s site/avatar.html
          test -s site/profile.html
          test -s site/js/phase389-avatar-room.js
          test -s site/js/phase389-profile-showroom.js
          test -s site/css/phase389-avatar-profile-visible-refresh.css
          grep -q 'PHASE-389-AVATAR-DRESSING-ROOM-VISIBLE-REFRESH-LOCK' site/avatar.html
          grep -q 'PHASE-389-PROFILE-AVATAR-SHOWROOM-VISIBLE-REFRESH-LOCK' site/profile.html

          test -s game/index.html
          test -s game/quest.html
          grep -q 'PHASE-389-FULL-AUDIT-VISIBLE-FIXES-LOCK' game/index.html
          grep -q 'phase389_runtime_health_visibility' game/index.html
          ! grep -q "^import './modules/phase388_front_south_seat_authority" game/index.html
          test -s game/modules/phase389_runtime_health_visibility.js
          test -s game/camera3-live.html
          test -s game/modules/phase389_camera3_live_preview.js
          grep -q 'PHASE-389-CAMERA3-LIVE-PREVIEW-ROUTE-LOCK' game/camera3-live.html
          grep -q 'PHASE389_CAMERA3_PRODUCTION_LIGHTING' game/modules/phase389_camera3_live_preview.js
          grep -q 'camera3-live.html?v=phase389' game/camera3.html
          grep -q 'camera3-live.html?v=phase389' game/cam3.html
          grep -q 'camera3-live.html?v=phase389' game/preview.html

          grep -q 'PHASE-389-ANDROID-RESPONSIVE-TABLE-LAYOUT-LOCK' game/android.html
          grep -q 'PHASE-389-ANDROID-RESPONSIVE-TABLE-LAYOUT-LOCK' game/android-tabletop.html
          test -s game/styles/phase389_android_responsive_layout.css
          test -s game/modules/phase389_android_responsive_layout.js
          grep -q 'phase389-full-audit-visible-fixes-v2' sw.js
          grep -q 'phase389-full-audit-visible-fixes-v2' pwa-sw.js
          grep -q 'pwa-phase389' manifest.webmanifest
          test -s game/assets/models/eric/eric.fbx
          test -s game/assets/models/table.glb
          test -s game/assets/table.fbx
          test -s downloads/svr-poker-android-rc2.apk
          grep -q 'PHASE-389-FULL-AUDIT-VISIBLE-FIXES-LOCK' deploy-health.json
          grep -q '"camera3DedicatedRoute": true' deploy-health.json
          grep -q '"camera3ProductionLighting": true' deploy-health.json
          grep -q '"questDuplicateFrontSouthAuthorityDisabled": true' deploy-health.json
          grep -q '"androidResponsivePortrait": true' deploy-health.json
          grep -q '"avatarVisibleRefresh": true' deploy-health.json
          grep -q '"profileLiveSavedAvatar": true' deploy-health.json
          test -f CNAME
          grep -qx 'svrpoker.com' CNAME

      - name: Configure GitHub Pages for Actions
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Phase 389 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Phase 389 audited visible fixes
        id: deployment
        uses: actions/deploy-pages@v4
