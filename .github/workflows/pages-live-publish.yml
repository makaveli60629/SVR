name: SVR Pages Live Verify

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['SVR Production Auto Deploy']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: svr-pages-live-verify
  cancel-in-progress: true

jobs:
  verify-live-source:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout authoritative main source
        uses: actions/checkout@v5
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Checkout authoritative gh-pages publish branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 1

      - name: Verify published source matches main
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test -s publish/deploy-health.json
          test -s publish/index.html
          test -s publish/game/index.html
          test -f publish/CNAME
          grep -qx 'svrpoker.com' publish/CNAME
          SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import json, os
          health = json.load(open('publish/deploy-health.json', encoding='utf-8'))
          expected = os.environ['SOURCE_SHA']
          actual = health.get('source_sha')
          if actual != expected:
              raise SystemExit(f'Published source mismatch: expected {expected}, got {actual}')
          if health.get('source_branch') != 'main':
              raise SystemExit(f"Unexpected published source branch: {health.get('source_branch')}")
          if health.get('workflow') != 'SVR Production Auto Deploy':
              raise SystemExit(f"Unexpected publisher: {health.get('workflow')}")
          print(f"Verified gh-pages source {actual} build {health.get('build', 'unknown')}")
          PY

      - name: Verify protected current runtime files exist
        shell: bash
        run: |
          set -euo pipefail
          test -s publish/game/modules/phase422_quest_table_geometry_theme_lock.js
          test -s publish/game/modules/phase422_quest_seated_inspection_lock.js
          test -s publish/game/modules/phase422_quest_table_prop_alignment_flex_lock.js
          test -s publish/site/config/player-api.json
          test -s publish/game/config/tournament-api.json
          python3 -m json.tool publish/site/config/player-api.json >/dev/null
          python3 -m json.tool publish/game/config/tournament-api.json >/dev/null
