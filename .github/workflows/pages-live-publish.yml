name: SVR Pages Live Publish

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
  workflow_run:
    workflows: ['SVR Production Auto Deploy']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svr-pages-live
  cancel-in-progress: true

jobs:
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Verify Phase 384 production payload
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SVR Poker | Public Launch Page' index.html
          grep -q 'PHASE-384-ERIC-QUEST-ANDROID-POLISH-LOCK' index.html
          grep -q 'site-public-hooks.js?v=phase384' index.html
          grep -q 'site/index.html?v=phase384' index.html
          grep -q 'Preview Site' index.html
          grep -q 'Preview Game' index.html
          test -s launch.css
          test -s matrix.js
          test -s site-public-hooks.js
          test -s logo.webp
          grep -q 'PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK' site/index.html
          grep -q 'Explore SVR Poker' site/index.html
          grep -q 'SVR Store' site/index.html
          grep -q 'Tournaments' site/index.html
          grep -q 'SVR AI Concierge' site/index.html
          test -s site/phase383-home-restore.css
          test -s site/phase383-home-restore.js
          test -f site/profile.html
          test -f site/avatar.html
          test -s site/js/phase384-avatar-site-lock.js
          grep -q 'PHASE-384-ERIC-DEFAULT-AVATAR-SITE-LOCK' site/js/phase384-avatar-site-lock.js
          grep -q 'PHASE-384-QUEST-ERIC-TABLE-QUICKPLAY-POLISH-LOCK' game/index.html
          grep -q 'phase381_vr_runtime_lock' game/index.html
          grep -q 'phase384_quest_quickplay_polish' game/index.html
          grep -q 'PHASE-384-QUEST-ERIC-TABLE-QUICKPLAY-POLISH-LOCK' game/modules/phase384_quest_quickplay_polish.js
          grep -q 'PHASE384_SVR_TABLE_LOGO' game/modules/phase384_quest_quickplay_polish.js
          grep -q 'PHASE-380-ANDROID-PLAYABLE-POKER-PRESENTATION-LOCK' game/android-stable.html
          grep -q 'PHASE-384-ANDROID-ONE-PAGE-3D-CHIP-WINNER-LOCK' game/android-stable.html
          grep -q 'onePageFit:true' game/android-stable.html
          grep -q 'cardBackLogo:true' game/android-stable.html
          grep -q 'singleCenteredSuit:true' game/android-stable.html
          grep -q 'chipAnimation:true' game/android-stable.html
          grep -q 'winnerFlashAndSound:true' game/android-stable.html
          grep -q 'phase384-eric-quest-android-polish' sw.js
          grep -q 'phase384-eric-quest-android-polish' pwa-sw.js
          grep -q 'pwa-phase384' manifest.webmanifest
          test -s game/assets/models/eric/eric.fbx
          test -s game/assets/models/table.glb
          test -s game/assets/table.fbx
          test -s downloads/svr-poker-android-rc2.apk
          grep -q 'PHASE-384-ERIC-QUEST-ANDROID-POLISH-LOCK' deploy-health.json
          grep -q '"androidOnePageFit": true' deploy-health.json
          grep -q '"questSingleEricDealer": true' deploy-health.json
          grep -q '"questSvrLogoOnTable": true' deploy-health.json
          grep -q '"profileDefaultTexturedEric": true' deploy-health.json
          grep -q '"fullWebsiteRestored": true' deploy-health.json
          grep -q '"cacheRecovery": true' deploy-health.json
          grep -q '"cleanTreePublish": true' deploy-health.json
          test -f CNAME
          grep -qx 'svrpoker.com' CNAME

      - name: Configure GitHub Pages for Actions
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Phase 384 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Phase 384 game polish
        id: deployment
        uses: actions/deploy-pages@v4
