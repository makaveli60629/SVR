name: SVR Pages Live Publish

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['SVR Production Auto Deploy']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svr-pages-live
  cancel-in-progress: true

jobs:
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Verify locked original Matrix public page
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SVR Poker | Public Launch Page' index.html
          grep -q 'id="binary-rain"' index.html
          grep -q 'Preview Site' index.html
          grep -q 'Preview Game' index.html
          grep -q 'Leave Message' index.html
          ! grep -q 'PHASE 379 LIVE RECOVERY' index.html
          ! grep -q 'PLAY ANDROID — JOIN NOW' index.html
          test -s launch.css
          test -s matrix.js
          test -s site-public-hooks.js
          test -s logo.webp
          grep -q 'PHASE-379-ANDROID-STANDALONE-JOIN-NOW-LOCK' game/android-stable.html
          grep -q 'JOIN NOW' game/android-stable.html
          test -f CNAME
          grep -qx 'svrpoker.com' CNAME

      - name: Configure GitHub Pages for Actions
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload locked Matrix Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy original Matrix public page
        id: deployment
        uses: actions/deploy-pages@v4
