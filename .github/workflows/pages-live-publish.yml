name: SVR Pages Live Publish

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
  workflow_run:
    workflows: ['SVR Production Auto Deploy']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svr-pages-live
  cancel-in-progress: true

jobs:
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Verify Phase 395 Quest production payload
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-395-QUEST-BROWSER-TABLE-GAMEPLAY-FIX-LOCK' index.html
          grep -q 'launch-quest.css?v=phase395' index.html
          grep -q 'PHASE-395-QUEST-BROWSER-PUBLIC-PAGE-CENTER-LOCK' launch-quest.css
          grep -q 'PHASE-395-QUEST-BROWSER-TABLE-GAMEPLAY-FIX-LOCK' game/quest.html
          grep -q 'PHASE-395-QUEST-BROWSER-TABLE-GAMEPLAY-FIX-LOCK' game/index.html
          grep -q 'phase395_quest_browser_table_gameplay_fix.js?v=phase395' game/index.html
          grep -q 'phase395_quest_eric_floor_guard.js?v=phase395' game/index.html
          test -s game/modules/phase395_quest_browser_table_gameplay_fix.js
          test -s game/modules/phase395_quest_eric_floor_guard.js
          grep -q 'TARGET_TABLE_WIDTH=3.58' game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'DEALER_GAP=0.22' game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'SEATED_RAIL_GAP=0.10' game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'SVR_PHASE395_ERIC_HARD_GUARD_QA' game/modules/phase395_quest_eric_floor_guard.js

          # Protected Android remains the approved Phase 394 table.
          grep -q 'PHASE-394-ANDROID-TABLE-PRESENTATION-POLISH-LOCK' game/android-stable.html
          grep -q 'phase394_android_table_polish.css' game/android-stable.html
          grep -q 'phase394_android_table_polish.js' game/android-stable.html
          test -s game/modules/phase393_android_gameplay.js
          test -s game/modules/phase394_android_table_polish.js
          test -s game/styles/phase393_android_table_layout.css
          test -s game/styles/phase394_android_table_polish.css

          grep -q 'PHASE-395-QUEST-BROWSER-TABLE-GAMEPLAY-FIX-LOCK' deploy-health.json
          grep -q '"questBrowserCentered": true' deploy-health.json
          grep -q '"questTableWidthMeters": 3.58' deploy-health.json
          grep -q '"questBaseLineAlignedToFloor": true' deploy-health.json
          grep -q '"questEricHardFloorGuard": true' deploy-health.json
          grep -q '"questEricDealerGapMeters": 0.22' deploy-health.json
          grep -q '"questSeatedRailGapMeters": 0.10' deploy-health.json
          grep -q '"questMinimumPhysicalCardMeshes": 17' deploy-health.json
          grep -q '"questLightingBoost": true' deploy-health.json
          grep -q '"androidLockedUnchangedForPhase395": true' deploy-health.json
          grep -q '"androidFeaturedSponsorDefault": "REIKI"' deploy-health.json
          test -s downloads/svr-poker-android-rc2.apk
          test -f CNAME
          grep -qx 'svrpoker.com' CNAME

      - name: Configure GitHub Pages for Actions
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Phase 395 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Phase 395 Quest browser and gameplay fix
        id: deployment
        uses: actions/deploy-pages@v4
