name: SVR Pages Live Publish

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
  workflow_run:
    workflows: ['SVR Production Auto Deploy']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svr-pages-live
  cancel-in-progress: true

jobs:
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Verify Phase 400 production payload
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-400-IPHONE-SAFARI-WEB-GAME-LOCK' index.html
          grep -q 'iphone.html?v=phase400' index.html
          test -s game/iphone.html
          test -s game/iphone-tabletop.html
          test -s game/modules/phase400_ios_safari_adapter.js
          test -s game/styles/phase400_ios_safari_compat.css
          grep -q 'phase400_ios_safari_adapter.js?v=phase400' game/android-stable.html
          grep -q 'phase400_ios_safari_compat.css?v=phase400' game/android-stable.html
          grep -q 'PHASE-399-ANDROID-LEARNING-WINNER-CHIPS-SPONSOR-LOCK' game/android-stable.html
          grep -q 'PHASE-398-ANDROID-RAISE-SIZING-SMOOTHNESS-LOCK' game/android-stable.html
          grep -q 'PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK' game/quest.html
          grep -q 'PHASE-400-IPHONE-SAFARI-WEB-GAME-LOCK' deploy-health.json
          grep -q '"iosIphoneSafariAvailable": true' deploy-health.json
          grep -q '"iosSafeAreaInsets": true' deploy-health.json
          grep -q '"iosSafariAudioUnlock": true' deploy-health.json
          grep -q '"androidExactBestFiveEvaluator": true' deploy-health.json
          grep -q '"questTeleportEnabled": false' deploy-health.json
          test -s downloads/svr-poker-android-rc2.apk
          test -f CNAME
          grep -qx 'svrpoker.com' CNAME

      - name: Configure GitHub Pages for Actions
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Phase 400 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Phase 400
        id: deployment
        uses: actions/deploy-pages@v4
