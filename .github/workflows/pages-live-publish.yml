name: SVR Pages Live Publish

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['SVR Production Auto Deploy']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svr-pages-live
  cancel-in-progress: true

jobs:
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Verify Phase 381 restored website and lobby payload
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SVR Poker | Public Launch Page' index.html
          grep -q 'id="binary-rain"' index.html
          grep -q 'Preview Site' index.html
          grep -q 'Launch VR Room' index.html
          grep -q 'Leave Message' index.html
          grep -q 'PHASE-381-PUBLIC-STATUS-AI-RESTORATION-LOCK' index.html
          grep -q 'data-svr-status="server"' index.html
          grep -q 'data-svr-status="database"' index.html
          grep -q 'data-svr-ask-ai' index.html
          test -s launch.css
          test -s matrix.js
          test -s site-public-hooks.js
          test -s site-local-counter.js
          test -s support-chat-bot.js
          test -s logo.webp
          grep -q 'PHASE-381-FULL-WEBSITE-HOMEPAGE-RESTORATION-LOCK' site/index.html
          grep -q 'SVR Website' site/index.html
          grep -q 'Open Android Lobby' site/index.html
          grep -q 'Download APK' site/index.html
          test -f site/profile.html
          test -f site/avatar.html
          test -f site/store.html
          test -f site/tournaments.html
          grep -q 'PHASE-381-ANDROID-VR-LOBBY-SOUND-TABLE-LOCK' game/android-lobby.html
          grep -q 'ENTER VR LOBBY' game/android-lobby.html
          grep -q 'PHASE-380-ANDROID-PLAYABLE-POKER-PRESENTATION-LOCK' game/android-stable.html
          grep -q 'PHASE-381-ANDROID-SOUND-COMPACT-LOGO-CARDS-LOCK' game/android-stable.html
          grep -q 'SVR card back' game/android-stable.html
          grep -q 'PHASE-380-ORIGINAL-UPLOADED-TABLE-AUTHORITY-LOCK' game/modules/phase380_original_table_authority_lock.js
          grep -q 'PHASE-381-ANDROID-QUEST-LOBBY-TABLE-WATCHDOG-LOCK' game/modules/phase381_table_lobby_watchdog_lock.js
          grep -q 'PHASE-380-QUEST-PROCEDURAL-TABLE-FALLBACK-LOCK' game/modules/phase379_quest_procedural_table_authority.js
          test -s game/assets/models/table.glb
          test -s game/assets/table.fbx
          test -s downloads/svr-poker-android-rc2.apk
          grep -q 'PHASE-381-SITE-LOBBY-RESTORATION-LOCK' deploy-health.json
          grep -q '"fullWebsiteHomepage": true' deploy-health.json
          grep -q '"publicStatusLights": true' deploy-health.json
          grep -q '"androidLobbyFirst": true' deploy-health.json
          grep -q '"questTableWatchdog": true' deploy-health.json
          grep -q '"cleanTreePublish": true' deploy-health.json
          test -f CNAME
          grep -qx 'svrpoker.com' CNAME

      - name: Configure GitHub Pages for Actions
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Phase 381 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Phase 381 restored website and game lobbies
        id: deployment
        uses: actions/deploy-pages@v4
