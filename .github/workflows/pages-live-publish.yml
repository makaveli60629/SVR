name: SVR Pages Live Publish

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
  workflow_run:
    workflows: ['SVR Production Auto Deploy']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svr-pages-live
  cancel-in-progress: true

jobs:
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1
      - name: Verify Phase 405 production payload
        shell: bash
        run: |
          set -euo pipefail
          test -s platform-device.js
          test -s game/android.html
          test -s game/android-tabletop.html
          test -s game/android-stable-phase405.html
          test -s game/iphone.html
          test -s game/iphone-tabletop.html
          test -s game/modules/phase405_mobile_ui.js
          test -s game/modules/phase405_vox_voice.js
          test -s game/modules/phase405_tournament_scheduler.js
          test -s site/js/phase405-profile-portrait.js
          grep -q 'PHASE-405-PLATFORM-MOBILE-SOCIAL-LOCK' game/android.html
          grep -q 'phase405_mobile_ui.js?v=phase405' game/android-stable-phase405.html
          grep -q 'phase405_vox_voice.js?v=phase405' game/android-stable-phase405.html
          grep -q 'PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK' game/modules/phase403_android_gameplay.js
          grep -q 'PHASE-404-ANDROID-MOBILE-DECISION-SAFETY-LOCK' game/modules/phase404_android_mobile_safety.js
          grep -q 'PHASE-400-IPHONE-SAFARI-WEB-GAME-LOCK' game/modules/phase400_ios_safari_adapter.js
          grep -q 'PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK' game/quest.html
          grep -q 'PHASE-405-PLATFORM-MOBILE-SOCIAL-LOCK' deploy-health.json
          grep -q '"androidSingleBurnPile": true' deploy-health.json
          grep -q '"androidPokerHandsButton": true' deploy-health.json
          grep -q '"androidTournamentEveryHours": 5' deploy-health.json
          grep -q '"androidProductionMatchServerConfigured": false' deploy-health.json
          grep -q '"nativeApkRebuild": false' deploy-health.json
          test -s downloads/svr-poker-android-rc2.apk
          test -f CNAME
          grep -qx 'svrpoker.com' CNAME
      - name: Configure GitHub Pages for Actions
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Phase 405 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy Phase 405
        id: deployment
        uses: actions/deploy-pages@v4
