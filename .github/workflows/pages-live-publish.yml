name: SVR Pages Live Publish

on:
  workflow_dispatch:
  push:
    branches: [gh-pages]
  workflow_run:
    workflows: ['SVR Production Auto Deploy']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: svr-pages-live
  cancel-in-progress: true

jobs:
  deploy-pages:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout authoritative gh-pages branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Verify Phase 404 production payload
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-404-ANDROID-MOBILE-DECISION-SAFETY-LOCK' index.html
          grep -q 'android.html?channel=stable&v=phase404' index.html
          test -s game/android.html
          test -s game/android-tabletop.html
          test -s game/android-stable-phase404.html
          test -s game/modules/phase404_android_mobile_safety.js
          test -s game/styles/phase404_android_mobile_safety.css
          test -s game/modules/phase403_android_gameplay.js
          test -s game/modules/phase403_android_pot_rules.js
          test -s game/modules/phase403_android_table_clarity.js
          grep -q 'ALL_IN_CONFIRM_MS=2600' game/modules/phase404_android_mobile_safety.js
          grep -q 'RUNOUT_STEP_MS=720' game/modules/phase404_android_mobile_safety.js
          grep -q 'decisionStripInsideRaisePanel' game/modules/phase404_android_mobile_safety.js
          grep -q 'PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK' game/modules/phase403_android_gameplay.js
          grep -q 'VISUAL_LEFT_SEAT_ORDER=Object.freeze(\[0,5,1,2,3,4\])' game/modules/phase403_android_gameplay.js
          grep -q 'PHASE-400-IPHONE-SAFARI-WEB-GAME-LOCK' game/iphone.html
          grep -q 'PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK' game/quest.html
          grep -q 'PHASE-404-ANDROID-MOBILE-DECISION-SAFETY-LOCK' deploy-health.json
          grep -q '"androidAllInDoubleTapGuard": true' deploy-health.json
          grep -q '"androidPacedAllInRunout": true' deploy-health.json
          grep -q '"androidDecisionStripInsideRaisePanel": true' deploy-health.json
          grep -q '"androidSessionPlaytestReport": true' deploy-health.json
          grep -q '"androidSidePotEngine": true' deploy-health.json
          grep -q '"androidTournamentSharedRegistrationBackendLive": false' deploy-health.json
          grep -q '"iosIphoneSafariAvailable": true' deploy-health.json
          grep -q '"questTeleportEnabled": false' deploy-health.json
          test -s downloads/svr-poker-android-rc2.apk
          test -f CNAME
          grep -qx 'svrpoker.com' CNAME

      - name: Configure GitHub Pages for Actions
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Phase 404 Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy Phase 404
        id: deployment
        uses: actions/deploy-pages@v4
