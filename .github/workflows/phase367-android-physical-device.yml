name: Phase 367 Android Physical Device Check

on:
  pull_request:
    paths:
      - 'game/android.html'
      - 'game/manifest.json'
      - 'game/android-release.json'
      - 'game/modules/phase340_platform_manifest.js'
      - 'game/modules/phase367_android_physical_device_viewport_touch_acceptance_lock.js'
      - 'game/tools/phase365-android-seated-ux-branding-static-test.mjs'
      - 'game/tools/phase367-android-physical-device-static-test.mjs'
      - 'game/tools/phase367-android-physical-device-browser-acceptance.cjs'
      - '.github/workflows/phase367-android-physical-device.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase367-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Phase 367 contracts
        run: |
          node --check game/modules/phase367_android_physical_device_viewport_touch_acceptance_lock.js
          node --check game/modules/phase340_platform_manifest.js
          node --check game/tools/phase367-android-physical-device-browser-acceptance.cjs
          node game/tools/phase367-android-physical-device-static-test.mjs
          python3 -m json.tool game/manifest.json >/dev/null
          python3 -m json.tool game/android-release.json >/dev/null

      - name: Preserve Android, profile and VR authorities
        run: |
          node game/tools/phase365-android-seated-ux-branding-static-test.mjs
          node game/tools/phase364-device-xr-geometry-static-test.mjs
          node game/tools/phase363-android-integrated-core-static-test.mjs
          node game/tools/phase357-android-table-status-showdown-ante-static-test.mjs
          node game/tools/phase347-android-static-test.mjs
          node site/tools/phase351-profile-showroom-test.mjs
          node site/tools/phase366-profile-live-camera-test.mjs
          node game/tools/phase353-avatar-vr-static-test.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Start local SVR site
        run: |
          python3 -m http.server 4173 > /tmp/svr-phase367-http.log 2>&1 &
          echo $! > /tmp/svr-phase367-http.pid
          sleep 2

      - name: Verify physical-device viewport and touch behavior
        env:
          SVR_TEST_BASE: http://127.0.0.1:4173
        run: node game/tools/phase367-android-physical-device-browser-acceptance.cjs

      - name: Re-run Phase 365 seated UX
        env:
          SVR_TEST_BASE: http://127.0.0.1:4173
        run: node game/tools/phase365-android-seated-ux-branding-browser-acceptance.cjs

      - name: Confirm dedicated Android full-game gate remains present
        run: |
          test -f .github/workflows/phase354-android-full-game.yml
          test -f game/tools/phase354-android-browser-acceptance.cjs

      - name: Upload HTTP log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase367-http-log
          path: /tmp/svr-phase367-http.log
