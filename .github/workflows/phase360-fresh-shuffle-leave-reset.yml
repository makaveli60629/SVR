name: Phase 360 Fresh Shuffle Leave Reset

on:
  pull_request:
    paths:
      - 'game/index.html'
      - 'game/android.html'
      - 'game/manifest.json'
      - 'game/modules/phase360_fresh_shuffle_leave_reset_continuous_table_lock.js'
      - 'game/modules/phase359_dual_platform_gameplay_continuity_lock.js'
      - 'game/modules/phase334_table_layout_gesture_poker_lock.js'
      - 'game/modules/phase336_authoritative_engine.js'
      - 'game/tools/phase360-fresh-shuffle-leave-reset-static-test.mjs'
      - 'game/tools/phase360-session-browser-acceptance.cjs'
      - 'game/tools/phase359-dual-platform-static-test.mjs'
      - 'game/tools/phase357-android-table-status-showdown-ante-static-test.mjs'
      - 'game/tools/phase358-quest-static-test.mjs'
      - 'game/phase360-release.json'
      - '.github/workflows/phase360-fresh-shuffle-leave-reset.yml'
  workflow_dispatch:

jobs:
  shuffle-session-full-game:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate Phase 360 and protected release contracts
        run: |
          node --check game/modules/phase360_fresh_shuffle_leave_reset_continuous_table_lock.js
          node --check game/tools/phase360-session-browser-acceptance.cjs
          node game/tools/phase360-fresh-shuffle-leave-reset-static-test.mjs
          node game/tools/phase359-dual-platform-static-test.mjs
          node game/tools/phase357-android-table-status-showdown-ante-static-test.mjs
          node game/tools/phase358-quest-static-test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Start local SVR site
        run: |
          python3 -m http.server 4173 > /tmp/svr-phase360-http.log 2>&1 &
          echo $! > /tmp/svr-phase360-http.pid
          sleep 2
      - name: Verify secure shuffle, leave reset, and rejoin
        env:
          SVR_TEST_BASE: http://127.0.0.1:4173
        run: node game/tools/phase360-session-browser-acceptance.cjs
      - name: Re-run Android complete-hand acceptance
        env:
          SVR_TEST_BASE: http://127.0.0.1:4173
        run: node game/tools/phase357-android-browser-acceptance.cjs
      - name: Re-run Quest complete-hand acceptance
        env:
          SVR_TEST_BASE: http://127.0.0.1:4173
        run: node game/tools/phase358-quest-browser-acceptance.cjs
      - name: Upload HTTP log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase360-http-log
          path: /tmp/svr-phase360-http.log
