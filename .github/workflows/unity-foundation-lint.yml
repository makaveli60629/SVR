name: Unity Foundation Validation

on:
  pull_request:
    paths:
      - 'unity/SVRPoker/**'
      - 'docs/PHASE-46*-UNITY-*.md'
      - 'docs/SVR_MASTER_MANIFEST.md'
      - 'docs/SVR_MASTER_MANIFEST.json'
      - '.github/workflows/unity-foundation-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f unity/SVRPoker/ProjectSettings/ProjectVersion.txt
          test -f unity/SVRPoker/Packages/manifest.json
          test -f unity/SVRPoker/Assets/SVR/Core/SVRBootstrap.cs
          test -f unity/SVRPoker/Assets/SVR/Editor/SVRBuild.cs
          grep -F "6000.3.15f1 (c1aa84e375f6)" unity/SVRPoker/ProjectSettings/ProjectVersion.txt

      - name: Validate package JSON
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path("unity/SVRPoker/Packages/manifest.json")
          data = json.loads(p.read_text())
          assert isinstance(data.get("dependencies"), dict)
          assert "com.unity.modules.webgl" in data["dependencies"]
          assert "com.unity.modules.androidjni" in data["dependencies"]
          print("Unity package manifest valid")

      - name: Validate cloud build entry points
        shell: bash
        run: |
          set -euo pipefail
          grep -F "BuildWebCloud" unity/SVRPoker/Assets/SVR/Editor/SVRBuild.cs
          grep -F "BuildAndroidCloud" unity/SVRPoker/Assets/SVR/Editor/SVRBuild.cs
          grep -F "WebGLCompressionFormat.Brotli" unity/SVRPoker/Assets/SVR/Editor/SVRBuild.cs

      - name: Validate master handoff manifest
        shell: python
        run: |
          import json
          from pathlib import Path

          md = Path("docs/SVR_MASTER_MANIFEST.md").read_text()
          assert "Current implementation phase:** Phase 465" in md
          assert "unity/SVRPoker" in md
          assert "SVR.Editor.SVRBuild.BuildWebCloud" in md
          assert "SVR.Editor.SVRBuild.BuildAndroidCloud" in md
          assert "PR #264" in md

          data = json.loads(Path("docs/SVR_MASTER_MANIFEST.json").read_text())
          assert data["project"]["currentPhase"] == 465
          assert data["project"]["pullRequest"] == 264
          assert data["runtimeTracks"]["unity"]["root"] == "unity/SVRPoker"
          assert data["runtimeTracks"]["unity"]["editorVersion"] == "6000.3.15f1"
          assert data["phase465"]["repositoryFoundation"] == "complete"
          print("SVR Phase 465 master manifests valid")
