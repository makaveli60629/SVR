name: Phase 448 Quest Comfort Input

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  quest-comfort:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate Quest comfort lab
        shell: bash
        run: |
          set -euo pipefail
          test -s game/labs/pro-playtest/phase448-quest-comfort-input.js
          test -s game/tools/phase448-quest-comfort-input-audit.mjs
          node --check game/labs/pro-playtest/phase448-quest-comfort-input.js
          node --check game/tools/phase448-quest-comfort-input-audit.mjs
          node game/tools/phase448-quest-comfort-input-audit.mjs
          grep -q 'TABLE_TELEPORT_ENABLED = false' game/labs/pro-playtest/phase448-quest-comfort-input.js
      - name: Validate current lobby locomotion remains enabled
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SVR_TELEPORT_ENABLED=true' game/quest-lobby.html
          grep -q 'thumbstickForwardBackHeadDirection: true' game/modules/movement_phase169_locomotion_polish_lock.js
          grep -q 'thumbstickLeftRightSnapTurn45: true' game/modules/movement_phase169_locomotion_polish_lock.js
