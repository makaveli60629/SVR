name: Phase 422 Production Backend Security Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase422-production-backend-security-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase422-production-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Protect current game and public release authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test -z "$(git diff origin/main -- index.html game/android.html game/iphone.html game/quest.html game/modules/phase403_android_gameplay.js game/modules/phase403_android_pot_rules.js game/modules/phase421_vr_table_final_polish.js)"
          grep -q 'PHASE-420-MOBILE-RELEASE-TRUTH-LOCK' game/android.html
          grep -q 'PHASE-420-MOBILE-RELEASE-TRUTH-LOCK' game/iphone.html
          grep -q 'PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK' game/quest.html
          grep -q 'PHASE-421-VR-TABLE-FINAL-POLISH-LOCK' game/modules/phase421_vr_table_final_polish.js
          grep -q 'PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK' game/modules/phase403_android_gameplay.js

      - name: Validate active backend fail-safe health behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/server.js
          grep -q 'PHASE-422-PRODUCTION-BACKEND-HEALTH-HARDENING-LOCK' backend/server.js
          grep -q "app.disable('x-powered-by')" backend/server.js
          grep -q "Cache-Control','no-store'" backend/server.js
          grep -q "X-Content-Type-Options','nosniff'" backend/server.js
          grep -q 'ALLOWED_ORIGINS' backend/server.js
          grep -q 'databaseVerified:false' backend/server.js
          grep -q 'accountApiConfigured' backend/server.js
          grep -q 'tournamentApiConfigured' backend/server.js
          grep -q 'Math.min(100' backend/server.js
          grep -q 'X-Request-ID' backend/server.js
          ! grep -q 'dev-secret' backend/server.js

      - name: Validate enterprise admin backend fails closed
        shell: bash
        run: |
          set -euo pipefail
          node --check backend/backend/src/server.js
          grep -q "ADMIN_JWT_SECRET is required; refusing insecure startup" backend/backend/src/server.js
          grep -q "ALLOWED_ORIGIN is required; refusing open CORS startup" backend/backend/src/server.js
          grep -q "jwt.sign.*adminJwtSecret" backend/backend/src/server.js
          grep -q "jwt.verify.*adminJwtSecret" backend/backend/src/server.js
          ! grep -q "ADMIN_JWT_SECRET ||" backend/backend/src/server.js
          ! grep -q 'dev-secret' backend/backend/src/server.js

      - name: Validate secret and signing hygiene
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^\.env$' .gitignore
          grep -q '^backend/\.env$' .gitignore
          grep -q '^\*\.jks$' .gitignore
          grep -q '^\*\.keystore$' .gitignore
          grep -q '^\*\*/keystore.properties$' .gitignore
          grep -q '^ADMIN_JWT_SECRET=$' backend/.env.example
          grep -q '^STORE_CHECKOUT_ENABLED=false$' backend/.env.example
          if git grep -nE 'AKIA[0-9A-Z]{16}' -- ':!node_modules/**' ':!**/node_modules/**'; then
            echo 'Possible committed AWS access key detected.' >&2
            exit 1
          fi

      - name: Preserve truthful cloud and APK boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"deploymentState": "cloud-endpoint-pending"' site/config/player-api.json
          grep -q '"accountApiEndpointConfigured": false' site/config/player-api.json
          grep -q '"apiBase": ""' site/config/player-api.json
          grep -q '"sharedRegistrationBackendLive": false' game/config/tournament-api.json
          grep -q '"backgroundPushLive": false' game/config/tournament-api.json
          grep -q '"apkVersionName": "0.1.0-rc2"' game/android-release.json
          grep -q '"apkVersionCode": 2' game/android-release.json
          grep -q '"forceUpdate": false' game/android-release.json
          grep -q '"showUpdatePrompt": false' game/android-release.json
          grep -q '"nativeApkRebuild": false' game/android-release.json
          python3 -m json.tool site/config/player-api.json >/dev/null
          python3 -m json.tool game/config/tournament-api.json >/dev/null
          python3 -m json.tool game/android-release.json >/dev/null
