name: Phase 359 Dual Platform Gameplay Continuity

on:
  pull_request:
    paths:
      - 'game/index.html'
      - 'game/android.html'
      - 'game/assets/table.fbx'
      - 'game/modules/phase359_dual_platform_gameplay_continuity_lock.js'
      - 'game/tools/phase359-dual-platform-static-test.mjs'
      - 'game/tools/phase357-android-browser-acceptance.cjs'
      - 'game/tools/phase358-quest-browser-acceptance.cjs'
      - 'game/android-release.json'
      - 'game/quest-release.json'
      - 'game/dual-platform-release.json'
      - '.github/workflows/phase359-dual-platform-gameplay-continuity.yml'
  workflow_dispatch:

jobs:
  dual-platform-full-game:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shared gameplay continuity contracts
        run: |
          node --check game/modules/phase359_dual_platform_gameplay_continuity_lock.js
          node --check game/tools/phase357-android-browser-acceptance.cjs
          node --check game/tools/phase358-quest-browser-acceptance.cjs
          node game/tools/phase359-dual-platform-static-test.mjs
          node game/tools/phase357-android-table-status-showdown-ante-static-test.mjs
          node game/tools/phase358-quest-static-test.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Start local SVR site
        run: |
          python3 -m http.server 4173 > /tmp/svr-phase359-http.log 2>&1 &
          echo $! > /tmp/svr-phase359-http.pid
          sleep 2
      - name: Run Android complete-hand acceptance
        env:
          SVR_TEST_BASE: http://127.0.0.1:4173
        run: node game/tools/phase357-android-browser-acceptance.cjs
      - name: Run Quest complete-hand acceptance
        env:
          SVR_TEST_BASE: http://127.0.0.1:4173
        run: node game/tools/phase358-quest-browser-acceptance.cjs
      - name: Upload HTTP log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase359-dual-platform-http-log
          path: /tmp/svr-phase359-http.log
