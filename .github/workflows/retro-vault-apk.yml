name: Build Retro Vault APK
on:
  pull_request:
    paths:
      - 'retro-vault-android/**'
      - '.github/workflows/retro-vault-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle -p retro-vault-android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: retro-vault-android-test
          path: retro-vault-android/app/build/outputs/apk/debug/app-debug.apk
