name: Phase 396 Seated Quest and Android Dealer Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase396-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Validate Phase 396 Quest seated mode
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK' game/quest.html
          grep -q 'PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK' game/index.html
          grep -q 'phase396_quest_seated_clean_table_deal_lock.js?v=phase396' game/index.html
          grep -q 'SVR_TELEPORT_DISABLED=true' game/index.html
          grep -q "target.searchParams.set('teleport','off')" game/quest.html
          grep -q 'SVR_PHASE396_TELEPORT_DISABLED=true' game/modules/phase396_quest_seated_clean_table_deal_lock.js
          grep -q 'SVR_PHASE395_SEAT_USER' game/modules/phase396_quest_seated_clean_table_deal_lock.js
          grep -q 'TABLETOP_ASSET' game/modules/phase396_quest_seated_clean_table_deal_lock.js
          grep -q 'PHASE341_CANONICAL_TABLE_PRESENTATION_ROOT' game/modules/phase396_quest_seated_clean_table_deal_lock.js
          grep -q 'SVR_POKER_NEXT_HAND' game/modules/phase396_quest_seated_clean_table_deal_lock.js
          grep -q 'cardMeshes>=17' game/modules/phase396_quest_seated_clean_table_deal_lock.js
          grep -q '"teleportEnabled": false' game/manifest.json
          grep -q '"hardSeatedAtFrontTable": true' game/manifest.json
          grep -q '"tabletopNonCardOverlaysHidden": true' game/manifest.json

      - name: Validate Phase 396 Android rotation polish
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-396-ANDROID-BURN-DEALER-POLISH-LOCK' game/android.html
          grep -q 'PHASE-396-ANDROID-BURN-DEALER-POLISH-LOCK' game/android-tabletop.html
          grep -q 'PHASE-396-ANDROID-BURN-DEALER-POLISH-LOCK' game/android-stable.html
          grep -q 'phase396_android_burn_dealer_polish.css?v=phase396' game/android-stable.html
          grep -q 'phase396_android_burn_dealer_polish.js?v=phase396' game/android-stable.html
          grep -q 'burn-zone' game/styles/phase396_android_burn_dealer_polish.css
          grep -q 'community-cards .card' game/styles/phase396_android_burn_dealer_polish.css
          grep -q 'dealer-button' game/styles/phase396_android_burn_dealer_polish.css
          grep -q 'dealer-readout' game/styles/phase396_android_burn_dealer_polish.css
          grep -q 'SVR_PHASE396_ANDROID_QA' game/modules/phase396_android_burn_dealer_polish.js
          grep -q 'game.dealer' game/modules/phase396_android_burn_dealer_polish.js
          grep -q 'SVR_PHASE396_ANDROID_WRAPPER_QA' game/android-tabletop.html
          grep -q '"burnTrayAboveCommunityCards": true' game/manifest.json
          grep -q '"movingDealerButton": true' game/manifest.json
          grep -q '"dealerNameReadout": true' game/manifest.json

      - name: Validate protected gameplay, Phase 398 betting rules, and APK policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-397-ANDROID-BETTING-ORDER-CHECK-CALL-RAISE-LOCK' game/modules/phase393_android_gameplay.js
          grep -q 'PHASE-398-ANDROID-RAISE-SIZING-SMOOTHNESS-LOCK' game/modules/phase393_android_gameplay.js
          grep -q 'clockwiseOrderAfter' game/modules/phase393_android_gameplay.js
          grep -q 'const first=nextEligible(big)' game/modules/phase393_android_gameplay.js
          grep -q 'const next=nextEligible(state.dealer)' game/modules/phase393_android_gameplay.js
          grep -q 'lastFullRaiseSize' game/modules/phase393_android_gameplay.js
          grep -q 'shortAllInDoesNotResetFullRaise' game/modules/phase393_android_gameplay.js
          grep -q 'SVR_PHASE398_ANDROID_BETTING_QA' game/modules/phase393_android_gameplay.js
          grep -q 'PHASE-398-ANDROID-RAISE-CONTROL-GUARD-LOCK' game/modules/phase397_android_action_button_guard.js
          grep -q 'phase397_android_action_button_guard.js?v=phase398' game/android-stable.html
          grep -q 'phase398_android_raise_rules.js?v=phase398' game/modules/phase393_android_gameplay.js
          grep -q 'TURN_SECONDS=15' game/modules/phase393_android_common.js
          grep -q 'PHASE-394-ANDROID-TABLE-PRESENTATION-POLISH-LOCK' game/modules/phase394_android_table_polish.js
          grep -q 'id="raiseSlider"' game/android-stable.html
          grep -q 'id="soundToggle"' game/android-stable.html
          grep -q 'id="featuredSponsor"' game/android-stable.html
          grep -q '"apkVersionName": "0.1.0-rc2"' game/android-release.json
          grep -q '"apkVersionCode": 2' game/android-release.json
          grep -q '"forceUpdate": false' game/android-release.json
          grep -q '"showUpdatePrompt": false' game/android-release.json
          grep -q '"nativeApkRebuild": false' game/android-release.json

      - name: Validate syntax, JSON, files, and cache
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 -m json.tool game/manifest.json >/dev/null
          python3 -m json.tool game/android-release.json >/dev/null
          python3 -m json.tool update/app-version.json >/dev/null
          node --check site-public-hooks.js
          node --check sw.js
          node --check pwa-sw.js
          node --check game/modules/phase396_quest_seated_clean_table_deal_lock.js
          node --check game/modules/phase395_quest_browser_table_gameplay_fix.js
          node --check game/modules/phase395_quest_eric_floor_guard.js
          node --check game/modules/phase393_android_common.js
          node --check game/modules/phase393_android_evaluator.js
          node --check game/modules/phase393_android_gameplay.js
          node --check game/modules/phase394_android_table_polish.js
          node --check game/modules/phase396_android_burn_dealer_polish.js
          node --check game/modules/phase397_android_action_button_guard.js
          node --check game/modules/phase398_android_raise_rules.js
          grep -q 'svr-poker-phase396-seated-quest-android-dealer-v1' sw.js
          grep -q 'svr-poker-phase396-seated-quest-android-dealer-v1' pwa-sw.js
          test -s game/styles/phase396_android_burn_dealer_polish.css
          test -s game/assets/models/table.glb
          test -s game/assets/models/eric/eric.fbx
          test -s downloads/svr-poker-android-rc2.apk
