name: SVR Android APK RC2 Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/android/**'
      - 'logo.png'
      - '.github/workflows/android-apk-release.yml'

permissions:
  contents: write

concurrency:
  group: svr-android-apk-rc2
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Android project and release manifests
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            native/android
            logo.png
            game/android-release.json
            update/app-version.json
            downloads

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build and verify APK RC2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/android/app/src/main/res/drawable
          cp logo.png native/android/app/src/main/res/drawable/svr_logo.png
          gradle -p native/android :app:assembleDebug --no-daemon --stacktrace
          APK_SOURCE='native/android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK_SOURCE"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_SOURCE"
          cp "$APK_SOURCE" svr-poker-android-rc2.apk
          sha256sum svr-poker-android-rc2.apk > svr-poker-android-rc2.apk.sha256
          APK_SHA="$(cut -d' ' -f1 svr-poker-android-rc2.apk.sha256)"
          echo "APK_SHA=$APK_SHA" >> "$GITHUB_ENV"

      - name: Publish GitHub Release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          # SVR Poker Android 0.1.0-rc2

          Phase 379 Android test release.

          - Version code: 2
          - Stable entry: JOIN NOW before cards
          - Old SIT/SEAT Android lobby excluded
          - Bundled offline table recovery
          - SHA-256: ${APK_SHA}

          Uninstall the earlier SVR Poker test APK before installing RC2.
          EOF
          if gh release view android-rc2 >/dev/null 2>&1; then
            gh release edit android-rc2 --title 'SVR Poker Android 0.1.0-rc2' --notes-file release-notes.md
          else
            gh release create android-rc2 --title 'SVR Poker Android 0.1.0-rc2' --notes-file release-notes.md --prerelease
          fi
          gh release upload android-rc2 svr-poker-android-rc2.apk svr-poker-android-rc2.apk.sha256 --clobber
          gh release view android-rc2 --json assets --jq '.assets[].name' | grep -qx 'svr-poker-android-rc2.apk'

      - name: Publish same-domain APK and verified manifests
        shell: bash
        run: |
          set -euo pipefail
          APK_URL='https://svrpoker.com/downloads/svr-poker-android-rc2.apk'
          mkdir -p downloads
          cp svr-poker-android-rc2.apk downloads/svr-poker-android-rc2.apk
          cp svr-poker-android-rc2.apk.sha256 downloads/svr-poker-android-rc2.apk.sha256
          test -s downloads/svr-poker-android-rc2.apk
          jq --arg url "$APK_URL" --arg sha "$APK_SHA" '.apkUrl=$url | .apkSha256=$sha | .releaseReady=true | .status="phase379-apk-rc2-same-domain-ready" | .nativeBuildStatus="same-domain-apk-verified" | .publicControls.directApkAvailable=true | .updateMessage="Android RC2 is published as a direct SVR Poker download."' game/android-release.json > game/android-release.json.tmp
          mv game/android-release.json.tmp game/android-release.json
          jq --arg url "$APK_URL" --arg sha "$APK_SHA" '.apkUrl=$url | .apkSha256=$sha | .releaseReady=true | .note="Android RC2 is published at the SVR Poker same-domain download path."' update/app-version.json > update/app-version.json.tmp
          mv update/app-version.json.tmp update/app-version.json
          git config user.name 'SVR Android Release'
          git config user.email 'actions@users.noreply.github.com'
          git add game/android-release.json update/app-version.json downloads/svr-poker-android-rc2.apk downloads/svr-poker-android-rc2.apk.sha256
          git commit -m 'Publish same-domain Android APK RC2 download' || exit 0
          git push origin HEAD:main

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: svr-poker-android-rc2
          path: |
            svr-poker-android-rc2.apk
            svr-poker-android-rc2.apk.sha256
          if-no-files-found: error
          retention-days: 30
