name: Phase 412 Professional Polish Account Gate Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase412-professional-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Protect public cache poker Quest and APK baselines under Phase 414 route
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test -z "$(git diff origin/main -- index.html site-public-hooks.js sw.js pwa-sw.js)"
          test -z "$(git diff origin/main -- game/modules/phase403_android_gameplay.js game/modules/phase403_android_pot_rules.js game/modules/phase398_android_raise_rules.js)"
          test -z "$(git diff origin/main -- game/quest.html game/modules/phase396_quest_seated_clean_table_deal_lock.js)"
          grep -q 'PHASE-414-HUMAN-TURN-ROTATION-AUTHORITY-LOCK' game/android.html
          grep -q 'android-tabletop.html?v=phase414&mode=practice' game/android.html
          grep -q 'android-tabletop.html?v=phase414&mode=regular' game/android.html
          grep -q 'PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK' game/modules/phase403_android_gameplay.js
          grep -q 'PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK' game/quest.html
          python3 -m json.tool game/android-release.json >/dev/null
          grep -q '"apkVersionName": "0.1.0-rc2"' game/android-release.json
          grep -q '"apkVersionCode": 2' game/android-release.json
          grep -q '"forceUpdate": false' game/android-release.json
          grep -q '"showUpdatePrompt": false' game/android-release.json
          grep -q '"nativeApkRebuild": false' game/android-release.json

      - name: Validate tournament account gate and Phase 414 target
        shell: bash
        run: |
          set -euo pipefail
          test -s game/modules/phase412_tournament_account_gate.js
          test -s site/tournament-account.html
          grep -q 'PHASE-412-TOURNAMENT-ACCOUNT-GATE-LOCK' game/modules/phase412_tournament_account_gate.js
          grep -q 'PHASE-412-TOURNAMENT-TEST-ACCOUNT-PAGE-LOCK' site/tournament-account.html
          grep -q "isTournamentGame=String(qs.get('mode')||'').toLowerCase()==='tournament'" game/modules/phase412_tournament_account_gate.js
          grep -q "TOURNAMENT_TARGET='/game/android-tabletop.html?v=phase414&mode=tournament&tournament=reiki-open-100'" game/modules/phase412_tournament_account_gate.js
          grep -q 'phase414HumanTurnRoute:true' game/modules/phase412_tournament_account_gate.js
          grep -q 'guestOneTournamentEligible:false' game/modules/phase412_tournament_account_gate.js
          grep -q 'genericDemoTournamentEligible:false' game/modules/phase412_tournament_account_gate.js
          grep -q 'practiceGuestAllowed:true' game/modules/phase412_tournament_account_gate.js
          grep -q 'productionRequirementWhenApiLive:true' game/modules/phase412_tournament_account_gate.js
          grep -q 'explicitLocalTestAccountRequiredBeforeApiLive:true' game/modules/phase412_tournament_account_gate.js
          grep -q 'svr_phase412_tournament_test_account_v1' game/modules/phase412_tournament_account_gate.js
          grep -q 'svr_phase412_tournament_test_account_v1' site/tournament-account.html
          grep -q 'CREATE LOCAL TOURNAMENT TEST ACCOUNT' site/tournament-account.html
          grep -q 'LOGIN / CREATE ACCOUNT TO ENTER' game/tournaments.html
          grep -q '/site/tournament-account.html' game/tournaments.html
          grep -q '/site/tournament-account.html' game/modules/phase412_tournament_account_gate.js
          grep -q 'phase412_tournament_account_gate.js?v=phase412' game/tournaments.html
          node --check game/modules/phase412_tournament_account_gate.js

      - name: Execute tournament entitlement scenarios
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          function eligible({profile,mode,apiConfigured,apiHealthy,testRegistration}){
            const production=Boolean(profile&&mode==='api'&&!profile.demoMode);
            const local=Boolean(profile&&mode==='demo'&&testRegistration?.playerId&&testRegistration.playerId===profile.playerId);
            return apiConfigured&&apiHealthy?production:Boolean(production||local);
          }
          if(eligible({profile:null,mode:'unconfigured',apiConfigured:false,apiHealthy:false,testRegistration:null})) throw new Error('Guest 1 must not enter tournament');
          if(eligible({profile:{playerId:'demo-1',demoMode:true},mode:'demo',apiConfigured:false,apiHealthy:false,testRegistration:null})) throw new Error('Generic demo player must not enter tournament');
          if(!eligible({profile:{playerId:'demo-1',demoMode:true},mode:'demo',apiConfigured:false,apiHealthy:false,testRegistration:{playerId:'demo-1'}})) throw new Error('Explicit local tournament test account must work before backend is live');
          if(eligible({profile:{playerId:'demo-1',demoMode:true},mode:'demo',apiConfigured:true,apiHealthy:true,testRegistration:{playerId:'demo-1'}})) throw new Error('Local test identity must not pass once production auth is live');
          if(!eligible({profile:{playerId:'prod-1',demoMode:false},mode:'api',apiConfigured:true,apiHealthy:true,testRegistration:null})) throw new Error('Production account must pass');
          console.log('Phase 412 tournament entitlement scenarios passed.');
          NODE

      - name: Validate professional interaction polish and active loader
        shell: bash
        run: |
          set -euo pipefail
          test -s game/styles/phase412_professional_polish.css
          test -s game/modules/phase412_professional_polish.js
          grep -q 'PHASE-412-MOBILE-PROFESSIONAL-POLISH-LOCK' game/modules/phase412_professional_polish.js
          grep -q 'YOUR DECISION' game/modules/phase412_professional_polish.js
          grep -q 'OPPONENT THINKING' game/modules/phase412_professional_polish.js
          grep -q 'navigator.vibrate' game/modules/phase412_professional_polish.js
          grep -q 'prefers-reduced-motion:reduce' game/styles/phase412_professional_polish.css
          grep -q 'focus-visible' game/styles/phase412_professional_polish.css
          grep -q 'ensurePhase412Layer' game/modules/phase407_mobile_fit_login.js
          grep -q 'phase412_tournament_account_gate.js?v=phase412' game/modules/phase407_mobile_fit_login.js
          grep -q 'phase412_professional_polish.js?v=phase412' game/modules/phase407_mobile_fit_login.js
          grep -q 'phase412_professional_polish.css?v=phase412' game/modules/phase407_mobile_fit_login.js
          node --check game/modules/phase412_professional_polish.js
          node --check game/modules/phase407_mobile_fit_login.js

      - name: Preserve Phase 411 tournament field underneath gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'NEXT TOURNAMENT SLOT' game/tournaments.html
          grep -q 'LAST TOURNAMENT RESULT' game/tournaments.html
          grep -q 'REIKI OPEN 100' game/tournaments.html
          grep -q '100 PLAYER LOCAL TEST FIELD' game/tournaments.html
          grep -q 'phase411_tournament_field_rotation.js?v=phase411' game/tournaments.html
          grep -q 'PHASE-411-TOURNAMENT-100-FIELD-ROTATION-LOCK' game/modules/phase411_tournament_field_rotation.js
          grep -q 'SLOT_MS=5\*60\*60\*1000' game/modules/phase411_tournament_field_rotation.js
          grep -q 'localSimulationOnly:true' game/modules/phase411_tournament_field_rotation.js
          node --check game/modules/phase411_tournament_field_rotation.js
