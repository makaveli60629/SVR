name: Phase 420 Mobile Release + Phase 421 VR Table Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase420-421-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Validate shared Android and iPhone mobile release
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-420-MOBILE-RELEASE-TRUTH-LOCK' game/android.html
          grep -q 'ANDROID • PHASE 420' game/android.html
          grep -q 'PHASE-420-MOBILE-RELEASE-TRUTH-LOCK' game/iphone.html
          grep -q 'IPHONE • PHASE 420' game/iphone.html
          grep -q 'PHASE-420-MOBILE-WRAPPER-RELEASE-LOCK' game/android-tabletop.html
          grep -q 'PHASE-420-IPHONE-WRAPPER-RELEASE-LOCK' game/iphone-tabletop.html
          grep -q 'phase420Found' game/android-tabletop.html
          grep -q 'phase420Found' game/iphone-tabletop.html
          grep -q 'phase420_mobile_release_lock.js?v=phase420' game/modules/phase419_mobile_table_flow_polish.js
          node --check game/modules/phase420_mobile_release_lock.js
          node --check game/modules/phase419_mobile_table_flow_polish.js
          node --check game/modules/phase407_mobile_fit_login.js

      - name: Validate mobile performance and no version downgrade
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'setInterval(poll,220)' game/modules/phase419_mobile_table_flow_polish.js; then
            echo 'Phase 419 table-flow must not continuously poll every 220 ms.' >&2
            exit 1
          fi
          grep -q 'MutationObserver' game/modules/phase419_mobile_table_flow_polish.js
          grep -q 'ensureMinimumPhaseVersion' game/modules/phase407_mobile_fit_login.js
          grep -q 'phase420NoVersionDowngrade:true' game/modules/phase407_mobile_fit_login.js
          grep -q 'pokerStateMutated:false' game/modules/phase419_mobile_table_flow_polish.js

      - name: Validate tournament current-slot start and next-slot registration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-420-TOURNAMENT-START-AUTHORITY-LOCK' game/tournaments.html
          grep -q 'phase420_tournament_start_authority.js?v=phase420' game/tournaments.html
          grep -q 'currentSlot()' game/modules/phase420_tournament_start_authority.js
          grep -q 'nextSlot()' game/modules/phase420_tournament_start_authority.js
          grep -q 'slot=${encodeURIComponent(id)}' game/modules/phase420_tournament_start_authority.js
          node --check game/modules/phase420_tournament_start_authority.js
          node <<'NODE'
          const SLOT=5*60*60*1000;
          if(SLOT!==18000000) throw new Error('five-hour cadence changed');
          const anchor=Date.UTC(2026,0,1);
          for(let i=0;i<5000;i++) if((anchor+(i+1)*SLOT)-(anchor+i*SLOT)!==SLOT) throw new Error('slot drift');
          console.log('5,000 five-hour slots passed without drift');
          NODE
          python3 - <<'PY'
          import json
          tournament=json.load(open('game/config/tournament-api.json'))
          assert tournament['apiBase']==''
          assert tournament['sharedRegistrationBackendLive'] is False
          assert tournament['backgroundPushLive'] is False
          player=json.load(open('site/config/player-api.json'))
          assert player['deploymentState']=='cloud-endpoint-pending'
          assert player['accountApiEndpointConfigured'] is False
          assert player['apiBase']==''
          print('Production auth/shared registration remain truthfully marked pending.')
          PY

      - name: Validate protected poker authority remains shared
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK' game/modules/phase403_android_gameplay.js
          grep -q 'PHASE-414-HUMAN-TURN-ROTATION-AUTHORITY-LOCK' game/modules/phase414_human_turn_rotation_authority.js
          grep -q 'PHASE-416-HUMAN-SEAT-NEVER-SKIP-LOCK' game/modules/phase416_human_seat_never_skip.js
          grep -q 'android-stable-phase405.html?v=phase420' game/iphone-tabletop.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('game/android-stable-phase405.html').read_text()
          assert s.count('class="burn-zone"') == 1
          assert s.index('phase404_android_mobile_safety.js?v=phase404') < s.index('phase403_android_gameplay.js?v=phase403')
          print('Shared mobile table keeps one burn pile and safety-before-engine order.')
          PY

      - name: Validate Phase 421 VR table-only polish
        shell: bash
        run: |
          set -euo pipefail
          test -s game/modules/phase421_vr_table_final_polish.js
          grep -q 'PHASE-421-VR-TABLE-FINAL-POLISH-LOCK' game/modules/phase421_vr_table_final_polish.js
          grep -q 'TARGET_RECESS_METERS=0.026' game/modules/phase421_vr_table_final_polish.js
          grep -q 'PHASE421_FINAL_POLISHED_PLAYING_SURFACE' game/modules/phase421_vr_table_final_polish.js
          grep -q 'svrPhase421DeepSourceSuppressed' game/modules/phase421_vr_table_final_polish.js
          grep -q 'material.colorWrite=false' game/modules/phase421_vr_table_final_polish.js
          grep -q 'phase421_vr_table_final_polish.js?v=phase421' game/modules/phase406_quest_side_burn_chip_polish.js
          grep -q 'tableOnlyPolish:true' game/modules/phase421_vr_table_final_polish.js
          grep -q 'lobbyGeometryUntouched:true' game/modules/phase421_vr_table_final_polish.js
          grep -q 'locomotionUntouched:true' game/modules/phase421_vr_table_final_polish.js
          if grep -q 'setInterval(watchdog' game/modules/phase421_vr_table_final_polish.js; then
            echo 'Phase 421 must not add a permanent VR felt watchdog interval.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import re
          s=open('game/modules/phase421_vr_table_final_polish.js').read()
          m=re.search(r'TARGET_RECESS_METERS=([0-9.]+)',s)
          assert m
          recess=float(m.group(1))
          assert 0.015 <= recess <= 0.04, recess
          print('VR felt recess is in the shallow padded-rail range:', recess)
          PY
          node --check game/modules/phase421_vr_table_final_polish.js
          node --check game/modules/phase406_quest_side_burn_chip_polish.js

      - name: Protect website and critical legacy authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test -z "$(git diff origin/main -- index.html site site-public-hooks.js style.css matrix.js)"
          test -z "$(git diff origin/main -- game/modules/phase403_android_gameplay.js game/modules/phase403_android_pot_rules.js game/modules/phase398_android_raise_rules.js game/modules/phase414_human_turn_rotation_authority.js game/modules/phase416_human_seat_never_skip.js game/quest.html game/index.html game/android-release.json)"

      - name: Syntax and JSON validation
        shell: bash
        run: |
          set -euo pipefail
          node --check game/modules/phase420_mobile_release_lock.js
          node --check game/modules/phase420_tournament_start_authority.js
          node --check game/modules/phase421_vr_table_final_polish.js
          node --check game/modules/phase419_mobile_table_flow_polish.js
          node --check game/modules/phase407_mobile_fit_login.js
          node --check game/modules/phase406_quest_side_burn_chip_polish.js
          python3 -m json.tool game/config/tournament-api.json >/dev/null
          python3 -m json.tool site/config/player-api.json >/dev/null
          python3 -m json.tool game/android-release.json >/dev/null
