name: Phase 384 Eric Quest Android Polish

on:
  pull_request:
    paths:
      - 'index.html'
      - 'site-public-hooks.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'pwa-sw.js'
      - 'site/**'
      - 'game/**'
      - 'update/app-version.json'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/pages-live-publish.yml'
      - '.github/workflows/phase384-eric-quest-android-polish.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site-public-hooks.js'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'pwa-sw.js'
      - 'site/**'
      - 'game/**'
      - 'update/app-version.json'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/pages-live-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase384-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate Phase 384 JavaScript and JSON
        run: |
          set -euo pipefail
          node --check site-public-hooks.js
          node --check site/js/phase366-player-account-resilience.js
          node --check site/js/phase345-demo-activity-persistence.js
          node --check site/js/phase384-avatar-site-lock.js
          node --check game/modules/phase381_vr_runtime_lock.js
          node --check game/modules/phase384_quest_quickplay_polish.js
          node --check game/tools/phase384-eric-quest-android-static-test.mjs
          node --check sw.js
          node --check pwa-sw.js
          python3 -m json.tool site/data/avatar-catalog.json >/dev/null
          python3 -m json.tool game/manifest.json >/dev/null
          python3 -m json.tool update/app-version.json >/dev/null
          python3 -m json.tool manifest.webmanifest >/dev/null

      - name: Run Phase 384 focused acceptance
        run: node game/tools/phase384-eric-quest-android-static-test.mjs

      - name: Verify required assets and protected baselines
        run: |
          set -euo pipefail
          test -s game/assets/models/eric/eric.fbx
          test -s game/assets/models/table.glb
          test -s game/assets/table.fbx
          test -s downloads/svr-poker-android-rc2.apk
          test -s downloads/svr-poker-android-rc2.apk.sha256
          grep -q 'PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK' site/index.html
          grep -q 'PHASE-380-ORIGINAL-UPLOADED-TABLE-AUTHORITY-LOCK' game/modules/phase380_original_table_authority_lock.js
          grep -q 'PHASE-381-VR-SEAT-ERIC-AUDIO-OVERLAY-LOCK' game/modules/phase381_vr_runtime_lock.js
          grep -q 'PHASE-380-ANDROID-PLAYABLE-POKER-PRESENTATION-LOCK' game/android-stable.html
          ! grep -Eqi 'Trueitive|Shyona Royston' site/index.html

      - name: Security scan Phase 384 public runtime
        run: |
          set -euo pipefail
          ! find game site downloads -type f \( -name '.env' -o -name '.env.*' \) | grep -q .
          ! grep -RIl --exclude='*.min.js' --exclude='*.map' -E 'AZURE_SQL_CONNECTION_STRING=|STRIPE_SECRET_KEY=|AWS_SECRET_ACCESS_KEY=|ADMIN_PASSWORD=' index.html site-public-hooks.js game site | grep -q .
