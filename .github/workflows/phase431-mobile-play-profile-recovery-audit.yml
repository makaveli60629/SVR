name: Phase 431 Mobile Play Profile Recovery Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase431-mobile-play-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Validate final mobile layout authority
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-431-MOBILE-PLAY-FIT-AUTHORITY-LOCK' game/styles/phase431_mobile_play_fit.css
          grep -q 'PHASE-431-MOBILE-PLAY-FIT-AUTHORITY-LOCK' game/modules/phase431_mobile_play_fit.js
          grep -q "phase431_mobile_play_fit.css?v=phase431" game/modules/phase418_mobile_surface_polish.js
          grep -q "phase431_mobile_play_fit.js?v=phase431" game/modules/phase418_mobile_surface_polish.js
          grep -q "visualViewport" game/modules/phase431_mobile_play_fit.js
          grep -q "android-stable-phase405.html" game/modules/phase431_mobile_play_fit.js
          grep -q "chooserDirectLinks" game/modules/phase431_mobile_play_fit.js
          grep -q "seatOverlaps" game/modules/phase431_mobile_play_fit.js
          grep -q "pokerStateMutated:false" game/modules/phase431_mobile_play_fit.js
          grep -q 'body.phase431-play-fit .player-box\[data-seat="2"\]' game/styles/phase431_mobile_play_fit.css
          grep -q 'body.phase431-play-fit .actions button' game/styles/phase431_mobile_play_fit.css
          node --check game/modules/phase418_mobile_surface_polish.js
          node --check game/modules/phase431_mobile_play_fit.js

      - name: Validate profile uses Dealer Lab Eric directly
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-430-PROFILE-DEALER-LAB-ERIC-AUTHORITY-LOCK' site/profile.html
          grep -q 'phase430-profile-immediate-layout.css?v=phase430' site/profile.html
          grep -q 'phase430-profile-lab-eric-authority.js?v=phase430' site/profile.html
          grep -q "EricDealerModule" site/js/phase430-profile-lab-eric-authority.js
          grep -q "../../game/modules/dealer/eric_dealer_module.js" site/js/phase430-profile-lab-eric-authority.js
          grep -q "fallbackAvatarUsed:false" site/js/phase430-profile-lab-eric-authority.js
          if grep -q 'src="js/phase389-profile-showroom.js' site/profile.html; then
            echo 'Legacy profile fallback viewer must not execute on Phase 430 profile' >&2; exit 1
          fi
          if grep -q 'src="js/phase429-approved-eric-visual.js' site/profile.html; then
            echo 'Competing Phase 429 Eric visual authority must not execute on Phase 430 profile' >&2; exit 1
          fi
          node --check site/js/phase430-profile-lab-eric-authority.js

      - name: Validate owner Dealer Lab shortcut
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-430-ADMIN-DEALER-LAB-SHORTCUT-LOCK' site/admin-preview.html
          grep -q '../game/dealer-lab.html?v=phase430' site/admin-preview.html
          grep -q 'OPEN DEALER LAB' site/admin-preview.html
          test -f game/dealer-lab.html
          test -f game/labs/dealer/index.html
          test -f game/modules/dealer/eric_dealer_module.js

      - name: Preserve protected poker authorities
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK' game/modules/phase403_android_gameplay.js
          grep -q 'PHASE-403-ANDROID-SIDE-POT-RULES-LOCK' game/modules/phase403_android_pot_rules.js
          grep -q 'PHASE-398-ANDROID-RAISE-SIZING-RULES-LOCK' game/modules/phase398_android_raise_rules.js
          grep -q 'PHASE-404-ANDROID-MOBILE-DECISION-SAFETY-LOCK' game/modules/phase404_android_mobile_safety.js
          grep -q 'PHASE-414-HUMAN-TURN-ROTATION-AUTHORITY-LOCK' game/modules/phase414_human_turn_rotation_authority.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('game/android-stable-phase405.html').read_text()
          assert s.count('class="burn-zone"') == 1, 'mobile shell must contain exactly one burn-zone'
          assert s.index('phase404_android_mobile_safety.js?v=phase404') < s.index('phase403_android_gameplay.js?v=phase403'), 'ALL IN safety must load before poker engine'
          print('protected mobile rules/order passed')
          PY
          git fetch origin main --depth=1
          test -z "$(git diff origin/main -- game/modules/phase403_android_gameplay.js game/modules/phase403_android_pot_rules.js game/modules/phase398_android_raise_rules.js game/modules/phase404_android_mobile_safety.js game/modules/phase414_human_turn_rotation_authority.js game/quest.html)"

      - name: Validate account truth remains cloud pending
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('site/config/player-api.json'))
          assert p['deploymentState']=='cloud-endpoint-pending'
          assert p['accountApiEndpointConfigured'] is False
          assert p['apiBase']==''
          assert p['localPlayerCreationEnabled'] is True
          print('account status remains truthful: local player ready, cloud endpoint pending')
          PY
