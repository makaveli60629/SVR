name: SVR Production Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svr-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout authoritative production source
        uses: actions/checkout@v5
        with:
          path: source
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /launch.css
            /matrix.js
            /site-public-hooks.js
            /logo.webp
            /logo.png
            /manifest.webmanifest
            /pwa-sw.js
            /sw.js
            /offline.html
            /CNAME
            /.nojekyll
            /game/
            /site/
            /downloads/
            /update/app-version.json

      - name: Checkout current production branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 1

      - name: Validate Phase 386 source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SVR Poker | Public Launch Page' source/index.html
          grep -q 'PHASE-384-ERIC-QUEST-ANDROID-POLISH-LOCK' source/index.html
          grep -q 'site-public-hooks.js?v=phase384' source/index.html
          grep -q 'site/index.html?v=phase384' source/index.html
          grep -q 'phase384-eric-quest-android-polish' source/site-public-hooks.js
          grep -q 'PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK' source/site/index.html
          grep -q 'Explore SVR Poker' source/site/index.html
          grep -q 'SVR Store' source/site/index.html
          grep -q 'Tournaments' source/site/index.html
          grep -q 'SVR AI Concierge' source/site/index.html
          ! grep -Eqi 'Trueitive|Shyona Royston' source/site/index.html
          test -s source/site/js/phase384-avatar-site-lock.js
          grep -q 'PHASE-384-ERIC-DEFAULT-AVATAR-SITE-LOCK' source/site/js/phase384-avatar-site-lock.js
          grep -q "DEFAULT_AVATAR_URL" source/site/js/phase366-player-account-resilience.js
          grep -q '"top": "none"' source/site/data/avatar-catalog.json

          grep -q 'PHASE-386-QUEST-TABLE-ENVIRONMENT-AUTHORITY-LOCK' source/game/index.html
          grep -q 'phase381_vr_runtime_lock' source/game/index.html
          grep -q 'phase384_quest_quickplay_polish' source/game/index.html
          grep -q 'phase386_quest_table_environment_authority' source/game/index.html
          grep -q 'phase386_planet_preservation_guard' source/game/index.html
          grep -q 'PHASE-384-QUEST-ERIC-TABLE-QUICKPLAY-POLISH-LOCK' source/game/modules/phase384_quest_quickplay_polish.js
          grep -q 'PHASE-386-QUEST-TABLE-ENVIRONMENT-AUTHORITY-LOCK' source/game/modules/phase386_quest_table_environment_authority.js
          grep -q 'PHASE-386-PLANET-PRESERVATION-GUARD' source/game/modules/phase386_planet_preservation_guard.js
          grep -q 'PHASE386_SVR_TABLE_LOGO' source/game/modules/phase386_quest_table_environment_authority.js
          grep -q 'PHASE386_PROFESSIONAL_TABLE_LIGHTING_RIG' source/game/modules/phase386_quest_table_environment_authority.js
          grep -q 'PHASE386_AUTHORITATIVE_TEXTURED_MOON' source/game/modules/phase386_quest_table_environment_authority.js
          grep -q 'svrPhase386HeadOverlayRemoved' source/game/modules/phase386_quest_table_environment_authority.js
          grep -q 'PLAYER_FRONT_GAP = 0.68' source/game/modules/phase386_quest_table_environment_authority.js
          grep -q 'forcedQuickSeatBlocks' source/game/modules/phase386_quest_table_environment_authority.js
          grep -q 'earthPreserved' source/game/modules/phase386_planet_preservation_guard.js
          grep -q 'marsPreserved' source/game/modules/phase386_planet_preservation_guard.js

          grep -q 'PHASE-380-ANDROID-PLAYABLE-POKER-PRESENTATION-LOCK' source/game/android-stable.html
          grep -q 'PHASE-384-ANDROID-ONE-PAGE-3D-CHIP-WINNER-LOCK' source/game/android-stable.html
          grep -q 'PHASE-385-ANDROID-ORIGINAL-TABLETOP-GYRO-UI-LOCK' source/game/android-tabletop.html
          grep -q 'phase385_android_tabletop_3d' source/game/android-tabletop.html
          test -s source/game/styles/phase385_android_tabletop.css
          test -s source/game/modules/phase385_android_tabletop_3d.js
          grep -q 'onePageFit:true' source/game/android-stable.html
          grep -q 'singleCenteredSuit:true' source/game/android-stable.html
          grep -q 'chipAnimation:true' source/game/android-stable.html
          grep -q 'winnerFlashAndSound:true' source/game/android-stable.html
          grep -q '<img src="/logo.png" alt="SVR">' source/game/android-stable.html
          grep -q 'deterministicHandEvaluator:true' source/game/android-stable.html

          grep -q 'PHASE-380-ORIGINAL-UPLOADED-TABLE-AUTHORITY-LOCK' source/game/modules/phase380_original_table_authority_lock.js
          grep -q 'PHASE-381-VR-SEAT-ERIC-AUDIO-OVERLAY-LOCK' source/game/modules/phase381_vr_runtime_lock.js
          grep -q 'pwa-phase384' source/manifest.webmanifest
          grep -q 'phase386-quest-table-environment' source/pwa-sw.js
          grep -q 'phase386-quest-table-environment' source/sw.js
          test -s source/game/assets/models/table.glb
          test -s source/game/assets/table.fbx
          test -s source/game/assets/models/eric/eric.fbx
          test -s source/downloads/svr-poker-android-rc2.apk
          test -s source/downloads/svr-poker-android-rc2.apk.sha256

          python3 -m json.tool source/game/android-release.json >/dev/null
          python3 -m json.tool source/game/manifest.json >/dev/null
          python3 -m json.tool source/update/app-version.json >/dev/null
          python3 -m json.tool source/manifest.webmanifest >/dev/null
          python3 -m json.tool source/site/data/avatar-catalog.json >/dev/null
          node --check source/site-public-hooks.js
          node --check source/site/js/phase384-avatar-site-lock.js
          node --check source/site/js/phase366-player-account-resilience.js
          node --check source/site/js/phase345-demo-activity-persistence.js
          node --check source/game/modules/phase381_vr_runtime_lock.js
          node --check source/game/modules/phase384_quest_quickplay_polish.js
          node --check source/game/modules/phase385_android_tabletop_3d.js
          node --check source/game/modules/phase386_quest_table_environment_authority.js
          node --check source/game/modules/phase386_planet_preservation_guard.js
          node --check source/pwa-sw.js
          node --check source/sw.js

      - name: Rebuild clean production tree
        shell: bash
        run: |
          set -euo pipefail
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp source/index.html publish/index.html
          cp source/launch.css publish/launch.css
          cp source/matrix.js publish/matrix.js
          cp source/site-public-hooks.js publish/site-public-hooks.js
          cp source/manifest.webmanifest publish/manifest.webmanifest
          cp source/pwa-sw.js publish/pwa-sw.js
          cp source/sw.js publish/sw.js
          cp source/offline.html publish/offline.html
          if [ -f source/logo.png ]; then cp source/logo.png publish/logo.png; fi
          if [ -f source/logo.webp ]; then cp source/logo.webp publish/logo.webp; fi
          if [ -f source/CNAME ]; then cp source/CNAME publish/CNAME; fi
          if [ -f source/.nojekyll ]; then cp source/.nojekyll publish/.nojekyll; else touch publish/.nojekyll; fi
          cp -a source/game publish/game
          cp -a source/site publish/site
          cp -a source/downloads publish/downloads
          mkdir -p publish/update
          cp source/update/app-version.json publish/update/app-version.json
          rm -rf publish/game/tools publish/game/docs publish/site/tools publish/site/docs
          find publish -type f \( -name '*.zip' -o -name '*.ps1' -o -name '.env' -o -name '.env.*' \) -delete
          chmod -R u+rwX,go+rX publish

      - name: Stamp deployment health
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APK_SHA="$(cut -d' ' -f1 source/downloads/svr-poker-android-rc2.apk.sha256)"
          cat > publish/deploy-health.json <<EOF2
          {
            "status": "ok",
            "build": "PHASE-386-QUEST-TABLE-ENVIRONMENT-AUTHORITY-LOCK",
            "androidBuild": "PHASE-380-ANDROID-PLAYABLE-POKER-PRESENTATION-LOCK",
            "androidSuccessorBuild": "PHASE-385-ANDROID-ORIGINAL-TABLETOP-GYRO-UI-LOCK",
            "questBuild": "PHASE-386-QUEST-TABLE-ENVIRONMENT-AUTHORITY-LOCK",
            "questPredecessorBuild": "PHASE-384-QUEST-ERIC-TABLE-QUICKPLAY-POLISH-LOCK",
            "profileBuild": "PHASE-384-ERIC-DEFAULT-AVATAR-SITE-LOCK",
            "publicBuild": "PHASE-384-ERIC-QUEST-ANDROID-POLISH-LOCK",
            "siteBuild": "PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK",
            "pwaBuild": "PHASE-386-CACHE-ROLLOVER",
            "commit": "${GITHUB_SHA}",
            "deployedAt": "${DEPLOYED_AT}",
            "sourceBranch": "main",
            "publishBranch": "gh-pages",
            "androidRoute": "/game/android.html?channel=stable&v=phase385",
            "androidTabletopRoute": "/game/android-tabletop.html?v=phase385",
            "questRoute": "/game/index.html?platform=quest&v=phase386",
            "siteRoute": "/site/index.html?v=phase384",
            "profileRoute": "/site/profile.html?v=phase384",
            "dressingRoomRoute": "/site/avatar.html?v=phase384",
            "downloadsRoute": "/downloads/?v=phase384",
            "apkUrl": "/downloads/svr-poker-android-rc2.apk",
            "apkSha256": "${APK_SHA}",
            "apkVersionName": "0.1.0-rc2",
            "apkVersionCode": 2,
            "apkBuildStatus": "same-domain-ready",
            "fullWebsiteRestored": true,
            "terminatedPartnerMaterialExcludedFromHomepage": true,
            "profileDefaultTexturedEric": true,
            "dressingRoomEricUpright": true,
            "dressingRoomGeneratedBoxClothingDisabled": true,
            "androidOriginalTablePrimary": true,
            "androidGyroscopeTableView": true,
            "androidCompactSeatPanels": true,
            "androidLargeCards": true,
            "androidVisiblePotChips": true,
            "androidSvrLogoOnFelt": true,
            "androidDeterministicEvaluator": true,
            "questOriginalTableFirst": true,
            "questTableSized": true,
            "questProfessionalLighting": true,
            "questSingleEricDealer": true,
            "questExternalSkeletonHidden": true,
            "questEricDealerMotion": true,
            "questEricTexturedMaterials": true,
            "questProfessionalTableFelt": true,
            "questSvrLogoOnTable": true,
            "questPlayerAlwaysFront": true,
            "questSameDistanceSittingStanding": true,
            "questForcedQuickPlayAutoSeat": false,
            "questManualSitPreserved": true,
            "questFrontTableMovementLocked": true,
            "questFrontTableTeleportLocked": true,
            "questTeleportVisualsHidden": true,
            "questNamedAndUnnamedHeadOverlayCleanup": true,
            "questPostprocessingVignetteDisabled": true,
            "questAuthoritativeTexturedMoon": true,
            "questDuplicateMoonsHidden": true,
            "questEarthAndMarsPreserved": true,
            "questProceduralAudioFallback": true,
            "cacheRecovery": true,
            "visibleBuildProof": true,
            "pagesPushTrigger": true,
            "cleanTreePublish": true,
            "customDomain": "svrpoker.com"
          }
          EOF2
          cp publish/deploy-health.json publish/game/deploy-health.json

      - name: Validate clean production tree
        shell: bash
        run: |
          set -euo pipefail
          test -f publish/index.html
          test -f publish/site/index.html
          test -f publish/site/profile.html
          test -f publish/site/avatar.html
          test -f publish/site/js/phase384-avatar-site-lock.js
          test -f publish/game/index.html
          test -f publish/game/android-stable.html
          test -f publish/game/android-tabletop.html
          test -f publish/game/styles/phase385_android_tabletop.css
          test -f publish/game/modules/phase381_vr_runtime_lock.js
          test -f publish/game/modules/phase384_quest_quickplay_polish.js
          test -f publish/game/modules/phase385_android_tabletop_3d.js
          test -f publish/game/modules/phase386_quest_table_environment_authority.js
          test -f publish/game/modules/phase386_planet_preservation_guard.js
          test -s publish/game/assets/models/table.glb
          test -s publish/game/assets/table.fbx
          test -s publish/game/assets/models/eric/eric.fbx
          test -s publish/downloads/svr-poker-android-rc2.apk
          test -f publish/deploy-health.json
          grep -q 'PHASE-386-QUEST-TABLE-ENVIRONMENT-AUTHORITY-LOCK' publish/deploy-health.json
          grep -q '"androidOriginalTablePrimary": true' publish/deploy-health.json
          grep -q '"questProfessionalLighting": true' publish/deploy-health.json
          grep -q '"questPlayerAlwaysFront": true' publish/deploy-health.json
          grep -q '"questFrontTableTeleportLocked": true' publish/deploy-health.json
          grep -q '"questAuthoritativeTexturedMoon": true' publish/deploy-health.json
          grep -q '"questEarthAndMarsPreserved": true' publish/deploy-health.json
          grep -q '"profileDefaultTexturedEric": true' publish/deploy-health.json
          ! find publish -type f \( -name '.env' -o -name '.env.*' \) | grep -q .
          ! grep -RIl --exclude='*.min.js' --exclude='*.map' -E 'AZURE_SQL_CONNECTION_STRING=|STRIPE_SECRET_KEY=|AWS_SECRET_ACCESS_KEY=|ADMIN_PASSWORD=' publish | grep -q .

      - name: Publish clean tree to gh-pages
        shell: bash
        working-directory: publish
        run: |
          set -euo pipefail
          git config user.name 'SVR Auto Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Production already matches the Phase 386 Quest environment tree.'
          else
            git commit -m "Deploy Phase 386 Quest table environment ${GITHUB_SHA}"
            git push origin gh-pages
          fi
