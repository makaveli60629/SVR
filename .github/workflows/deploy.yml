name: SVR Production Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svr-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout authoritative production source
        uses: actions/checkout@v5
        with:
          path: source
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /launch.css
            /matrix.js
            /site-public-hooks.js
            /logo.webp
            /logo.png
            /manifest.webmanifest
            /pwa-sw.js
            /sw.js
            /offline.html
            /CNAME
            /.nojekyll
            /game/
            /site/
            /downloads/
            /update/app-version.json

      - name: Checkout current production branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 1

      - name: Validate Phase 388 source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-388-QUEST-TABLE-PLAYER-ERIC-AUTHORITY-LOCK' source/index.html
          grep -q 'game/quest.html?v=phase388' source/index.html
          grep -q 'site-public-hooks.js?v=phase388' source/index.html
          grep -q 'phase388-quest-table-player-eric' source/site-public-hooks.js
          grep -q 'PHASE-388-QUEST-TABLE-PLAYER-ERIC-AUTHORITY-LOCK' source/game/quest.html
          grep -q 'phase388_quest_table_player_eric_authority' source/game/index.html
          grep -q 'phase388_front_south_seat_authority' source/game/index.html
          grep -q 'SVR_PHASE388_FRONT_SOUTH_SEAT' source/game/index.html
          grep -q 'SVR_PHASE388_ENSURE_ERIC' source/game/index.html
          ! grep -q "await import('./modules/phase381_vr_runtime_lock" source/game/index.html
          ! grep -q "await import('./modules/phase384_quest_quickplay_polish" source/game/index.html
          ! grep -q "await import('./modules/phase386_quest_table_environment_authority" source/game/index.html
          ! grep -q "await import('./modules/phase387_quest_direct_seat_recovery" source/game/index.html
          test -s source/game/modules/phase388_front_south_seat_authority.js
          test -s source/game/modules/phase388_quest_table_player_eric_authority.js
          test -s source/game/modules/phase388_quest_view_dealer_guard.js
          grep -q 'PHASE388_OFFICIAL_SITE_LOGO_FELT' source/game/modules/phase388_quest_table_player_eric_authority.js
          grep -q 'PHASE388_QUEST_PROFESSIONAL_LIGHTS' source/game/modules/phase388_quest_table_player_eric_authority.js
          grep -q 'svrPhase388EricMaterial' source/game/modules/phase388_quest_table_player_eric_authority.js
          grep -q 'GAP=.12' source/game/modules/phase388_front_south_seat_authority.js
          grep -q 'transformDirection(table.matrixWorld)' source/game/modules/phase388_front_south_seat_authority.js
          grep -q 'svrPhase388HeadOverlayRemoved' source/game/modules/phase388_quest_view_dealer_guard.js
          grep -q 'phase388-eric-upright-material-lock' source/site/js/phase346-avatar-room.js
          test -s source/site/js/phase388-eric-upright-material-lock.js
          grep -q 'PHASE-388-ERIC-UPRIGHT-MATERIAL-LOCK' source/site/js/phase388-eric-upright-material-lock.js
          grep -q 'phase388-quest-table-player-eric' source/sw.js
          grep -q 'phase388-quest-table-player-eric' source/pwa-sw.js
          test -s source/game/assets/models/table.glb
          test -s source/game/assets/table.fbx
          test -s source/game/assets/models/eric/eric.fbx
          test -s source/logo.png
          test -s source/downloads/svr-poker-android-rc2.apk
          test -s source/downloads/svr-poker-android-rc2.apk.sha256
          python3 -m json.tool source/game/android-release.json >/dev/null
          python3 -m json.tool source/game/manifest.json >/dev/null
          python3 -m json.tool source/update/app-version.json >/dev/null
          python3 -m json.tool source/manifest.webmanifest >/dev/null
          node --check source/site-public-hooks.js
          node --check source/site/js/phase346-avatar-room.js
          node --check source/site/js/phase388-eric-upright-material-lock.js
          node --check source/game/modules/phase381_vr_runtime_lock.js
          node --check source/game/modules/phase384_quest_quickplay_polish.js
          node --check source/game/modules/phase386_quest_table_environment_authority.js
          node --check source/game/modules/phase387_quest_direct_seat_recovery.js
          node --check source/game/modules/phase388_front_south_seat_authority.js
          node --check source/game/modules/phase388_quest_table_player_eric_authority.js
          node --check source/game/modules/phase388_quest_view_dealer_guard.js
          node --check source/pwa-sw.js
          node --check source/sw.js

      - name: Rebuild clean production tree
        shell: bash
        run: |
          set -euo pipefail
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp source/index.html publish/index.html
          cp source/launch.css publish/launch.css
          cp source/matrix.js publish/matrix.js
          cp source/site-public-hooks.js publish/site-public-hooks.js
          cp source/manifest.webmanifest publish/manifest.webmanifest
          cp source/pwa-sw.js publish/pwa-sw.js
          cp source/sw.js publish/sw.js
          cp source/offline.html publish/offline.html
          cp source/logo.png publish/logo.png
          if [ -f source/logo.webp ]; then cp source/logo.webp publish/logo.webp; fi
          if [ -f source/CNAME ]; then cp source/CNAME publish/CNAME; fi
          if [ -f source/.nojekyll ]; then cp source/.nojekyll publish/.nojekyll; else touch publish/.nojekyll; fi
          cp -a source/game publish/game
          cp -a source/site publish/site
          cp -a source/downloads publish/downloads
          mkdir -p publish/update
          cp source/update/app-version.json publish/update/app-version.json
          rm -rf publish/game/tools publish/game/docs publish/site/tools publish/site/docs
          find publish -type f \( -name '*.zip' -o -name '*.ps1' -o -name '.env' -o -name '.env.*' \) -delete
          chmod -R u+rwX,go+rX publish

      - name: Stamp deployment health
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APK_SHA="$(cut -d' ' -f1 source/downloads/svr-poker-android-rc2.apk.sha256)"
          cat > publish/deploy-health.json <<EOF2
          {
            "status": "ok",
            "build": "PHASE-388-QUEST-TABLE-PLAYER-ERIC-AUTHORITY-LOCK",
            "questBuild": "PHASE-388-QUEST-TABLE-PLAYER-ERIC-AUTHORITY-LOCK",
            "questPredecessorBuild": "PHASE-387-QUEST-DIRECT-SEAT-RECOVERY-LOCK",
            "androidBuild": "PHASE-385-ANDROID-ORIGINAL-TABLETOP-GYRO-UI-LOCK",
            "siteBuild": "PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK",
            "commit": "${GITHUB_SHA}",
            "deployedAt": "${DEPLOYED_AT}",
            "sourceBranch": "main",
            "publishBranch": "gh-pages",
            "questRoute": "/game/quest.html?v=phase388",
            "questRuntimeRoute": "/game/index.html?platform=quest&v=phase388&direct=1&autoseat=1&questfix=1&clean=1",
            "dressingRoomRoute": "/site/avatar.html?v=phase388",
            "profileRoute": "/site/profile.html?v=phase388",
            "androidRoute": "/game/android.html?channel=stable&v=phase385",
            "apkUrl": "/downloads/svr-poker-android-rc2.apk",
            "apkSha256": "${APK_SHA}",
            "apkVersionName": "0.1.0-rc2",
            "apkVersionCode": 2,
            "questPlayerUsesHeadWorldSeat": true,
            "questPlayerUsesTableLocalFrontAxis": true,
            "questExclusiveEnvironmentAuthority": true,
            "questOldPhase381EnvironmentLoaded": false,
            "questOldPhase384EnvironmentLoaded": false,
            "questOldPhase386EnvironmentLoaded": false,
            "questOldPhase387SeatControllerLoaded": false,
            "questPlayerTableEdgeGapMeters": 0.12,
            "questLegacySeatSystemsNeutralized": true,
            "questTeleportAndMovementLocked": true,
            "questEricFreshAuthority": true,
            "questEricBoneCheckedUpright": true,
            "questEricGrounded": true,
            "questEricGeneratedStripeTextureRemoved": true,
            "questEricDealerVertexMaterials": true,
            "dressingRoomEricUprightMaterialLock": true,
            "questOfficialRootLogoOnFelt": true,
            "questLegacyYellowLogoOverlayRemoved": true,
            "questProfessionalLightingAuthority": true,
            "questRendererExposure": 1.72,
            "questOriginalTablePreserved": true,
            "questMoonEarthMarsPreserved": true,
            "cacheRecovery": true,
            "cleanTreePublish": true,
            "customDomain": "svrpoker.com"
          }
          EOF2
          cp publish/deploy-health.json publish/game/deploy-health.json

      - name: Validate clean production tree
        shell: bash
        run: |
          set -euo pipefail
          test -f publish/index.html
          test -f publish/game/index.html
          test -f publish/game/quest.html
          test -f publish/game/modules/phase388_front_south_seat_authority.js
          test -f publish/game/modules/phase388_quest_table_player_eric_authority.js
          test -f publish/game/modules/phase388_quest_view_dealer_guard.js
          test -f publish/site/js/phase388-eric-upright-material-lock.js
          test -f publish/site/avatar.html
          test -s publish/game/assets/models/table.glb
          test -s publish/game/assets/models/eric/eric.fbx
          test -s publish/logo.png
          test -s publish/downloads/svr-poker-android-rc2.apk
          grep -q 'PHASE-388-QUEST-TABLE-PLAYER-ERIC-AUTHORITY-LOCK' publish/deploy-health.json
          grep -q '"questPlayerUsesHeadWorldSeat": true' publish/deploy-health.json
          grep -q '"questPlayerUsesTableLocalFrontAxis": true' publish/deploy-health.json
          grep -q '"questPlayerTableEdgeGapMeters": 0.12' publish/deploy-health.json
          grep -q '"questExclusiveEnvironmentAuthority": true' publish/deploy-health.json
          grep -q '"questEricBoneCheckedUpright": true' publish/deploy-health.json
          grep -q '"questOfficialRootLogoOnFelt": true' publish/deploy-health.json
          grep -q '"questProfessionalLightingAuthority": true' publish/deploy-health.json
          ! find publish -type f \( -name '.env' -o -name '.env.*' \) | grep -q .
          ! grep -RIl --exclude='*.min.js' --exclude='*.map' -E 'AZURE_SQL_CONNECTION_STRING=|STRIPE_SECRET_KEY=|AWS_SECRET_ACCESS_KEY=|ADMIN_PASSWORD=' publish | grep -q .

      - name: Publish clean tree to gh-pages
        shell: bash
        working-directory: publish
        run: |
          set -euo pipefail
          git config user.name 'SVR Auto Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Production already matches the Phase 388 tree.'
          else
            git commit -m "Deploy Phase 388 Quest table and Eric authority ${GITHUB_SHA}"
            git push origin gh-pages
          fi
