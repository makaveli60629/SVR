name: Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fresh repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync

      - name: Clean build folders
        run: |
          set -euo pipefail
          rm -rf build tmp dist public _site
          mkdir -p build

      - name: Copy site base
        run: |
          set -euo pipefail
          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'backend' \
            --exclude 'docs' \
            --exclude 'update' \
            --exclude 'Library' \
            --exclude 'Logs' \
            --exclude 'Temp' \
            --exclude 'node_modules' \
            --exclude 'backend/node_modules' \
            --exclude '*.zip' \
            --exclude '*.fbx' \
            ./ build/ || test $? -eq 24

      - name: Copy game folder directly
        run: |
          set -euo pipefail

          if [ ! -f game/index.html ]; then
            echo "ERROR: game/index.html missing in repository."
            echo "The /game folder must be committed directly."
            exit 1
          fi

          rm -rf build/game
          mkdir -p build/game

          rsync -av game/ build/game/ || test $? -eq 24

          chmod -R u+rwX,go+rX build || true

      - name: Stamp deploy health
        run: |
          set -euo pipefail

          COMMIT_SHA="${GITHUB_SHA}"
          DEPLOY_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_LABEL="PHASE-65-DIRECT-RUNTIME-FIX-LOCK"

          mkdir -p build/game

          cat > build/game/deploy-health.json <<EOF
          {
            "status": "ok",
            "build": "${BUILD_LABEL}",
            "commit": "${COMMIT_SHA}",
            "deployedAt": "${DEPLOY_TIME}",
            "workflow": "Auto Deploy",
            "target": "/game",
            "source": "direct-game-folder"
          }
          EOF

          cat > build/game/version.json <<EOF
          {
            "build": "${BUILD_LABEL}",
            "commit": "${COMMIT_SHA}",
            "deployedAt": "${DEPLOY_TIME}",
            "source": "direct-game-folder"
          }
          EOF

      - name: Validate build output
        run: |
          set -euo pipefail

          test -f build/index.html
          test -f build/game/index.html
          test -f build/game/version.json
          test -f build/game/deploy-health.json

          echo "Game phase markers:"
          grep -R "PHASE-" build/game/index.html build/game/version.json build/game/deploy-health.json || true

          echo "Build size:"
          du -sh build build/game

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
