name: Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout fresh repo
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rsync unzip

      - name: Build committed site and game
        run: |
          set -euo pipefail
          rm -rf build tmp dist public _site tmp_site
          mkdir -p build

          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'backend' \
            --exclude 'docs' \
            --exclude 'update' \
            --exclude 'Library' \
            --exclude 'Logs' \
            --exclude 'Temp' \
            --exclude 'node_modules' \
            --exclude 'backend/node_modules' \
            --exclude '*.zip' \
            --exclude '*.fbx' \
            ./ build/ || test $? -eq 24

          chmod -R u+rwX,go+rX build || true

      - name: Validate game folder
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/site/index.html
          test -f build/game/index.html

      - name: Stamp deploy health
        run: |
          set -euo pipefail

          COMMIT_SHA="${GITHUB_SHA}"
          DEPLOY_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_LABEL="$(grep -oE 'PHASE-[A-Za-z0-9._-]+' build/game/index.html | head -n 1 || true)"

          if [ -z "${BUILD_LABEL}" ] && [ -f build/game/docs/BUILD_VERSION.json ]; then
            BUILD_LABEL="$(grep -oE 'PHASE-[A-Za-z0-9._-]+' build/game/docs/BUILD_VERSION.json | head -n 1 || true)"
          fi

          if [ -z "${BUILD_LABEL}" ]; then
            BUILD_LABEL="SVR-DIRECT-FILES-LOCK"
          fi

          mkdir -p build/game build/site

          cat > build/deploy-health.json <<EOF
          {
            "status": "ok",
            "build": "${BUILD_LABEL}",
            "commit": "${COMMIT_SHA}",
            "deployedAt": "${DEPLOY_TIME}",
            "workflow": "Auto Deploy",
            "target": "/",
            "source": "committed-files-no-site-zip"
          }
          EOF

          cat > build/game/deploy-health.json <<EOF
          {
            "status": "ok",
            "build": "${BUILD_LABEL}",
            "commit": "${COMMIT_SHA}",
            "deployedAt": "${DEPLOY_TIME}",
            "workflow": "Auto Deploy",
            "target": "/game",
            "source": "direct-game-folder"
          }
          EOF

          cat > build/game/version.json <<EOF
          {
            "build": "${BUILD_LABEL}",
            "commit": "${COMMIT_SHA}",
            "deployedAt": "${DEPLOY_TIME}",
            "source": "direct-game-folder"
          }
          EOF

      - name: Validate build output
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/site/index.html
          test -f build/game/index.html
          test -f build/game/version.json
          test -f build/game/deploy-health.json
          test -f build/deploy-health.json

          echo "Game phase markers:"
          grep -R "PHASE-\|SVR-DIRECT-FILES-LOCK" build/game/index.html build/game/version.json build/game/deploy-health.json build/deploy-health.json || true

          echo "Build size:"
          du -sh build build/game

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

