name: SVR Production Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: svr-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[SVR DEPLOY]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          path: source
          fetch-depth: 1

      - name: Checkout production
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 1

      - name: Verify latest main source
        shell: bash
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          test "$(git -C source rev-parse HEAD)" = "$(git -C source rev-parse origin/main)"

      - name: Validate protected mobile and account authorities
        shell: bash
        run: |
          set -euo pipefail
          test -s source/platform-device.js
          test -s source/phase409-public-status.js
          test -s source/site-public-hooks.js
          test -s source/game/android.html
          test -s source/game/iphone.html
          test -s source/game/android-tabletop.html
          test -s source/game/iphone-tabletop.html
          test -s source/game/android-stable-phase405.html
          test -s source/game/modules/phase420_mobile_release_lock.js
          test -s source/game/modules/phase420_tournament_start_authority.js
          test -s source/game/modules/phase403_android_gameplay.js
          test -s source/game/modules/phase403_android_pot_rules.js
          test -s source/game/modules/phase414_human_turn_rotation_authority.js
          test -s source/game/modules/phase416_human_seat_never_skip.js
          test -s source/game/tournament-signup.html
          test -s source/game/config/tournament-api.json
          test -s source/site/config/player-api.json
          test -s source/downloads/svr-poker-android-rc2.apk
          grep -q 'PHASE-420-MOBILE-RELEASE-TRUTH-LOCK' source/game/android.html
          grep -q 'PHASE-420-MOBILE-RELEASE-TRUTH-LOCK' source/game/iphone.html
          grep -q 'PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK' source/game/modules/phase403_android_gameplay.js
          grep -q 'PHASE-403-ANDROID-SIDE-POT-RULES-LOCK' source/game/modules/phase403_android_pot_rules.js
          grep -q 'PHASE-414-HUMAN-TURN-ROTATION-AUTHORITY-LOCK' source/game/modules/phase414_human_turn_rotation_authority.js
          grep -q 'PHASE-416-HUMAN-SEAT-NEVER-SKIP-LOCK' source/game/modules/phase416_human_seat_never_skip.js
          grep -q '"apkVersionName": "0.1.0-rc2"' source/game/android-release.json
          grep -q '"apkVersionCode": 2' source/game/android-release.json
          grep -q '"forceUpdate": false' source/game/android-release.json
          grep -q '"showUpdatePrompt": false' source/game/android-release.json
          grep -q '"nativeApkRebuild": false' source/game/android-release.json
          python3 - <<'PY'
          import json
          t=json.load(open('source/game/config/tournament-api.json'))
          p=json.load(open('source/site/config/player-api.json'))
          assert t['apiBase']==''
          assert t['sharedRegistrationBackendLive'] is False
          assert t['backgroundPushLive'] is False
          assert p['deploymentState']=='cloud-endpoint-pending'
          assert p['accountApiEndpointConfigured'] is False
          assert p['apiBase']==''
          PY
          node --check source/platform-device.js
          node --check source/site-public-hooks.js
          node --check source/phase409-public-status.js
          node --check source/game/modules/phase420_mobile_release_lock.js
          node --check source/game/modules/phase420_tournament_start_authority.js
          node --check source/game/modules/phase403_android_gameplay.js
          node --check source/game/modules/phase403_android_pot_rules.js
          node --check source/game/modules/phase414_human_turn_rotation_authority.js
          node --check source/game/modules/phase416_human_seat_never_skip.js
          node --check source/sw.js
          node --check source/pwa-sw.js
          python3 -m json.tool source/game/config/tournament-api.json >/dev/null
          python3 -m json.tool source/site/config/player-api.json >/dev/null
          python3 -m json.tool source/manifest.webmanifest >/dev/null
          python3 -m json.tool source/game/manifest.json >/dev/null
          python3 -m json.tool source/game/android-release.json >/dev/null
          python3 -m json.tool source/update/app-version.json >/dev/null

      - name: Validate Quest visual authority successor
        shell: bash
        run: |
          set -euo pipefail
          # Keep predecessor source files available for rollback/reference, but Phase 440
          # is now the only active rendered Quest table/dealer visual authority.
          test -s source/game/modules/phase421_vr_table_final_polish.js
          test -s source/game/modules/phase422_quest_table_geometry_theme_lock.js
          test -s source/game/modules/phase422_quest_seated_inspection_lock.js
          test -s source/game/modules/phase422_quest_table_prop_alignment_flex_lock.js
          test -s source/game/modules/phase438_lab_master_lobby_dealer_authority.js
          test -s source/game/modules/phase439_lab_only_lobby_render_authority.js
          test -s source/game/modules/phase440_lab_master_hard_render_lock.js
          test -s source/game/modules/dealer/table_calibration_module.js
          test -s source/game/modules/dealer/eric_dealer_module.js
          test -s source/game/labs/dealer/table-surface-authority-phase437.js
          test -s source/game/labs/avatar/index.html
          test -s source/game/labs/avatar/avatar-lab.js
          test -s source/game/modules/avatar/player_avatar_module.js
          test -s source/game/modules/phase444_heads_up_avatar_demo.js
          test -s source/game/tools/phase443-avatar-dealer-table-audit.mjs
          test -s source/game/assets/models/table.glb
          test -s source/game/assets/models/eric/eric.fbx
          grep -q 'PHASE-440-LAB-MASTER-HARD-RENDER-LOCK' source/game/quest.html
          grep -q 'phase440-lab-master-hard-render' source/game/quest.html
          grep -q 'data-quest-polish-build="PHASE-440-LAB-MASTER-HARD-RENDER-LOCK"' source/game/index.html
          grep -Fq 'phase406_quest_side_burn_chip_polish.js?v=phase422&patch=phase444' source/game/index.html
          grep -q 'SVR_PHASE440_READY_PROMISE' source/game/index.html
          grep -q 'phase438_lab_master_lobby_dealer_authority.js?v=phase440&patch=phase444' source/game/modules/phase406_quest_side_burn_chip_polish.js
          grep -q 'phase439_lab_only_lobby_render_authority.js?v=phase440' source/game/modules/phase406_quest_side_burn_chip_polish.js
          grep -q 'phase440_lab_master_hard_render_lock.js?v=phase440' source/game/modules/phase406_quest_side_burn_chip_polish.js
          grep -q 'phase422_quest_seated_inspection_lock.js?v=phase440' source/game/modules/phase406_quest_side_burn_chip_polish.js
          grep -q 'phase422_quest_table_prop_alignment_flex_lock.js?v=phase440' source/game/modules/phase406_quest_side_burn_chip_polish.js
          if grep -q 'phase422_quest_table_geometry_theme_lock.js?v=phase422' source/game/modules/phase406_quest_side_burn_chip_polish.js; then
            echo 'Legacy Phase 422 visual table authority is active again.' >&2
            exit 1
          fi
          grep -q 'APPROVED_SCALE = 0.0047' source/game/modules/phase440_lab_master_hard_render_lock.js
          grep -q 'PHASE440_NON_RENDERED_LEGACY_ROOT' source/game/modules/phase440_lab_master_hard_render_lock.js
          grep -q 'oneRenderedTable' source/game/modules/phase440_lab_master_hard_render_lock.js
          grep -q 'oneRenderedEric' source/game/modules/phase440_lab_master_hard_render_lock.js
          grep -q 'PHASE341_CANONICAL_PASS_LINE_ROOT' source/game/modules/phase440_lab_master_hard_render_lock.js
          grep -q 'PHASE341_CANONICAL_CENTER_LOGO_ROOT' source/game/modules/phase440_lab_master_hard_render_lock.js
          node --check source/game/modules/phase406_quest_side_burn_chip_polish.js
          node --check source/game/modules/phase438_lab_master_lobby_dealer_authority.js
          node --check source/game/modules/phase439_lab_only_lobby_render_authority.js
          node --check source/game/modules/phase440_lab_master_hard_render_lock.js
          node --check source/game/modules/dealer/table_calibration_module.js
          node --check source/game/modules/dealer/eric_dealer_module.js
          node --check source/game/labs/dealer/table-surface-authority-phase437.js
          node --check source/game/labs/avatar/avatar-lab.js
          node --check source/game/modules/avatar/player_avatar_module.js
          node --check source/game/modules/phase444_heads_up_avatar_demo.js
          (cd source && node game/tools/phase443-avatar-dealer-table-audit.mjs)

      - name: Execute protected Phase 403 pot sanity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {buildSidePots,sumPotAmounts,splitPotAmount} from './source/game/modules/phase403_android_pot_rules.js';
          const audit=buildSidePots([{index:0,amount:1000},{index:1,amount:500},{index:2,amount:200}],1700);
          if(JSON.stringify(audit.pots.map(p=>p.amount))!==JSON.stringify([600,600,500]))throw new Error('side-pot layers wrong');
          if(sumPotAmounts(audit.pots)!==1700)throw new Error('pot conservation failed');
          const split=splitPotAmount(301,[0,5],4,[0,5,1,2,3,4]);
          if(split.payouts[0]!==151||split.payouts[5]!==150)throw new Error('odd-chip order failed');
          console.log('Protected Phase 403 production pot sanity passed.');
          NODE

      - name: Build clean production tree
        shell: bash
        run: |
          set -euo pipefail
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          for file in index.html launch.css launch-quest.css matrix.js platform-device.js site-public-hooks.js phase409-public-status.js site-local-counter.js support-chat-bot.js manifest.webmanifest pwa-sw.js sw.js offline.html logo.png logo.webp CNAME .nojekyll 404.html; do
            [ -e "source/$file" ] && cp "source/$file" "publish/$file"
          done
          cp -a source/game publish/game
          cp -a source/site publish/site
          cp -a source/downloads publish/downloads
          mkdir -p publish/update
          cp source/update/app-version.json publish/update/app-version.json
          rm -rf publish/game/tools publish/game/docs publish/site/tools publish/site/docs
          find publish -type f \( -name '*.zip' -o -name '*.ps1' -o -name '.env' -o -name '.env.*' \) -delete

      - name: Stamp deployment health
        shell: bash
        run: |
          set -euo pipefail
          cat > publish/deploy-health.json <<EOF_HEALTH
          {
            "status": "ok",
            "build": "PHASE-440-LAB-MASTER-HARD-RENDER-LOCK",
            "predecessorMobileBuild": "PHASE-420-MOBILE-RELEASE-TRUTH-LOCK",
            "questBuild": "PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK",
            "vrTableBuild": "PHASE-440-LAB-MASTER-HARD-RENDER-LOCK",
            "vrTablePredecessorBuild": "PHASE-422-QUEST-TABLE-INSPECTION-LOCK",
            "labTableSurfaceBuild": "DEALER-LAB-V2.5-BLACK-FELT-TABLE-SHAPE-PASSLINE-LOCK",
            "avatarLabBuild": "PHASE-443-PLAYER-ONLY-ARTICULATED-AVATAR-LAB",
            "avatarLabRoute": "/game/labs/avatar/",
            "avatarLabDealerSeparated": true,
            "avatarLabArticulatedJoints": 19,
            "avatarLabPlaceholderBoxes": 0,
            "tableChipShelfInches": 3.75,
            "androidBuild": "PHASE-420-MOBILE-WRAPPER-RELEASE-LOCK",
            "androidSurfaceBuild": "PHASE-420-MOBILE-RELEASE-TRUTH-LOCK",
            "androidEngineBuild": "PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK",
            "commit": "${GITHUB_SHA}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "questRoute": "/game/quest.html?v=phase440",
            "camera3Route": "/game/camera3-live.html?v=phase440",
            "androidRoute": "/game/android.html?channel=stable&v=phase420",
            "iphoneRoute": "/game/iphone.html?v=phase420",
            "questTeleportEnabled": false,
            "questHandTeleportEnabled": false,
            "questGripTeleportEnabled": false,
            "questLabMasterOnlyRenderedTable": true,
            "questLabMasterOnlyRenderedEric": true,
            "questLegacyTableVisualsDetached": true,
            "questLegacyDealerVisualsDetached": true,
            "questLegacyPassLineLogoDetached": true,
            "questBlackNativeFelt": true,
            "questProtectiveTopCoverHidden": true,
            "questApprovedEricScale": 0.0047,
            "questEricGrounded": true,
            "androidProductionLoginBackendLive": false,
            "androidTournamentSharedRegistrationBackendLive": false,
            "androidProductionMatchServerConfigured": false,
            "playerAccountCloudEndpointConfigured": false,
            "apkVersionName": "0.1.0-rc2",
            "apkVersionCode": 2,
            "forceUpdate": false,
            "showUpdatePrompt": false,
            "nativeApkRebuild": false,
            "customDomain": "svrpoker.com"
          }
          EOF_HEALTH
          cp publish/deploy-health.json publish/game/deploy-health.json

      - name: Validate production tree
        shell: bash
        run: |
          set -euo pipefail
          test -s publish/index.html
          test -s publish/game/index.html
          test -s publish/game/quest.html
          test -s publish/game/camera3-live.html
          test -s publish/game/modules/phase438_lab_master_lobby_dealer_authority.js
          test -s publish/game/modules/phase439_lab_only_lobby_render_authority.js
          test -s publish/game/modules/phase440_lab_master_hard_render_lock.js
          test -s publish/game/modules/dealer/table_calibration_module.js
          test -s publish/game/modules/dealer/eric_dealer_module.js
          test -s publish/game/labs/dealer/table-surface-authority-phase437.js
          test -s publish/game/labs/avatar/index.html
          test -s publish/game/labs/avatar/avatar-lab.js
          test -s publish/game/modules/avatar/player_avatar_module.js
          test -s publish/game/modules/phase444_heads_up_avatar_demo.js
          test -s publish/game/tools/phase443-avatar-dealer-table-audit.mjs
          test -s publish/game/assets/models/table.glb
          test -s publish/game/assets/models/eric/eric.fbx
          grep -q 'PHASE-440-LAB-MASTER-HARD-RENDER-LOCK' publish/deploy-health.json
          grep -q '"questLabMasterOnlyRenderedTable": true' publish/deploy-health.json
          grep -q '"questLabMasterOnlyRenderedEric": true' publish/deploy-health.json
          grep -q '"questLegacyTableVisualsDetached": true' publish/deploy-health.json
          grep -q '"questApprovedEricScale": 0.0047' publish/deploy-health.json
          grep -q 'PHASE-443-PLAYER-ONLY-ARTICULATED-AVATAR-LAB' publish/deploy-health.json
          (cd publish && node game/tools/phase443-avatar-dealer-table-audit.mjs)
          test -f publish/CNAME
          grep -qx 'svrpoker.com' publish/CNAME
          test -s publish/404.html
          grep -Fq '<title>SVR Poker | Official 404</title>' publish/404.html

      - name: Publish
        shell: bash
        working-directory: publish
        run: |
          set -euo pipefail
          git config user.name 'SVR Auto Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Production already matches Phase 440.'
          else
            git commit -m "Deploy Phase 440 Lab-only Quest lobby ${GITHUB_SHA}"
            git push origin gh-pages
          fi
