name: SVR Production Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svr-production-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Free runner disk
        shell: bash
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Checkout production paths
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            index.html
            404.html
            style.css
            launch.css
            launch-overrides.css
            matrix.js
            site-local-counter.js
            site-public-hooks.js
            support-chat-bot.js
            support-lead-routing.js
            pwa-app-install.js
            app-install.js
            app-update-checker.js
            manifest.webmanifest
            pwa-sw.js
            sw.js
            offline.html
            logo.png
            logo.webp
            favicon.ico
            CNAME
            .nojekyll
            game
            site
            android
            downloads
            update

      - name: Verify Phase 375 Android playable gate
        shell: bash
        run: |
          set -euo pipefail
          node game/tools/phase375-android-playable-static-test.mjs

      - name: Build production branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

          for file in index.html 404.html style.css launch.css launch-overrides.css matrix.js site-local-counter.js site-public-hooks.js support-chat-bot.js support-lead-routing.js pwa-app-install.js app-install.js app-update-checker.js manifest.webmanifest pwa-sw.js sw.js offline.html logo.png logo.webp favicon.ico CNAME .nojekyll; do
            if [ -f "$file" ]; then cp -a "$file" build/; fi
          done

          for dir in game site android downloads update; do
            if [ -d "$dir" ]; then mkdir -p "build/$dir" && cp -a "$dir"/. "build/$dir"/; fi
          done

          touch build/.nojekyll
          find build -type d \( -name '_backups' -o -name 'backup-game-*' -o -name 'node_modules' -o -name '.git' \) -prune -exec rm -rf {} + || true
          find build -type f \( -name '*.zip' -o -name '*.7z' -o -name '*.rar' -o -name '*.blend' -o -name '*.psd' -o -name '*.tmp' \) -delete || true
          find build/game -type f -name '*.fbx' ! -path 'build/game/assets/table.fbx' ! -path 'build/game/assets/models/eric/eric.fbx' ! -path 'build/game/assets/models/claudia/claudia.fbx' -delete || true

          test -f build/index.html
          test -f build/CNAME
          test -f build/game/index.html
          test -f build/game/android.html
          test -f build/game/modules/phase375_android_playable_authority_lock.js
          test -f build/game/modules/phase363_android_canonical_table_asset_lock.js
          test -f build/game/modules/phase347_android_single_controller_seated_gameplay_apk_release_lock.js
          test -f build/game/modules/phase357_android_direct_camera_seat_fix.js
          test -f build/game/assets/models/table.glb
          test -f build/game/assets/table.fbx
          test -f build/site/index.html
          test -f build/site/login.html
          test -f build/site/profile.html
          test -f build/site/avatar.html
          test -f build/site/config/player-api.json

          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > build/deploy-health.json <<EOF_HEALTH
          {
            "status": "ok",
            "build": "PHASE-375-ANDROID-PLAYABLE-AUTODEPLOY-LOCK",
            "androidBuild": "PHASE-375-ANDROID-PLAYABLE-SINGLE-JOIN-AUTHORITY-LOCK",
            "profileBuild": "PHASE-374-PROFILE-MOBILE-AVATAR-MENU-RECOVERY-LOCK",
            "questBuild": "PHASE-373-QUEST-SEATED-TELEPORT-TABLE-SPAWN-NPC-LOCK",
            "questFinalizer": "PHASE-373-QUEST-TABLE-SEAT-FINALIZER-LOCK",
            "commit": "$GITHUB_SHA",
            "deployedAt": "$DEPLOYED_AT",
            "sourceBranch": "main",
            "publishBranch": "gh-pages",
            "databaseProvider": "aws",
            "identityProvider": "cognito",
            "profileDatabase": "dynamodb",
            "androidRoute": "/game/android.html?channel=stable&v=phase375",
            "profileRoute": "/site/profile.html?v=phase374",
            "questRoute": "/game/index.html?platform=quest&v=phase373",
            "apkVersionName": "0.1.0-rc1",
            "apkVersionCode": 1,
            "nativeApkRebuild": false,
            "webRuntimeUpdated": true,
            "customDomain": "svrpoker.com"
          }
          EOF_HEALTH
          cp build/deploy-health.json build/game/deploy-health.json
          du -sh build

      - name: Publish exact build to gh-pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd build
          git init -b gh-pages
          git config user.name "SVR Auto Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify custom-domain deployment
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            response="$(curl -fsS --max-time 15 "https://svrpoker.com/deploy-health.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            if echo "$response" | grep -q "$GITHUB_SHA"; then
              echo "Verified svrpoker.com at ${GITHUB_SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::The gh-pages branch was published, but the custom-domain cache did not expose the new commit within four minutes."
