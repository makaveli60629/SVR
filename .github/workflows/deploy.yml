name: Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Prepare build folder
        run: |
          rm -rf build
          mkdir -p build

          echo "Copying site files..."

          if [ -d "site" ]; then
            cp -r site/* build/
          fi

          if [ -d "game" ]; then
            mkdir -p build/game
            cp -r game/* build/game/
          fi

      - name: Apply update zips safely
        run: |

          flatten_zip () {
            ZIPFILE=$1
            TARGET=$2

            mkdir tmpzip
            unzip -o "$ZIPFILE" -d tmpzip

            # detect nested folder
            if [ ! -f tmpzip/index.html ]; then
              INNER=$(find tmpzip -mindepth 1 -maxdepth 1 -type d | head -n1)
              if [ -n "$INNER" ]; then
                cp -r "$INNER"/* "$TARGET"/
              fi
            else
              cp -r tmpzip/* "$TARGET"/
            fi

            rm -rf tmpzip
          }

          if [ -f update/site.zip ]; then
            echo "Applying site update..."
            flatten_zip update/site.zip build
          fi

          if [ -f update/game.zip ]; then
            echo "Applying game update..."
            mkdir -p build/game
            flatten_zip update/game.zip build/game
          fi

      - name: Validate build
        run: |
          if [ ! -f build/index.html ]; then
            echo "❌ ERROR: index.html missing. Deploy cancelled."
            exit 1
          fi

          echo "✅ index.html found."

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy site
        uses: actions/deploy-pages@v4
