name: Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: "Type YES to confirm deploy"
        required: false
        default: "YES"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Free runner disk before checkout
        shell: bash
        run: |
          set +e
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          docker system prune -af || true
          sudo apt-get clean || true
          echo "Disk after cleanup:"
          df -h

      - name: Checkout public files only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            index.html
            style.css
            launch.css
            matrix.js
            site-public-hooks.js
            logo.png
            logo.webp
            favicon.ico
            .nojekyll
            site
            game
            reiki
            android
            downloads
            presentations
            presentation
            update
            docs/PHASE_100_FULL_DEMO_POLISH_MANIFEST.md
            docs/PHASE_100_AWS_WEBEX_DEPLOYMENT_NOTES.md
            docs/PHASE_100_QA_CHECKLIST.md
            docs/PHASE_100_HANDOFF.md

      - name: Prepare static Pages build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          copy_file_if_exists() {
            if [ -f "$1" ]; then
              mkdir -p "build/$(dirname "$1")"
              cp "$1" "build/$1"
            fi
          }

          copy_dir_if_exists() {
            if [ -d "$1" ]; then
              mkdir -p "build/$1"
              cp -a "$1"/. "build/$1"/
            fi
          }

          copy_file_if_exists index.html
          copy_file_if_exists style.css
          copy_file_if_exists launch.css
          copy_file_if_exists matrix.js
          copy_file_if_exists site-public-hooks.js
          copy_file_if_exists logo.png
          copy_file_if_exists logo.webp
          copy_file_if_exists favicon.ico
          copy_file_if_exists .nojekyll

          copy_dir_if_exists site
          copy_dir_if_exists game
          copy_dir_if_exists reiki
          copy_dir_if_exists android
          copy_dir_if_exists downloads
          copy_dir_if_exists presentations
          copy_dir_if_exists presentation
          copy_dir_if_exists update

          touch build/.nojekyll

          mkdir -p build/reiki build/android build/downloads build/update
          mkdir -p build/site/presentations/reiki build/site/android build/site/downloads build/game

          if [ ! -f build/site/presentations/reiki/index.html ]; then
            printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>SVR Reiki Presentation</title></head><body style="background:#030008;color:white;font-family:Arial;padding:32px"><h1>SVR Reiki Presentation</h1><p>Prepared for private review. Partner-specific materials remain awaiting approval.</p><p><a style="color:#ffd36a" href="/game/?scene=lobby&focus=reiki-storefront&svr30sky=1">Open VR Reiki Storefront Preview</a></p><p><a style="color:#7ffcff" href="/android/">Open Android Demo Page</a></p></body></html>' > build/site/presentations/reiki/index.html
          fi

          if [ ! -f build/site/android/index.html ]; then
            printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>SVR Android Demo</title></head><body style="background:#030008;color:white;font-family:Arial;padding:32px"><h1>SVR Android Demo</h1><p>The Android APK demo is being finalized.</p><p><a style="color:#ffd36a" href="/reiki/">Open Reiki Presentation</a></p></body></html>' > build/site/android/index.html
          fi

          if [ ! -f build/site/downloads/index.html ]; then
            printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>SVR Downloads</title></head><body style="background:#030008;color:white;font-family:Arial;padding:32px"><h1>SVR Downloads</h1><p>The APK direct file will appear after the demo build is finalized.</p><p><a style="color:#ffd36a" href="/android/">Open Android Demo Page</a></p></body></html>' > build/site/downloads/index.html
          fi

          if [ ! -f build/reiki/index.html ]; then
            printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/site/presentations/reiki/"><a href="/site/presentations/reiki/">Open Reiki Presentation</a>' > build/reiki/index.html
          fi

          if [ ! -f build/android/index.html ]; then
            printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/site/android/"><a href="/site/android/">Open Android Demo Page</a>' > build/android/index.html
          fi

          if [ ! -f build/downloads/index.html ]; then
            printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/site/downloads/"><a href="/site/downloads/">Open Downloads</a>' > build/downloads/index.html
          fi

          GAME_ZIP_STATUS="missing"
          GAME_ZIP_BYTES="0"
          if [ -f build/update/game.zip ]; then
            GAME_ZIP_STATUS="present"
            GAME_ZIP_BYTES="$(wc -c < build/update/game.zip | tr -d ' ')"
            if [ "$GAME_ZIP_BYTES" -gt 26214400 ]; then
              echo "::warning::update/game.zip is larger than 25 MB: ${GAME_ZIP_BYTES} bytes"
            fi
          else
            echo "::warning::update/game.zip is missing from this deployment artifact"
          fi

          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n  "status": "ok",\n  "build": "SVR-PHASE-100-AUTO-DEPLOY",\n  "commit": "%s",\n  "deployedAt": "%s",\n  "gameZipStatus": "%s",\n  "gameZipBytes": "%s"\n}\n' "$GITHUB_SHA" "$DEPLOYED_AT" "$GAME_ZIP_STATUS" "$GAME_ZIP_BYTES" > build/deploy-health.json
          cp build/deploy-health.json build/game/deploy-health.json
          cp build/deploy-health.json build/phase100-deploy.json

          find build -maxdepth 3 -type f | sort > /tmp/svr-build-files.txt
          sed -n '1,260p' /tmp/svr-build-files.txt | sed 's#^# - #'
          df -h

      - name: Validate routes before upload
        shell: bash
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/reiki/index.html
          test -f build/android/index.html
          test -f build/downloads/index.html
          test -f build/site/presentations/reiki/index.html
          test -f build/site/android/index.html
          test -f build/site/downloads/index.html
          test -f build/deploy-health.json
          test -f build/game/deploy-health.json
          test -f build/phase100-deploy.json
          if [ ! -f build/update/game.zip ]; then
            echo "::warning::build/update/game.zip was not found; Pages deploy will continue with health warning"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
