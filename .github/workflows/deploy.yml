- name: Prepare build
  run: |
    rm -rf build
    mkdir build

    rsync -av \
      --exclude '.git' \
      --exclude '.github' \
      --exclude 'update' \
      --exclude 'backend/node_modules' \
      --exclude 'Library' \
      --exclude 'Logs' \
      --exclude 'Temp' \
      ./ build/ || test $? -eq 24
