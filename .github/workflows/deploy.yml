name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare build
        run: |
          rm -rf dist
          mkdir dist

      - name: Copy base repo
        run: |
          rsync -av --exclude='.git' --exclude='.github' --exclude='update' ./ dist/

      - name: Apply update zips
        run: |
          if [ -d "update" ]; then
            for z in update/*.zip; do
              echo "Applying $z"
              unzip -o "$z" -d dist
            done
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        uses: actions/deploy-pages@v4
