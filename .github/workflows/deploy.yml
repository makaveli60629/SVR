name: Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Prepare build
        run: |
          set -euo pipefail
          rm -rf build tmp
          mkdir -p build

          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'update' \
            --exclude 'backend' \
            --exclude 'docs' \
            --exclude 'modules' \
            --exclude 'Library' \
            --exclude 'Logs' \
            --exclude 'Temp' \
            --exclude '*.zip' \
            --exclude '*.fbx' \
            ./ build/ || test $? -eq 24

      - name: Apply update zips
        run: |
          set -euo pipefail

          flatten_zip() {
            ZIP="$1"
            TARGET="$2"
            LABEL="$3"

            if [ ! -f "$ZIP" ]; then
              echo "No $LABEL zip found at $ZIP"
              return 0
            fi

            echo "Applying $LABEL from $ZIP into $TARGET"
            rm -rf tmp
            mkdir -p tmp "$TARGET"

            unzip -o "$ZIP" -d tmp
            chmod -R u+rwX,go+rX tmp || true

            echo "$LABEL zip top-level contents:"
            find tmp -maxdepth 3 -mindepth 1 | sort | head -300

            SRC="tmp"
            if [ -f tmp/index.html ]; then
              SRC="tmp"
            elif [ -f tmp/game/index.html ]; then
              SRC="tmp/game"
            elif [ -f tmp/site/index.html ]; then
              SRC="tmp/site"
            else
              INNER="$(find tmp -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
              if [ -n "$INNER" ] && [ -f "$INNER/index.html" ]; then
                SRC="$INNER"
              fi
            fi

            if [ ! -f "$SRC/index.html" ]; then
              echo "ERROR: $LABEL zip did not contain an index.html at root, /game, /site, or one inner folder."
              exit 1
            fi

            rm -rf "$TARGET"
            mkdir -p "$TARGET"
            cp -a "$SRC"/. "$TARGET"/
            chmod -R u+rwX,go+rX "$TARGET" || true

            rm -rf tmp
          }

          flatten_zip update/site.zip build site
          flatten_zip update/game.zip build/game game

      - name: Stamp deploy version
        run: |
          set -euo pipefail
          mkdir -p build/game
          COMMIT_SHA="${GITHUB_SHA}"
          DEPLOY_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          cat > build/game/deploy-health.json <<EOF
          {
            "status": "ok",
            "commit": "${COMMIT_SHA}",
            "deployedAt": "${DEPLOY_TIME}",
            "workflow": "Auto Deploy",
            "target": "/game"
          }
          EOF

          if [ ! -f build/game/version.json ]; then
            cat > build/game/version.json <<EOF
          {
            "build": "DEPLOY-STAMP-${COMMIT_SHA}",
            "commit": "${COMMIT_SHA}",
            "deployedAt": "${DEPLOY_TIME}"
          }
          EOF
          fi

      - name: Validate build
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/game/index.html
          test -f build/game/deploy-health.json
          test -f build/game/version.json

          echo "Root build files:"
          find build -maxdepth 3 -type f | sort | head -300

          echo "Checking active game entry file:"
          grep -n "BUILD:" build/game/index.html || true
          grep -n "PHASE-" build/game/index.html || true

          if [ -f update/game.zip ]; then
            if unzip -p update/game.zip docs/BUILD_VERSION.json 2>/dev/null | grep -q "PHASE-48-POKER-JS-TRUTH-LOCK"; then
              echo "WARNING: update/game.zip docs/BUILD_VERSION.json still says Phase 48. Deploying because the uploaded game zip is the current requested source."
            fi
            if unzip -p update/game.zip index.html 2>/dev/null | grep -q "PHASE-48-POKER-JS-TRUTH-LOCK"; then
              echo "WARNING: update/game.zip root index.html still says Phase 48. Deploying because this proves the zip itself must be replaced next, not the workflow."
            fi
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy
        uses: actions/deploy-pages@v4
