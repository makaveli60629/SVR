- name: Prepare build
  run: |
    rm -rf build
    mkdir -p build

    # copy site files directly into root
    if [ -d "site" ]; then
      cp -r site/* build/
    fi

    # copy game folder
    if [ -d "game" ]; then
      mkdir -p build/game
      cp -r game/* build/game/
    fi

    # verify root index exists
    if [ ! -f build/index.html ]; then
      echo "ERROR: index.html missing in build root"
      exit 1
    fi
