name: SVR Production Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svr-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout authoritative production source
        uses: actions/checkout@v5
        with:
          path: source
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /launch.css
            /matrix.js
            /site-public-hooks.js
            /logo.webp
            /logo.png
            /manifest.webmanifest
            /pwa-sw.js
            /sw.js
            /offline.html
            /CNAME
            /.nojekyll
            /game/
            /site/
            /downloads/
            /update/app-version.json

      - name: Checkout current production branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 1

      - name: Validate Phase 383 full-site source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SVR Poker | Public Launch Page' source/index.html
          grep -q 'id="binary-rain"' source/index.html
          grep -q 'PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK' source/index.html
          grep -q 'site-public-hooks.js?v=phase383' source/index.html
          grep -q 'site/index.html?v=phase383' source/index.html
          grep -q 'Preview Site' source/index.html
          grep -q 'Preview Game' source/index.html
          grep -q 'phase383-full-site-homepage-restore' source/site-public-hooks.js
          grep -q 'PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK' source/site/index.html
          grep -q 'Explore SVR Poker' source/site/index.html
          grep -q 'SVR Store' source/site/index.html
          grep -q 'Tournaments' source/site/index.html
          grep -q 'Membership' source/site/index.html
          grep -q 'Sponsorship' source/site/index.html
          grep -q 'Community Impact' source/site/index.html
          grep -q 'SVR AI Concierge' source/site/index.html
          grep -q 'phase383-home-restore.css' source/site/index.html
          grep -q 'phase383-home-restore.js' source/site/index.html
          test -s source/site/phase383-home-restore.css
          test -s source/site/phase383-home-restore.js
          ! grep -Eqi 'Trueitive|Shyona Royston' source/site/index.html
          grep -q 'PHASE-381-VR-SEAT-ERIC-AUDIO-OVERLAY-LOCK' source/game/index.html
          grep -q 'phase381_asset_load_cache_guard' source/game/index.html
          grep -q 'phase381_vr_runtime_lock' source/game/index.html
          ! grep -q 'phase364_quest_eric_quarantine_watch' source/game/index.html
          grep -q 'PHASE-380-ANDROID-PLAYABLE-POKER-PRESENTATION-LOCK' source/game/android-stable.html
          grep -q 'JOIN NOW' source/game/android-stable.html
          grep -q 'deterministicHandEvaluator:true' source/game/android-stable.html
          grep -q 'PHASE-380-ORIGINAL-UPLOADED-TABLE-AUTHORITY-LOCK' source/game/modules/phase380_original_table_authority_lock.js
          grep -q 'PHASE-380-QUEST-PROCEDURAL-TABLE-FALLBACK-LOCK' source/game/modules/phase379_quest_procedural_table_authority.js
          grep -q 'pwa-phase382' source/manifest.webmanifest
          grep -q 'phase383-full-site-homepage-restore' source/pwa-sw.js
          grep -q 'phase383-full-site-homepage-restore' source/sw.js
          test -s source/offline.html
          test -s source/game/assets/models/table.glb
          test -s source/game/assets/table.fbx
          test -s source/game/assets/models/eric/eric.fbx
          test -s source/downloads/svr-poker-android-rc2.apk
          test -s source/downloads/svr-poker-android-rc2.apk.sha256
          python3 -m json.tool source/game/android-release.json >/dev/null
          python3 -m json.tool source/game/manifest.json >/dev/null
          python3 -m json.tool source/update/app-version.json >/dev/null
          python3 -m json.tool source/manifest.webmanifest >/dev/null
          node --check source/site-public-hooks.js
          node --check source/site/phase383-home-restore.js
          node --check source/game/modules/phase381_asset_load_cache_guard.js
          node --check source/game/modules/phase381_vr_runtime_lock.js
          node --check source/game/modules/phase380_original_table_authority_lock.js
          node --check source/game/modules/phase379_quest_procedural_table_authority.js
          node --check source/pwa-sw.js
          node --check source/sw.js

      - name: Rebuild clean production tree
        shell: bash
        run: |
          set -euo pipefail
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp source/index.html publish/index.html
          cp source/launch.css publish/launch.css
          cp source/matrix.js publish/matrix.js
          cp source/site-public-hooks.js publish/site-public-hooks.js
          cp source/manifest.webmanifest publish/manifest.webmanifest
          cp source/pwa-sw.js publish/pwa-sw.js
          cp source/sw.js publish/sw.js
          cp source/offline.html publish/offline.html
          if [ -f source/logo.png ]; then cp source/logo.png publish/logo.png; fi
          if [ -f source/logo.webp ]; then cp source/logo.webp publish/logo.webp; fi
          if [ -f source/CNAME ]; then cp source/CNAME publish/CNAME; fi
          if [ -f source/.nojekyll ]; then cp source/.nojekyll publish/.nojekyll; else touch publish/.nojekyll; fi
          cp -a source/game publish/game
          cp -a source/site publish/site
          cp -a source/downloads publish/downloads
          mkdir -p publish/update
          cp source/update/app-version.json publish/update/app-version.json
          rm -rf publish/game/tools publish/game/docs publish/site/tools publish/site/docs
          find publish -type f \( -name '*.zip' -o -name '*.ps1' -o -name '.env' -o -name '.env.*' \) -delete
          chmod -R u+rwX,go+rX publish

      - name: Stamp deployment health
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APK_SHA="$(cut -d' ' -f1 source/downloads/svr-poker-android-rc2.apk.sha256)"
          cat > publish/deploy-health.json <<EOF2
          {
            "status": "ok",
            "build": "PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK",
            "androidBuild": "PHASE-380-ANDROID-PLAYABLE-POKER-PRESENTATION-LOCK",
            "questBuild": "PHASE-381-VR-SEAT-ERIC-AUDIO-OVERLAY-LOCK",
            "publicBuild": "PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK",
            "siteBuild": "PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK",
            "pwaBuild": "PHASE-383-FULL-SITE-CACHE-ROLLOVER",
            "commit": "${GITHUB_SHA}",
            "deployedAt": "${DEPLOYED_AT}",
            "sourceBranch": "main",
            "publishBranch": "gh-pages",
            "androidRoute": "/game/android-stable.html?v=phase380&deploy=phase383",
            "questRoute": "/game/index.html?platform=quest&v=phase383",
            "siteRoute": "/site/index.html?v=phase383",
            "downloadsRoute": "/downloads/?v=phase383",
            "apkUrl": "/downloads/svr-poker-android-rc2.apk",
            "apkSha256": "${APK_SHA}",
            "apkVersionName": "0.1.0-rc2",
            "apkVersionCode": 2,
            "apkBuildStatus": "same-domain-ready",
            "fullWebsiteRestored": true,
            "homepageNavigationRestored": true,
            "homepageSliderRestored": true,
            "homepageLivePreviewRestored": true,
            "homepageStoreTournamentsMembershipSponsorsImpactRestored": true,
            "homepageStatusAiDressingRoomPreserved": true,
            "terminatedPartnerMaterialExcludedFromHomepage": true,
            "joinNowStatic": true,
            "cardsBeforeJoin": false,
            "androidDeterministicEvaluator": true,
            "questOriginalTableFirst": true,
            "questProceduralTableEmergencyOnly": true,
            "questEricMeshRiggedToDealerMotion": true,
            "questSeatedMovementAndTeleportLocked": true,
            "questHeadOverlayCleanup": true,
            "questProceduralAudioFallback": true,
            "cacheRecovery": true,
            "visibleBuildProof": true,
            "pagesPushTrigger": true,
            "cleanTreePublish": true,
            "customDomain": "svrpoker.com"
          }
          EOF2
          cp publish/deploy-health.json publish/game/deploy-health.json

      - name: Validate clean production tree
        shell: bash
        run: |
          set -euo pipefail
          test -f publish/index.html
          test -f publish/site/index.html
          test -f publish/site/profile.html
          test -f publish/site/avatar.html
          test -f publish/site/phase383-home-restore.css
          test -f publish/site/phase383-home-restore.js
          test -f publish/game/index.html
          test -f publish/game/android-stable.html
          test -f publish/game/modules/phase381_asset_load_cache_guard.js
          test -f publish/game/modules/phase381_vr_runtime_lock.js
          test -f publish/game/modules/phase380_original_table_authority_lock.js
          test -s publish/game/assets/models/table.glb
          test -s publish/game/assets/table.fbx
          test -s publish/game/assets/models/eric/eric.fbx
          test -s publish/downloads/svr-poker-android-rc2.apk
          test -f publish/manifest.webmanifest
          test -f publish/pwa-sw.js
          test -f publish/sw.js
          test -f publish/offline.html
          test -f publish/deploy-health.json
          grep -q 'PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK' publish/site/index.html
          grep -q 'PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK' publish/deploy-health.json
          grep -q '"fullWebsiteRestored": true' publish/deploy-health.json
          ! find publish -type f \( -name '.env' -o -name '.env.*' \) | grep -q .
          ! grep -RIl --exclude='*.min.js' --exclude='*.map' -E 'AZURE_SQL_CONNECTION_STRING=|STRIPE_SECRET_KEY=|AWS_SECRET_ACCESS_KEY=|ADMIN_PASSWORD=' publish | grep -q .

      - name: Publish clean tree to gh-pages
        shell: bash
        working-directory: publish
        run: |
          set -euo pipefail
          git config user.name 'SVR Auto Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Production already matches the Phase 383 full-site homepage restore tree.'
          else
            git commit -m "Deploy Phase 383 full-site homepage restore ${GITHUB_SHA}"
            git push origin gh-pages
          fi
