name: Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Prepare build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          rsync -av --exclude '.git' --exclude '.github' --exclude 'update' ./ build/

      - name: Apply update zips
        shell: bash
        run: |
          set -euo pipefail

          flatten() {
            local ZIP="$1"
            local TARGET="$2"
            local TMP
            local SRC
            local INNER

            TMP="$(mktemp -d)"
            mkdir -p "$TARGET"

            unzip -oq "$ZIP" -d "$TMP"

            SRC="$TMP"

            if [ ! -f "$TMP/index.html" ]; then
              INNER="$(find "$TMP" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)"
              if [ -n "${INNER:-}" ]; then
                SRC="$INNER"
              fi
            fi

            rsync -av "$SRC"/ "$TARGET"/
            rm -rf "$TMP"
          }

          if [ -f update/site.zip ]; then
            echo "Updating site"
            flatten update/site.zip build
          fi

          if [ -f update/game.zip ]; then
            echo "Updating game"
            flatten update/game.zip build/game
          fi

      - name: Validate build
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f build/index.html ]; then
            echo "ERROR: build/index.html missing"
            exit 1
          fi

          if [ ! -f build/game/index.html ]; then
            echo "WARNING: build/game/index.html missing"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy
        uses: actions/deploy-pages@v4
