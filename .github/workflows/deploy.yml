name: SVR Production Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svr-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          path: source
          fetch-depth: 1
      - name: Checkout production
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 1

      - name: Verify latest main source
        shell: bash
        run: |
          set -euo pipefail
          git -C source fetch origin main --depth=1
          test "$(git -C source rev-parse HEAD)" = "$(git -C source rev-parse origin/main)"

      - name: Validate Phase 395 Quest and locked Android Phase 394
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-395-QUEST-BROWSER-TABLE-GAMEPLAY-FIX-LOCK' source/index.html
          grep -q 'launch-quest.css?v=phase395' source/index.html
          grep -q 'game/quest.html?v=phase395' source/index.html
          grep -q 'game/android.html?channel=stable&v=phase394' source/index.html
          grep -q 'PHASE-395-QUEST-BROWSER-PUBLIC-PAGE-CENTER-LOCK' source/launch-quest.css
          grep -q 'PHASE-395-QUEST-BROWSER-TABLE-GAMEPLAY-FIX-LOCK' source/game/quest.html
          grep -q 'PHASE-395-QUEST-BROWSER-TABLE-GAMEPLAY-FIX-LOCK' source/game/index.html
          grep -q 'phase395_quest_browser_table_gameplay_fix.js?v=phase395' source/game/index.html
          grep -q 'phase395_quest_eric_floor_guard.js?v=phase395' source/game/index.html
          grep -q 'TARGET_TABLE_WIDTH=3.58' source/game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'TARGET_TABLE_TOP=1.03' source/game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'TARGET_TABLE_BOTTOM=-0.015' source/game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'TARGET_FELT_RECESS=0.12' source/game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'DEALER_GAP=0.22' source/game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'SEATED_RAIL_GAP=0.10' source/game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'SEATED_EYE_HEIGHT=1.22' source/game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'SVR_PHASE341_REBUILD' source/game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'SVR_POKER_NEXT_HAND' source/game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'PHASE395_QUEST_TABLE_LIGHTING' source/game/modules/phase395_quest_browser_table_gameplay_fix.js
          grep -q 'SVR_PHASE395_ERIC_HARD_GUARD_QA' source/game/modules/phase395_quest_eric_floor_guard.js
          grep -q 'supersededByPhase395' source/game/modules/phase393_quest_table_eric_seat_calibration.js
          grep -q '"phase": 395' source/game/manifest.json
          grep -q '"lockedUnchangedForPhase395": true' source/game/manifest.json

          # Android Phase 394 is a protected production baseline for this Quest-only phase.
          grep -q 'PHASE-394-ANDROID-TABLE-PRESENTATION-POLISH-LOCK' source/game/android.html
          grep -q 'PHASE-394-ANDROID-TABLE-PRESENTATION-POLISH-LOCK' source/game/android-tabletop.html
          grep -q 'PHASE-394-ANDROID-TABLE-PRESENTATION-POLISH-LOCK' source/game/android-stable.html
          grep -q 'phase394_android_table_polish.css' source/game/android-stable.html
          grep -q 'phase394_android_table_polish.js' source/game/android-stable.html
          grep -q 'SVR_PHASE394_ANDROID_POLISH_QA' source/game/modules/phase394_android_table_polish.js
          grep -q 'SVR_PHASE393_ANDROID_QA' source/game/modules/phase393_android_gameplay.js
          grep -q 'TURN_SECONDS=15' source/game/modules/phase393_android_common.js
          grep -q '"potBelowLogo": true' source/game/android-release.json
          grep -q '"dedicatedBurnTray": true' source/game/android-release.json
          grep -q '"featuredSponsorDefault": "REIKI"' source/game/android-release.json

          node --check source/site-public-hooks.js
          node --check source/sw.js
          node --check source/pwa-sw.js
          node --check source/game/modules/phase395_quest_browser_table_gameplay_fix.js
          node --check source/game/modules/phase395_quest_eric_floor_guard.js
          node --check source/game/modules/phase393_quest_table_eric_seat_calibration.js
          node --check source/game/modules/phase393_android_common.js
          node --check source/game/modules/phase393_android_evaluator.js
          node --check source/game/modules/phase393_android_gameplay.js
          node --check source/game/modules/phase394_android_table_polish.js
          python3 -m json.tool source/manifest.webmanifest >/dev/null
          python3 -m json.tool source/game/manifest.json >/dev/null
          python3 -m json.tool source/game/android-release.json >/dev/null
          python3 -m json.tool source/update/app-version.json >/dev/null
          python3 -m json.tool source/docs/PHASE_395_QUEST_BROWSER_TABLE_GAMEPLAY_FIX.json >/dev/null
          test -s source/launch-quest.css
          test -s source/game/assets/models/table.glb
          test -s source/game/assets/models/eric/eric.fbx
          test -s source/support-chat-bot.js
          test -s source/site-local-counter.js
          test -s source/downloads/svr-poker-android-rc2.apk
          grep -q '"apkVersionName": "0.1.0-rc2"' source/game/android-release.json
          grep -q '"apkVersionCode": 2' source/game/android-release.json
          grep -q '"forceUpdate": false' source/game/android-release.json
          grep -q '"showUpdatePrompt": false' source/game/android-release.json
          grep -q '"nativeApkRebuild": false' source/game/android-release.json

      - name: Build clean production tree
        shell: bash
        run: |
          set -euo pipefail
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          for file in index.html launch.css launch-quest.css matrix.js site-public-hooks.js site-local-counter.js support-chat-bot.js manifest.webmanifest pwa-sw.js sw.js offline.html logo.png logo.webp CNAME .nojekyll; do
            [ -e "source/$file" ] && cp "source/$file" "publish/$file"
          done
          cp -a source/game publish/game
          cp -a source/site publish/site
          cp -a source/downloads publish/downloads
          mkdir -p publish/update
          cp source/update/app-version.json publish/update/app-version.json
          rm -rf publish/game/tools publish/game/docs publish/site/tools publish/site/docs
          find publish -type f \( -name '*.zip' -o -name '*.ps1' -o -name '.env' -o -name '.env.*' \) -delete

      - name: Stamp deployment health
        shell: bash
        run: |
          set -euo pipefail
          cat > publish/deploy-health.json <<EOF_HEALTH
          {
            "status": "ok",
            "build": "PHASE-395-QUEST-BROWSER-TABLE-GAMEPLAY-FIX-LOCK",
            "questBuild": "PHASE-395-QUEST-BROWSER-TABLE-GAMEPLAY-FIX-LOCK",
            "androidBuild": "PHASE-394-ANDROID-TABLE-PRESENTATION-POLISH-LOCK",
            "androidCoreBuild": "PHASE-393-ANDROID-PERIMETER-TURN-CLOCK-AUDIO-LOCK",
            "camera3Build": "PHASE-392-CAMERA3-TABLE-SHOWCASE-LOCK",
            "siteBuild": "PHASE-392-SITE-PRESENTATION-POLISH-LOCK",
            "commit": "${GITHUB_SHA}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sourceBranch": "main",
            "publishBranch": "gh-pages",
            "questRoute": "/game/quest.html?v=phase395",
            "questRuntimeRoute": "/game/index.html?platform=quest&v=phase395&direct=1&autoseat=1&questfix=1&clean=1",
            "androidRoute": "/game/android.html?channel=stable&v=phase394",
            "androidGameplayRoute": "/game/android-stable.html?v=phase394&direct=1",
            "questBrowserCentered": true,
            "questTableWidthMeters": 3.58,
            "questTableTopMeters": 1.03,
            "questTableBottomFallbackMeters": -0.015,
            "questBaseLineAlignedToFloor": true,
            "questFeltRecessMeters": 0.12,
            "questEricFloorAnchored": true,
            "questEricHardFloorGuard": true,
            "questEricDealerGapMeters": 0.22,
            "questSeatedRailGapMeters": 0.10,
            "questSeatedEyeHeightMeters": 1.22,
            "questMinimumPhysicalCardMeshes": 17,
            "questCardsRebuiltAfterFinalCalibration": true,
            "questAutoStartTestHandWhenIdle": true,
            "questLightingBoost": true,
            "androidLockedUnchangedForPhase395": true,
            "androidPerimeterSeats": 5,
            "androidCenterPlayerCount": 0,
            "androidTurnClockSeconds": 15,
            "androidCustomRaiseSlider": true,
            "androidPokerSounds": true,
            "androidPotBelowLogo": true,
            "androidLogoCenterUnobstructed": true,
            "androidLargerCommunityCards": true,
            "androidDedicatedBurnTray": true,
            "androidAnimatedBurnTransfer": true,
            "androidFeaturedSponsorAboveLogo": true,
            "androidFeaturedSponsorDefault": "REIKI",
            "androidEmbeddedSponsorZones": 3,
            "apkVersionName": "0.1.0-rc2",
            "apkVersionCode": 2,
            "forceUpdate": false,
            "showUpdatePrompt": false,
            "nativeApkRebuild": false,
            "customDomain": "svrpoker.com"
          }
          EOF_HEALTH
          cp publish/deploy-health.json publish/game/deploy-health.json

      - name: Validate production tree
        shell: bash
        run: |
          set -euo pipefail
          test -s publish/index.html
          test -s publish/launch-quest.css
          test -s publish/game/quest.html
          test -s publish/game/index.html
          test -s publish/game/modules/phase395_quest_browser_table_gameplay_fix.js
          test -s publish/game/modules/phase395_quest_eric_floor_guard.js
          test -s publish/game/modules/phase393_quest_table_eric_seat_calibration.js
          test -s publish/game/android-stable.html
          test -s publish/game/modules/phase393_android_common.js
          test -s publish/game/modules/phase393_android_evaluator.js
          test -s publish/game/modules/phase393_android_gameplay.js
          test -s publish/game/modules/phase394_android_table_polish.js
          test -s publish/game/styles/phase393_android_table_layout.css
          test -s publish/game/styles/phase394_android_table_polish.css
          grep -q 'PHASE-395-QUEST-BROWSER-TABLE-GAMEPLAY-FIX-LOCK' publish/deploy-health.json
          grep -q '"questBrowserCentered": true' publish/deploy-health.json
          grep -q '"questEricHardFloorGuard": true' publish/deploy-health.json
          grep -q '"questMinimumPhysicalCardMeshes": 17' publish/deploy-health.json
          grep -q '"androidLockedUnchangedForPhase395": true' publish/deploy-health.json
          grep -q '"androidPotBelowLogo": true' publish/deploy-health.json
          grep -q '"androidFeaturedSponsorDefault": "REIKI"' publish/deploy-health.json

      - name: Publish
        shell: bash
        working-directory: publish
        run: |
          set -euo pipefail
          git config user.name 'SVR Auto Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Production already matches Phase 395 Quest fixes.'
          else
            git commit -m "Deploy Phase 395 Quest browser and gameplay fix ${GITHUB_SHA}"
            git push origin gh-pages
          fi
