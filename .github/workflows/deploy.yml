BUILD_LABEL="UNKNOWN"

if [ -f build/game/docs/BUILD_VERSION.json ]; then
  BUILD_LABEL="$(grep -o '"build"[[:space:]]*:[[:space:]]*"[^"]*"' build/game/docs/BUILD_VERSION.json | head -n1 | cut -d '"' -f4)"
elif [ -f build/game/version.json ]; then
  BUILD_LABEL="$(grep -o '"build"[[:space:]]*:[[:space:]]*"[^"]*"' build/game/version.json | head -n1 | cut -d '"' -f4)"
fi

cat > build/game/version.json <<EOF
{
  "build": "${BUILD_LABEL}",
  "commit": "${COMMIT_SHA}",
  "deployedAt": "${DEPLOY_TIME}"
}
EOF
