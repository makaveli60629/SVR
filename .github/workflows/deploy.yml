name: SVR Production Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svr-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout authoritative production source
        uses: actions/checkout@v5
        with:
          path: source
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /index.html
            /launch.css
            /matrix.js
            /site-public-hooks.js
            /logo.webp
            /logo.png
            /manifest.webmanifest
            /pwa-sw.js
            /sw.js
            /offline.html
            /CNAME
            /.nojekyll
            /game/
            /site/
            /downloads/
            /update/app-version.json

      - name: Checkout current production branch
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 1

      - name: Validate Phase 389 source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-389-FULL-AUDIT-VISIBLE-FIXES-LOCK' source/index.html
          grep -q 'site-public-hooks.js?v=phase389' source/index.html
          grep -q 'game/quest.html?v=phase389' source/index.html
          grep -q 'game/android.html?channel=stable&amp;v=phase389' source/index.html
          grep -q 'site/avatar.html?v=phase389' source/index.html
          grep -q 'site/profile.html?v=phase389' source/index.html
          grep -q 'phase389-full-audit-visible-fixes' source/site-public-hooks.js
          grep -q 'PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK' source/site/index.html
          ! grep -Eqi 'Trueitive|Shyona Royston' source/site/index.html

          test -s source/game/index.html
          grep -q 'PHASE-389-FULL-AUDIT-VISIBLE-FIXES-LOCK' source/game/index.html
          grep -q 'phase389_runtime_health_visibility' source/game/index.html
          ! grep -q "^import './modules/phase388_front_south_seat_authority" source/game/index.html
          test -s source/game/modules/phase389_runtime_health_visibility.js
          grep -q 'duplicatePhase388SeatControllerLoaded' source/game/index.html

          test -s source/game/camera3-live.html
          grep -q 'PHASE-389-CAMERA3-LIVE-PREVIEW-ROUTE-LOCK' source/game/camera3-live.html
          test -s source/game/modules/phase389_camera3_live_preview.js
          grep -q 'PHASE389_CAMERA3_PRODUCTION_LIGHTING' source/game/modules/phase389_camera3_live_preview.js
          grep -q 'camera3-live.html?v=phase389' source/site/phase383-home-restore.js
          grep -q 'camera3-live.html?v=phase389' source/game/camera3.html
          grep -q 'camera3-live.html?v=phase389' source/game/cam3.html
          grep -q 'camera3-live.html?v=phase389' source/game/preview.html

          grep -q 'PHASE-389-AVATAR-DRESSING-ROOM-VISIBLE-REFRESH-LOCK' source/site/avatar.html
          grep -q 'phase389-avatar-room.js?v=phase389' source/site/avatar.html
          test -s source/site/js/phase389-avatar-room.js
          grep -q 'PHASE-389-PROFILE-AVATAR-SHOWROOM-VISIBLE-REFRESH-LOCK' source/site/profile.html
          grep -q 'phase389-profile-showroom.js?v=phase389' source/site/profile.html
          test -s source/site/js/phase389-profile-showroom.js
          test -s source/site/css/phase389-avatar-profile-visible-refresh.css

          grep -q 'PHASE-389-ANDROID-RESPONSIVE-TABLE-LAYOUT-LOCK' source/game/android.html
          grep -q 'PHASE-389-ANDROID-RESPONSIVE-TABLE-LAYOUT-LOCK' source/game/android-tabletop.html
          test -s source/game/styles/phase389_android_responsive_layout.css
          test -s source/game/modules/phase389_android_responsive_layout.js
          grep -q 'responsiveModuleInjected' source/game/android-tabletop.html
          grep -q '"webEntry": "/game/android.html?channel=stable&v=phase389"' source/game/android-release.json
          grep -q '"forceUpdate": false' source/game/android-release.json
          grep -q '"showUpdatePrompt": false' source/game/android-release.json

          grep -q 'phase389-full-audit-visible-fixes-v2' source/sw.js
          grep -q 'phase389-full-audit-visible-fixes-v2' source/pwa-sw.js
          grep -q 'pwa-phase389' source/manifest.webmanifest
          grep -q '"phase": 389' source/game/manifest.json
          test -s source/game/assets/models/table.glb
          test -s source/game/assets/table.fbx
          test -s source/game/assets/models/eric/eric.fbx
          test -s source/logo.png
          test -s source/downloads/svr-poker-android-rc2.apk
          test -s source/downloads/svr-poker-android-rc2.apk.sha256

          python3 -m json.tool source/game/android-release.json >/dev/null
          python3 -m json.tool source/game/manifest.json >/dev/null
          python3 -m json.tool source/update/app-version.json >/dev/null
          python3 -m json.tool source/manifest.webmanifest >/dev/null
          node --check source/site-public-hooks.js
          node --check source/site/phase383-home-restore.js
          node --check source/site/js/phase389-avatar-room.js
          node --check source/site/js/phase389-profile-showroom.js
          node --check source/game/modules/phase389_runtime_health_visibility.js
          node --check source/game/modules/phase389_camera3_live_preview.js
          node --check source/game/modules/phase389_android_responsive_layout.js
          node --check source/sw.js
          node --check source/pwa-sw.js

      - name: Rebuild clean production tree
        shell: bash
        run: |
          set -euo pipefail
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp source/index.html publish/index.html
          cp source/launch.css publish/launch.css
          cp source/matrix.js publish/matrix.js
          cp source/site-public-hooks.js publish/site-public-hooks.js
          cp source/manifest.webmanifest publish/manifest.webmanifest
          cp source/pwa-sw.js publish/pwa-sw.js
          cp source/sw.js publish/sw.js
          cp source/offline.html publish/offline.html
          cp source/logo.png publish/logo.png
          if [ -f source/logo.webp ]; then cp source/logo.webp publish/logo.webp; fi
          if [ -f source/CNAME ]; then cp source/CNAME publish/CNAME; fi
          if [ -f source/.nojekyll ]; then cp source/.nojekyll publish/.nojekyll; else touch publish/.nojekyll; fi
          cp -a source/game publish/game
          cp -a source/site publish/site
          cp -a source/downloads publish/downloads
          mkdir -p publish/update
          cp source/update/app-version.json publish/update/app-version.json
          rm -rf publish/game/tools publish/game/docs publish/site/tools publish/site/docs
          find publish -type f \( -name '*.zip' -o -name '*.ps1' -o -name '.env' -o -name '.env.*' \) -delete
          chmod -R u+rwX,go+rX publish

      - name: Stamp Phase 389 deployment health
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APK_SHA="$(cut -d' ' -f1 source/downloads/svr-poker-android-rc2.apk.sha256)"
          cat > publish/deploy-health.json <<EOF2
          {
            "status": "ok",
            "build": "PHASE-389-FULL-AUDIT-VISIBLE-FIXES-LOCK",
            "questBuild": "PHASE-389-FULL-AUDIT-VISIBLE-FIXES-LOCK",
            "camera3Build": "PHASE-389-CAMERA3-LIVE-PREVIEW-ROUTE-LOCK",
            "androidBuild": "PHASE-389-ANDROID-RESPONSIVE-TABLE-LAYOUT-LOCK",
            "avatarBuild": "PHASE-389-AVATAR-DRESSING-ROOM-VISIBLE-REFRESH-LOCK",
            "profileBuild": "PHASE-389-PROFILE-AVATAR-SHOWROOM-VISIBLE-REFRESH-LOCK",
            "siteBuild": "PHASE-383-FULL-SITE-HOMEPAGE-RESTORE-LOCK",
            "commit": "${GITHUB_SHA}",
            "deployedAt": "${DEPLOYED_AT}",
            "sourceBranch": "main",
            "publishBranch": "gh-pages",
            "questRoute": "/game/quest.html?v=phase389",
            "questRuntimeRoute": "/game/index.html?platform=quest&v=phase389&direct=1&autoseat=1&questfix=1&clean=1",
            "camera3Route": "/game/camera3-live.html?v=phase389",
            "androidRoute": "/game/android.html?channel=stable&v=phase389",
            "androidTabletopRoute": "/game/android-tabletop.html?v=phase389",
            "dressingRoomRoute": "/site/avatar.html?v=phase389",
            "profileRoute": "/site/profile.html?v=phase389",
            "apkUrl": "/downloads/svr-poker-android-rc2.apk",
            "apkSha256": "${APK_SHA}",
            "apkVersionName": "0.1.0-rc2",
            "apkVersionCode": 2,
            "questSingleSeatAuthority": true,
            "questDuplicateFrontSouthAuthorityDisabled": true,
            "questRuntimeVisibilityGuard": true,
            "camera3DedicatedRoute": true,
            "camera3TableRequired": true,
            "camera3ProductionLighting": true,
            "camera3DirectorShots": 5,
            "websiteCamera3IframeUpdated": true,
            "androidResponsivePortrait": true,
            "androidResponsiveLandscape": true,
            "androidSafeAreaInsets": true,
            "avatarVisibleRefresh": true,
            "profileLiveSavedAvatar": true,
            "cacheRecovery": true,
            "cleanTreePublish": true,
            "forceUpdate": false,
            "showUpdatePrompt": false,
            "customDomain": "svrpoker.com"
          }
          EOF2
          cp publish/deploy-health.json publish/game/deploy-health.json

      - name: Validate clean production tree
        shell: bash
        run: |
          set -euo pipefail
          test -f publish/index.html
          test -f publish/game/index.html
          test -f publish/game/quest.html
          test -f publish/game/camera3-live.html
          test -f publish/game/modules/phase389_camera3_live_preview.js
          test -f publish/game/modules/phase389_runtime_health_visibility.js
          test -f publish/game/modules/phase389_android_responsive_layout.js
          test -f publish/game/styles/phase389_android_responsive_layout.css
          test -f publish/site/avatar.html
          test -f publish/site/profile.html
          test -f publish/site/js/phase389-avatar-room.js
          test -f publish/site/js/phase389-profile-showroom.js
          test -s publish/game/assets/models/table.glb
          test -s publish/game/assets/models/eric/eric.fbx
          test -s publish/logo.png
          test -s publish/downloads/svr-poker-android-rc2.apk
          grep -q 'PHASE-389-FULL-AUDIT-VISIBLE-FIXES-LOCK' publish/deploy-health.json
          grep -q '"camera3DedicatedRoute": true' publish/deploy-health.json
          grep -q '"questDuplicateFrontSouthAuthorityDisabled": true' publish/deploy-health.json
          grep -q '"androidResponsivePortrait": true' publish/deploy-health.json
          grep -q '"profileLiveSavedAvatar": true' publish/deploy-health.json
          ! find publish -type f \( -name '.env' -o -name '.env.*' \) | grep -q .
          ! grep -RIl --exclude='*.min.js' --exclude='*.map' -E 'AZURE_SQL_CONNECTION_STRING=|STRIPE_SECRET_KEY=|AWS_SECRET_ACCESS_KEY=|ADMIN_PASSWORD=' publish | grep -q .

      - name: Publish clean tree to gh-pages
        shell: bash
        working-directory: publish
        run: |
          set -euo pipefail
          git config user.name 'SVR Auto Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Production already matches the Phase 389 audited tree.'
          else
            git commit -m "Deploy Phase 389 audited visible fixes ${GITHUB_SHA}"
            git push origin gh-pages
          fi
