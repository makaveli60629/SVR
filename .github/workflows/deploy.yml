name: Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Create build folder
        run: |
          mkdir build
          cp -r site/* build/ || true
          cp -r game build/game || true

      - name: Apply updates
        run: |
          if [ -f update/site.zip ]; then
            unzip -o update/site.zip -d build
          fi

          if [ -f update/game.zip ]; then
            unzip -o update/game.zip -d build
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - uses: actions/deploy-pages@v4
