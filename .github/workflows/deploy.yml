name: Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Free runner disk before checkout
        shell: bash
        run: |
          set +e
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Checkout public files only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            index.html
            style.css
            launch.css
            matrix.js
            site-public-hooks.js
            logo.png
            logo.webp
            favicon.ico
            .nojekyll
            site
            game
            reiki
            android
            downloads
            presentations
            presentation

      - name: Prepare static Pages build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          copy_file(){ if [ -f "$1" ]; then mkdir -p "build/$(dirname "$1")"; cp "$1" "build/$1"; fi; }
          copy_dir(){ if [ -d "$1" ]; then mkdir -p "build/$1"; cp -a "$1"/. "build/$1"/; fi; }
          for f in index.html style.css launch.css matrix.js site-public-hooks.js logo.png logo.webp favicon.ico .nojekyll; do copy_file "$f"; done
          for d in site game reiki android downloads presentations presentation; do copy_dir "$d"; done
          touch build/.nojekyll
          mkdir -p build/reiki build/android build/downloads build/site/presentations/reiki build/site/android build/site/downloads build/game
          if [ ! -f build/site/presentations/reiki/index.html ]; then printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>Trueitive / REIKI Presentation</title></head><body style="background:#030008;color:white;font-family:Arial;padding:32px"><h1>Trueitive / REIKI Presentation</h1><p>Prepared for private partner review.</p><p><a style="color:#ffd36a" href="/game/?scene=lobby&focus=reiki-storefront&source=trueitive-review&svr30sky=1">Open VR REIKI Storefront Preview</a></p><p><a style="color:#7ffcff" href="/android/">Open Android Demo Page</a></p></body></html>' > build/site/presentations/reiki/index.html; fi
          if [ ! -f build/site/android/index.html ]; then printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>SVR Android Demo</title></head><body style="background:#030008;color:white;font-family:Arial;padding:32px"><h1>SVR Android Demo</h1><p>The Android APK demo is being finalized.</p><p><a style="color:#ffd36a" href="/reiki/">Open Trueitive / REIKI Presentation</a></p></body></html>' > build/site/android/index.html; fi
          if [ ! -f build/site/downloads/index.html ]; then printf '%s\n' '<!doctype html><html><head><meta charset="utf-8"><title>SVR Downloads</title></head><body style="background:#030008;color:white;font-family:Arial;padding:32px"><h1>SVR Downloads</h1><p>The APK direct file will appear after the demo build is finalized.</p><p><a style="color:#ffd36a" href="/android/">Open Android Demo Page</a></p></body></html>' > build/site/downloads/index.html; fi
          if [ ! -f build/reiki/index.html ]; then printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/site/presentations/reiki/"><a href="/site/presentations/reiki/">Open Trueitive / REIKI Presentation</a>' > build/reiki/index.html; fi
          if [ ! -f build/android/index.html ]; then printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/site/android/"><a href="/site/android/">Open Android Demo Page</a>' > build/android/index.html; fi
          if [ ! -f build/downloads/index.html ]; then printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/site/downloads/"><a href="/site/downloads/">Open Downloads</a>' > build/downloads/index.html; fi
          T="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n "status":"ok",\n "build":"SVR-UPDATE-3.0-MASTER-STABILITY-LOCK",\n "commit":"%s",\n "deployedAt":"%s"\n}\n' "$GITHUB_SHA" "$T" > build/deploy-health.json
          cp build/deploy-health.json build/game/deploy-health.json
          find build -maxdepth 3 -type f | sort > /tmp/svr-build-files.txt
          sed -n '1,240p' /tmp/svr-build-files.txt | sed 's#^# - #'
          df -h

      - name: Validate routes before upload
        shell: bash
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/reiki/index.html
          test -f build/android/index.html
          test -f build/downloads/index.html
          test -f build/site/presentations/reiki/index.html
          test -f build/site/android/index.html
          test -f build/site/downloads/index.html
          test -f build/deploy-health.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
