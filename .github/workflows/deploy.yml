name: Deploy GitHub Pages

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - name: Prepare build
      run: |
        rm -rf dist
        mkdir dist

    - name: Copy repo
      run: |
        rsync -av --exclude='.git' --exclude='.github' --exclude='update' ./ dist/

    - name: Apply update packages
      run: |
        if [ -d update ]; then
          for z in update/*.zip; do
            unzip -o "$z" -d dist
          done
        fi

    - uses: actions/upload-pages-artifact@v3
      with:
        path: dist

    - uses: actions/deploy-pages@v4
