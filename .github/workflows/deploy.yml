name: SVR Production Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svr-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          path: source
          fetch-depth: 1
      - name: Checkout production
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 1
      - name: Validate Phase 392
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-392-PUBLIC-ANDROID-SHOWCASE-POLISH-LOCK' source/index.html
          test "$(grep -o 'class=\"btn ' source/index.html | wc -l)" -eq 3
          grep -q 'PHASE-392-SITE-PRESENTATION-POLISH-LOCK' source/site/phase392-site-polish.js
          grep -q 'PHASE-392-MARKET-ADS-NO-DUPLICATE-NAV-LOCK' source/site/js/market-ads.js
          grep -q 'PHASE-392-ANDROID-CONTINUOUS-PLAY-RANKING-LOCK' source/game/android-stable.html
          grep -q 'SVR_PHASE392_ANDROID_QA' source/game/modules/phase392_android_gameplay.js
          grep -q 'PHASE-392-CAMERA3-TABLE-SHOWCASE-LOCK' source/game/camera3-showcase.html
          grep -q 'PHASE-392-AVATAR-PEDESTAL-UPRIGHT-LOCK' source/site/avatar.html
          node --check source/site-public-hooks.js
          node --check source/site/phase383-home-restore.js
          node --check source/site/phase392-site-polish.js
          node --check source/site/js/market-ads.js
          node --check source/site/js/phase392-avatar-pedestal-fix.js
          node --check source/game/modules/phase392_camera3_table_showcase.js
          node --check source/game/modules/phase392_android_gameplay.js
          node --check source/sw.js
          node --check source/pwa-sw.js
          test -s source/game/styles/phase392_android_gameplay.css
          python3 -m json.tool source/manifest.webmanifest >/dev/null
          python3 -m json.tool source/game/manifest.json >/dev/null
          python3 -m json.tool source/game/android-release.json >/dev/null
          python3 -m json.tool source/update/app-version.json >/dev/null
          test -s source/support-chat-bot.js
          test -s source/site-local-counter.js
          test -s source/downloads/svr-poker-android-rc2.apk
          grep -q '"apkVersionName": "0.1.0-rc2"' source/game/android-release.json
          grep -q '"apkVersionCode": 2' source/game/android-release.json
          grep -q '"forceUpdate": false' source/game/android-release.json
          grep -q '"showUpdatePrompt": false' source/game/android-release.json
          grep -q '"nativeApkRebuild": false' source/game/android-release.json
      - name: Build clean production tree
        shell: bash
        run: |
          set -euo pipefail
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          for file in index.html launch.css matrix.js site-public-hooks.js site-local-counter.js support-chat-bot.js manifest.webmanifest pwa-sw.js sw.js offline.html logo.png logo.webp CNAME .nojekyll; do
            [ -e "source/$file" ] && cp "source/$file" "publish/$file"
          done
          cp -a source/game publish/game
          cp -a source/site publish/site
          cp -a source/downloads publish/downloads
          mkdir -p publish/update
          cp source/update/app-version.json publish/update/app-version.json
          rm -rf publish/game/tools publish/game/docs publish/site/tools publish/site/docs
          find publish -type f \( -name '*.zip' -o -name '*.ps1' -o -name '.env' -o -name '.env.*' \) -delete
      - name: Stamp deployment health
        shell: bash
        run: |
          set -euo pipefail
          cat > publish/deploy-health.json <<EOF
          {
            "status": "ok",
            "build": "PHASE-392-PUBLIC-ANDROID-SHOWCASE-POLISH-LOCK",
            "questBuild": "PHASE-391-PRODUCTION-CONSOLIDATION-AUTO-DEPLOY-LOCK",
            "camera3Build": "PHASE-392-CAMERA3-TABLE-SHOWCASE-LOCK",
            "androidBuild": "PHASE-392-ANDROID-CONTINUOUS-PLAY-RANKING-LOCK",
            "avatarBuild": "PHASE-392-AVATAR-PEDESTAL-UPRIGHT-LOCK",
            "siteBuild": "PHASE-392-SITE-PRESENTATION-POLISH-LOCK",
            "commit": "${GITHUB_SHA}",
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "sourceBranch": "main",
            "publishBranch": "gh-pages",
            "questRoute": "/game/quest.html?v=phase392",
            "camera3Route": "/game/camera3-showcase.html?v=phase392",
            "androidRoute": "/game/android.html?channel=stable&v=phase392",
            "androidGameplayRoute": "/game/android-stable.html?v=phase392&direct=1",
            "publicButtons": 3,
            "platformAwareLaunch": true,
            "androidContinuousPlay": true,
            "androidLeaveButton": true,
            "androidOutOfChipsNotice": true,
            "androidBurnAndTurn": true,
            "androidXpAndRanks": true,
            "androidSponsorZones": 2,
            "avatarPedestalUpright": true,
            "camera3TableShowcase": true,
            "siteHeaderConsolidated": true,
            "vibezSeparatedFromHero": true,
            "duplicateFloatingMenuRemoved": true,
            "supportChatBotPublished": true,
            "siteLocalCounterPublished": true,
            "apkVersionName": "0.1.0-rc2",
            "apkVersionCode": 2,
            "forceUpdate": false,
            "showUpdatePrompt": false,
            "nativeApkRebuild": false,
            "customDomain": "svrpoker.com"
          }
          EOF
          cp publish/deploy-health.json publish/game/deploy-health.json
      - name: Validate production tree
        shell: bash
        run: |
          set -euo pipefail
          test -s publish/index.html
          test -s publish/site/phase392-site-polish.js
          test -s publish/site/js/market-ads.js
          test -s publish/site/js/phase392-avatar-pedestal-fix.js
          test -s publish/game/camera3-showcase.html
          test -s publish/game/modules/phase392_camera3_table_showcase.js
          test -s publish/game/android-stable.html
          test -s publish/game/modules/phase392_android_gameplay.js
          test -s publish/game/styles/phase392_android_gameplay.css
          test -s publish/support-chat-bot.js
          test -s publish/site-local-counter.js
          grep -q 'PHASE-392-PUBLIC-ANDROID-SHOWCASE-POLISH-LOCK' publish/deploy-health.json
          grep -q '"androidContinuousPlay": true' publish/deploy-health.json
          grep -q '"duplicateFloatingMenuRemoved": true' publish/deploy-health.json
      - name: Publish
        shell: bash
        working-directory: publish
        run: |
          set -euo pipefail
          git config user.name 'SVR Auto Deploy'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Production already matches Phase 392.'
          else
            git commit -m "Deploy Phase 392 platform polish ${GITHUB_SHA}"
            git push origin gh-pages
          fi