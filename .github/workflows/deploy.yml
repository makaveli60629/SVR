name: SVR Production Auto Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: svr-production-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Free runner disk without deleting Android SDK
        shell: bash
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker system prune -af || true
          sudo apt-get clean || true
          df -h

      - name: Checkout production and native Android paths
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            index.html
            404.html
            style.css
            launch.css
            launch-overrides.css
            matrix.js
            site-local-counter.js
            site-public-hooks.js
            support-chat-bot.js
            support-lead-routing.js
            pwa-app-install.js
            app-install.js
            app-update-checker.js
            manifest.webmanifest
            pwa-sw.js
            sw.js
            offline.html
            logo.png
            logo.webp
            favicon.ico
            CNAME
            .nojekyll
            game
            site
            android
            downloads
            update
            native

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK without blocking the web game deployment
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p native/android/app/src/main/res/drawable downloads site/downloads
          cp logo.png native/android/app/src/main/res/drawable/svr_logo.png

          set +e
          gradle -p native/android :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee apk-build.log
          GRADLE_EXIT=${PIPESTATUS[0]}
          set -e

          APK_SOURCE="native/android/app/build/outputs/apk/debug/app-debug.apk"
          APK_READY=false
          APK_SHA=""
          APK_PUBLIC_URL=""
          APK_BUILD_STATUS="failed"

          if [ "$GRADLE_EXIT" -eq 0 ] && [ -s "$APK_SOURCE" ]; then
            if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_SOURCE"; then
              cp "$APK_SOURCE" downloads/svr-poker-android-rc2.apk
              cp "$APK_SOURCE" site/downloads/svr-poker-android-rc2.apk
              APK_SHA="$(sha256sum "$APK_SOURCE" | awk '{print $1}')"
              printf '%s  %s\n' "$APK_SHA" "svr-poker-android-rc2.apk" > downloads/svr-poker-android-rc2.apk.sha256
              cp downloads/svr-poker-android-rc2.apk.sha256 site/downloads/svr-poker-android-rc2.apk.sha256
              APK_READY=true
              APK_PUBLIC_URL="/downloads/svr-poker-android-rc2.apk"
              APK_BUILD_STATUS="ready"
            fi
          fi

          if [ "$APK_READY" = true ]; then
            jq --arg sha "$APK_SHA" --arg url "$APK_PUBLIC_URL" '.apkSha256=$sha | .apkUrl=$url | .releaseReady=true | .nativeBuildStatus="generated-by-production-workflow"' game/android-release.json > game/android-release.json.tmp
            mv game/android-release.json.tmp game/android-release.json
            jq --arg sha "$APK_SHA" --arg url "$APK_PUBLIC_URL" '.apkSha256=$sha | .apkUrl=$url | .releaseReady=true' update/app-version.json > update/app-version.json.tmp
            mv update/app-version.json.tmp update/app-version.json
          else
            echo "::warning::APK build did not complete. Publishing the Phase 378 browser game and download status page anyway."
            cp apk-build.log downloads/apk-build-status.txt || true
            cp apk-build.log site/downloads/apk-build-status.txt || true
            jq '.apkSha256="" | .apkUrl="" | .releaseReady=false | .nativeBuildStatus="build-pending" | .updateMessage="Phase 378 browser game is live. APK RC2 build is pending."' game/android-release.json > game/android-release.json.tmp
            mv game/android-release.json.tmp game/android-release.json
            jq '.apkSha256="" | .apkUrl="" | .releaseReady=false | .note="Phase 378 browser game is live. APK RC2 build is pending."' update/app-version.json > update/app-version.json.tmp
            mv update/app-version.json.tmp update/app-version.json
          fi

          echo "APK_READY=$APK_READY" >> "$GITHUB_ENV"
          echo "APK_SHA=$APK_SHA" >> "$GITHUB_ENV"
          echo "APK_PUBLIC_URL=$APK_PUBLIC_URL" >> "$GITHUB_ENV"
          echo "APK_BUILD_STATUS=$APK_BUILD_STATUS" >> "$GITHUB_ENV"

      - name: Verify Phase 378 browser game and optional APK
        shell: bash
        run: |
          set -euo pipefail
          node game/tools/phase378-native-apk-stable-static-test.mjs
          test -f game/android-stable.html
          grep -q "JOIN NOW" game/android-stable.html
          if [ "$APK_READY" = true ]; then
            test -s downloads/svr-poker-android-rc2.apk
            test -s site/downloads/svr-poker-android-rc2.apk
          else
            echo "APK not ready; web deployment remains authorized."
          fi

      - name: Build production branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build

          for file in index.html 404.html style.css launch.css launch-overrides.css matrix.js site-local-counter.js site-public-hooks.js support-chat-bot.js support-lead-routing.js pwa-app-install.js app-install.js app-update-checker.js manifest.webmanifest pwa-sw.js sw.js offline.html logo.png logo.webp favicon.ico CNAME .nojekyll; do
            if [ -f "$file" ]; then cp -a "$file" build/; fi
          done

          for dir in game site android downloads update; do
            if [ -d "$dir" ]; then mkdir -p "build/$dir" && cp -a "$dir"/. "build/$dir"/; fi
          done

          touch build/.nojekyll
          find build -type d \( -name '_backups' -o -name 'backup-game-*' -o -name 'node_modules' -o -name '.git' \) -prune -exec rm -rf {} + || true
          find build -type f \( -name '*.zip' -o -name '*.7z' -o -name '*.rar' -o -name '*.blend' -o -name '*.psd' -o -name '*.tmp' \) -delete || true
          find build/game -type f -name '*.fbx' ! -path 'build/game/assets/table.fbx' ! -path 'build/game/assets/models/eric/eric.fbx' ! -path 'build/game/assets/models/claudia/claudia.fbx' -delete || true

          test -f build/index.html
          test -f build/CNAME
          test -f build/game/index.html
          test -f build/game/android.html
          test -f build/game/android-play.html
          test -f build/game/android-stable.html
          grep -q "JOIN NOW" build/game/android-stable.html
          test -f build/game/assets/models/table.glb
          test -f build/game/assets/table.fbx
          test -f build/downloads/index.html
          test -f build/site/index.html
          test -f build/site/login.html
          test -f build/site/profile.html
          test -f build/site/avatar.html
          test -f build/site/config/player-api.json
          if [ "$APK_READY" = true ]; then
            test -s build/downloads/svr-poker-android-rc2.apk
            test -s build/site/downloads/svr-poker-android-rc2.apk
          fi

          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > build/deploy-health.json <<EOF_HEALTH
          {
            "status": "ok",
            "build": "PHASE-378-WEB-FIRST-NATIVE-APK-AUTODEPLOY-LOCK",
            "androidBuild": "PHASE-378-ANDROID-STANDALONE-STABLE-TABLE-LOCK",
            "publicReleaseBuild": "PHASE-378-PUBLIC-APK-RC2-NOTIFICATION-LOCK",
            "profileBuild": "PHASE-374-PROFILE-MOBILE-AVATAR-MENU-RECOVERY-LOCK",
            "questBuild": "PHASE-373-QUEST-SEATED-TELEPORT-TABLE-SPAWN-NPC-LOCK",
            "commit": "$GITHUB_SHA",
            "deployedAt": "$DEPLOYED_AT",
            "sourceBranch": "main",
            "publishBranch": "gh-pages",
            "androidRoute": "/game/android-stable.html?v=phase378",
            "legacyAndroidRedirect": "/game/android.html?v=phase378",
            "downloadsRoute": "/downloads/",
            "apkUrl": "$APK_PUBLIC_URL",
            "apkVersionName": "0.1.0-rc2",
            "apkVersionCode": 2,
            "apkSha256": "$APK_SHA",
            "signedApkAttached": $APK_READY,
            "apkBuildStatus": "$APK_BUILD_STATUS",
            "signingChannel": "android-debug-test-key",
            "nativeApkRebuild": true,
            "offlineStableTableBundled": true,
            "webRuntimeUpdated": true,
            "customDomain": "svrpoker.com"
          }
          EOF_HEALTH
          cp build/deploy-health.json build/game/deploy-health.json
          du -sh build

      - name: Publish exact build to gh-pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd build
          git init -b gh-pages
          git config user.name "SVR Auto Deploy"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages

      - name: Verify custom-domain browser game and optional APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            health="$(curl -fsS --max-time 15 "https://svrpoker.com/deploy-health.json?commit=${GITHUB_SHA}&attempt=${attempt}" || true)"
            game="$(curl -fsS --max-time 15 "https://svrpoker.com/game/android-stable.html?v=phase378&attempt=${attempt}" || true)"
            if echo "$health" | grep -q "$GITHUB_SHA" && echo "$game" | grep -q "JOIN NOW"; then
              if [ "$APK_READY" = true ]; then
                apk_code="$(curl -L -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://svrpoker.com/downloads/svr-poker-android-rc2.apk?attempt=${attempt}" || true)"
                if [ "$apk_code" = "200" ]; then
                  echo "Verified Phase 378 website, Android table, and APK download."
                  exit 0
                fi
              else
                echo "Verified Phase 378 website and Android table. APK build remains pending."
                exit 0
              fi
            fi
            sleep 10
          done
          echo "::error::Custom domain did not expose the Phase 378 Android table within five minutes."
          exit 1
