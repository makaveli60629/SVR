name: Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Free runner disk before checkout
        shell: bash
        run: |
          set +e
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/boost || true
          docker system prune -af || true
          sudo apt-get clean || true
          echo "Disk after cleanup:"
          df -h

      - name: Checkout public files only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            index.html
            style.css
            launch.css
            matrix.js
            site-public-hooks.js
            logo.png
            logo.webp
            favicon.ico
            .nojekyll
            site
            game
            reiki
            android
            downloads
            presentations
            presentation

      - name: Prepare static Pages build
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          copy_file_if_exists() {
            if [ -f "$1" ]; then
              cp "$1" "build/$1"
            fi
          }

          copy_dir_if_exists() {
            if [ -d "$1" ]; then
              mkdir -p "build/$1"
              rsync -a --delete "$1"/ "build/$1"/
            fi
          }

          copy_file_if_exists index.html
          copy_file_if_exists style.css
          copy_file_if_exists launch.css
          copy_file_if_exists matrix.js
          copy_file_if_exists site-public-hooks.js
          copy_file_if_exists logo.png
          copy_file_if_exists logo.webp
          copy_file_if_exists favicon.ico
          copy_file_if_exists .nojekyll

          copy_dir_if_exists site
          copy_dir_if_exists game
          copy_dir_if_exists reiki
          copy_dir_if_exists android
          copy_dir_if_exists downloads
          copy_dir_if_exists presentations
          copy_dir_if_exists presentation

          touch build/.nojekyll

          mkdir -p build/reiki
          mkdir -p build/android
          mkdir -p build/downloads
          mkdir -p build/site/presentations/reiki
          mkdir -p build/site/android
          mkdir -p build/site/downloads
          mkdir -p build/game

          if [ ! -f build/reiki/index.html ]; then
            printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/site/presentations/reiki/"><a href="/site/presentations/reiki/">Open Trueitive / REIKI Presentation</a>' > build/reiki/index.html
          fi

          if [ ! -f build/android/index.html ]; then
            printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/site/android/"><a href="/site/android/">Open Android Demo Page</a>' > build/android/index.html
          fi

          if [ ! -f build/downloads/index.html ]; then
            printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=/site/downloads/"><a href="/site/downloads/">Open Downloads</a>' > build/downloads/index.html
          fi

          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n  "status": "ok",\n  "build": "PHASE-1.7.9B-LITE-PAGES-NO-SPACE-NO-HEREDOC",\n  "commit": "%s",\n  "deployedAt": "%s"\n}\n' "$GITHUB_SHA" "$DEPLOYED_AT" > build/deploy-health.json
          cp build/deploy-health.json build/game/deploy-health.json

          echo "Build contents sample:"
          find build -maxdepth 3 -type f | sort | sed 's#^# - #' | head -200
          echo "Disk after build:"
          df -h

      - name: Validate routes before upload
        shell: bash
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/reiki/index.html
          test -f build/android/index.html
          test -f build/downloads/index.html
          test -f build/site/presentations/reiki/index.html
          test -f build/site/android/index.html
          test -f build/deploy-health.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
