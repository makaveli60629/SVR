name: Auto Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Prepare build from committed site/game files
        run: |
          set -euo pipefail
          rm -rf build tmp
          mkdir -p build

          rsync -av \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'update' \
            --exclude 'backend' \
            --exclude 'docs' \
            --exclude 'Library' \
            --exclude 'Logs' \
            --exclude 'Temp' \
            --exclude '*.zip' \
            --exclude '*.fbx' \
            ./ build/ || test $? -eq 24

      - name: Apply game update zip if present
        run: |
          set -euo pipefail

          flatten_zip() {
            ZIP="$1"
            TARGET="$2"
            LABEL="$3"

            if [ ! -f "$ZIP" ]; then
              echo "No $LABEL zip found at $ZIP; using committed $TARGET folder."
              return 0
            fi

            echo "Applying $LABEL from $ZIP into $TARGET"
            rm -rf tmp "$TARGET"
            mkdir -p tmp "$TARGET"

            unzip -o "$ZIP" -d tmp
            chmod -R u+rwX,go+rX tmp || true

            SRC="tmp"
            if [ -f tmp/index.html ]; then
              SRC="tmp"
            elif [ -f tmp/game/index.html ]; then
              SRC="tmp/game"
            else
              INNER="$(find tmp -mindepth 1 -maxdepth 1 -type d | head -n1 || true)"
              if [ -n "$INNER" ] && [ -f "$INNER/index.html" ]; then
                SRC="$INNER"
              fi
            fi

            if [ ! -f "$SRC/index.html" ]; then
              echo "ERROR: $LABEL zip has no deployable index.html"
              exit 1
            fi

            cp -a "$SRC"/. "$TARGET"/
            chmod -R u+rwX,go+rX "$TARGET" || true
            rm -rf tmp
          }

          flatten_zip update/game.zip build/game game

      - name: Stamp game deploy health
        run: |
          set -euo pipefail
          mkdir -p build/game
          COMMIT_SHA="${GITHUB_SHA}"
          DEPLOY_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_LABEL="GAME-AUTO-DEPLOY-LOCK"

          if [ -f build/game/version.json ]; then
            EXISTING_LABEL="$(grep -o 'PHASE-[A-Z0-9._-]*' build/game/version.json | head -n1 || true)"
            if [ -n "$EXISTING_LABEL" ]; then BUILD_LABEL="$EXISTING_LABEL"; fi
          fi

          cat > build/game/deploy-health.json <<EOF
          {
            "status": "ok",
            "commit": "${COMMIT_SHA}",
            "deployedAt": "${DEPLOY_TIME}",
            "workflow": "Auto Deploy",
            "target": "/game",
            "build": "${BUILD_LABEL}"
          }
          EOF

      - name: Validate build
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/game/index.html
          test -f build/game/deploy-health.json

          echo "Game build label search:"
          grep -R "PHASE-\|BUILD:" -n build/game/index.html build/game/version.json 2>/dev/null || true

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy
        uses: actions/deploy-pages@v4
