      - name: Validate build
        run: |
          set -euo pipefail

          test -f build/index.html
          test -f build/game/index.html
          test -f build/game/deploy-health.json
          test -f build/game/version.json

          echo "Active deployed version:"
          cat build/game/version.json

          echo "Active deploy health:"
          cat build/game/deploy-health.json

          echo "Index build labels:"
          grep -n "BUILD:" build/game/index.html || true
          grep -n "PHASE-" build/game/index.html || true

          echo "Warn if stale Phase 39 label is present:"
          if grep -R "20260411-P39-HUB-SCENES-AD-PRESENTATION" build/game --exclude-dir=.git; then
            echo "WARNING: stale Phase 39 label found. Deploy allowed, but game.zip needs cleanup."
          fi
