name: Phase 397 Android Betting Order Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase397-android-betting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Validate active Android betting source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-402-ANDROID-VISUAL-LEFT-SEAT-ORDER-LOCK' game/modules/phase402_android_gameplay.js
          grep -q 'PHASE-398-ANDROID-RAISE-SIZING-SMOOTHNESS-LOCK' game/modules/phase402_android_gameplay.js
          grep -q 'VISUAL_LEFT_SEAT_ORDER=Object.freeze(\[0,5,1,2,3,4\])' game/modules/phase402_android_gameplay.js
          grep -q 'leftwardOrderAfter' game/modules/phase402_android_gameplay.js
          grep -q 'state.dealer=nextVisualSeat(state.dealer)' game/modules/phase402_android_gameplay.js
          grep -q 'const small=nextVisualSeat(state.dealer),big=nextVisualSeat(small)' game/modules/phase402_android_gameplay.js
          grep -q 'const first=nextEligible(big)' game/modules/phase402_android_gameplay.js
          grep -q 'const next=nextEligible(state.dealer)' game/modules/phase402_android_gameplay.js
          grep -q 'legalFullRaise' game/modules/phase402_android_gameplay.js
          grep -q 'lastFullRaiseSize' game/modules/phase402_android_gameplay.js
          grep -q 'SVR_PHASE398_ANDROID_BETTING_QA' game/modules/phase402_android_gameplay.js
          grep -q 'SVR_PHASE402_ANDROID_SEAT_ORDER_QA' game/modules/phase402_android_gameplay.js
          grep -q 'PHASE-398-ANDROID-RAISE-CONTROL-GUARD-LOCK' game/modules/phase397_android_action_button_guard.js
          grep -q 'RAISE TO' game/modules/phase397_android_action_button_guard.js
          grep -q 'phase397_android_action_button_guard.js?v=phase398' game/android-stable-phase402.html
          grep -q 'phase398_android_raise_rules.js?v=phase398' game/modules/phase402_android_gameplay.js
          node --check game/modules/phase402_android_gameplay.js
          node --check game/modules/phase397_android_action_button_guard.js
          node --check game/modules/phase398_android_raise_rules.js

      - name: Simulate physical six-seat Holdem action rotation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const visual=[0,5,1,2,3,4];
          const names={0:'YOU',1:'Claudia',2:'Eric',3:'Maya',4:'Darius',5:'Nova'};
          const orderAfter=(anchor,eligible=new Set(visual))=>{
            const pos=visual.indexOf(anchor),out=[];
            for(let step=1;step<=visual.length;step++){
              const i=visual[(pos+step)%visual.length];
              if(eligible.has(i))out.push(i);
            }
            return out;
          };
          const next=s=>orderAfter(s)[0];
          if(next(4)!==0)throw new Error('Darius must act to YOU next');
          if(next(0)!==5)throw new Error('YOU must act to Nova next');
          if(next(5)!==1)throw new Error('Nova must act to Claudia next');
          if(next(1)!==2||next(2)!==3||next(3)!==4)throw new Error('upper-table physical order is wrong');
          for(const dealer of visual){
            const small=next(dealer),big=next(small),pre=orderAfter(big),post=orderAfter(dealer);
            if(pre[0]!==next(big))throw new Error(`bad preflop first actor for dealer ${names[dealer]}`);
            if(post[0]!==next(dealer))throw new Error(`bad postflop first actor for dealer ${names[dealer]}`);
            if(new Set(pre).size!==visual.length||new Set(post).size!==visual.length)throw new Error(`duplicate action order for dealer ${names[dealer]}`);
          }
          const withoutNova=orderAfter(4,new Set([0,1,2,3,4]));
          if(withoutNova[0]!==0)throw new Error(`Darius skipped YOU when Nova unavailable: ${withoutNova}`);
          const withoutUser=orderAfter(4,new Set([1,2,3,4,5]));
          if(withoutUser[0]!==5)throw new Error(`fold/all-in skip order wrong when YOU unavailable: ${withoutUser}`);
          console.log('Physical Android action order:',visual.map(i=>names[i]).join(' -> '));
          NODE
