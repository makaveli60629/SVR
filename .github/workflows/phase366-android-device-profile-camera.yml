name: Phase 366 Android Device and Profile Camera Check

on:
  pull_request:
    paths:
      - 'game/android.html'
      - 'game/manifest.json'
      - 'game/android-release.json'
      - 'game/modules/phase340_platform_manifest.js'
      - 'game/modules/phase366_android_physical_device_viewport_acceptance_lock.js'
      - 'game/tools/phase366-android-device-profile-camera-static-test.mjs'
      - 'game/tools/phase366-android-device-profile-camera-browser-acceptance.cjs'
      - 'site/profile.html'
      - 'site/css/phase366-profile-live-camera.css'
      - 'site/js/phase366-profile-live-camera-lock.js'
      - '.github/workflows/phase366-android-device-profile-camera.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase366-release:
    runs-on: ubuntu-latest
    timeout-minutes: 46
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Phase 366 contracts
        run: |
          node --check game/modules/phase366_android_physical_device_viewport_acceptance_lock.js
          node --check site/js/phase366-profile-live-camera-lock.js
          node --check game/modules/phase340_platform_manifest.js
          node --check game/tools/phase366-android-device-profile-camera-browser-acceptance.cjs
          node game/tools/phase366-android-device-profile-camera-static-test.mjs
          python3 -m json.tool game/manifest.json >/dev/null
          python3 -m json.tool game/android-release.json >/dev/null

      - name: Preserve Phase 365 and avatar contracts
        run: |
          node game/tools/phase365-android-seated-ux-branding-static-test.mjs
          node site/tools/phase351-profile-showroom-test.mjs
          node game/tools/phase353-avatar-vr-static-test.mjs
          node game/tools/phase347-android-static-test.mjs

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Start local SVR site
        run: |
          python3 -m http.server 4173 > /tmp/svr-phase366-http.log 2>&1 &
          echo $! > /tmp/svr-phase366-http.pid
          sleep 2

      - name: Verify Android device calibration and profile live camera
        env:
          SVR_TEST_BASE: http://127.0.0.1:4173
        run: node game/tools/phase366-android-device-profile-camera-browser-acceptance.cjs

      - name: Re-run complete Android Hold'em game
        env:
          SVR_TEST_BASE: http://127.0.0.1:4173
        run: node game/tools/phase363-android-integrated-core-browser-acceptance.cjs

      - name: Upload HTTP log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase366-http-log
          path: /tmp/svr-phase366-http.log
