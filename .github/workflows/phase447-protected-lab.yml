name: Phase 447 Protected Lab

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  protected-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Validate protected lab source
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/SVR_MASTER_MANIFEST.md
          test -s docs/SVR_SOURCE_MEMORY.md
          test -s game/labs/pro-playtest/phase447-state-contract.js
          test -s game/tools/phase447-professional-state-audit.mjs
          node --check game/labs/pro-playtest/phase447-state-contract.js
          node --check game/tools/phase447-professional-state-audit.mjs
          node game/tools/phase447-professional-state-audit.mjs
      - name: Protect Matrix public baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="binary-rain"' index.html
          grep -q 'Site under construction' index.html
          grep -q './matrix.js' index.html
