name: Phase 380/381 Game Site Integrity

on:
  pull_request:
    paths:
      - 'index.html'
      - 'site-public-hooks.js'
      - 'site/**'
      - 'game/**'
      - 'update/app-version.json'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/pages-live-publish.yml'
      - '.github/workflows/phase380-game-site-integrity.yml'
      - '.github/workflows/phase381-vr-runtime-lock.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site-public-hooks.js'
      - 'site/**'
      - 'game/**'
      - 'update/app-version.json'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/pages-live-publish.yml'
      - '.github/workflows/phase381-vr-runtime-lock.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase380-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate JavaScript and JSON
        run: |
          set -euo pipefail
          node --check game/modules/phase381_asset_load_cache_guard.js
          node --check game/modules/phase381_vr_runtime_lock.js
          node --check game/modules/phase380_original_table_authority_lock.js
          node --check game/modules/phase379_quest_procedural_table_authority.js
          node --check game/tools/phase354-android-browser-acceptance.cjs
          node --check game/tools/phase358-quest-browser-acceptance.cjs
          node --check site-public-hooks.js
          python3 -m json.tool game/android-release.json >/dev/null
          python3 -m json.tool game/quest-release.json >/dev/null
          python3 -m json.tool game/manifest.json >/dev/null
          python3 -m json.tool update/app-version.json >/dev/null

      - name: Validate locked site and Phase 381 runtime
        run: |
          set -euo pipefail
          grep -q 'SVR Poker | Public Launch Page' index.html
          grep -q 'id="binary-rain"' index.html
          grep -q 'Preview Site' index.html
          grep -q 'Preview Game' index.html
          grep -q 'PHASE-380-PUBLIC-GAME-SITE-INTEGRITY-LOCK' site/index.html
          grep -q 'PHASE-381-VR-SEAT-ERIC-AUDIO-OVERLAY-LOCK' game/index.html
          grep -q 'phase381_asset_load_cache_guard' game/index.html
          grep -q 'phase381_vr_runtime_lock' game/index.html
          ! grep -q 'phase364_quest_eric_quarantine_watch' game/index.html
          grep -q 'PHASE-380-ANDROID-PLAYABLE-POKER-PRESENTATION-LOCK' game/android-stable.html
          grep -q 'JOIN NOW' game/android-stable.html
          grep -q 'deterministicHandEvaluator:true' game/android-stable.html
          grep -q 'PHASE-380-ORIGINAL-UPLOADED-TABLE-AUTHORITY-LOCK' game/modules/phase380_original_table_authority_lock.js
          grep -q 'PHASE-380-QUEST-PROCEDURAL-TABLE-FALLBACK-LOCK' game/modules/phase379_quest_procedural_table_authority.js
          grep -q 'SVR_PHASE381_SEAT_LOCK' game/modules/phase381_vr_runtime_lock.js
          grep -q 'SVR_PHASE381_AUDIO_TOGGLE' game/modules/phase381_vr_runtime_lock.js
          grep -q 'assets/models/eric/eric.fbx' game/modules/phase381_vr_runtime_lock.js

      - name: Verify required production assets
        run: |
          set -euo pipefail
          test -s game/assets/models/table.glb
          test -s game/assets/table.fbx
          test -s game/assets/models/eric/eric.fbx
          test -s game/modules/phase368_card_dealer_motion.js
          test -s downloads/svr-poker-android-rc2.apk
          test -s downloads/svr-poker-android-rc2.apk.sha256
          test -f site/profile.html
          test -f site/avatar.html
          test -f site/store.html
          test -f site/contact.html
          test -f site/tournaments.html

      - name: Security scan public runtime
        run: |
          set -euo pipefail
          ! find game site downloads -type f \( -name '.env' -o -name '.env.*' \) | grep -q .
          ! grep -RIl --exclude='*.min.js' --exclude='*.map' -E 'AZURE_SQL_CONNECTION_STRING=|STRIPE_SECRET_KEY=|AWS_SECRET_ACCESS_KEY=|ADMIN_PASSWORD=' index.html site-public-hooks.js game site | grep -q .
