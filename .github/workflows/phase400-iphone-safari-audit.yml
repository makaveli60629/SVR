name: Phase 400 iPhone Safari Web Game Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase400-iphone-safari-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Validate protected public iPhone detection
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-400-IPHONE-SAFARI-WEB-GAME-LOCK' index.html
          grep -q 'iPhone|iPad|iPod' index.html
          grep -q "navigator.platform==='MacIntel'" index.html
          grep -q 'apple-mobile-web-app-capable' index.html
          grep -q 'apple-touch-icon' index.html
          grep -q 'platformIosDetection' update/app-version.json
          grep -q 'IPHONE GAME • NOT VR • TEST READY' site-public-hooks.js
      - name: Validate Phase 406 iPhone entry and wrapper preserve Phase 400
        shell: bash
        run: |
          set -euo pipefail
          test -s game/iphone.html
          test -s game/iphone-tabletop.html
          grep -q 'PHASE-400-IPHONE-SAFARI-WEB-GAME-LOCK' game/iphone.html
          grep -q 'PHASE-400-IPHONE-SAFARI-WEB-GAME-LOCK' game/iphone-tabletop.html
          grep -q 'PHASE-406-IPHONE-MOBILE-GAMEPLAY-LOCK' game/iphone.html
          grep -q 'viewport-fit=cover' game/iphone.html
          grep -q 'apple-mobile-web-app-capable' game/iphone.html
          grep -q 'platform=ios&safari=1' game/iphone.html
          grep -q 'platform=ios&safari=1' game/iphone-tabletop.html
          grep -q 'allow="microphone; autoplay; fullscreen"' game/iphone-tabletop.html
          grep -q 'SVR_PHASE406_IPHONE_WRAPPER_QA' game/iphone-tabletop.html
          grep -q 'SVR_PHASE405_IPHONE_WRAPPER_QA' game/iphone-tabletop.html
          grep -q 'SVR_PHASE400_IPHONE_WRAPPER_QA' game/iphone-tabletop.html
          grep -q 'android-stable-phase405.html' game/iphone-tabletop.html
      - name: Validate Safari runtime and safe-area CSS
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-400-IOS-SAFARI-RUNTIME-ADAPTER-LOCK' game/modules/phase400_ios_safari_adapter.js
          grep -q 'PHASE-400-IOS-SAFARI-COMPAT-STYLES-LOCK' game/styles/phase400_ios_safari_compat.css
          grep -q "navigator.platform==='MacIntel'" game/modules/phase400_ios_safari_adapter.js
          grep -q 'visualViewport' game/modules/phase400_ios_safari_adapter.js
          grep -q 'touchstart' game/modules/phase400_ios_safari_adapter.js
          grep -q "sound('check')" game/modules/phase400_ios_safari_adapter.js
          grep -q 'navigator.mediaDevices?.getUserMedia' game/modules/phase400_ios_safari_adapter.js
          grep -q 'SVR_PHASE400_IOS_SAFARI_QA' game/modules/phase400_ios_safari_adapter.js
          grep -q 'safe-area-inset-top' game/styles/phase400_ios_safari_compat.css
          grep -q 'safe-area-inset-bottom' game/styles/phase400_ios_safari_compat.css
          grep -q '100dvh' game/styles/phase400_ios_safari_compat.css
          grep -q 'touch-action:manipulation' game/styles/phase400_ios_safari_compat.css
          grep -q 'min-height:44px' game/styles/phase400_ios_safari_compat.css
          grep -q 'window.webkitAudioContext' game/modules/phase393_android_common.js
      - name: Validate shared mobile table integration without iOS regression
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'phase400_ios_safari_compat.css?v=phase400' game/android-stable.html
          grep -q 'phase400_ios_safari_adapter.js?v=phase400' game/android-stable.html
          grep -q 'phase400_ios_safari_compat.css?v=phase400' game/android-stable-phase405.html
          grep -q 'phase400_ios_safari_adapter.js?v=phase400' game/android-stable-phase405.html
          grep -q 'apple-mobile-web-app-capable' game/android-stable-phase405.html
          grep -q 'data-ios-build="PHASE-400-IPHONE-SAFARI-WEB-GAME-LOCK"' game/android-stable-phase405.html
          grep -q 'phase399_android_learning_chips_sponsor.js?v=phase399' game/android-stable-phase405.html
          grep -q 'phase399_android_matchmaking_voice.js?v=phase399' game/android-stable-phase405.html
          grep -q 'phase403_android_gameplay.js?v=phase403' game/android-stable-phase405.html
          grep -q 'phase406_mobile_ultimate_gameplay.js?v=phase406' game/android-stable-phase405.html
      - name: Validate metadata PWA and protected platforms
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"phase": 406' game/manifest.json
          grep -q '"iphoneSafariAvailable": true' game/manifest.json
          grep -q '"usesProtectedAndroidPokerEngine": true' game/manifest.json
          grep -q '"iosIphoneSafariAvailable": true' update/app-version.json
          grep -q '"iosSafeAreaInsets": true' update/app-version.json
          grep -q '"iosSafariAudioUnlock": true' update/app-version.json
          grep -q '"iosMicrophonePermissionReady": true' update/app-version.json
          grep -q 'Play on iPhone / Safari' manifest.webmanifest
          grep -q '/game/iphone.html?v=phase406' manifest.webmanifest
          grep -q 'PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK' game/quest.html
          grep -q 'PHASE-398-ANDROID-RAISE-SIZING-SMOOTHNESS-LOCK' game/modules/phase393_android_gameplay.js
          grep -q '"apkVersionName": "0.1.0-rc2"' game/android-release.json
          grep -q '"apkVersionCode": 2' game/android-release.json
          grep -q '"forceUpdate": false' game/android-release.json
          grep -q '"nativeApkRebuild": false' game/android-release.json
      - name: Validate syntax JSON and current cache
        shell: bash
        run: |
          set -euo pipefail
          node --check game/modules/phase400_ios_safari_adapter.js
          node --check game/modules/phase393_android_common.js
          node --check game/modules/phase393_android_gameplay.js
          node --check game/modules/phase399_android_learning_chips_sponsor.js
          node --check game/modules/phase399_android_matchmaking_voice.js
          node --check game/modules/phase405_mobile_ui.js
          node --check game/modules/phase405_vox_voice.js
          node --check game/modules/phase406_mobile_ultimate_gameplay.js
          node --check sw.js
          node --check pwa-sw.js
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 -m json.tool game/manifest.json >/dev/null
          python3 -m json.tool game/android-release.json >/dev/null
          python3 -m json.tool update/app-version.json >/dev/null
          grep -q 'svr-poker-phase403-android-engine-reliability-v1' sw.js
          grep -q 'svr-poker-phase405-platform-mobile-social-v1' sw.js
          grep -q 'svr-poker-phase406-mobile-ultimate-gameplay-v1' sw.js
          test -s game/styles/phase400_ios_safari_compat.css
          test -s downloads/svr-poker-android-rc2.apk
