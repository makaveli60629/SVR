name: Phase 366 Profile Live Camera Check

on:
  pull_request:
    paths:
      - 'site/profile.html'
      - 'site/js/phase345-demo-activity-persistence.js'
      - 'site/js/phase366-player-account-resilience.js'
      - 'site/js/phase366-profile-live-camera-watchdog.js'
      - 'site/tools/phase366-profile-live-camera-test.mjs'
      - 'game/avatar-vr.html'
      - 'game/android-release.json'
      - '.github/workflows/phase366-profile-live-camera-check.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  phase366-profile-live-camera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax
        run: |
          node --check site/js/phase366-player-account-resilience.js
          node --check site/js/phase366-profile-live-camera-watchdog.js
          node --check site/js/phase345-demo-activity-persistence.js
      - name: Profile live camera contract
        run: node site/tools/phase366-profile-live-camera-test.mjs
