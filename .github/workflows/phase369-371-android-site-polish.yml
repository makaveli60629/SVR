name: Phase 369-373 Android Quest Site Production Recovery

on:
  pull_request:
    paths:
      - 'game/android.html'
      - 'game/index.html'
      - 'game/modules/phase368_card_dealer_animation_lock.js'
      - 'game/modules/phase368_card_dealer_motion.js'
      - 'game/modules/phase369_android_join_table_freeze_recovery_lock.js'
      - 'game/modules/phase369_android_join_readiness_transaction_lock.js'
      - 'game/modules/phase369_android_join_intent_bridge_lock.js'
      - 'game/modules/phase372_live_entry_recovery_lock.js'
      - 'game/modules/phase373_quest_rig_preflight_lock.js'
      - 'game/modules/phase373_quest_seated_teleport_table_spawn_npc_lock.js'
      - 'game/modules/phase373_quest_npc_teleport_postflight_lock.js'
      - 'game/phase369-release.json'
      - 'game/tools/phase350-integrity-static-test.mjs'
      - 'game/tools/phase356-android-real-device-static-test.mjs'
      - 'game/tools/phase369-android-recovery-static-test.mjs'
      - 'game/tools/phase372-production-recovery-static-test.mjs'
      - 'game/tools/phase373-quest-seated-table-static-test.mjs'
      - 'site/js/phase345-player-account-client.js'
      - 'site/js/phase346-avatar-viewer.js'
      - 'site/js/phase370-account-profile-mobile-polish.js'
      - 'site/css/phase370-account-profile-mobile-clean.css'
      - 'site/config/player-api.json'
      - 'site/login.html'
      - 'site/tools/phase370-371-site-polish-static-test.mjs'
      - 'infrastructure/aws/phase372-player-account-foundation.yml'
      - 'matrix.js'
      - 'docs/SVR_PHASE_369_371_ANDROID_SITE_CONTINUATION_MANIFEST.md'
      - 'docs/SVR_PHASE_369_371_MANIFEST.json'
      - 'docs/SVR_PHASE_372_PRODUCTION_RECOVERY_MANIFEST.md'
      - 'docs/SVR_PHASE_373_QUEST_RECOVERY_MANIFEST.md'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/phase369-371-android-site-polish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax and manifests
        run: |
          node --check game/modules/phase368_card_dealer_animation_lock.js
          node --check game/modules/phase368_card_dealer_motion.js
          node --check game/modules/phase369_android_join_table_freeze_recovery_lock.js
          node --check game/modules/phase369_android_join_readiness_transaction_lock.js
          node --check game/modules/phase369_android_join_intent_bridge_lock.js
          node --check game/modules/phase372_live_entry_recovery_lock.js
          node --check game/modules/phase373_quest_rig_preflight_lock.js
          node --check game/modules/phase373_quest_seated_teleport_table_spawn_npc_lock.js
          node --check game/modules/phase373_quest_npc_teleport_postflight_lock.js
          node --check site/js/phase345-player-account-client.js
          node --check site/js/phase346-avatar-viewer.js
          node --check site/js/phase370-account-profile-mobile-polish.js
          node --check matrix.js
          node --check game/tools/phase350-integrity-static-test.mjs
          node --check game/tools/phase356-android-real-device-static-test.mjs
          node --check game/tools/phase372-production-recovery-static-test.mjs
          node --check game/tools/phase373-quest-seated-table-static-test.mjs
          python3 -m json.tool game/phase369-release.json >/dev/null
          python3 -m json.tool docs/SVR_PHASE_369_371_MANIFEST.json >/dev/null
          python3 -m json.tool site/config/player-api.json >/dev/null
      - name: Validate release and protected contracts
        run: |
          node game/tools/phase368-card-dealer-static-test.mjs
          node game/tools/phase369-android-recovery-static-test.mjs
          node game/tools/phase372-production-recovery-static-test.mjs
          node game/tools/phase373-quest-seated-table-static-test.mjs
          node site/tools/phase370-371-site-polish-static-test.mjs
          node game/tools/phase350-integrity-static-test.mjs
          node game/tools/phase356-android-real-device-static-test.mjs
          node game/tools/phase364-device-xr-geometry-static-test.mjs
          node game/tools/phase365-android-seated-ux-branding-static-test.mjs
          node game/tools/phase367-android-physical-device-static-test.mjs
      - name: AWS and security assertions
        run: |
          ! test -f backend/phase370/sql/002_phase370_admin_test_role_assignment.sql
          ! grep -RniE 'cash.?app.*(password|pin|card.?number)' site/login.html site/js/phase345-player-account-client.js site/js/phase370-account-profile-mobile-polish.js
          ! grep -RniE 'AWS_ACCESS_KEY_ID|AWS_SECRET_ACCESS_KEY|clientSecret|databasePassword' site game matrix.js
          grep -q '"provider": "aws"' site/config/player-api.json
          grep -q '"database": "dynamodb"' site/config/player-api.json
          grep -q '"identity": "cognito"' site/config/player-api.json
          grep -q 'AWS::Cognito::UserPool' infrastructure/aws/phase372-player-account-foundation.yml
          grep -q 'AWS::DynamoDB::Table' infrastructure/aws/phase372-player-account-foundation.yml
          grep -q 'Cash App <strong>\$SVRhelp</strong>' site/js/phase370-account-profile-mobile-polish.js
