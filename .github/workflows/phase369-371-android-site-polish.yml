name: Phase 369-371 Android Site Polish

on:
  pull_request:
    paths:
      - 'game/android.html'
      - 'game/modules/phase368_card_dealer_animation_lock.js'
      - 'game/modules/phase368_card_dealer_motion.js'
      - 'game/modules/phase369_android_join_table_freeze_recovery_lock.js'
      - 'game/phase369-release.json'
      - 'game/tools/phase350-integrity-static-test.mjs'
      - 'game/tools/phase369-android-recovery-static-test.mjs'
      - 'site/js/phase346-avatar-viewer.js'
      - 'site/js/phase370-account-profile-mobile-polish.js'
      - 'site/css/phase370-account-profile-mobile-clean.css'
      - 'site/tools/phase370-371-site-polish-static-test.mjs'
      - 'backend/phase370/sql/002_phase370_admin_test_role_assignment.sql'
      - 'matrix.js'
      - 'docs/SVR_PHASE_369_371_ANDROID_SITE_CONTINUATION_MANIFEST.md'
      - 'docs/SVR_PHASE_369_371_MANIFEST.json'
      - '.github/workflows/phase369-371-android-site-polish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate syntax
        run: |
          node --check game/modules/phase368_card_dealer_animation_lock.js
          node --check game/modules/phase368_card_dealer_motion.js
          node --check game/modules/phase369_android_join_table_freeze_recovery_lock.js
          node --check site/js/phase346-avatar-viewer.js
          node --check site/js/phase370-account-profile-mobile-polish.js
          node --check matrix.js
          node --check game/tools/phase350-integrity-static-test.mjs
          python3 -m json.tool game/phase369-release.json >/dev/null
          python3 -m json.tool docs/SVR_PHASE_369_371_MANIFEST.json >/dev/null
      - name: Validate new phases
        run: |
          node game/tools/phase368-card-dealer-static-test.mjs
          node game/tools/phase369-android-recovery-static-test.mjs
          node site/tools/phase370-371-site-polish-static-test.mjs
          node game/tools/phase350-integrity-static-test.mjs
      - name: Preserve certified Android and XR contracts
        run: |
          node game/tools/phase364-device-xr-geometry-static-test.mjs
          node game/tools/phase365-android-seated-ux-branding-static-test.mjs
          node game/tools/phase367-android-physical-device-static-test.mjs
      - name: Security assertions
        run: |
          ! grep -RniE 'cash.?app.*(password|pin|card.?number)' site/login.html site/js/phase345-player-account-client.js
          grep -q "VALUES(@playerId,@displayName,@email,'player'" backend/phase345/src/server.js
          grep -q "SET Role = 'admin'" backend/phase370/sql/002_phase370_admin_test_role_assignment.sql
          grep -q 'Cash App <strong>\$SVRhelp</strong>' site/js/phase370-account-profile-mobile-polish.js
