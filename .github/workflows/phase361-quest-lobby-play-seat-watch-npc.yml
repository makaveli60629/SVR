name: Phase 361 Quest Lobby Seat Watch Check

on:
  pull_request:
    paths:
      - 'game/index.html'
      - 'game/quest-release.json'
      - 'game/modules/phase340_platform_manifest.js'
      - 'game/modules/phase361_quest_lobby_play_seat_watch_npc_lock.js'
      - 'game/tools/phase361-quest-lobby-seat-static-test.mjs'
      - '.github/workflows/phase361-quest-lobby-play-seat-watch-npc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase361-quest-seat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Phase 361 runtime syntax
        run: node --check game/modules/phase361_quest_lobby_play_seat_watch_npc_lock.js

      - name: Run Phase 361 static acceptance
        run: node game/tools/phase361-quest-lobby-seat-static-test.mjs

      - name: Run protected Quest static regression
        run: node game/tools/phase358-quest-static-test.mjs

      - name: Run protected dual-platform continuity regression
        run: node game/tools/phase359-dual-platform-static-test.mjs

      - name: Run protected fresh-shuffle and leave-reset regression
        run: node game/tools/phase360-fresh-shuffle-leave-reset-static-test.mjs
