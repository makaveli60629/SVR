name: Phase 404 Android Mobile Decision Safety Audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase404-android-mobile-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Validate protected Phase 404 layer under current Phase 406 shell
        shell: bash
        run: |
          set -euo pipefail
          test -s game/android-stable-phase404.html
          test -s game/android-stable-phase405.html
          test -s game/modules/phase404_android_mobile_safety.js
          test -s game/styles/phase404_android_mobile_safety.css
          grep -q 'PHASE-406-MOBILE-ULTIMATE-GAMEPLAY-POLISH-LOCK' game/android.html
          grep -q 'android-tabletop.html?v=phase406' game/android.html
          grep -q 'android-stable-phase405.html' game/android-tabletop.html
          grep -q 'SVR_PHASE404_MOBILE_SAFETY_QA' game/android-tabletop.html
          grep -q 'SVR_PHASE404_ANDROID_WRAPPER_QA' game/android-tabletop.html
          grep -q 'phase404_android_mobile_safety.css?v=phase404' game/android-stable-phase405.html
          grep -q 'PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK' game/android-stable-phase405.html
          python3 - <<'PY'
          from pathlib import Path
          for path in ['game/android-stable-phase404.html','game/android-stable-phase405.html']:
              s=Path(path).read_text()
              safety=s.index('phase404_android_mobile_safety.js?v=phase404')
              engine=s.index('phase403_android_gameplay.js?v=phase403')
              if safety >= engine: raise SystemExit(f'Phase 404 capture guard must load before engine in {path}')
          PY
      - name: Validate ALL IN double-tap interception
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'ALL_IN_CONFIRM_MS=2600' game/modules/phase404_android_mobile_safety.js
          grep -q 'event.preventDefault()' game/modules/phase404_android_mobile_safety.js
          grep -q 'event.stopImmediatePropagation()' game/modules/phase404_android_mobile_safety.js
          grep -q '{capture:true}' game/modules/phase404_android_mobile_safety.js
          grep -q 'CONFIRM ALL IN' game/modules/phase404_android_mobile_safety.js
          grep -q 'state.armedUntil>t' game/modules/phase404_android_mobile_safety.js
          node <<'NODE'
          const CONFIRM=2600;let armedUntil=0,engineActions=0;
          function tap(t){if(armedUntil>t){armedUntil=0;engineActions++;return 'confirm'}armedUntil=t+CONFIRM;return 'arm'}
          if(tap(1000)!=='arm'||engineActions!==0)throw new Error('first tap reached engine');
          if(tap(2000)!=='confirm'||engineActions!==1)throw new Error('second tap did not confirm');
          if(tap(5000)!=='arm'||tap(8000)!=='arm'||engineActions!==1)throw new Error('expired arm incorrectly confirmed');
          NODE
      - name: Validate decision strip remains inside raise panel
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const raise=\$('#raisePanel'),footer=\$('.footer')" game/modules/phase404_android_mobile_safety.js
          grep -q "raise.insertAdjacentHTML('afterbegin'" game/modules/phase404_android_mobile_safety.js
          grep -q 'decisionStripInsideRaisePanel' game/modules/phase404_android_mobile_safety.js
          grep -q '.raise-panel{position:relative}' game/styles/phase404_android_mobile_safety.css
          grep -q 'POT ODDS' game/modules/phase404_android_mobile_safety.js
          grep -q 'MIN RAISE' game/modules/phase404_android_mobile_safety.js
      - name: Validate paced all-in runout presentation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'RUNOUT_STEP_MS=720' game/modules/phase404_android_mobile_safety.js
          grep -q 'prepareRunout' game/modules/phase404_android_mobile_safety.js
          grep -q 'scheduleRunoutPresentation' game/modules/phase404_android_mobile_safety.js
          grep -q 'phase404-runout-hidden' game/modules/phase404_android_mobile_safety.js
          grep -q 'phase404-runout-pending #winnerBanner' game/styles/phase404_android_mobile_safety.css
          node <<'NODE'
          function groups(start){const out=[];if(start<=2){const flop=[];for(let i=start;i<3;i++)flop.push(i);if(flop.length)out.push(['FLOP',flop])}if(start<=3)out.push(['TURN',[3]]);if(start<=4)out.push(['RIVER',[4]]);return out}
          if(JSON.stringify(groups(0))!==JSON.stringify([['FLOP',[0,1,2]],['TURN',[3]],['RIVER',[4]]]))throw new Error('preflop runout wrong');
          if(JSON.stringify(groups(3))!==JSON.stringify([['TURN',[3]],['RIVER',[4]]]))throw new Error('flop runout wrong');
          NODE
      - name: Validate playtest session and wake lock
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'sessionStorage.getItem(STORAGE)' game/modules/phase404_android_mobile_safety.js
          grep -q "navigator.wakeLock.request('screen')" game/modules/phase404_android_mobile_safety.js
          grep -q 'COPY TEST REPORT' game/modules/phase404_android_mobile_safety.js
          grep -q 'navigator.clipboard.writeText' game/modules/phase404_android_mobile_safety.js
          grep -q 'handsCompleted' game/modules/phase404_android_mobile_safety.js
          grep -q 'mainPotsWon' game/modules/phase404_android_mobile_safety.js
          grep -q 'sidePotsWon' game/modules/phase404_android_mobile_safety.js
          grep -q 'biggestPot' game/modules/phase404_android_mobile_safety.js
          grep -q 'allInRunouts' game/modules/phase404_android_mobile_safety.js
      - name: Preserve Phase 403 engine and protected platforms
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PHASE-403-ANDROID-POKER-ENGINE-RELIABILITY-LOCK' game/modules/phase403_android_gameplay.js
          grep -q 'PHASE-403-ANDROID-SIDE-POT-RULES-LOCK' game/modules/phase403_android_pot_rules.js
          grep -q 'PHASE-403-ANDROID-TABLE-CLARITY-LOCK' game/modules/phase403_android_table_clarity.js
          grep -q 'VISUAL_LEFT_SEAT_ORDER=Object.freeze(\[0,5,1,2,3,4\])' game/modules/phase403_android_gameplay.js
          grep -q 'PHASE-398-ANDROID-RAISE-SIZING-RULES-LOCK' game/modules/phase398_android_raise_rules.js
          grep -q 'PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK' game/quest.html
          grep -q 'PHASE-400-IOS-SAFARI-RUNTIME-ADAPTER-LOCK' game/modules/phase400_ios_safari_adapter.js
          git fetch origin main --depth=1
          test -z "$(git diff origin/main -- game/modules/phase403_android_gameplay.js game/modules/phase403_android_pot_rules.js game/modules/phase403_android_table_clarity.js game/modules/phase398_android_raise_rules.js)"
          test -z "$(git diff origin/main -- game/quest.html game/modules/phase396_quest_seated_clean_table_deal_lock.js)"
          test -z "$(git diff origin/main -- game/modules/phase400_ios_safari_adapter.js)"
      - name: Re-run Phase 403 pot sanity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {buildSidePots,splitPotAmount,sumPotAmounts} from './game/modules/phase403_android_pot_rules.js';
          const audit=buildSidePots([{index:0,amount:1000},{index:1,amount:500},{index:2,amount:200}],1700);
          if(JSON.stringify(audit.pots.map(p=>p.amount))!==JSON.stringify([600,600,500]))throw new Error('side-pot layers changed');
          if(sumPotAmounts(audit.pots)!==1700)throw new Error('pot conservation changed');
          const split=splitPotAmount(301,[0,5],4,[0,5,1,2,3,4]);
          if(split.payouts[0]!==151||split.payouts[5]!==150)throw new Error('odd-chip order changed');
          NODE
      - name: Validate metadata syntax cache and APK policy
        shell: bash
        run: |
          set -euo pipefail
          node --check game/modules/phase404_android_mobile_safety.js
          node --check site-public-hooks.js
          node --check sw.js
          node --check pwa-sw.js
          python3 -m json.tool manifest.webmanifest >/dev/null
          python3 -m json.tool game/manifest.json >/dev/null
          python3 -m json.tool game/android-release.json >/dev/null
          python3 -m json.tool update/app-version.json >/dev/null
          grep -q '"phase": 406' game/manifest.json
          grep -q '"androidAllInDoubleTapGuard": true' update/app-version.json
          grep -q '"androidSessionPlaytestReport": true' update/app-version.json
          grep -q 'svr-poker-phase404-android-mobile-safety-v1' sw.js
          grep -q 'svr-poker-phase405-platform-mobile-social-v1' sw.js
          grep -q 'svr-poker-phase406-mobile-ultimate-gameplay-v1' sw.js
          grep -q '"apkVersionName": "0.1.0-rc2"' game/android-release.json
          grep -q '"apkVersionCode": 2' game/android-release.json
          grep -q '"forceUpdate": false' game/android-release.json
          grep -q '"showUpdatePrompt": false' game/android-release.json
          grep -q '"nativeApkRebuild": false' game/android-release.json
