
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVR Poker Test Scene</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

<style>
body{margin:0;background:black;}
</style>
</head>

<body>

<a-scene background="color:#000">

<!-- lighting -->
<a-entity light="type:ambient;intensity:1"></a-entity>

<!-- camera -->
<a-entity position="0 1.6 6">
<a-camera></a-camera>
</a-entity>

<!-- floor -->
<a-plane
rotation="-90 0 0"
width="200"
height="200"
color="#111">
</a-plane>

<!-- poker table -->
<a-cylinder
position="0 0.9 0"
radius="1.6"
height="1"
color="#0b5e2b">
</a-cylinder>

<!-- skyline test -->
<a-box position="10 10 -30" width="10" height="20" depth="10" color="#222"></a-box>
<a-box position="-10 12 -40" width="10" height="24" depth="10" color="#333"></a-box>

<!-- sky -->
<a-sky color="#020010"></a-sky>

</a-scene>

</body>
</html>
