<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVR Test Queue Admin</title><style>body{background:#090512;color:#f6eeff;font-family:system-ui;margin:0;padding:24px}main{max-width:980px;margin:auto}.card{border:1px solid #7c4dff33;background:#160b24;border-radius:18px;padding:18px;margin:12px 0}button{background:#2d1442;color:white;border:1px solid #b98cff;border-radius:999px;padding:10px 14px}pre{white-space:pre-wrap;background:#0008;border-radius:12px;padding:12px;overflow:auto}</style></head><body><main><h1>SVR Test Queue Admin</h1><section class="card"><p>Internal helper for Phase 197 tester queue payloads. Public Matrix page is untouched.</p><button id="load">Load Queue</button><pre id="out">Ready.</pre></section></main><script>document.getElementById('load').onclick=async()=>{const out=document.getElementById('out');try{const r=await fetch('/api/game/test-queue?limit=30');out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent='API not connected yet: '+e.message}}</script></body></html>
