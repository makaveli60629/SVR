<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="SVR in-game billboard program visual">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#07000d"/><stop offset=".45" stop-color="#150022"/><stop offset="1" stop-color="#050014"/></linearGradient>
    <linearGradient id="screen" x1="0" x2="1"><stop offset="0" stop-color="#ffd879"/><stop offset=".5" stop-color="#ff55df"/><stop offset="1" stop-color="#80f8ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="760" rx="42" fill="url(#bg)"/>
  <path d="M0 560c195-72 349-86 548-54 241 39 403-35 652-96v350H0z" fill="#0d0018"/>
