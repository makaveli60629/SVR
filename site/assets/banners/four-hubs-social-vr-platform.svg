<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 640" role="img" aria-labelledby="title desc">
  <title id="title">Four Hubs One Social VR Platform banner</title>
  <desc id="desc">SVR Poker banner reading Four Hubs. One Social VR Platform.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07051a"/>
      <stop offset="0.52" stop-color="#100720"/>
      <stop offset="1" stop-color="#02040c"/>
    </linearGradient>
    <radialGradient id="cyan" cx="78%" cy="20%" r="46%">
      <stop offset="0" stop-color="#69e8ff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#69e8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple" cx="12%" cy="78%" r="50%">
      <stop offset="0" stop-color="#b48cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9ffff"/>
      <stop offset="0.45" stop-color="#72ecff"/>
      <stop offset="1" stop-color="#f552eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.93 0 0 0 0 1 0 0 0 .8 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="640" fill="url(#bg)"/>
  <rect width="1920" height="640" fill="url(#cyan)"/>
  <rect width="1920" height="640" fill="url(#purple)"/>
  <g opacity="0.18" stroke="#b48cff" stroke-width="1">
    <path d="M0 80h1920M0 160h1920M0 240h1920M0 320h1920M0 400h1920M0 480h1920M0 560h1920"/>
    <path d="M80 0v640M160 0v640M240 0v640M320 0v640M400 0v640M480 0v640M560 0v640M640 0v640M720 0v640M800 0v640M880 0v640M960 0v640M1040 0v640M1120 0v640M1200 0v640M1280 0v640M1360 0v640M1440 0v640M1520 0v640M1600 0v640M1680 0v640M1760 0v640M1840 0v640"/>
  </g>
  <rect x="44" y="44" width="1832" height="552" rx="38" fill="none" stroke="#b48cff" stroke-opacity="0.65" stroke-width="3"/>
  <rect x="58" y="58" width="1804" height="524" rx="30" fill="none" stroke="#69e8ff" stroke-opacity="0.25" stroke-width="1.5"/>
  <g filter="url(#glow)">
    <text x="104" y="190" font-family="Arial Black, Orbitron, Arial, sans-serif" font-size="142" font-weight="900" letter-spacing="10" fill="url(#textGrad)">FOUR HUBS.</text>
    <text x="104" y="350" font-family="Arial Black, Orbitron, Arial, sans-serif" font-size="126" font-weight="900" letter-spacing="8" fill="url(#textGrad)">ONE SOCIAL VR PLATFORM.</text>
  </g>
  <g font-family="Arial Black, Orbitron, Arial, sans-serif" font-size="34" font-weight="900" text-anchor="middle">
    <rect x="1320" y="430" width="190" height="58" rx="29" fill="#070814" fill-opacity="0.72" stroke="#b48cff" stroke-opacity="0.72"/>
    <text x="1415" y="469" fill="#f4f0ff">REIKI</text>
    <rect x="1530" y="430" width="190" height="58" rx="29" fill="#070814" fill-opacity="0.72" stroke="#b48cff" stroke-opacity="0.72"/>
    <text x="1625" y="469" fill="#f4f0ff">PGA</text>
    <rect x="1320" y="504" width="190" height="58" rx="29" fill="#070814" fill-opacity="0.72" stroke="#b48cff" stroke-opacity="0.72"/>
    <text x="1415" y="543" fill="#f4f0ff">SMOKER</text>
    <rect x="1530" y="504" width="220" height="58" rx="29" fill="#070814" fill-opacity="0.72" stroke="#b48cff" stroke-opacity="0.72"/>
    <text x="1640" y="543" fill="#f4f0ff">SVR STORE</text>
  </g>
  <g font-family="Arial Black, Orbitron, Arial, sans-serif" font-size="30" font-weight="900" fill="#dff8ff">
    <rect x="82" y="526" width="410" height="54" rx="27" fill="#000" fill-opacity="0.45" stroke="#69e8ff" stroke-opacity="0.55"/>
    <text x="112" y="562">SVR POKER • SOCIAL VR HUB</text>
  </g>
</svg>
