<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 760" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">Four Hubs One Social VR Platform banner</title>
  <desc id="desc">SVR Poker responsive banner reading Four Hubs One Social VR Platform with four hub logo badges for Reiki, PGA, Smoker Lounge, and SVR Store.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050317"/>
      <stop offset="0.45" stop-color="#150b2c"/>
      <stop offset="1" stop-color="#030611"/>
    </linearGradient>
    <radialGradient id="cyan" cx="72%" cy="18%" r="58%">
      <stop offset="0" stop-color="#69e8ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#69e8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple" cx="14%" cy="78%" r="62%">
      <stop offset="0" stop-color="#b48cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0ffff"/>
      <stop offset="0.42" stop-color="#72ecff"/>
      <stop offset="1" stop-color="#f552eb"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.45 0 0 0 0 0.93 0 0 0 0 1 0 0 0 .82 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="badgeGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .titleText{font-family:Arial Black,Orbitron,Arial,sans-serif;font-weight:900;letter-spacing:8px;fill:url(#textGrad);filter:url(#softGlow)}
      .subText{font-family:Arial,Orbitron,sans-serif;font-weight:800;letter-spacing:3px;fill:#dffcff}
      .badgeText{font-family:Arial Black,Orbitron,Arial,sans-serif;font-weight:900;fill:#ffffff;text-anchor:middle;dominant-baseline:middle}
      .badgeSmall{font-family:Arial,Orbitron,sans-serif;font-weight:800;fill:#dffcff;text-anchor:middle;dominant-baseline:middle;letter-spacing:1px}
    </style>
  </defs>
  <rect width="1920" height="760" rx="0" fill="url(#bg)"/>
  <rect width="1920" height="760" fill="url(#cyan)"/>
  <rect width="1920" height="760" fill="url(#purple)"/>
  <g opacity="0.16" stroke="#b48cff" stroke-width="1">
    <path d="M0 95h1920M0 190h1920M0 285h1920M0 380h1920M0 475h1920M0 570h1920M0 665h1920"/>
    <path d="M95 0v760M190 0v760M285 0v760M380 0v760M475 0v760M570 0v760M665 0v760M760 0v760M855 0v760M950 0v760M1045 0v760M1140 0v760M1235 0v760M1330 0v760M1425 0v760M1520 0v760M1615 0v760M1710 0v760M1805 0v760"/>
  </g>
  <rect x="46" y="46" width="1828" height="668" rx="42" fill="rgba(3,5,13,.34)" stroke="#b48cff" stroke-opacity="0.68" stroke-width="4"/>
  <rect x="66" y="66" width="1788" height="628" rx="34" fill="none" stroke="#69e8ff" stroke-opacity="0.28" stroke-width="2"/>
  <g>
    <text class="titleText" x="105" y="190" font-size="132">FOUR HUBS.</text>
    <text class="titleText" x="105" y="338" font-size="104">ONE SOCIAL VR</text>
    <text class="titleText" x="105" y="478" font-size="104">PLATFORM.</text>
    <text class="subText" x="112" y="562" font-size="34">Poker • Wellness • Training • Lounge • Store</text>
    <rect x="100" y="610" width="430" height="58" rx="29" fill="#02040d" fill-opacity="0.74" stroke="#69e8ff" stroke-opacity="0.62" stroke-width="2"/>
    <text x="315" y="648" text-anchor="middle" font-family="Arial Black,Orbitron,Arial,sans-serif" font-size="29" font-weight="900" fill="#e8fbff">SVR POKER • SOCIAL VR HUB</text>
  </g>
  <g transform="translate(1070 115)">
    <rect x="0" y="0" width="700" height="520" rx="38" fill="#040711" fill-opacity="0.58" stroke="#b48cff" stroke-opacity="0.45" stroke-width="2"/>
    <text x="350" y="58" text-anchor="middle" font-family="Arial Black,Orbitron,Arial,sans-serif" font-size="33" font-weight="900" fill="#dffcff" letter-spacing="3">HUB LOGOS</text>
    <g transform="translate(105 105)" filter="url(#badgeGlow)">
      <circle cx="95" cy="95" r="88" fill="#07171a" stroke="#7fffd4" stroke-width="6"/>
      <path d="M95 35v120M35 95h120M52 52l86 86M138 52L52 138" stroke="#7fffd4" stroke-width="7" stroke-linecap="round" opacity=".78"/>
      <circle cx="95" cy="95" r="42" fill="none" stroke="#f552eb" stroke-width="6"/>
      <text class="badgeText" x="95" y="206" font-size="34">REIKI</text>
      <text class="badgeSmall" x="95" y="240" font-size="18">WELLNESS</text>
    </g>
    <g transform="translate(405 105)" filter="url(#badgeGlow)">
      <circle cx="95" cy="95" r="88" fill="#07131f" stroke="#69e8ff" stroke-width="6"/>
      <circle cx="76" cy="82" r="35" fill="#f5ffff"/>
      <circle cx="68" cy="76" r="4" fill="#8ea7bb"/><circle cx="86" cy="77" r="4" fill="#8ea7bb"/><circle cx="76" cy="94" r="4" fill="#8ea7bb"/>
      <path d="M115 45c48 32 78 70 98 122" fill="none" stroke="#ffd36b" stroke-width="10" stroke-linecap="round"/>
      <path d="M205 164l24 25" stroke="#ffd36b" stroke-width="12" stroke-linecap="round"/>
      <text class="badgeText" x="95" y="206" font-size="34">PGA</text>
      <text class="badgeSmall" x="95" y="240" font-size="18">TRAINING</text>
    </g>
    <g transform="translate(105 315)" filter="url(#badgeGlow)">
      <circle cx="95" cy="95" r="88" fill="#180b1e" stroke="#ff8bd7" stroke-width="6"/>
      <path d="M45 115h100a28 28 0 0 1 28 28v26H17v-26a28 28 0 0 1 28-28Z" fill="#090b15" stroke="#ff8bd7" stroke-width="6"/>
      <rect x="45" y="70" width="100" height="56" rx="22" fill="#25152b" stroke="#ffd36b" stroke-width="5" opacity=".9"/>
      <path d="M70 50c-28-32 26-38 3-72M112 50c-28-32 26-38 3-72" fill="none" stroke="#dffcff" stroke-width="7" stroke-linecap="round" opacity=".68"/>
      <text class="badgeText" x="95" y="206" font-size="28">SMOKER</text>
      <text class="badgeSmall" x="95" y="240" font-size="18">LOUNGE</text>
    </g>
    <g transform="translate(405 315)" filter="url(#badgeGlow)">
      <circle cx="95" cy="95" r="88" fill="#171005" stroke="#ffd36b" stroke-width="6"/>
      <path d="M53 72h84l16 84H38l15-84Z" fill="#080b16" stroke="#ffd36b" stroke-width="7"/>
      <path d="M68 72c0-33 23-53 57-53s57 20 57 53" fill="none" stroke="#69e8ff" stroke-width="8" stroke-linecap="round" transform="translate(-30 0)"/>
      <text x="95" y="128" text-anchor="middle" font-family="Arial Black,Orbitron,Arial" font-size="34" fill="#fff">SVR</text>
      <text class="badgeText" x="95" y="206" font-size="29">SVR STORE</text>
      <text class="badgeSmall" x="95" y="240" font-size="18">GEAR</text>
    </g>
  </g>
</svg>