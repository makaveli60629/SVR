<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SVR Cache Tools</title>
  <style>
    body { background:#050008; color:white; font-family:Arial,sans-serif; padding:32px; }
    button { background:#8a2be2; color:white; border:0; border-radius:10px; padding:14px 20px; font-weight:700; cursor:pointer; }
    pre { background:#111; padding:16px; border-radius:10px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>SVR Cache Tools</h1>
  <p>This page only clears cache after you press the button.</p>
  <button id="clear">Clear allowed browser cache</button>
  <pre id="out">Ready.</pre>

  <script>
    document.getElementById("clear").addEventListener("click", async function () {
      const out = document.getElementById("out");
      const lines = [];

      try {
        if ("caches" in window && window.isSecureContext) {
          const keys = await caches.keys();
          for (const key of keys) await caches.delete(key);
          lines.push("Deleted caches: " + (keys.length ? keys.join(", ") : "none"));
        } else {
          lines.push("CacheStorage not available in this browser context.");
        }
      } catch (e) {
        lines.push("Cache clear blocked: " + e.message);
      }

      try {
        if ("serviceWorker" in navigator && window.isSecureContext) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) await reg.unregister();
          lines.push("Unregistered service workers: " + regs.length);
        } else {
          lines.push("ServiceWorker tools not available in this browser context.");
        }
      } catch (e) {
        lines.push("ServiceWorker cleanup blocked: " + e.message);
      }

      out.textContent = lines.join("\n");
    });
  </script>
</body>
</html>
