<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>SVR Poker Quest Lobby</title>
<meta name="theme-color" content="#050508">
<style>
html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;background:#050508;color:#fff;font-family:system-ui,Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;z-index:20;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;border:1px solid #7ffcff55;border-radius:16px;background:#050812cc;backdrop-filter:blur(8px)}
#hud img{width:42px;height:42px;object-fit:contain}.title{font-weight:950}.status{color:#bffcff;font-size:12px;flex:1;min-width:180px}
#hud a,#hud button{border:1px solid #ffd98a66;border-radius:10px;background:#111827;color:#fff;padding:8px 10px;text-decoration:none;font-weight:900}
.xr-active #hud{display:none}
body:not(.lobby-ready) .svr-vr-button{display:none!important}
#hint{position:fixed;z-index:15;left:50%;bottom:14px;transform:translateX(-50%);max-width:min(90vw,760px);padding:9px 13px;border:1px solid #a77cff66;border-radius:999px;background:#070a12d9;text-align:center;color:#e9ddff;font-size:12px}
.xr-active #hint{display:none}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<link rel="modulepreload" href="./modules/phase467_quest_lobby_table_dealer.js?v=phase467&playability=phase470">
</head>
<body data-build="PHASE-467-QUEST-WALKABLE-LOBBY-TABLE-DEALER">
<div id="app"></div>
<div id="hud"><img src="/logo.png" alt="SVR Poker"><div><div class="title">SVR QUEST LOBBY</div><div class="status" id="status" role="status" aria-live="polite">Building the walkable lobby…</div></div><button id="retryBtn" hidden>RETRY LOADING</button><button id="centerBtn">LOBBY CENTER</button><a href="/game/index.html?platform=quest&v=phase470&direct=1&tableonly=1&autoseat=1&questfix=1&seated=1&teleport=off&clean=1">POKER ROOM</a><a href="/game/scorpion.html?v=phase464">SCORPION</a><a href="/game/reiki-vr.html?v=phase464">REIKI</a><a href="/game/pga-drive.html?v=phase464">PGA</a></div>
<div id="hint">Quest: right stick forward/back follows your head direction • left/right snap-turns • grip/trigger/hand gesture teleport stays available in the lobby.</div>
<script type="module">
const status=document.getElementById('status');
const retry=document.getElementById('retryBtn');
retry.onclick=()=>location.reload();
const slow=setTimeout(()=>{status.textContent='Loading is taking longer than expected. You can retry or open the Poker Room.';retry.hidden=false},45000);
try{
 const {bootQuestLobby}=await import('./modules/quest_lobby_runtime.js?v=phase470');
 await bootQuestLobby();
 clearTimeout(slow);retry.hidden=true;
 document.body.classList.add('lobby-ready');
}catch(error){
 clearTimeout(slow);
 console.error('Quest lobby startup failed',error);
 status.textContent='The lobby could not load. Check your connection and retry, or open the Poker Room.';
 retry.hidden=false;
 document.body.classList.add('lobby-failed');
}
</script>
</body>
</html>
