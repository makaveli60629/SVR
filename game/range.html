<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>SVR PGA Driving Range • Phase 91</title>
  <style>
    html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden}
    #app{position:fixed;inset:0}
    .hud{position:fixed;left:14px;top:14px;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .pill,.btn{border:1px solid rgba(93,242,163,.58);background:rgba(0,0,0,.62);backdrop-filter:blur(8px);border-radius:999px;padding:8px 12px;color:#fff;text-decoration:none;font-size:13px}
    .btn:hover{background:rgba(40,140,95,.72)}
    .bottom{position:fixed;left:14px;right:14px;bottom:14px;z-index:5;text-align:center;color:rgba(255,255,255,.76);font-size:13px}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <a class="btn" href="./index.html">← Lobby</a>
    <span class="pill">BUILD: PHASE-91-PGA-DRIVING-RANGE-RESTORE-LOCK</span>
    <span class="pill">PGA DRIVE RESTORED</span>
  </div>
  <div class="bottom">Stand on gold mat • ball is in front • click/Space = test swing • R resets • WASD/arrows move • Q/E turn • B/Esc returns</div>
  <script type="module">
    import { createPgaDrivingRange } from './modules/range_logic.js';
    createPgaDrivingRange({ build: 'PHASE-91-PGA-DRIVING-RANGE-RESTORE-LOCK', alias: 'PGA DRIVE' });
  </script>
</body>
</html>
