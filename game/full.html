    html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden}#app{position:fixed;inset:0}.panel{position:fixed;left:12px;top:12px;right:12px;z-index:10;display:grid;gap:10px;pointer-events:none}.card{width:min(760px,calc(100vw - 24px));border:1px solid rgba(105,232,255,.32);border-radius:22px;background:rgba(5,5,14,.86);padding:14px;box-shadow:0 24px 80px rgba(0,0,0,.68);backdrop-filter:blur(14px);pointer-events:auto}h1{margin:0 0 6px;font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase}.muted{color:#cfc8ff;margin:0 0 10px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}a,button{border:1px solid rgba(105,232,255,.36);border-radius:999px;background:rgba(105,232,255,.1);color:#fff;text-decoration:none;padding:8px 12px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,rgba(255,91,233,.86),rgba(92,72,255,.86))}#bootLog{max-height:34vh;overflow:auto;font:12px/1.35 ui-monospace,Consolas,monospace;background:rgba(0,0,0,.38);border-radius:14px;padding:10px}.ok{color:#a7ffbd}.fail{color:#ff9aa9;white-space:pre-wrap}@media(max-width:640px){.card{padding:12px}#bootLog{max-height:30vh}}
  </style>
</head>

</html>
