<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SVR Poker VR Room | 404</title>
  <meta name="description" content="SVR Poker VR room section 404 page." />
  <link rel="icon" href="../logo.png" type="image/png" />
  <style>
    :root { color-scheme: dark; --cyan:#58fff4; --violet:#b56cff; --pink:#ff5ceb; --text:#effcff; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; color: var(--text); background: radial-gradient(circle at 50% 24%, rgba(181,108,255,.22), transparent 32%), radial-gradient(circle at 50% 74%, rgba(88,255,244,.13), transparent 42%), #000; }
    .page { min-height: 100svh; display: grid; place-items: center; padding: 28px; }
    .card { width: min(760px,100%); text-align:center; border:1px solid rgba(88,255,244,.42); border-radius:30px; background:linear-gradient(180deg,rgba(0,8,14,.88),rgba(5,0,16,.88)); box-shadow:0 0 42px rgba(88,255,244,.18),0 0 66px rgba(181,108,255,.12); padding:clamp(24px,5vw,46px); }
    .logo { width:min(280px,70vw); display:block; margin:0 auto 12px; filter:drop-shadow(0 0 20px rgba(255,92,235,.55)) drop-shadow(0 0 18px rgba(88,255,244,.38)); }
    .code { color:#ffccd9; font-weight:900; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:10px 0 8px; font-size:clamp(34px,7vw,74px); line-height:.95; text-shadow:0 0 24px rgba(88,255,244,.62); }
    p { margin:10px auto; max-width:620px; color:#bfefff; line-height:1.55; font-size:clamp(16px,2.4vw,19px); }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; margin-top:24px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; min-height:46px; padding:12px 18px; border-radius:999px; border:1px solid rgba(88,255,244,.48); color:#fff; text-decoration:none; font-weight:900; background:rgba(4,18,26,.74); box-shadow:0 12px 28px rgba(0,0,0,.34); }
    .btn.primary { border-color:rgba(255,92,235,.72); background:linear-gradient(135deg,rgba(92,0,134,.86),rgba(9,34,48,.86)); }
    .foot { margin-top:24px; color:rgba(239,252,255,.68); font-size:13px; letter-spacing:.04em; }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="game-404-title">
      <img class="logo" src="../logo.png" alt="SVR Poker logo" />
      <div class="code">Official SVR VR Room Route Error</div>
      <h1 id="game-404-title">404</h1>
      <p>This VR room route is unavailable, unpublished, or moved.</p>
      <p>Return to the live VR lobby or the official launch page.</p>
      <nav class="actions" aria-label="Game 404 recovery navigation">
        <a class="btn primary" href="./index.html">Launch VR Room</a>
        <a class="btn" href="../index.html">Return Home</a>
        <a class="btn" href="../site/index.html">Preview Site</a>
      </nav>
      <div class="foot">SVR Poker • Official VR Room Section</div>
    </section>
  </main>
</body>
</html>
