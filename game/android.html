<html lang="en">
<head>

<style>
html,body,#app{height:100%;margin:0;background:#080a0f;color:#f5f0e6;overflow:hidden;font-family:system-ui,Arial,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%}
#safeStage{position:fixed;inset:0;z-index:2147483646;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 38%,#1a202b,#080a0f 72%)}
#safeStage[hidden]{display:none!important}.boot-card{width:min(430px,92vw);padding:24px;border:1px solid rgba(127,252,255,.68);border-radius:22px;background:rgba(13,16,23,.94);text-align:center;box-shadow:0 18px 58px rgba(0,0,0,.55)}.boot-card img{width:82px;height:82px;object-fit:contain}.boot-card h1{margin:10px 0 6px;letter-spacing:.08em}.boot-card p{margin:6px 0 16px;color:#d8fbff;line-height:1.4}.boot-card button{min-height:48px;padding:10px 16px;border:1px solid rgba(255,217,138,.72);border-radius:13px;background:#252832;color:#fff;font-weight:900}
#runtimeRecovery{position:fixed;z-index:2147483647;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));padding:12px;border:1px solid rgba(255,159,189,.72);border-radius:16px;background:rgba(14,17,24,.97);box-shadow:0 18px 60px rgba(0,0,0,.64);text-align:center}#runtimeRecovery[hidden]{display:none!important}#runtimeRecovery p{margin:0 0 9px;line-height:1.3}#runtimeRecovery .actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}#runtimeRecovery button{min-height:44px;padding:8px 14px;border:1px solid rgba(255,217,138,.72);border-radius:12px;background:#252832;color:#fff;font-weight:900}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script>
window.SVR_PHASE375_CACHE_READY = (async () => {
  try {
    const epoch = 'phase375';
    if (localStorage.getItem('svr_android_cache_epoch') === epoch) return true;
    if ('serviceWorker' in navigator) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map((registration) => registration.unregister().catch(() => false)));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.filter((key) => /svr|poker/i.test(key)).map((key) => caches.delete(key)));
    }
    localStorage.setItem('svr_android_cache_epoch', epoch);
    return true;
  } catch {
    return false;
  }
})();
</script>
</head>
<body data-build="PHASE-375-ANDROID-PLAYABLE-SINGLE-JOIN-AUTHORITY-LOCK" data-release="PHASE-375-ANDROID-PLAYABLE-SINGLE-JOIN-AUTHORITY-LOCK" data-platform="android">
<div id="app"></div>
<div id="safeStage">
  <div class="boot-card">
    <img src="/logo.png" alt="SVR Poker logo">
    <h1>SVR POKER</h1>
    <p id="safeStatus">Clearing the old app cache and loading the verified table…</p>
    <button id="startRuntimeBtn" type="button">START GAME</button>
  </div>
</div>
<aside id="runtimeRecovery" hidden>
  <p id="runtimeRecoveryText">The Android game stopped during startup.</p>
  <div class="actions">
    <button id="runtimeLowPowerButton" type="button">LOW POWER</button>
    <button id="runtimeReloadButton" type="button">RELOAD GAME</button>
  </div>
</aside>
<script type="module">
await window.SVR_PHASE375_CACHE_READY;
window.SVR_PLATFORM = 'android';
window.SVR_REQUIRE_TABLE_JOIN = true;
window.SVR_TABLE_STARTING_STACK = 15000;
window.SVR_ANDROID_BRAND_SLOT = { id:'svr', name:'SVR POKER', logoUrl:'/logo.png', fallbackLogoUrl:'/logo.webp' };
window.SVR_ANDROID_UPDATE_POLICY = {
  apkVersionName:'0.1.0-rc1',
  apkVersionCode:1,
  forceUpdate:false,
  showUpdatePrompt:false,
  manualUpdateOnly:true,
  webEntry:'/game/android.html?channel=stable&v=phase375',
  webRuntimeBuild:'PHASE-375-ANDROID-PLAYABLE-SINGLE-JOIN-AUTHORITY-LOCK'
};

const VERSION = 'phase375';
const report = (message, error = false) => {
  const status = document.getElementById('safeStatus');
  if (status) status.textContent = message;
  if (error) {
    const panel = document.getElementById('runtimeRecovery');
    const text = document.getElementById('runtimeRecoveryText');
    if (text) text.textContent = message;
    if (panel) panel.hidden = false;
  }
};
const load = async (path, label, critical = true) => {
  report(label);
  const url = new URL(path, document.baseURI);
  url.searchParams.set('v', VERSION);
  try {
    return await Promise.race([
      import(url.href),
      new Promise((_, reject) => setTimeout(() => reject(new Error(`MODULE_TIMEOUT:${path}`)), 30000))
    ]);
  } catch (error) {
    window.SVR_PHASE375_BOOT_ERRORS = [...(window.SVR_PHASE375_BOOT_ERRORS || []), { path, error:String(error?.message || error) }];
    if (critical) throw error;
    return null;
  }
};

let started = false;
const start = async () => {
  if (started) return;
  started = true;
  document.getElementById('startRuntimeBtn').disabled = true;
  try {
    await load('./modules/phase340_runtime_authority_registry.js', 'Preparing Android runtime authority…', false);
    await load('./modules/phase364_device_xr_geometry_spawn_lock.js', 'Preparing Android camera and device geometry…', false);
    await load('./modules/phase356_android_real_device_freeze_recovery_lock.js', 'Applying Android freeze protection…');
    await load('./phase101_boot_load_screen_recovery.js', 'Preparing the game scene…', false);
    await load('./phase101_partial_runtime_render_guard.js', 'Starting protected rendering…', false);
    await load('./main.js', 'Loading the SVR Poker lobby…');
    await load('./modules/phase363_android_canonical_table_asset_lock.js', 'Loading the verified poker table…');
    await load('./modules/phase355_android_poker_boot_order_lock.js', 'Loading cards and poker rules…');
    await load('./modules/phase337_physical_pot_winner_settlement_lock.js', 'Loading pot and winner settlement…', false);
    await load('./modules/phase338_bankroll_chip_inventory_sync_lock.js', 'Loading player chip stacks…', false);
    await load('./modules/phase342_adaptive_performance_asset_pipeline_lock.js', 'Optimizing Android graphics…', false);
    await load('./modules/phase347_android_single_controller_seated_gameplay_apk_release_lock.js', 'Loading the single Android controller…');
    await load('./modules/phase355_android_full_hand_driver_compatibility_lock.js', 'Connecting the full poker hand…', false);
    await load('./modules/phase350_android_controller_dom_deduplication_lock.js', 'Removing duplicate controls…', false);
    await load('./modules/phase365_android_seated_ux_branding_gyro_alignment_lock.js', 'Aligning the seated table view…', false);
    await load('./modules/phase367_android_physical_device_viewport_touch_acceptance_lock.js', 'Calibrating phone touch controls…', false);
    await load('./modules/phase357_android_direct_camera_seat_fix.js', 'Locking the camera to the player seat…', false);
    await load('./modules/phase375_android_playable_authority_lock.js', 'Finishing JOIN NOW and table recovery…');
    window.__SVR_GAME_READY__ = true;
    window.SVR_GAME_READY = true;
    document.body.classList.add('boot-released', 'runtime-visible', 'ready', 'svr-platform-android', 'svr-phase375');
    document.getElementById('safeStage').hidden = true;
    window.dispatchEvent(new CustomEvent('svr:phase375-core-ready', { detail:{ at:Date.now(), errors:window.SVR_PHASE375_BOOT_ERRORS || [] } }));
  } catch (error) {
    console.error(error);
    started = false;
    document.getElementById('startRuntimeBtn').disabled = false;
    report(`Startup recovery: ${String(error?.message || error)}. Press RELOAD GAME.`, true);
  }
};

document.getElementById('startRuntimeBtn').addEventListener('click', start);
document.getElementById('runtimeLowPowerButton').addEventListener('click', () => window.SVR_PHASE375_LOW_POWER?.());
document.getElementById('runtimeReloadButton').addEventListener('click', () => location.replace(`/game/android.html?channel=stable&v=phase375&reload=${Date.now()}`));
window.addEventListener('unhandledrejection', (event) => {
  console.error(event.reason);
  report('A game module stopped responding. Reload the Phase 375 Android game.', true);
});
setTimeout(start, 160);
</script>
</body>
</html>
