<script>
window.SVR_PHASE376_CACHE_READY=(async()=>{try{const epoch='phase376';if(localStorage.getItem('svr_android_cache_epoch')===epoch)return true;if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map((registration)=>registration.unregister().catch(()=>false)));}if('caches'in window){const keys=await caches.keys();await Promise.all(keys.filter((key)=>/svr|poker/i.test(key)).map((key)=>caches.delete(key)));}localStorage.setItem('svr_android_cache_epoch',epoch);return true;}catch{return false;}})();
</script>

<body data-build="PHASE-376-ANDROID-IMMEDIATE-JOIN-SAFE-PLAY-LOCK" data-release="PHASE-376-ANDROID-IMMEDIATE-JOIN-SAFE-PLAY-LOCK" data-platform="android">
<div id="app"></div>
<section id="svr376Gate" aria-label="SVR Poker Android start">
  <div class="svr376-card">
    <img src="/logo.png" alt="SVR Poker logo">
    <h1>SVR POKER</h1>
    <p>The Join button is available before the 3D room loads.</p>
    <div class="svr376-actions">
      <button id="svr376Join" class="primary" type="button">JOIN NOW</button>
      <button id="svr376Safe" class="safe" type="button">SAFE TABLE</button>
      <button id="svr376Reload" type="button">RELOAD</button>
    </div>
    <div id="svr376Progress" class="svr376-progress">Ready. Press JOIN NOW.</div>
    <p class="svr376-note">SAFE TABLE is a lightweight playable backup if the 3D lobby stalls on this phone.</p>
  </div>
</section>
<button id="svr376Leave" type="button" hidden>LEAVE TABLE</button>
<aside id="runtimeRecovery" hidden>
  <p id="runtimeRecoveryText">The 3D table did not finish loading.</p>
  <button id="runtimeSafeButton" type="button">PLAY SAFE TABLE</button>
  <button id="runtimeReloadButton" type="button">RELOAD GAME</button>
</aside>
<script type="module">
window.SVR_PLATFORM='android';
window.SVR_REQUIRE_TABLE_JOIN=true;
window.SVR_TABLE_STARTING_STACK=15000;
window.SVR_ANDROID_LOW_POWER_MODE=true;
window.SVR_ANDROID_BRAND_SLOT={id:'svr',name:'SVR POKER',logoUrl:'/logo.png',fallbackLogoUrl:'/logo.webp'};
window.SVR_ANDROID_UPDATE_POLICY={apkVersionName:'0.1.0-rc1',apkVersionCode:1,forceUpdate:false,showUpdatePrompt:false,manualUpdateOnly:true,webEntry:'/game/android.html?channel=stable&v=phase376',webRuntimeBuild:'PHASE-376-ANDROID-IMMEDIATE-JOIN-SAFE-PLAY-LOCK'};

const VERSION='phase376';
const gate=document.getElementById('svr376Gate');
const joinButton=document.getElementById('svr376Join');
const progress=document.getElementById('svr376Progress');
const leaveButton=document.getElementById('svr376Leave');
let booting=false;
let joined=false;

function report(message,error=false){progress.textContent=message;if(error){document.getElementById('runtimeRecoveryText').textContent=message;document.getElementById('runtimeRecovery').hidden=false;}}
async function load(path,label,critical=true,timeout=16000){report(label);const url=new URL(path,document.baseURI);url.searchParams.set('v',VERSION);try{return await Promise.race([import(url.href),new Promise((_,reject)=>setTimeout(()=>reject(new Error(`MODULE_TIMEOUT:${path}`)),timeout))]);}catch(error){window.SVR_PHASE376_BOOT_ERRORS=[...(window.SVR_PHASE376_BOOT_ERRORS||[]),{path,error:String(error?.message||error)}];if(critical)throw error;return null;}}
function cleanControls(){document.querySelectorAll('button').forEach((button)=>{if(button===leaveButton||button.closest('#runtimeRecovery'))return;const text=(button.textContent||'').trim().toUpperCase();if(['SIT','SEAT','SIT DOWN','SIT AT TABLE','PLAY GAME','JOIN TABLE','JOIN NOW','LOBBY','CENTER'].includes(text)){if(!button.closest('#svr376Gate')){button.hidden=true;button.setAttribute('aria-hidden','true');try{button.inert=true;}catch{}}}});}
function rendererBudget(){try{const renderer=window.__SVR_RENDERER__;renderer?.setPixelRatio?.(Math.min(.78,window.devicePixelRatio||1));if(renderer?.shadowMap)renderer.shadowMap.enabled=false;}catch{}}
async function startSafe(reason='manual'){report(`Opening SAFE TABLE (${reason})…`);try{window.SVR_PHASE376_SAFE_AUTOSTART=false;await load('./modules/phase376_android_safe_play_fallback.js','Opening the lightweight playable table…',true,8000);window.SVR_PHASE376_START_SAFE_PLAY?.();gate.hidden=true;document.getElementById('runtimeRecovery').hidden=true;}catch(error){report(`Safe table failed: ${String(error?.message||error)}. Reload the game.`,true);}}
function deferred(){const run=async()=>{await load('./modules/phase337_physical_pot_winner_settlement_lock.js','',false,12000);await load('./modules/phase338_bankroll_chip_inventory_sync_lock.js','',false,12000);await load('./modules/phase355_android_full_hand_driver_compatibility_lock.js','',false,12000);await load('./modules/phase350_android_controller_dom_deduplication_lock.js','',false,12000);};if('requestIdleCallback'in window)requestIdleCallback(()=>run().catch(()=>{}),{timeout:7000});else setTimeout(()=>run().catch(()=>{}),3500);}
async function start3d(){if(booting||joined)return;booting=true;joinButton.disabled=true;joinButton.textContent='JOINING…';window.SVR_PHASE376_JOIN_INTENT=true;try{
  await window.SVR_PHASE376_CACHE_READY;
  await load('./modules/phase340_runtime_authority_registry.js','Preparing game authority…',false,7000);
  await load('./phase101_boot_load_screen_recovery.js','Preparing protected rendering…',false,7000);
  await load('./phase101_partial_runtime_render_guard.js','Preparing Android frame safety…',false,7000);
  await load('./main.js','Loading the 3D poker room…',true,18000);
  rendererBudget();
  await load('./modules/phase363_android_canonical_table_asset_lock.js','Loading the verified poker table…',true,18000);
  await load('./modules/phase355_android_poker_boot_order_lock.js','Loading cards and poker rules…',true,18000);
  await load('./modules/phase347_android_single_controller_seated_gameplay_apk_release_lock.js','Loading phone controls…',true,14000);
  await load('./modules/phase357_android_direct_camera_seat_fix.js','Aligning your table seat…',false,9000);
  await load('./modules/phase365_android_seated_ux_branding_gyro_alignment_lock.js','Finishing the seated view…',false,9000);
  await load('./modules/phase367_android_physical_device_viewport_touch_acceptance_lock.js','Calibrating touch controls…',false,9000);
  rendererBudget();
  if(typeof window.SVR_PHASE347_SIT!=='function'||typeof window.SVR_RESET_POKER_TABLE!=='function')throw new Error('ANDROID_PLAY_API_NOT_READY');
  const seated=window.SVR_PHASE347_SIT();
  if(seated===false)throw new Error('ANDROID_SEAT_NOT_READY');
  await new Promise((resolve)=>setTimeout(resolve,140));
  window.SVR_RESET_POKER_TABLE(15000);
  window.SVR_PHASE357_DIRECT_CAMERA_CORRECT?.();
  window.SVR_PHASE365_SYNC?.();
  window.SVR_PHASE367_DEVICE_CALIBRATE?.();
  joined=true;
  document.body.classList.add('svr376-playing','runtime-visible','ready','svr-platform-android');
  cleanControls();
  gate.hidden=true;
  leaveButton.hidden=false;
  document.getElementById('runtimeRecovery').hidden=true;
  window.__SVR_GAME_READY__=true;window.SVR_GAME_READY=true;
  window.SVR_PHASE376_STATE={build:'PHASE-376-ANDROID-IMMEDIATE-JOIN-SAFE-PLAY-LOCK',joined:true,mode:'3d',checkedAt:new Date().toISOString()};
  deferred();
}catch(error){console.error(error);booting=false;joinButton.disabled=false;joinButton.textContent='JOIN NOW';report(`3D startup stopped: ${String(error?.message||error)}. Opening SAFE TABLE…`,true);await startSafe('automatic recovery');return;}finally{if(joined)booting=false;}}
function leave3d(){try{window.SVR_PHASE347_LEAVE?.();}catch{}location.replace(`/game/android.html?channel=stable&v=phase376&leave=${Date.now()}`);}

joinButton.addEventListener('click',start3d);
document.getElementById('svr376Safe').addEventListener('click',()=>startSafe('selected'));
document.getElementById('svr376Reload').addEventListener('click',()=>location.replace(`/game/android.html?channel=stable&v=phase376&reload=${Date.now()}`));
leaveButton.addEventListener('click',leave3d);
document.getElementById('runtimeSafeButton').addEventListener('click',()=>startSafe('recovery'));
document.getElementById('runtimeReloadButton').addEventListener('click',()=>location.replace(`/game/android.html?channel=stable&v=phase376&reload=${Date.now()}`));
window.addEventListener('unhandledrejection',(event)=>{console.error(event.reason);if(!joined&&!document.getElementById('svr376SafeTable'))report('A 3D module stopped. Use SAFE TABLE or reload.',true);});
window.SVR_PHASE376_START_3D=start3d;
window.SVR_PHASE376_START_SAFE=startSafe;
window.SVR_PHASE376_QA=()=>({build:'PHASE-376-ANDROID-IMMEDIATE-JOIN-SAFE-PLAY-LOCK',gateVisible:!gate.hidden,joinVisible:!joinButton.hidden,safeButtonVisible:!document.getElementById('svr376Safe').hidden,joined,booting,mode:document.getElementById('svr376SafeTable')?'safe':joined?'3d':'gate',errors:window.SVR_PHASE376_BOOT_ERRORS||[],checkedAt:new Date().toISOString()});
</script>
