<body data-build="PHASE-357-ANDROID-TABLE-STATUS-SHOWDOWN-ANTE-LOCK" data-release="PHASE-360-FRESH-SHUFFLE-LEAVE-RESET-CONTINUOUS-TABLE-LOCK" data-acceptance="PHASE-354-ANDROID-FULL-GAME-RELEASE-ACCEPTANCE-LOCK" data-platform="android"><div id="app"></div><div id="safeStage"><div class="card"><h1>SVR POKER</h1><p id="safeStatus">Preparing the Android table, fresh deck, cards, winner display, and continuous play…</p><button id="startRuntimeBtn">Enter Game</button></div></div><aside id="runtimeRecovery" hidden><p id="runtimeRecoveryText">Android performance recovery is available.</p><div class="actions"><button id="runtimeLowPowerButton" type="button">Continue Low Power</button><button id="runtimeReloadButton" type="button">Reload Table</button></div></aside><script type="module">
import{bootPlatform}from'./modules/phase340_platform_core_loader.js?v=phase360';
window.SVR_ANDROID_UPDATE_POLICY={apkVersionName:'0.1.0-rc1',apkVersionCode:1,forceUpdate:false,showUpdatePrompt:false,manualUpdateOnly:true};
let started=false;
const report=(message)=>{const status=document.getElementById('safeStatus');if(status)status.textContent=message;const panel=document.getElementById('runtimeRecovery');const text=document.getElementById('runtimeRecoveryText');if(text)text.textContent=message;if(panel)panel.hidden=false;};

document.getElementById('runtimeReloadButton')?.addEventListener('click',()=>location.reload());
window.addEventListener('unhandledrejection',(event)=>{console.error(event.reason);report('A game module stopped responding. Continue in low power or reload the table.');});
setTimeout(start,320);
</script></body></html>
