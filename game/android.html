<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>SVR Poker — Android Game</title>
  <meta name="theme-color" content="#050508">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden;font-family:system-ui,Arial,sans-serif;touch-action:none}
    #app{position:fixed;inset:0;background:#02040b}
    canvas{display:block;width:100%;height:100%;background:#000;outline:none}
    #safeStage{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#000;transition:opacity .35s ease}
    .safe-card{width:min(88vw,560px);border:1px solid rgba(127,252,255,.72);border-radius:22px;background:rgba(0,0,0,.78);box-shadow:0 0 42px rgba(127,252,255,.18);padding:24px;text-align:center}
    .safe-card h1{margin:4px 0 8px;font-size:clamp(30px,7vw,56px);letter-spacing:.05em}
    .safe-card p{margin:0 0 14px;color:#dffeff}
    .pill{display:inline-block;border:1px solid #ffd98a;border-radius:999px;color:#ffd98a;padding:7px 12px;font-weight:900;font-size:11px;letter-spacing:.09em}
    .btn{border:1px solid rgba(127,252,255,.65);border-radius:12px;background:rgba(127,252,255,.12);color:#dffeff;padding:10px 14px;font-weight:900;cursor:pointer}
    #sceneNav,#log,#err,#hud,#svrPhaseBadge,.phase-label{display:none!important}
    .boot-released #safeStage,.runtime-visible #safeStage,.overlay-released #safeStage{display:none!important}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body data-build="PHASE-327-ANDROID-APK-RELEASE-CANDIDATE-LOCK">
  <div id="app"></div>
  <div id="safeStage">
    <section class="safe-card">
      <span class="pill">ANDROID RELEASE CANDIDATE</span>
      <h1>SVR POKER</h1>
      <p id="safeStatus">Loading stable Android play mode…</p>
      <button class="btn" id="startRuntimeBtn" type="button">Enter Android Game</button>
    </section>
  </div>
  <div id="bootFallback"></div>
  <div id="hud"><span id="status"></span><span id="mode"></span><button id="toggleLog" type="button">Log</button><button id="toggleJoints" type="button">Joints</button></div>
  <div id="sceneNav"></div><pre id="log"></pre><pre id="err"></pre>
  <script>
    (function(){
      const BUILD = "PHASE-327-ANDROID-APK-RELEASE-CANDIDATE-LOCK";
      const params = new URLSearchParams(location.search);
      if(!params.has("channel")) params.set("channel","stable");
      const modules = [
        "./phase101_boot_load_screen_recovery.js?v=android-rc1",
        "./phase101_partial_runtime_render_guard.js?v=android-rc1",
        "./main.js?v=android-rc1",
        "./phase156_table2_stool_texture_lock.js?v=android-rc1",
        "./phase161_geometry_table_fbx_floor_lock.js?v=android-rc1",
        "./phase164_fbx_table_final_alignment_seat_anchor_lock.js?v=android-rc1",
        "./modules/phase199_fbx_table_runtime_diagnostic_lock.js?v=android-rc1",
        "./modules/phase200_clean_runtime_authority_lock.js?v=android-rc1",
        "./modules/phase202_fbx_asset_path_recovery_lock.js?v=android-rc1",
        "./modules/phase203_table_asset_resolver_lock.js?v=android-rc1",
        "./phase145_android_black_screen_recovery_lock.js?v=android-rc1",
        "./modules/phase322_full_lobby_visual_finish_lock.js?v=android-rc1",
        "./modules/phase323_table_resting_point_alignment_lock.js?v=android-rc1",
        "./phase321_android_lobby_production_lock.js?v=android-rc1",
        "./phase324_android_game_entry_controls_lock.js?v=android-rc1",
        "./phase325_android_controls_table_unifier_lock.js?v=android-rc1",
        "./phase326_android_playable_polish_lock.js?v=android-rc1",
        "./phase327_android_apk_release_candidate_lock.js?v=android-rc1",
        "./phase142_playable_poker_core_authority_lock.js?v=android-rc1"
      ];
      let started = false;
      const status = document.getElementById("safeStatus");
      window.SVR_SUPPRESS_PHASE_BADGES = true;
      window.SVR_ANDROID_RELEASE_CHANNEL = "stable";
      window.SVR_ANDROID_PRODUCTION_ROUTE = { build:BUILD, channel:"stable", apkVersionName:"0.1.0-rc1", apkVersionCode:1, active:true, modules:[...modules], siteTouched:false, startedAt:new Date().toISOString() };
      function note(message){ if(status) status.textContent = message; window.SVR_ANDROID_PRODUCTION_ROUTE.lastMessage = message; }
      function release(reason){
        document.body.classList.add("boot-released","runtime-visible","overlay-released","svr-android-game-controls","svr-phase326-android","svr-phase327-android-release");
        document.getElementById("safeStage")?.remove();
        window.__SVR_GAME_READY__ = true;
        window.SVR_GAME_READY = true;
        window.SVR_ANDROID_PRODUCTION_ROUTE.releaseReason = reason;
      }
      function addModule(src){
        return new Promise((resolve,reject)=>{
          const script = document.createElement("script");
          script.type = "module";
          script.src = src;
          script.onload = resolve;
          script.onerror = ()=>reject(new Error(`Failed to load ${src}`));
          document.body.appendChild(script);
        });
      }
      async function start(){
        if(started) return;
        started = true;
        try{
          for(let i=0;i<modules.length;i++){
            note(`Loading Android RC1 ${i+1} / ${modules.length}`);
            await addModule(modules[i]);
          }
          note("Android RC1 ready");
          setTimeout(()=>release("phase327-ready"),180);
        }catch(error){
          window.SVR_ANDROID_PRODUCTION_ROUTE.error = String(error?.message || error);
          note("Recovery mode active");
          setTimeout(()=>release("phase327-recovery"),700);
        }
      }
      document.getElementById("startRuntimeBtn")?.addEventListener("click", start);
      window.SVR_ENTER_ANDROID_GAME_FROM_BUTTON = start;
      window.addEventListener("error",()=>setTimeout(()=>release("window-error-release"),250));
      window.addEventListener("unhandledrejection",()=>setTimeout(()=>release("promise-error-release"),250));
      setTimeout(()=>{ if(!started) note("Tap Enter Android Game"); },320);
      setTimeout(start,1000);
      setTimeout(()=>release("absolute-release"),5600);
    })();
  </script>
</body>
</html>
