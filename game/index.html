<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVR Poker</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:10;
}

</style>
</head>

<body>

<div id="ui">SVR Poker Multiplayer Client</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,10,18);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);

document.body.appendChild(renderer.domElement);

//
// lighting
//

const ambient = new THREE.AmbientLight(0xffffff,1);
scene.add(ambient);

const light = new THREE.PointLight(0xffffff,2);
light.position.set(10,20,10);
scene.add(light);

//
// floor
//

const floor = new THREE.Mesh(

new THREE.PlaneGeometry(200,200),

new THREE.MeshStandardMaterial({color:0x111111})

);

floor.rotation.x = -Math.PI/2;

scene.add(floor);

//
// poker table
//

const table = new THREE.Mesh(

new THREE.CylinderGeometry(5,5,0.6,64),

new THREE.MeshStandardMaterial({color:0x0b5d0b})

);

table.position.y = 0.6;

scene.add(table);

//
// seats
//

const seats = [

[0,0,7],
[6,0,4],
[6,0,-4],
[0,0,-7],
[-6,0,-4],
[-6,0,4]

];

seats.forEach(pos=>{

const seat = new THREE.Mesh(

new THREE.BoxGeometry(1.4,0.6,1.4),

new THREE.MeshStandardMaterial({color:0x333333})

);

seat.position.set(pos[0],0.3,pos[2]);

scene.add(seat);

});

//
// render loop
//

function animate(){

requestAnimationFrame(animate);

renderer.render(scene,camera);

}

animate();

//
// resize
//

window.addEventListener("resize",()=>{

camera.aspect = window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>
