  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }
    #hud { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 10; display: flex; gap: 10px; align-items: center; justify-content: space-between; pointer-events: none; }
    .pill { background: rgba(0,0,0,.55); border: 1px solid rgba(0,255,204,.35); backdrop-filter: blur(8px); border-radius: 999px; padding: 8px 12px; color: #e9fffb; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); pointer-events: none; }
    .btn { pointer-events: auto; border: 1px solid rgba(0,255,204,.45); background: rgba(0,0,0,.55); color: #fff; border-radius: 999px; padding: 8px 12px; cursor: pointer; user-select: none; }
    .btn:hover { background: rgba(0,80,70,.55); }
    #sceneMenuToggle { position: fixed; left: 12px; bottom: 12px; z-index: 14; pointer-events: auto; border: 1px solid rgba(120,255,186,.55); background: rgba(2,10,8,.78); color: #eafff4; border-radius: 999px; padding: 10px 14px; cursor: pointer; box-shadow: 0 10px 28px rgba(0,0,0,.35); font-weight: 900; }
    #sceneNav { position: fixed; left: 12px; bottom: 58px; z-index: 12; display: none; flex-direction: column; gap: 8px; pointer-events: auto; max-height: 60vh; overflow: auto; padding: 10px; border: 1px solid rgba(120,255,186,.26); border-radius: 18px; background: rgba(0,0,0,.64); backdrop-filter: blur(8px); }
    body.svr-nav-open #sceneNav { display: flex; }
    .scene-btn { border: 1px solid rgba(120,255,186,.42); background: rgba(2,10,8,.72); color: #eafff4; border-radius: 999px; padding: 8px 12px; cursor: pointer; box-shadow: 0 10px 28px rgba(0,0,0,.35); font-size: 12px; text-align: left; min-width: 148px; }
    .scene-btn:hover { background: rgba(10,48,33,.72); }
    body.preview-mode #sceneNav, body.preview-mode #sceneMenuToggle, body.preview-mode #desktopHint { display:none !important; }
    #desktopHint { position: fixed; right: 12px; bottom: 12px; z-index: 13; pointer-events: none; background: rgba(0,0,0,.52); border: 1px solid rgba(180,140,255,.34); color: rgba(245,240,255,.82); border-radius: 999px; padding: 8px 12px; font-size: 11px; font-weight: 800; letter-spacing: .03em; }
    #log { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10; max-height: 38vh; overflow: auto; display: none; background: rgba(0,0,0,.55); border: 1px solid rgba(0,255,204,.25); border-radius: 14px; padding: 10px 12px; color: #d7fff8; font: 12px/1.35 ui-monospace, monospace; white-space: pre-wrap; }
    #err { position: fixed; inset: 0; display: none; z-index: 50; background: rgba(0,0,0,.88); color: #fff; padding: 18px; font: 13px/1.45 ui-monospace, monospace; overflow: auto; }
    body.preview-mode #hud, body.preview-mode #log, body.preview-mode #err { display: none !important; }
    #splash, #vr-loading-screen { position: fixed; inset: 0; z-index: 999999; display: grid; place-items: center; background: radial-gradient(circle at 50% 22%, rgba(0,255,255,.18), transparent 24%), radial-gradient(circle at 70% 68%, rgba(188,0,221,.16), transparent 34%), #030307; transition: opacity .60s cubic-bezier(.25,1,.5,1), visibility .60s cubic-bezier(.25,1,.5,1); pointer-events: auto; }
    body.svr-ready #splash, body.svr-ready #vr-loading-screen { opacity: 0; visibility: hidden; pointer-events: none; }
    body.preview-mode #splash, body.preview-mode #vr-loading-screen { display: none !important; }
    .splash-card { width: min(620px, calc(100vw - 36px)); border: 2px solid #00ffff; border-radius: 30px; padding: 30px; background: linear-gradient(180deg, rgba(3,3,7,.96), rgba(5,8,15,.86)); box-shadow: inset 0 0 18px rgba(0,255,255,.16), 0 0 42px rgba(0,255,255,.22), 0 28px 90px rgba(0,0,0,.78); color: #fff; text-align: center; }
    .splash-logo { width: 132px; height: 132px; object-fit: contain; filter: drop-shadow(0 0 28px rgba(0,255,255,.62)); animation: svrPulse 2.6s ease-in-out infinite; }
    .splash-title { margin: 10px 0 4px; font-size: clamp(34px, 7vw, 62px); font-weight: 950; letter-spacing: .13em; color: #00ffff; text-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff; }
    .splash-sub { color: #ffffff; font-weight: 500; font-size: 15px; letter-spacing: .26em; text-transform: uppercase; }
    .splash-step { display:inline-block; min-height: 22px; margin-top: 24px; color: #fff; font-size: 14px; font-weight: 900; letter-spacing:.11em; text-transform:uppercase; background:rgba(0,255,255,.10); border:2px solid #00ffff; border-radius:999px; padding:10px 24px; box-shadow: inset 0 0 12px rgba(0,255,255,.20), 0 0 15px rgba(0,255,255,.15); }
    .splash-bar { width:min(420px,82vw); height: 10px; overflow: hidden; border-radius: 999px; border: 2px solid #ffffff; background: #101020; margin: 20px auto 12px; box-shadow: 0 0 20px rgba(0,255,255,.20); }
    .splash-fill { height: 100%; width: 4%; border-radius: inherit; background: linear-gradient(90deg, #00ffff, #bc00dd); box-shadow: 0 0 18px rgba(0,255,255,.70); transition: width .15s ease-out; }
    .splash-hint { color: rgba(255,255,255,.74); font-size: 12px; line-height: 1.45; }
    .splash-build { margin-top: 12px; color: rgba(255,255,255,.50); font: 11px/1.3 ui-monospace, monospace; }
    @keyframes svrPulse { 0%,100% { transform: scale(1); opacity: .92; } 50% { transform: scale(1.035); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .splash-logo { animation: none; } #splash, #vr-loading-screen, .splash-fill { transition: none; } }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<body>
  <div id="splash" aria-live="polite">
    <div class="splash-card">
      <img class="splash-logo" src="./assets/ui/logo.png" alt="SVR" onerror="this.onerror=null;this.src='./logo.png';">
      <div class="splash-title">SCARLETT VR</div>
      <div class="splash-sub">POKER LOBBY</div>
      <div class="splash-step" id="splashStep">INITIALIZING CORE ENGINE...</div>
      <div class="splash-bar"><div class="splash-fill" id="splashFill"></div></div>
      <div class="splash-hint" id="splashHint">High-contrast pipeline loader active. Graphics warm up before entry.</div>
      <div class="splash-build" id="splashBuild">LOBBY-ORG-1-5A-PIPELINE-LOADER</div>
    </div>
  </div>
  <div id="app"></div>
  <div id="hud"><div class="pill" id="status">Booting Lobby Organization 1.5A...</div><div style="display:flex;gap:8px;align-items:center;"><button class="btn" id="toggleLog" title="Show/Hide logs">Logs</button><button class="btn" id="toggleJoints" title="Toggle joint debug spheres">Joints</button><span class="pill" id="mode">Hands: ...</span><span class="pill">BUILD: LOBBY-ORG-1-5A</span></div></div>
  <button id="sceneMenuToggle" type="button">Destinations ▾</button>
  <div id="sceneNav"><button class="scene-btn" data-scene="lobby">Lobby</button><button class="scene-btn" data-scene="seat">Seat</button><button class="scene-btn" data-scene="reiki">Reiki</button><button class="scene-btn" data-scene="reikiRoom">Reiki Room</button><button class="scene-btn" data-scene="reikiTalk">Reiki Talk</button><button class="scene-btn" data-scene="pgaDrive">PGA Drive</button><button class="scene-btn" data-scene="chipPutt">Chip/Putt</button><button class="scene-btn" data-scene="vrStore">VR Store</button><button class="scene-btn" data-scene="smokerLounge">Smoker</button><button class="scene-btn" data-scene="scorpionRoom">Scorpion Room</button><button class="scene-btn" data-scene="pga">PGA</button><button class="scene-btn" data-scene="legends">Legend</button><button class="scene-btn" data-scene="sponsor">Sponsor</button><button class="scene-btn" data-scene="scorpion">Scorpion</button></div>
  <div id="desktopHint">Desktop carousel: [ previous  ] next  Enter action</div>
  <pre id="log"></pre><pre id="err"></pre>
  <script>
    (function(){
      const step = () => document.getElementById('splashStep');
      const fill = () => document.getElementById('splashFill');
      window.updateLoadingProgress = function(percent, stageText){
        const p = Math.min(Math.max(parseInt(percent || 0), 0), 100);
        const f = fill(); const s = step();
        if (f) f.style.width = p + '%';
        if (s) s.textContent = `${String(stageText || 'LOADING').toUpperCase()}: ${p}%`;
        window.SVR_LOADER_ASSETS_DONE = p >= 100;
      };
      window.signalPipelineReady = function(){
        window.SVR_LOADER_PIPELINE_DONE = true;
        const s = step(); if (s) { s.style.borderColor = '#00ff00'; s.style.color = '#00ff00'; s.style.boxShadow = '0 0 18px #00ff00'; s.textContent = 'ALL SYSTEMS NOMINAL - ENTERING LOBBY'; }
      };
    })();
    document.getElementById('sceneMenuToggle')?.addEventListener('click',()=>document.body.classList.toggle('svr-nav-open'));
    function activeCarousel(){
      if (window.SVR_PGA_INTERACTION_ACTIVE && window.SVR_PGA_CAROUSEL_14) return { label:'PGA Golf', api: window.SVR_PGA_CAROUSEL_14 };
      if (window.SVR_STORE_INTERACTION_ACTIVE && window.SVR_STORE_CAROUSEL_12) return { label:'SVR Store', api: window.SVR_STORE_CAROUSEL_12 };
      if (window.SVR_REIKI_INTERACTION_ACTIVE && window.SVR_RICI_UPDATE_101_CAROUSEL) return { label:'Reiki', api: window.SVR_RICI_UPDATE_101_CAROUSEL };
      return null;
    }
    window.addEventListener('keydown', (e)=>{
      if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
      const tag = (document.activeElement?.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      const target = activeCarousel();
      if (!target) return;
      if (e.code === 'BracketLeft' || e.code === 'Comma') { target.api.prev?.(); e.preventDefault(); }
      if (e.code === 'BracketRight' || e.code === 'Period') { target.api.next?.(); e.preventDefault(); }
      if (e.code === 'Enter' || e.code === 'Space') { target.api.activate?.(); e.preventDefault(); }
      const status = document.getElementById('status');
      if (status) status.textContent = `${target.label}: keyboard carousel control`;
    });
  </script>
  <script type="module" src="./main.js?v=lobby-org-1-5a-pipeline-loader"></script>
</body>
</html>
