<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SVR Poker Game</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}
</style>

</head>

<body>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js"
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js"
import { FBXLoader } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/FBXLoader.js"

const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.1,
1000
)

camera.position.set(0,1.6,4)

const renderer = new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

const light = new THREE.DirectionalLight(0xffffff,1)
light.position.set(5,10,5)
scene.add(light)

const ambient = new THREE.AmbientLight(0x888888)
scene.add(ambient)

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(50,50),
new THREE.MeshStandardMaterial({color:0x222222})
)

floor.rotation.x = -Math.PI/2
scene.add(floor)

const gltfLoader = new GLTFLoader()
const fbxLoader = new FBXLoader()

/* load poker table */

gltfLoader.load(
"assets/models/table.glb",
(model)=>{
model.scene.scale.set(1,1,1)
model.scene.position.set(0,0,0)
scene.add(model.scene)
}
)

/* load player */

gltfLoader.load(
"assets/models/player.glb",
(model)=>{
model.scene.position.set(0,0,-3)
scene.add(model.scene)
}
)

/* load npc */

fbxLoader.load(
"assets/models/npc_sitting.fbx",
(model)=>{
model.scale.set(.01,.01,.01)
model.position.set(2,0,0)
scene.add(model)
}
)

/* moon */

fbxLoader.load(
"assets/models/moon.fbx",
(model)=>{
model.scale.set(.02,.02,.02)
model.position.set(0,10,-20)
scene.add(model)
}
)

function animate(){
requestAnimationFrame(animate)
renderer.render(scene,camera)
}

animate()

</script>

</body>
</html>
