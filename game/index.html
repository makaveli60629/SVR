<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SVR Poker</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}
</style>

</head>

<body>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js"
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js"
import { FBXLoader } from "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/FBXLoader.js"

const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.1,
1000
)

camera.position.set(0,1.6,4)

const renderer = new THREE.WebGLRenderer({antialias:true})
renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

const light = new THREE.DirectionalLight(0xffffff,1)
light.position.set(5,10,5)
scene.add(light)

const ambient = new THREE.AmbientLight(0x666666)
scene.add(ambient)

/* floor */

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(100,100),
new THREE.MeshStandardMaterial({color:0x222222})
)

floor.rotation.x = -Math.PI/2
scene.add(floor)

/* loaders */

const gltfLoader = new GLTFLoader()
const fbxLoader = new FBXLoader()
const texLoader = new THREE.TextureLoader()

/* table texture */

const felt = texLoader.load("assets/texture/tablefelt.png")

/* TABLE */

gltfLoader.load(
"assets/models/table.glb",
(gltf)=>{

gltf.scene.traverse((child)=>{
if(child.isMesh){
child.material.map = felt
}
})

gltf.scene.scale.set(.01,.01,.01)
scene.add(gltf.scene)

}
)

/* PLAYER */

gltfLoader.load(
"assets/models/player.glb",
(gltf)=>{
gltf.scene.scale.set(.01,.01,.01)
gltf.scene.position.set(0,0,-3)
scene.add(gltf.scene)
}
)

/* NPC */

fbxLoader.load(
"assets/models/npc_sitting.fbx",
(fbx)=>{
fbx.scale.set(.01,.01,.01)
fbx.position.set(2,0,0)
scene.add(fbx)
}
)

/* MOON */

fbxLoader.load(
"assets/models/moon.fbx",
(fbx)=>{
fbx.scale.set(.02,.02,.02)
fbx.position.set(0,15,-40)
scene.add(fbx)
}
)

function animate(){
requestAnimationFrame(animate)
renderer.render(scene,camera)
}

animate()

</script>

</body>
</html>
