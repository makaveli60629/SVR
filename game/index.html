<html>

<head>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>

<a-scene>

<a-sky color="#000"></a-sky>

<!-- PLAYER -->

<a-entity
camera
position="0 1.6 3"
look-controls
wasd-controls>
</a-entity>

<!-- FLOOR -->

<a-plane
rotation="-90 0 0"
width="40"
height="40"
color="#111">
</a-plane>

<!-- POKER TABLE -->

<a-cylinder
position="0 1 0"
radius="1.6"
height="0.2"
color="#065f3b">
</a-cylinder>

<a-cylinder
position="0 0.5 0"
radius="0.3"
height="1"
color="#333">
</a-cylinder>

<!-- CHAIRS -->

<a-cylinder position="1.5 0.5 -1" radius="0.4" height="0.6" color="#222"></a-cylinder>
<a-cylinder position="-1.5 0.5 -1" radius="0.4" height="0.6" color="#222"></a-cylinder>
<a-cylinder position="1.5 0.5 1" radius="0.4" height="0.6" color="#222"></a-cylinder>
<a-cylinder position="-1.5 0.5 1" radius="0.4" height="0.6" color="#222"></a-cylinder>

<!-- NPC PLACEHOLDER -->

<a-sphere
position="1.5 1.3 -1"
radius="0.3"
color="#888">
</a-sphere>

<!-- MOON -->

<a-sphere
position="0 20 -30"
radius="4"
color="#ddd">
</a-sphere>

<!-- TELEPORT RING -->

<a-ring
position="0 0.01 3"
rotation="-90 0 0"
radius-inner="0.4"
radius-outer="0.6"
color="#9c27ff">
</a-ring>

</a-scene>

</body>

</html>
