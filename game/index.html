<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>SVR Poker</title>

<style>

body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

#title{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:10;
}

</style>
</head>

<body>

<div id="title">SVR Poker Multiplayer Client</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

import { createTable } from "./scripts/table.js";
import { initSeats } from "./scripts/seat-system.js";

import { initHands } from "./systems/hands.js";
import { initTeleport } from "./systems/teleport.js";
import { initPoker } from "./systems/poker.js";

//
// Scene
//

const scene = new THREE.Scene();

//
// Camera
//

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,10,16);
camera.lookAt(0,0,0);

//
// Renderer
//

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

//
// Lighting
//

const ambient = new THREE.AmbientLight(0xffffff,1);
scene.add(ambient);

const light = new THREE.PointLight(0xffffff,3);
light.position.set(10,20,10);
scene.add(light);

//
// Floor
//

const floor = new THREE.Mesh(

new THREE.PlaneGeometry(200,200),

new THREE.MeshStandardMaterial({color:0x111111})

);

floor.rotation.x = -Math.PI/2;

scene.add(floor);

//
// Table
//

createTable(scene);

//
// Seats
//

initSeats(scene);

//
// Systems
//

initHands(scene);
initTeleport(scene,camera);
initPoker(scene);

//
// Render loop
//

function animate(){

requestAnimationFrame(animate);

renderer.render(scene,camera);

}

animate();

//
// Resize
//

window.addEventListener("resize",()=>{

camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>
