<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVR Cyberpunk Rooftop</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
body{margin:0;background:black}

#hud{
position:absolute;
top:10px;
left:10px;
color:white;
padding:10px;
border-radius:10px;
background:rgba(0,0,0,.6);
border:1px solid #7b3cff;
font-family:Arial
}
</style>
</head>

<body>

<div id="hud">
SVR Engine v2<br>
WASD = Move<br>
Mouse = Look<br>
T = Teleport
</div>

<a-scene background="color:#02030a">

<a-assets>
<img id="logo" src="/logo.png">
</a-assets>

<a-sky color="#030312"></a-sky>

<!-- moon -->
<a-sphere position="0 30 -80"
radius="7"
color="#dde1ff"
emissive="#dde1ff">
</a-sphere>

<!-- rooftop floor -->
<a-plane
rotation="-90 0 0"
width="120"
height="120"
color="#090914">
</a-plane>

<!-- poker table -->
<a-cylinder
position="0 1 -6"
radius="2"
height=".3"
color="#147a46">
</a-cylinder>

<a-cylinder
position="0 .5 -6"
radius=".3"
height="1"
color="#333">
</a-cylinder>

<a-torus
position="0 1.05 -6"
rotation="90 0 0"
radius="2.1"
radius-tubular=".05"
color="#7b3cff">
</a-torus>

<!-- hologram logo -->
<a-plane
position="0 18 -40"
width="12"
height="6"
material="src:#logo; transparent:true">
</a-plane>

<!-- player -->
<a-entity id="rig" position="0 1.6 -3">
<a-camera wasd-controls look-controls></a-camera>
</a-entity>

<a-entity id="city"></a-entity>

</a-scene>

<script>

const city = document.querySelector("#city")

for(let i=0;i<50;i++){

let b=document.createElement("a-box")

let x=(Math.random()*120)-60
let z=(Math.random()*120)-60
let h=15+Math.random()*50

b.setAttribute("position",x+" "+h/2+" "+z)
b.setAttribute("width",4+Math.random()*6)
b.setAttribute("depth",4+Math.random()*6)
b.setAttribute("height",h)
b.setAttribute("color","#0c0d18")

city.appendChild(b)
}

const scene=document.querySelector("a-scene")

for(let i=0;i<300;i++){

let p=document.createElement("a-sphere")

let x=(Math.random()*90)-45
let z=(Math.random()*90)-45
let y=Math.random()*60

p.setAttribute("position",x+" "+y+" "+z)
p.setAttribute("radius",".04")

p.setAttribute(
"color",
Math.random()>.5?"#7b3cff":"#33d6ff"
)

p.setAttribute(
"animation",
"property:position; to:"+x+" -5 "+z+
"; loop:true; dur:"+(3000+Math.random()*4000)
)

scene.appendChild(p)
}

</script>

</body>
</html>
