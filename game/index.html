<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>ScarlettVR Poker • Phase 95 Site Store Android Boot Lock</title>
  <meta name="theme-color" content="#050508"/>
  <link rel="manifest" href="./manifest.json"/>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }
    #hud {
      position: fixed; left: 12px; right: 12px; top: 12px; z-index: 10;
      display: flex; gap: 10px; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .pill {
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(180,140,255,.35);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      padding: 8px 12px;
      color: #e9e9ff;
      font-size: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      pointer-events: none;
    }
    .btn {
      pointer-events: auto;
      border: 1px solid rgba(180,140,255,.45);
      background: rgba(0,0,0,.55);
      color: #fff;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
    }
    .btn:hover { background: rgba(60,40,90,.55); }
    #sceneNav{
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 12;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center;
      pointer-events: auto;
    }
    .scene-btn{
      border: 1px solid rgba(120,255,186,.42);
      background: rgba(2,10,8,.62);
      color: #eafff4;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
      font-size: 12px;
      min-height: 42px;
      touch-action: manipulation;
    }
    .scene-btn:hover{ background: rgba(10,48,33,.72); }
    body.preview-mode #sceneNav { display:none !important; }
    #log {
      position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10;
      max-height: 38vh; overflow: auto; display: none;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(180,140,255,.25);
      border-radius: 14px;
      padding: 10px 12px;
      color: #d7d7ff;
      font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      white-space: pre-wrap;
    }
    #err {
      position: fixed; inset: 0; display: none; z-index: 50;
      background: rgba(0,0,0,.88);
      color: #fff;
      padding: 18px;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      overflow: auto;
    }
    #bootGuard{
      position:fixed; inset:0; z-index:40;
      display:grid; place-items:center;
      background:
        radial-gradient(circle at 18% 22%, rgba(105,232,255,.18), transparent 34%),
        radial-gradient(circle at 78% 72%, rgba(255,91,233,.16), transparent 32%),
        #020205;
      color:#fff;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #bootGuard.is-hidden{opacity:0; visibility:hidden; pointer-events:none;}
    .boot-card{
      width:min(560px, calc(100vw - 32px));
      border:1px solid rgba(180,140,255,.35);
      border-radius:28px;
      background:rgba(5,5,14,.86);
      box-shadow:0 30px 110px rgba(0,0,0,.72);
      padding:24px;
      text-align:center;
      backdrop-filter: blur(18px);
    }
    .boot-title{font-weight:900; letter-spacing:.08em; text-transform:uppercase; margin:0 0 8px;}
    .boot-sub{color:#d8d2ff; margin:0 0 16px; line-height:1.45;}
    .boot-actions{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:16px;}
    .boot-actions a,.boot-actions button{
      min-height:42px; border-radius:999px; border:1px solid rgba(105,232,255,.36);
      color:#fff; background:rgba(105,232,255,.10); padding:9px 14px;
      text-decoration:none; font-weight:800; cursor:pointer;
    }
    .boot-actions .primary{background:linear-gradient(135deg,rgba(255,91,233,.88),rgba(92,72,255,.88));}
    .boot-progress{height:8px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.12);}
    .boot-progress span{display:block; height:100%; width:38%; border-radius:inherit; background:linear-gradient(90deg,#69e8ff,#ff5be9); animation:svrBoot 1.45s ease-in-out infinite alternate;}
    @keyframes svrBoot{from{transform:translateX(-20%); width:34%;}to{transform:translateX(165%); width:42%;}}
    body.preview-mode #hud,
    body.preview-mode #log,
    body.preview-mode #err { display: none !important; }
    @media(max-width:640px){
      #hud{left:8px; right:8px; top:calc(8px + env(safe-area-inset-top,0px)); gap:6px;}
      .pill,.btn,.scene-btn{font-size:11px; padding:8px 10px;}
      #sceneNav{left:8px; right:8px; bottom:calc(8px + env(safe-area-inset-bottom,0px));}
      .boot-card{padding:18px; border-radius:22px;}
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div id="bootGuard" role="status" aria-live="polite">
    <div class="boot-card">
      <h1 class="boot-title">Booting SVR Poker</h1>
      <p class="boot-sub" id="bootGuardText">Loading world modules, hands, controller fallback, watch, and portal routes.</p>
      <div class="boot-progress" aria-hidden="true"><span></span></div>
      <div class="boot-actions" id="bootGuardActions" style="display:none">
        <button class="primary" type="button" onclick="location.reload()">Reload Game</button>
        <a href="../site/index.html">Open Site</a>
        <a href="./index.html?preview=1&cam=director&autocam=1">Preview Mode</a>
      </div>
    </div>
  </div>

  <div id="hud">
    <div class="pill" id="status">Booting…</div>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="btn" id="toggleLog" title="Show/Hide logs">Logs</button>
      <button class="btn" id="toggleJoints" title="Toggle joint debug spheres">Joints</button>
      <span class="pill" id="mode">Hands: …</span>
      <span class="pill">BUILD: PHASE-95-SITE-STORE-ANDROID-BOOT-LOCK</span>
    </div>
  </div>

  <div id="sceneNav">
    <button class="scene-btn" data-scene="lobby">Lobby</button>
    <button class="scene-btn" data-scene="table">Table</button>
    <button class="scene-btn" data-scene="seat">Seat</button>
    <button class="scene-btn" data-scene="reiki">Reiki Hub</button>
    <button class="scene-btn" data-scene="reikiRoom">Reiki Room</button>
    <button class="scene-btn" data-scene="pga">PGA Hub</button>
    <button class="scene-btn" data-scene="pgaDrive">PGA Drive</button>
    <button class="scene-btn" data-scene="chipPutt">Chip/Putt</button>
    <button class="scene-btn" data-scene="store">VR Store</button>
    <button class="scene-btn" data-scene="lounge">Lounge</button>
    <button class="scene-btn" data-scene="loungeRoom">Lounge Room</button>
    <button class="scene-btn" data-scene="legends">Legend</button>
    <button class="scene-btn" data-scene="sponsor">Sponsor</button>
    <button class="scene-btn" data-scene="scorpion">Scorpion</button>
  </div>

  <pre id="log"></pre>
  <pre id="err"></pre>

  <script>
    window.__SVR_BOOT = { ready:false, stage:'html', startedAt:Date.now() };
    window.svrBootStage = function(stage){
      window.__SVR_BOOT.stage = stage;
      const el = document.getElementById('bootGuardText');
      if (el) el.textContent = stage;
    };
    window.svrBootReady = function(){
      window.__SVR_BOOT.ready = true;
      window.__SVR_BOOT.stage = 'ready';
      const guard = document.getElementById('bootGuard');
      if (guard) guard.classList.add('is-hidden');
    };
    window.addEventListener('error', function(event){
      const text = document.getElementById('bootGuardText');
      const actions = document.getElementById('bootGuardActions');
      if (!window.__SVR_BOOT.ready && text) text.textContent = 'Boot error: ' + (event.message || 'Unknown runtime error');
      if (!window.__SVR_BOOT.ready && actions) actions.style.display = 'flex';
    });
    window.addEventListener('unhandledrejection', function(event){
      const text = document.getElementById('bootGuardText');
      const actions = document.getElementById('bootGuardActions');
      const reason = event.reason && (event.reason.message || event.reason.stack || String(event.reason));
      if (!window.__SVR_BOOT.ready && text) text.textContent = 'Boot promise error: ' + (reason || 'Unknown module error');
      if (!window.__SVR_BOOT.ready && actions) actions.style.display = 'flex';
    });
    window.setTimeout(function(){
      if (window.__SVR_BOOT.ready) return;
      const text = document.getElementById('bootGuardText');
      const actions = document.getElementById('bootGuardActions');
      if (text) text.textContent = 'Still loading: ' + (window.__SVR_BOOT.stage || 'module startup') + '. Check connection/CDN or use preview mode.';
      if (actions) actions.style.display = 'flex';
    }, 9500);
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
