<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVR Poker Cyberpunk District</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>

<style>
body{margin:0;background:black}
</style>

</head>

<body>

<a-scene fog="type: exponential; color:#120018; density:0.02" background="color:black">

<a-assets>
<img id="logo" src="./assets/logo.png">
</a-assets>

<!-- Star sky -->
<a-sky color="#000"></a-sky>

<!-- rain -->
<a-entity particle-system="preset:rain;particleCount:3000;color:#66ccff"></a-entity>

<!-- lights -->
<a-entity light="type:ambient;intensity:1"></a-entity>
<a-entity light="type:point;color:#8a2be2;intensity:5;distance:120" position="0 40 -20"></a-entity>

<!-- player rig -->
<a-entity position="0 1.6 6" rotation="0 180 0">

<a-camera></a-camera>

<a-entity hand-controls="hand:left"></a-entity>
<a-entity hand-controls="hand:right"></a-entity>

</a-entity>

<!-- plaza -->
<a-plane rotation="-90 0 0" width="200" height="200" color="#111"></a-plane>

<!-- poker table -->
<a-cylinder position="0 0.9 0" radius="1.6" height="1" color="#0b5e2b"></a-cylinder>

<!-- chairs -->
<a-cylinder position="2.6 0.6 0" radius="0.4" height="1" color="#222"></a-cylinder>
<a-cylinder position="-2.6 0.6 0" radius="0.4" height="1" color="#222"></a-cylinder>
<a-cylinder position="0 0.6 2.6" radius="0.4" height="1" color="#222"></a-cylinder>
<a-cylinder position="0 0.6 -2.6" radius="0.4" height="1" color="#222"></a-cylinder>

<!-- skyline -->
<a-box position="-50 40 -60" width="20" height="80" depth="20" color="#090909"></a-box>
<a-box position="50 50 -70" width="24" height="100" depth="24" color="#0b0b0b"></a-box>
<a-box position="-80 35 -80" width="18" height="70" depth="18" color="#090909"></a-box>
<a-box position="80 45 -90" width="22" height="90" depth="22" color="#0b0b0b"></a-box>

<!-- SVR tower -->
<a-box position="0 70 -50" width="24" height="140" depth="24" color="#000"></a-box>

<!-- tower logo -->
<a-image src="#logo"
position="0 70 -37"
width="20"
height="10"
material="emissive:#00ffff; emissiveIntensity:1">
</a-image>

<!-- hologram -->
<a-entity position="0 140 -50"
animation="property: rotation; to:0 360 0; loop:true; dur:20000">

<a-image src="#logo"
width="24"
height="24"
material="opacity:0.8; emissive:#00ffff">

</a-image>

</a-entity>

<!-- earth -->
<a-sphere
position="120 100 -220"
radius="40"
color="#2244ff"
animation="property: rotation; to:0 360 0; loop:true; dur:120000">

</a-sphere>

<!-- drones -->
<a-sphere
color="#ff00ff"
radius="0.5"
position="0 80 -20"
animation="property: position; to:30 80 -60; dir:alternate; loop:true; dur:6000">

</a-sphere>

<a-sphere
color="#00ffff"
radius="0.5"
position="-20 70 -30"
animation="property: position; to:-40 70 -80; dir:alternate; loop:true; dur:7000">

</a-sphere>

</a-scene>

</body>
</html>
