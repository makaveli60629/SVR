  <script>
    (function(){
      const params = new URLSearchParams(location.search);
      const ua = navigator.userAgent || "";
      const android = /Android/i.test(ua);
      const quest = /Quest|Oculus|Meta Quest/i.test(ua);
      const preview = window.self !== window.top || params.has("preview") || params.has("live") || params.get("cam") === "director";
      const alreadyAndroid = /\/android\.html$/i.test(location.pathname);
      if(android && !quest && !preview && !alreadyAndroid && !params.has("standard") && !params.has("desktop")){
        window.SVR_ANDROID_REDIRECTING = true;
        location.replace(`./android.html${location.search || "?channel=stable"}`);
      }
    })();
  </script>

</head>
