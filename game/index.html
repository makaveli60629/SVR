<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SVR Poker Stable Test</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000}
    #hud{
      position:fixed;left:16px;bottom:16px;z-index:10;
      color:#fff;background:rgba(20,10,40,.75);
      padding:10px 12px;border-radius:12px;
      border:1px solid rgba(160,90,255,.5);
      font:14px Arial,sans-serif
    }
  </style>
</head>
<body>
  <div id="hud">SVR Stable Test • WASD move • Mouse look</div>

  <a-scene background="color:#0a0a12">
    <a-entity light="type:ambient;intensity:1"></a-entity>
    <a-entity light="type:directional;intensity:1.2" position="3 6 2"></a-entity>

    <a-sky color="#090916"></a-sky>
    <a-plane rotation="-90 0 0" width="60" height="60" color="#14141c"></a-plane>

    <!-- table -->
    <a-cylinder position="0 0.75 0" radius="1.1" height="0.12" color="#0c6b46"></a-cylinder>
    <a-cylinder position="0 0.35 0" radius="0.14" height="0.8" color="#3a2b1f"></a-cylinder>

    <!-- npc marker -->
    <a-box position="1.8 1 -0.4" width="0.5" height="1.6" depth="0.4" color="#4c3d63"></a-box>

    <!-- player -->
    <a-entity position="0 1.6 5">
      <a-camera wasd-controls look-controls></a-camera>
    </a-entity>
  </a-scene>
</body>
</html>
