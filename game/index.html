<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
  <title>SVR Poker • PHASE-101V-SAFE-LOADER-BRIDGE-LOCK</title>
  <meta name="theme-color" content="#050508"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <link rel="manifest" href="./manifest.json?v=phase101v"/>
  <style>
    :root{color-scheme:dark;--cyan:#7ffcff;--gold:#ffd98a;--bg:#02040b;--purple:#b55cff}
    html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overscroll-behavior:none;touch-action:none}
    #app{position:fixed;inset:0;background:radial-gradient(circle at 50% 42%,rgba(127,252,255,.12),#02040b 48%,#000 100%)}canvas{display:block;width:100%;height:100%;background:#000;outline:none;touch-action:none}
    #safeStage{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,rgba(127,252,255,.14),rgba(5,5,18,.96) 48%,#000 100%)}.safe-card{width:min(92vw,720px);border:1px solid rgba(127,252,255,.72);border-radius:22px;background:rgba(0,0,0,.68);box-shadow:0 0 42px rgba(127,252,255,.20);padding:26px;text-align:center}.safe-card h1{margin:6px 0 8px;font-size:clamp(34px,7vw,72px);letter-spacing:.04em}.safe-card h2{margin:0 0 14px;color:var(--cyan);font-size:clamp(16px,3vw,28px)}.safe-card p{color:#d7eaff}.pill{display:inline-block;border:1px solid var(--gold);border-radius:999px;color:var(--gold);padding:7px 12px;font-weight:900;font-size:12px;letter-spacing:.08em}.btn{display:inline-flex;align-items:center;justify-content:center;margin:6px;border:1px solid rgba(255,217,138,.65);border-radius:12px;background:rgba(255,217,138,.12);color:#ffd98a;padding:10px 14px;font-weight:900;text-decoration:none;cursor:pointer}.btn.cyan{border-color:rgba(127,252,255,.68);color:#bffcff;background:rgba(127,252,255,.10)}#bootFallback{display:none!important;opacity:0!important;pointer-events:none!important}.phase-label,#sceneNav,#log,#err,#hud{display:none!important}.boot-released #safeStage{opacity:0;pointer-events:none;transition:opacity .25s ease}.runtime-visible #safeStage{display:none!important}
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body data-build="PHASE-101V-SAFE-LOADER-BRIDGE-LOCK">
  <div id="app"></div>
  <div id="safeStage">
    <section class="safe-card">
      <span class="pill">PHASE 101V ACTIVE</span>
      <h1>SVR POKER</h1>
      <h2>Safe Loader Bridge</h2>
      <p id="safeStatus">Starting lobby and Quest portal bridge...</p>
      <div>
        <button class="btn cyan" id="startRuntimeBtn" type="button">Start Lobby Now</button>
        <button class="btn" id="clearCacheBtn" type="button">Clear Game Cache</button>
        <a class="btn" href="./index.html?v=phase101v-safe-loader-manual">Reload Fresh</a>
      </div>
    </section>
  </div>
  <div id="bootFallback"></div><div id="hud"><span id="status"></span><span id="mode"></span><button id="toggleLog" type="button">Log</button><button id="toggleJoints" type="button">Joints</button></div><div id="sceneNav"></div><pre id="log"></pre><pre id="err"></pre>
  <script>
    (function(){
      var BUILD='PHASE-101V-SAFE-LOADER-BRIDGE-LOCK';
      var loaded=false;
      var status=document.getElementById('safeStatus');
      window.SVR_PHASE101V_BOOT={build:BUILD,active:true,loaded:false,errors:[],startedAt:new Date().toISOString()};
      function note(msg){ if(status) status.textContent=msg; window.SVR_PHASE101V_BOOT.lastMessage=msg; window.SVR_PHASE101V_BOOT.checkedAt=new Date().toISOString(); }
      function release(reason){ document.body.classList.add('boot-released','runtime-visible'); window.__SVR_GAME_READY__=true; window.SVR_GAME_READY=true; window.SVR_PHASE101V_BOOT.released=true; window.SVR_PHASE101V_BOOT.reason=reason; window.SVR_PHASE101V_BOOT.releasedAt=new Date().toISOString(); }
      window.SVR_RELEASE_BOOT=release;
      async function clearBrowserCaches(){try{if(navigator.serviceWorker){var regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(function(r){return r.unregister();}));window.SVR_PHASE101V_BOOT.serviceWorkersUnregistered=regs.length;}}catch(e){window.SVR_PHASE101V_BOOT.swError=String(e.message||e);}try{if(window.caches){var keys=await caches.keys();await Promise.all(keys.map(function(k){return caches.delete(k);}));window.SVR_PHASE101V_BOOT.cachesDeleted=keys.length;}}catch(e){window.SVR_PHASE101V_BOOT.cacheError=String(e.message||e);}}
      function addModule(src){ return new Promise(function(resolve,reject){ var s=document.createElement('script'); s.type='module'; s.src=src; s.onload=resolve; s.onerror=function(){reject(new Error('Failed '+src));}; document.body.appendChild(s); }); }
      async function startRuntime(){
        if(loaded) return; loaded=true; window.SVR_PHASE101V_BOOT.loaded=true;
        note('Starting SVR safe loader bridge...');
        try{
          await addModule('./phase101_boot_load_screen_recovery.js?v=phase101v');
          await addModule('./phase101_partial_runtime_render_guard.js?v=phase101v');
          await addModule('./phase101_render_marker_cleanup.js?v=phase101v');
          await addModule('./main.js?v=phase101v');
          setTimeout(function(){ addModule('./phase260_roman_canopy_archway_final_lock.js?v=phase101v').catch(function(e){window.SVR_PHASE101V_BOOT.errors.push(String(e.message||e));}); },500);
          setTimeout(function(){ addModule('./phase101s_finished_lobby_lock.js?v=phase101v').catch(function(e){window.SVR_PHASE101V_BOOT.errors.push(String(e.message||e));}); },950);
          setTimeout(function(){ addModule('./phase101t_lobby_interaction_portal_qa_lock.js?v=phase101v').catch(function(e){window.SVR_PHASE101V_BOOT.errors.push(String(e.message||e));}); },1450);
          setTimeout(function(){ addModule('./phase101v_safe_loader_bridge.js?v=phase101v').catch(function(e){window.SVR_PHASE101V_BOOT.errors.push(String(e.message||e));}); },1950);
          note('Safe loader bridge launched. Releasing boot screen...');
          setTimeout(function(){ release('phase101v-safe-loader-bridge'); },900);
        }catch(e){window.SVR_PHASE101V_BOOT.errors.push(String(e.message||e));note('Runtime module failed, showing boot-safe fallback...');try{await addModule('./phase101_boot_load_screen_recovery.js?v=phase101v-fallback');}catch(_e){}setTimeout(function(){release('phase101v-fallback-after-error');},900);}
      }
      document.getElementById('startRuntimeBtn').addEventListener('click', startRuntime);
      document.getElementById('clearCacheBtn').addEventListener('click', async function(){ note('Clearing cache...'); await clearBrowserCaches(); note('Cache cleared. Starting safe loader bridge...'); startRuntime(); });
      window.addEventListener('error',function(e){window.SVR_PHASE101V_BOOT.errors.push(String(e.message||e.error||e)); release('error-release');});
      window.addEventListener('unhandledrejection',function(e){window.SVR_PHASE101V_BOOT.errors.push(String((e.reason&&e.reason.message)||e.reason||e)); release('promise-release');});
      clearBrowserCaches().finally(function(){note('Cache checked. Starting safe loader bridge...'); setTimeout(startRuntime,350);});
      setTimeout(function(){if(!window.__SVR_RENDERER__&&!window.__SVR_SCENE__) startRuntime();},1800);
      setTimeout(function(){release('absolute-release');},5200);
    })();
  </script>
</body>
</html>
