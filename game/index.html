    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; background: #000; outline: none; }
    #hud { position: fixed; left: 12px; right: 12px; top: 12px; z-index: 10; display: flex; gap: 10px; align-items: center; justify-content: space-between; pointer-events: none; }
    .pill { background: rgba(0,0,0,.68); border: 1px solid rgba(246,226,127,.65); backdrop-filter: blur(5px); border-radius: 999px; padding: 8px 12px; color: #fff7be; font-size: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); pointer-events: none; }
    .btn { pointer-events: auto; border: 1px solid rgba(246,226,127,.70); background: rgba(0,0,0,.66); color: #fff; border-radius: 999px; padding: 8px 12px; cursor: pointer; user-select: none; }
    .btn:hover { background: rgba(90,68,20,.66); }
    #sceneNav{ position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 12; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; pointer-events: auto; }
    .scene-btn{ border: 1px solid rgba(246,226,127,.70); background: rgba(3,9,20,.72); color: #fff7be; border-radius: 999px; padding: 8px 12px; cursor: pointer; box-shadow: 0 10px 28px rgba(0,0,0,.35); font-size: 12px; font-weight:800; }
    .scene-btn:hover{ background: rgba(60,48,18,.72); }
    body.preview-mode #sceneNav { display:none !important; }
    #log { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10; max-height: 38vh; overflow: auto; display: none; background: rgba(0,0,0,.55); border: 1px solid rgba(246,226,127,.55); border-radius: 14px; padding: 10px 12px; color: #fff7be; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; white-space: pre-wrap; }
    #err { position: fixed; inset: 0; display: none; z-index: 50; background: rgba(0,0,0,.88); color: #fff; padding: 18px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; overflow: auto; }
    body.preview-mode #hud, body.preview-mode #log, body.preview-mode #err { display: none !important; }
  </style>
