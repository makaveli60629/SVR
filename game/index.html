<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<title>SVR Poker VR</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:10;
}
</style>

</head>

<body>

<div id="ui">
SVR Poker Multiplayer Client
</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.set(0,2,5);
camera.lookAt(0,0,0);

scene.background = new THREE.Color(0x000000);

const light = new THREE.PointLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff,0.6);
scene.add(ambient);

//
// FLOOR
//

const floor = new THREE.Mesh(
new THREE.PlaneGeometry(80,80),
new THREE.MeshStandardMaterial({color:0x111111})
);

floor.rotation.x = -Math.PI/2;
scene.add(floor);

//
// POKER TABLE
//

const table = new THREE.Mesh(
new THREE.CylinderGeometry(2.2,2.2,0.35,64),
new THREE.MeshStandardMaterial({color:0x0b5d0b})
);

table.position.y = 0.2;
scene.add(table);

//
// SEATS
//

const seatPositions = [

[0,0,3],
[2.5,0,1.5],
[2.5,0,-1.5],
[0,0,-3],
[-2.5,0,-1.5],
[-2.5,0,1.5]

];

seatPositions.forEach(pos=>{

const seat = new THREE.Mesh(

new THREE.BoxGeometry(0.6,0.3,0.6),
new THREE.MeshStandardMaterial({color:0x444444})

);

seat.position.set(pos[0],0.15,pos[2]);

scene.add(seat);

});

//
// CHICAGO SKYLINE
//

for(let i=0;i<50;i++){

const height = Math.random()*8 + 2;

const building = new THREE.Mesh(

new THREE.BoxGeometry(
Math.random()*2+1,
height,
Math.random()*2+1
),

new THREE.MeshStandardMaterial({color:0x111144})

);

building.position.set(

(Math.random()-0.5)*70,
height/2,
(Math.random()-0.5)*70

);

scene.add(building);

}

//
// MOON
//

const moon = new THREE.Mesh(

new THREE.SphereGeometry(2,32,32),
new THREE.MeshBasicMaterial({color:0xffffff})

);

moon.position.set(15,18,-30);
scene.add(moon);

//
// ANIMATION
//

function animate(){

requestAnimationFrame(animate);

renderer.render(scene,camera);

}

animate();

//
// RESIZE HANDLING
//

window.addEventListener("resize",()=>{

camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>
