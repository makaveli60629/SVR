<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVR Poker</title>

<script src="https://unpkg.com/aframe@1.4.2/dist/aframe.min.js"></script>

<style>
html,body{
margin:0;
background:black;
}
#loader{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-family:Arial;
background:black;
z-index:9999;
}
</style>

</head>

<body>

<div id="loader">Loading SVR Poker…</div>

<a-scene background="color:black">

<a-entity light="type:ambient;intensity:1"></a-entity>

<a-box position="0 1 -4" color="#8A2BE2"></a-box>

<a-plane rotation="-90 0 0"
width="50"
height="50"
color="#111">
</a-plane>

<a-sky color="#000"></a-sky>

</a-scene>

<script>
window.addEventListener("load",()=>{
document.getElementById("loader").style.display="none";
});
</script>

</body>
</html>
