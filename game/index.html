<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVR Rooftop Casino</title>

<link rel="icon" type="image/png" href="/logo.png">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
body{
margin:0;
background:black;
font-family:Arial;
}
</style>
</head>

<body>

<a-scene>

<!-- LIGHTING -->
<a-entity light="type:ambient; intensity:0.7"></a-entity>
<a-entity light="type:directional; intensity:1" position="2 4 1"></a-entity>

<!-- SKY -->
<a-sky color="#02030a"></a-sky>

<!-- MOON -->
<a-sphere position="0 25 -40" radius="4" color="#ccccff" emissive="#8888ff"></a-sphere>

<!-- ROOFTOP FLOOR -->
<a-plane rotation="-90 0 0"
width="80"
height="80"
color="#101018">
</a-plane>

<!-- POKER TABLE -->
<a-cylinder
position="0 1 -4"
radius="1.8"
height="0.4"
color="#0a5c2e">
</a-cylinder>

<!-- COMMUNITY CARDS -->
<a-plane position="-0.8 1.25 -4" width="0.5" height="0.7" color="#ffffff"></a-plane>
<a-plane position="-0.4 1.25 -4" width="0.5" height="0.7" color="#ffffff"></a-plane>
<a-plane position="0 1.25 -4" width="0.5" height="0.7" color="#ffffff"></a-plane>
<a-plane position="0.4 1.25 -4" width="0.5" height="0.7" color="#ffffff"></a-plane>
<a-plane position="0.8 1.25 -4" width="0.5" height="0.7" color="#ffffff"></a-plane>

<!-- SKYLINE BLOCKS -->
<a-box position="-10 8 -30" width="6" height="16" depth="6" color="#111"></a-box>
<a-box position="-4 6 -28" width="5" height="12" depth="5" color="#151515"></a-box>
<a-box position="4 7 -32" width="6" height="14" depth="6" color="#111"></a-box>
<a-box position="10 9 -34" width="5" height="18" depth="5" color="#111"></a-box>

<!-- PARTICLES -->
<a-entity id="particles"></a-entity>

<!-- PLAYER -->
<a-entity id="rig" position="0 1.6 4">

<a-camera wasd-controls look-controls></a-camera>

</a-entity>

</a-scene>

<script>

const container=document.querySelector("#particles")

for(let i=0;i<60;i++){

let p=document.createElement("a-sphere")

p.setAttribute("radius","0.03")
p.setAttribute("color","#b26cff")

let x=(Math.random()*8)-4
let z=(Math.random()*8)-4
let y=Math.random()*2+1

p.setAttribute("position",`${x} ${y} ${z}`)

p.setAttribute("animation",`
property: position;
to: ${x} ${y+3} ${z};
loop: true;
dur: 4000;
dir: alternate
`)

container.appendChild(p)

}

</script>

</body>
</html>
