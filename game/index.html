<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SVR Poker | Phase 102 Seat Fit + Real Eric</title>
  <meta name="description" content="Phase 101 fits the real table against the real Eric dealer reference while keeping the stable Quest controller baseline." />
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    body.vr-mode .a-enter-vr-button { display: none !important; }
    body.vr-mode .hud, body.vr-mode .overlay, body.vr-mode .ui-panel { display: none !important; }
  </style>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/loaders/FBXLoader.js"></script>
</head>
<body>
  <a-scene renderer="antialias: false; colorManagement: true; physicallyCorrectLights: false; highRefreshRate: false"
           xr-mode-ui="enabled: true"
           background="color: #020208"
           phase102-vr-cleanup>

    <a-assets timeout="20000">
      <a-asset-item id="tableGlb" src="./assets/models/table.glb"></a-asset-item>
      <img id="tableFelt" src="./assets/texture/tablefelt_custom_phase100.png" crossorigin="anonymous" />
    </a-assets>

    <a-entity light="type: ambient; intensity: 1.0; color: #cad5ff"></a-entity>
    <a-entity light="type: directional; intensity: 0.34; color: #ffffff" position="-2 4 1"></a-entity>
    <a-sky color="#03040a"></a-sky>

    <a-entity id="rig" position="0 0.0 1.02" rotation="0 180 0" phase102-rig>
      <a-entity id="camera" camera look-controls wasd-controls="enabled: true; acceleration: 22" position="0 1.40 0"></a-entity>
      <a-entity id="leftHand" laser-controls="hand: left" line="color: #7fd6ff"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" line="color: #d08cff"></a-entity>
    </a-entity>

    <a-plane rotation="-90 0 0" width="24" height="24" color="#15161f"></a-plane>

    <a-entity id="cam3Rig" position="0 2.2 0" animation="property: rotation; from: 0 0 0; to: 0 360 0; loop: true; dur: 28000; easing: linear">
      <a-entity id="camera3" camera="active: false" position="0 0 4.2" look-controls="enabled: false"></a-entity>
    </a-entity>

    <a-entity id="roomShell">
      <a-cylinder position="0 1.72 0" radius="9" height="3.44" color="#0a0c18" open-ended="true" side="back"></a-cylinder>
      <a-ring position="0 3.39 0" rotation="-90 0 0" radius-inner="8.68" radius-outer="8.98" color="#8746ff"></a-ring>
    </a-entity>

    <a-entity id="tableRoot" position="0 0 0">
      <a-entity id="realTable" gltf-model="#tableGlb" phase102-table-fit></a-entity>
      <a-plane id="feltTop" visible="false" rotation="-90 0 0" material="src: #tableFelt; shader: standard; transparent: false; side: double"></a-plane>
    </a-entity>

    <a-entity id="dealerAnchor" position="0 0 -0.86" phase102-dealer-loader></a-entity>
  </a-scene>
  <script src="./main.js"></script>
</body>
</html>
