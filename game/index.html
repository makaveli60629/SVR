<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVR Poker Engine</title>

<!-- stable CDN -->
<script src="https://unpkg.com/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>

<style>
html,body{
margin:0;
background:black;
}

#loader{
position:fixed;
top:0;
left:0;
right:0;
bottom:0;
background:black;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial;
font-size:24px;
z-index:9999;
}
</style>
</head>

<body>

<div id="loader">Loading Scarlett VR Poker...</div>

<a-scene
background="color:black"
fog="type:exponential; color:#120018; density:0.02"
renderer="antialias:true">

<!-- ASSETS -->
<a-assets timeout="20000">

<video
id="matrixVideo"
src="./assets/video/matrix-rain.mp4"
autoplay
loop
muted
playsinline
webkit-playsinline
preload="auto">
</video>

<img id="logo" src="./assets/logo.png">

<img id="floor" src="./assets/textures/floor.png">
<img id="wall" src="./assets/textures/wall.png">
<img id="windows" src="./assets/textures/windows.png">

</a-assets>

<!-- LIGHTING -->
<a-entity light="type:ambient; intensity:1"></a-entity>
<a-entity light="type:point; color:#8a2be2; intensity:4; distance:40" position="0 3 0"></a-entity>

<!-- PARTICLES -->
<a-entity particle-system="preset:dust; color:#a020f0,#6a0dad; particleCount:1500; size:2; opacity:0.4"></a-entity>

<!-- FLOOR -->
<a-plane src="#floor" rotation="-90 0 0" width="400" height="400"></a-plane>

<!-- PLAYER -->
<a-entity position="0 1.6 60" rotation="0 180 0">
<a-camera></a-camera>
</a-entity>

<!-- TABLE -->
<a-cylinder position="0 0.9 0" radius="5" height="1" color="#0b5e2b"></a-cylinder>

<!-- CHAIRS -->
<a-cylinder position="8 0.6 0" radius="0.7" height="1" color="#222"></a-cylinder>
<a-cylinder position="-8 0.6 0" radius="0.7" height="1" color="#222"></a-cylinder>
<a-cylinder position="0 0.6 8" radius="0.7" height="1" color="#222"></a-cylinder>
<a-cylinder position="0 0.6 -8" radius="0.7" height="1" color="#222"></a-cylinder>

<!-- WALLS -->
<a-box src="#wall" position="0 15 -100" width="200" height="30" depth="1"></a-box>
<a-box src="#wall" position="0 15 100" width="200" height="30" depth="1"></a-box>
<a-box src="#wall" position="-100 15 0" width="1" height="30" depth="200"></a-box>
<a-box src="#wall" position="100 15 0" width="1" height="30" depth="200"></a-box>

<!-- MATRIX TOWER -->
<a-box
position="0 220 -260"
width="120"
height="420"
depth="120"
material="src:#matrixVideo; shader:flat">
</a-box>

<!-- LOGO -->
<a-image
src="#logo"
position="0 220 -200"
width="120"
height="120">
</a-image>

<!-- HOLOGRAM -->
<a-entity position="0 420 -260"
animation="property: rotation; to:0 360 0; loop:true; dur:25000">

<a-image src="#logo"
width="180"
height="180"
material="opacity:0.85; emissive:#00ffff">
</a-image>

</a-entity>

<!-- BUILDINGS -->
<a-box src="#windows" position="-260 180 -300" width="160" height="360" depth="160"></a-box>
<a-box src="#windows" position="260 180 -300" width="160" height="360" depth="160"></a-box>

<!-- MOON -->
<a-sphere
position="420 300 -500"
radius="70"
color="#ddd"
material="emissive:#ffffff; emissiveIntensity:0.35">
</a-sphere>

</a-scene>

<script>
window.addEventListener("load", () => {
document.getElementById("loader").style.display="none";
});
</script>

</body>
</html>
