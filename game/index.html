    .btn { pointer-events: auto; border: 1px solid rgba(180,140,255,.45); background: rgba(0,0,0,.55); color: #fff; border-radius: 999px; padding: 8px 12px; cursor: pointer; user-select: none; }
    .btn:hover { background: rgba(60,40,90,.55); }
    #sceneNav{ position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 12; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; pointer-events: auto; }
    .scene-btn{ border: 1px solid rgba(120,255,186,.42); background: rgba(2,10,8,.62); color: #eafff4; border-radius: 999px; padding: 8px 12px; cursor: pointer; box-shadow: 0 10px 28px rgba(0,0,0,.35); font-size: 12px; }
    .scene-btn:hover{ background: rgba(10,48,33,.72); }
    body.preview-mode #sceneNav { display:none !important; }
    body.svr-low-perf .pill, body.svr-low-perf .btn, body.svr-low-perf .scene-btn { box-shadow: none; backdrop-filter: none; }
    #log { position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 10; max-height: 38vh; overflow: auto; display: none; background: rgba(0,0,0,.55); border: 1px solid rgba(180,140,255,.25); border-radius: 14px; padding: 10px 12px; color: #d7d7ff; font: 12px/1.35 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; white-space: pre-wrap; }
    #err { position: fixed; inset: 0; display: none; z-index: 50; background: rgba(0,0,0,.88); color: #fff; padding: 18px; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; overflow: auto; }
    body.preview-mode #hud, body.preview-mode #log, body.preview-mode #err { display: none !important; }
    #hardHoloButton{position:fixed;right:14px;top:62px;z-index:2147483000;border:1px solid rgba(246,226,127,.95);background:linear-gradient(135deg,rgba(88,24,150,.96),rgba(208,92,255,.96));color:#fff;border-radius:999px;padding:13px 18px;font-weight:1000;letter-spacing:.04em;box-shadow:0 0 34px rgba(208,92,255,.55);cursor:pointer;pointer-events:auto}
    #hardHoloOverlay{position:fixed;inset:0;z-index:2147483001;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 34%,rgba(208,92,255,.22),rgba(0,0,0,.58) 62%,rgba(0,0,0,.82));color:#fff;pointer-events:auto}
    #hardHoloOverlay.open{display:flex}.hard-holo-panel{width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;border:1px solid rgba(246,226,127,.72);border-radius:30px;background:linear-gradient(135deg,rgba(4,7,18,.97),rgba(43,9,82,.97));box-shadow:0 0 90px rgba(208,92,255,.36);padding:22px}.hard-holo-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}.hard-holo-title{font-size:clamp(30px,5vw,58px);font-weight:1000;line-height:1}.hard-holo-sub{color:#7ff5c7;font-weight:900;letter-spacing:.12em;font-size:12px;margin-bottom:6px}.hard-holo-close{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:12px 16px;font-weight:1000;cursor:pointer}.hard-holo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.hard-holo-card{min-height:96px;border:1px solid rgba(180,140,255,.55);background:linear-gradient(135deg,rgba(127,245,199,.10),rgba(208,92,255,.18));color:#fff;border-radius:18px;padding:14px;text-align:left;cursor:pointer}.hard-holo-card:hover{outline:2px solid #f6e27f;background:linear-gradient(135deg,rgba(208,92,255,.38),rgba(127,245,199,.14))}.hard-holo-card b{display:block;font-size:22px}.hard-holo-card span{display:block;margin-top:7px;font-size:12px;color:#7ff5c7;font-weight:900;text-transform:uppercase}.hard-holo-status{margin-top:14px;color:#f6e27f;font-weight:1000}@media(max-width:740px){.hard-holo-grid{grid-template-columns:1fr 1fr}.hard-holo-panel{padding:16px}}@media(max-width:460px){.hard-holo-grid{grid-template-columns:1fr}}

  <script>
    (function(){
      const overlay = document.getElementById('hardHoloOverlay');
      const btn = document.getElementById('hardHoloButton');
      const status = document.getElementById('hardHoloStatus');
      function setOpen(open){ overlay.classList.toggle('open', !!open); overlay.setAttribute('aria-hidden', open ? 'false' : 'true'); window.SVR_HARD_HOLO_OPEN = !!open; }
      function toggle(){ setOpen(!overlay.classList.contains('open')); }
      window.SVR_HARD_OPEN_HOLOGRAM = () => setOpen(true);
      window.SVR_HARD_CLOSE_HOLOGRAM = () => setOpen(false);
      window.SVR_HARD_TOGGLE_HOLOGRAM = toggle;
      btn.addEventListener('click', toggle);
      overlay.addEventListener('click', (e)=>{
        if (e.target === overlay || e.target.closest('[data-hard-close]')) { setOpen(false); return; }
        const route = e.target.closest('[data-hard-route]');
        if (route){ window.location.href = route.dataset.hardRoute; return; }
        const act = e.target.closest('[data-hard-action]');
        if (act){
          const a = act.dataset.hardAction;
          if (a === 'seat') { window.dispatchEvent(new KeyboardEvent('keydown', { code:'KeyJ' })); status.textContent = 'Seat command sent.'; }
          else if (a === 'call') { window.dispatchEvent(new KeyboardEvent('keydown', { code:'KeyC' })); status.textContent = 'Check/Call command sent.'; }
          else if (a === 'fold') { window.dispatchEvent(new KeyboardEvent('keydown', { code:'KeyF' })); status.textContent = 'Fold command sent.'; }
          else if (a === 'teleport') { window.dispatchEvent(new KeyboardEvent('keydown', { code:'KeyT' })); status.textContent = 'Teleport toggle command sent.'; }
        }
      });
      window.addEventListener('keydown', (e)=>{ if (e.code === 'KeyG' && !e.repeat) toggle(); if (e.code === 'Escape') setOpen(false); }, true);
      window.SVR_PHASE93_GAME_ENTRY = { phase:'PHASE-93-LAZY-GEOMETRIC-TEXTURE-TABLE', ready:true, appElementExists: !!document.getElementById('app') };
    })();
  </script>
