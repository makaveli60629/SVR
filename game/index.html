  <style>
    html,body{height:100%;margin:0;background:#000;color:#fff;overflow:hidden;font-family:system-ui,Arial,sans-serif;touch-action:none}#app{position:fixed;inset:0;background:#02040b}canvas{display:block;width:100%;height:100%;background:#000;outline:none}#safeStage{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#000}.safe-card{width:min(92vw,720px);border:1px solid rgba(127,252,255,.72);border-radius:22px;background:rgba(0,0,0,.72);box-shadow:0 0 42px rgba(127,252,255,.20);padding:26px;text-align:center}.safe-card h1{margin:6px 0 8px;font-size:clamp(34px,7vw,72px);letter-spacing:.04em}.safe-card h2{margin:0 0 14px;color:#7ffcff;font-size:clamp(16px,3vw,28px)}.safe-card p{color:#d7eaff}.pill{display:inline-block;border:1px solid #ffd98a;border-radius:999px;color:#ffd98a;padding:7px 12px;font-weight:900;font-size:12px;letter-spacing:.08em}.btn{display:inline-flex;align-items:center;justify-content:center;margin:6px;border:1px solid rgba(255,217,138,.65);border-radius:12px;background:rgba(255,217,138,.12);color:#ffd98a;padding:10px 14px;font-weight:900;text-decoration:none;cursor:pointer}.btn.cyan{border-color:rgba(127,252,255,.68);color:#bffcff;background:rgba(127,252,255,.10)}#bootFallback{display:none!important;opacity:0!important;pointer-events:none!important}.phase-label,#sceneNav,#log,#err,#hud{display:none!important}.boot-released #safeStage,.runtime-visible #safeStage,.overlay-released #safeStage{display:none!important;opacity:0!important;visibility:hidden!important;pointer-events:none!important}

<body data-build="PHASE-103-QUEST-CONTROL-VIEW-POLISH-LOCK" data-player-facing-build="SCARLETT-POKER-VR-CLEAN-LOBBY">
  <div id="app"></div>
  <div id="safeStage"><section class="safe-card"><span class="pill">SCARLETT POKER VR</span><h1>SCARLETT POKER VR</h1><h2>Luxury Lobby</h2><p id="safeStatus">Loading Scarlett Poker VR lobby...</p><div><button class="btn cyan" id="startRuntimeBtn" type="button">Start Lobby Now</button><a class="btn" href="./index.html?v=phase103-manual-refresh">Reload Fresh</a></div></section></div>
  <div id="bootFallback"></div><div id="hud"><span id="status"></span><span id="mode"></span><button id="toggleLog" type="button">Log</button><button id="toggleJoints" type="button">Joints</button></div><div id="sceneNav"></div><pre id="log"></pre><pre id="err"></pre>
  <script>
    (function(){
      var BUILD='PHASE-103-QUEST-CONTROL-VIEW-POLISH-LOCK';var loaded=false;var status=document.getElementById('safeStatus');
      window.SVR_PHASE103_BOOT={build:BUILD,active:true,loaded:false,errors:[],startedAt:new Date().toISOString(),quickLoad:true,oldPhaseVisualStack:false,playerFacingPhaseText:false,questControlFix:true};
      function note(msg){if(status)status.textContent=msg;window.SVR_PHASE103_BOOT.lastMessage=msg;window.SVR_PHASE103_BOOT.checkedAt=new Date().toISOString();}
      function hideOverlay(reason){document.body.classList.add('boot-released','runtime-visible','overlay-released');var safe=document.getElementById('safeStage');if(safe){safe.style.display='none';safe.style.opacity='0';safe.style.visibility='hidden';safe.style.pointerEvents='none';safe.setAttribute('aria-hidden','true');}window.__SVR_GAME_READY__=true;window.SVR_GAME_READY=true;window.SVR_PHASE103_BOOT.overlayReleased=true;window.SVR_PHASE103_BOOT.reason=reason;window.SVR_PHASE103_BOOT.releasedAt=new Date().toISOString();}
      window.SVR_RELEASE_BOOT=hideOverlay;window.SVR_FORCE_HIDE_SAFE_STAGE=hideOverlay;
      function addModule(src){return new Promise(function(resolve,reject){var s=document.createElement('script');s.type='module';s.src=src;s.onload=resolve;s.onerror=function(){reject(new Error('Failed '+src));};document.body.appendChild(s);});}
      async function startRuntime(){if(loaded)return;loaded=true;window.SVR_PHASE103_BOOT.loaded=true;note('Preparing lobby...');try{
        await addModule('./phase101_boot_load_screen_recovery.js?v=phase103');
        await addModule('./phase101_partial_runtime_render_guard.js?v=phase103');
        await addModule('./phase101_render_marker_cleanup.js?v=phase103');
        await addModule('./main.js?v=phase103-quest-control-runtime');
        note('Opening lobby...');
        await addModule('./phase101t_lobby_interaction_portal_qa_lock.js?v=phase103-essential-portals');
        await addModule('./phase99_clean_expanded_lobby_rebuild_lock.js?v=phase103-clean-expanded-lobby');
        await addModule('./phase98_second_floor_safety_floor_lock.js?v=phase103-second-floor-after-cleanup');
        await addModule('./phase100_clean_lobby_acceptance_qa_lock.js?v=phase103-acceptance-qa');
        await addModule('./phase101_second_floor_visibility_final_qa_lock.js?v=phase103-final-visible-floor-qa');
        await addModule('./phase102_user_friendly_fast_launch_lock.js?v=phase103-no-visible-phase-text');
        await addModule('./phase103_view_polish_lock.js?v=phase103-view-lighting-textures');
        note('Lobby ready.');
        setTimeout(function(){hideOverlay('phase103-ready');},140);
      }catch(e){window.SVR_PHASE103_BOOT.errors.push(String(e.message||e));note('Lobby ready.');setTimeout(function(){hideOverlay('phase103-fallback-release');},500);}}
      document.getElementById('startRuntimeBtn').addEventListener('click',startRuntime);
      window.addEventListener('error',function(e){window.SVR_PHASE103_BOOT.errors.push(String(e.message||e.error||e));hideOverlay('error-release');});
      window.addEventListener('unhandledrejection',function(e){window.SVR_PHASE103_BOOT.errors.push(String((e.reason&&e.reason.message)||e.reason||e));hideOverlay('promise-release');});
      var overlayWatch=setInterval(function(){if(window.__SVR_RENDERER__||window.__SVR_SCENE__||document.querySelector('canvas')){hideOverlay('scene-or-canvas-detected');clearInterval(overlayWatch);}},250);
      setTimeout(startRuntime,120);
      setTimeout(function(){if(!window.__SVR_RENDERER__&&!window.__SVR_SCENE__)startRuntime();},850);
      setTimeout(function(){hideOverlay('absolute-overlay-release-1400ms');},1400);
    })();
  </script>
</body>
