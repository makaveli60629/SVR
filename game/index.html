<body style="margin:0;overflow:hidden;background:black;">

<div style="
position:absolute;
top:10px;
left:10px;
color:white;
font-family:Arial;
z-index:10;">
SVR Poker Multiplayer Client
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.161/build/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.set(0,3,6);

const light = new THREE.PointLight(0xffffff,2);
light.position.set(5,10,5);
scene.add(light);

const tableGeo = new THREE.CylinderGeometry(2,2,0.3,32);
const tableMat = new THREE.MeshStandardMaterial({color:0x006400});
const table = new THREE.Mesh(tableGeo,tableMat);
scene.add(table);

const floorGeo = new THREE.PlaneGeometry(50,50);
const floorMat = new THREE.MeshStandardMaterial({color:0x111111});
const floor = new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.2;
scene.add(floor);

function animate(){
requestAnimationFrame(animate);
renderer.render(scene,camera);
}

animate();

</script>

</body>
