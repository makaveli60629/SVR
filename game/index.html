<!DOCTYPE html>
<html>
<head>

<script src="./systems/hands.js"></script>
<script src="./systems/teleport.js"></script>
<script src="./systems/poker.js"></script>

</head>

<body>

<a-scene vr-hands teleport-system poker-table>

<a-sky color="#000"></a-sky>

<a-entity light="type:ambient; intensity:1"></a-entity>

          gltf-model="/assets/table.glb"
          scale="1 1 1">
</a-entity>

</a-scene>

</body>
</html>
