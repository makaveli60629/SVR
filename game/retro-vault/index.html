<!doctype html><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>Retro Vault Test</title><style>body{font-family:system-ui;margin:0;background:#070812;color:#fff}.w{max-width:720px;margin:auto;padding:20px}.b{text-align:center}.logo{font-size:42px;font-weight:900}.r{color:#25e7ff;text-shadow:2px 2px #ef35d4;font-style:italic}.v{display:block}.c{background:#111426;border:1px solid #2d3150;border-radius:18px;padding:18px;margin-top:18px}input,select,button{width:100%;margin-top:12px;min-height:50px;border-radius:12px;font-size:16px}button{border:0;background:linear-gradient(90deg,#ef35d4,#25e7ff);font-weight:900}#game{height:70vh;background:#000;border-radius:14px}#p{display:none}.small{color:#9aa1bd;font-size:12px;line-height:1.4}</style><div class='w'><section id='l'><div class='b'><div class='logo'><span class='r'>RETRO</span><span class='v'>VAULT</span></div><p class='small'>Android browser ROM test</p></div><div class='c'><input id='rom' type='file'><select id='sys'><option value='auto'>Auto detect</option><option value='nes'>NES</option><option value='snes'>SNES</option><option value='gb'>Game Boy / Color</option><option value='gba'>Game Boy Advance</option><option value='segaMD'>Genesis</option><option value='n64'>Nintendo 64</option><option value='nds'>Nintendo DS</option><option value='psx'>PlayStation</option><option value='psp'>PSP</option><option value='arcade'>Arcade</option></select><button id='go' disabled>START GAME</button><p id='st' class='small'>Choose a ROM you legally own. Start with a small NES, Game Boy, or GBA file for the quickest test.</p></div></section><section id='p'><button id='back'>← BACK</button><div id='game'></div></section></div><script>const $=x=>document.getElementById(x);let f=null;const ext={nes:['nes','fds'],snes:['sfc','smc'],gb:['gb','gbc'],gba:['gba'],segaMD:['gen','md','smd'],n64:['z64','n64','v64'],nds:['nds'],psx:['cue','chd','pbp','bin'],psp:['iso','cso'],arcade:['zip','7z']};function d(){let e=f.name.toLowerCase().split('.').pop();for(let k in ext)if(ext[k].includes(e))return k;return'arcade'}$('rom').onchange=e=>{f=e.target.files[0]||null;$('go').disabled=!f;if(f)$('st').textContent='Ready: '+f.name};$('go').onclick=()=>{if(!f)return;let core=$('sys').value==='auto'?d():$('sys').value;$('l').style.display='none';$('p').style.display='block';window.EJS_player='#game';window.EJS_core=core;window.EJS_gameName=f.name;window.EJS_gameUrl=URL.createObjectURL(f);window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';window.EJS_startOnLoaded=true;window.EJS_color='#25e7ff';let s=document.createElement('script');s.src='https://cdn.emulatorjs.org/stable/data/loader.js';s.onerror=()=>alert('Emulator engine failed to load. Check internet access.');document.body.appendChild(s)};$('back').onclick=()=>location.reload()</script>
