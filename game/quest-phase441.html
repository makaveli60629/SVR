<body data-build="PHASE-441-QUEST-TABLE-CLEARANCE-POLISH"><div id="status">Preparing Phase 441: approved Lab table, inset pass line, clear felt, and hip-height alignment…</div><script>
(async()=>{const status=document.getElementById('status'),query=new URLSearchParams(location.search),clean=query.get('clean')==='1';try{if(!clean){status.textContent='Clearing the previous Quest table/dealer/overlay cache…';try{if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(r=>r.unregister()))}}catch{}try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}}catch{}try{localStorage.setItem('svr_public_cache_epoch','phase441-quest-table-clearance');localStorage.setItem('svr_quest_cache_epoch','phase441-quest-table-clearance')}catch{}location.replace(`/game/quest-phase441.html?clean=1&t=${Date.now()}`);return}const target=new URL('/game/index.html',location.origin);target.searchParams.set('platform','quest');target.searchParams.set('v','phase441');target.searchParams.set('direct','1');target.searchParams.set('autoseat','1');target.searchParams.set('questfix','1');target.searchParams.set('seated','1');target.searchParams.set('teleport','off');target.searchParams.set('clean','1');target.searchParams.set('t',String(Date.now()));location.replace(target.pathname+target.search)}catch(error){console.error(error);status.textContent='Phase 441 Quest launcher recovery: reload this page once.'}})();
