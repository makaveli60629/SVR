<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>SVR Scorpion Table P91</title><style>html,body{height:100%;margin:0;background:#050308;color:#fff;overflow:hidden;font-family:system-ui,Arial,sans-serif}#app{position:fixed;inset:0}#hud{position:fixed;left:12px;top:12px;z-index:20;padding:10px 12px;border:1px solid #ff3d66;border-radius:12px;background:rgba(0,0,0,.72);font-size:13px;line-height:1.35;max-width:380px}#buttons{position:fixed;left:12px;bottom:12px;z-index:20;display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #7ffcff;background:#08131a;color:#fff;border-radius:10px;padding:9px 11px;font-weight:800}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="app"></div><div id="hud">Loading Phase 91...</div><div id="buttons"><button id="closer">Closer</button><button id="back">Back</button><button id="up">Up</button><button id="down">Down</button><button id="lock">Lock Seat</button><button id="newhand">New Hand</button></div><script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
const BUILD='PHASE-91-SCORPION-TABLE-INTERACTION-ACCURACY-LOCK';
const app=document.getElementById('app'), hud=document.getElementById('hud');
let scene,camera,renderer,room,tableObj,seat={forward:.42,height:0},locked=true;
init();
async function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x030407);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.03,100);camera.position.set(0,1.35,1.15);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;app.appendChild(renderer.domElement);document.body.appendChild(VRButton.createButton(renderer));window.__SVR_SCENE__=scene;window.__SVR_CAMERA__=camera;window.__SVR_RENDERER__=renderer;room=new THREE.Group();room.name='PHASE200_ORDERED_GRAND_LOBBY_ROOT';scene.add(room);buildRoom();await loadTable();fallback();seatMarker();window.SVR_LOCKED_FINAL_BUILD=BUILD;window.SVR_LIVE_BUILD_POINTER=BUILD;await import('./modules/p85_poker_truth_lock.js?v=phase91');await import('./modules/p89_surface_grab_lock.js?v=phase91');await import('./modules/p90_surface_polish_lock.js?v=phase91');await import('./modules/p91_interaction_accuracy_lock.js?v=phase91');reseat(true);wireButtons();addEventListener('resize',resize);renderer.setAnimationLoop(loop)}
function mat(c){return new THREE.MeshStandardMaterial({color:c,roughness:.75,metalness:.08,side:THREE.DoubleSide})}
function box(n,x,y,z,w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.name=n;m.position.set(x,y,z);room.add(m);return m}
function buildRoom(){box('SCORPION_FLOOR',0,-.04,0,10,.08,8,0x13060b);box('SCORPION_NORTH_WALL',0,2,-4,10,4,.14,0x08070b);box('SCORPION_SOUTH_WALL',0,2,4,10,4,.14,0x08070b);box('SCORPION_WEST_WALL',-5,2,0,.14,4,8,0x08070b);box('SCORPION_EAST_WALL',5,2,0,.14,4,8,0x08070b);box('SCORPION_BACK_PANEL',0,2.2,-3.9,4.4,1.2,.08,0x3b0712);box('SCORPION_TABLE_ZONE',0,.02,0,4.2,.04,2.4,0xb88a35);const hemi=new THREE.HemisphereLight(0xffd6dd,0x060004,.65);room.add(hemi);const key=new THREE.PointLight(0xffd6aa,1.65,16,2);key.position.set(0,4.2,1.2);room.add(key);const red=new THREE.PointLight(0xff2f5f,.85,12,2);red.position.set(0,3,-3);room.add(red)}
async function loadTable(){try{const fbx=await new Promise((res,rej)=>new FBXLoader().load('./assets/table.fbx',res,undefined,rej));fbx.name='PHASE159_ACTUAL_UPLOADED_TABLE_FBX_FLAT_SCALED';fbx.position.set(0,0,0);fbx.scale.setScalar(.01);room.add(fbx);tableObj=fbx;normalize()}catch(e){console.warn(e)}}
function fallback(){if(tableObj)return;const g=new THREE.Group();g.name='PHASE159_ACTUAL_UPLOADED_TABLE_FBX_FLAT_SCALED';room.add(g);g.add(box('FALLBACK_TABLE_TOP',0,.72,0,3.2,.12,1.65,0x101010));g.add(box('FALLBACK_TABLE_FELT',0,.79,0,2.65,.035,1.15,0x062014));tableObj=g}
function normalize(){const b=new THREE.Box3().setFromObject(tableObj),s=new THREE.Vector3();b.getSize(s);const scale=3.2/Math.max(.001,s.x);tableObj.scale.multiplyScalar(scale);tableObj.updateMatrixWorld(true);const b2=new THREE.Box3().setFromObject(tableObj),c2=new THREE.Vector3();b2.getCenter(c2);tableObj.position.x-=c2.x;tableObj.position.z-=c2.z;tableObj.position.y-=b2.min.y}
function tableInfo(){if(!tableObj)return null;tableObj.updateMatrixWorld(true);const b=new THREE.Box3().setFromObject(tableObj),s=new THREE.Vector3(),c=new THREE.Vector3();b.getSize(s);b.getCenter(c);return{b,s,c,top:b.max.y,halfZ:Math.max(.75,s.z*.5),halfX:Math.max(1.2,s.x*.5),playY:b.max.y-.152}}
function seatMarker(){const i=tableInfo();if(!i)return;const ring=new THREE.Mesh(new THREE.RingGeometry(.18,.21,32),new THREE.MeshBasicMaterial({color:0x7ffcff,side:THREE.DoubleSide}));ring.name='SCORPION_PLAYER_SEAT_RING';ring.rotation.x=-Math.PI/2;ring.position.set(i.c.x,.025,i.c.z+i.halfZ*.74);room.add(ring)}
function reseat(){const i=tableInfo();if(!i)return;const z=i.c.z+i.halfZ*(.72-seat.forward);const eye=new THREE.Vector3(i.c.x,i.top+1.02+seat.height,z);const target=new THREE.Vector3(i.c.x,i.top+.04,i.c.z-i.halfZ*.12);if(renderer.xr.isPresenting){camera.position.copy(eye)}else{camera.position.copy(eye);camera.lookAt(target)}window.SVR_SCORPION_SEAT={eye:{x:+eye.x.toFixed(2),y:+eye.y.toFixed(2),z:+eye.z.toFixed(2)},target:{x:+target.x.toFixed(2),y:+target.y.toFixed(2),z:+target.z.toFixed(2)},seat}}
function wireButtons(){document.getElementById('closer').onclick=()=>{seat.forward=Math.min(.68,seat.forward+.05);reseat()};document.getElementById('back').onclick=()=>{seat.forward=Math.max(.1,seat.forward-.05);reseat()};document.getElementById('up').onclick=()=>{seat.height=Math.min(.3,seat.height+.04);reseat()};document.getElementById('down').onclick=()=>{seat.height=Math.max(-.25,seat.height-.04);reseat()};document.getElementById('lock').onclick=()=>{locked=!locked};document.getElementById('newhand').onclick=()=>window.SVR_POKER_NEXT_HAND?.()}
function hudMsg(){const p=new THREE.Vector3();camera.getWorldPosition(p);const i=tableInfo();const a=window.SVR_PHASE91_INTERACTION||{};hud.innerHTML=`<b>${BUILD}</b><br>Seat lock: ${locked?'ON':'OFF'}<br>Camera: X ${p.x.toFixed(2)} Y ${p.y.toFixed(2)} Z ${p.z.toFixed(2)}<br>Surface: ${i?i.playY.toFixed(3):'waiting'}<br>Hover: ${a.hover||'-'}<br>Held: ${a.held||'-'}<br>Last release: ${a.lastRelease||'-'}<br>Last snap: ${a.lastSnap||'-'}<br>Audit: SVR_RUN_PHASE91_INTERACTION_AUDIT()`}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function loop(){if(locked&&!renderer.xr.isPresenting)reseat();hudMsg();renderer.render(scene,camera)}
</script></body></html>
