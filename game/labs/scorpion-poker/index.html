<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
<meta name="referrer" content="no-referrer" />
<title>SVR Scorpion Three-Hand Test</title>
<style>
:root{color-scheme:dark;--p:#9c5cff;--c:#78eaff;--g:#79f2ae}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020105;color:#fff;font-family:Inter,system-ui,sans-serif}#app{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#panel{position:fixed;z-index:20;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(620px,calc(100vw - 18px));padding:10px;border:1px solid #7140ac;border-radius:16px;background:rgba(7,4,12,.82);backdrop-filter:blur(12px);box-shadow:0 14px 50px #000b}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}.head strong{font-size:14px}.badge{font-size:9px;color:var(--g);border:1px solid #3b8d62;padding:5px 7px;border-radius:999px}.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.btn{min-height:42px;border:1px solid #8550c4;border-radius:11px;background:#1d0e2b;color:#fff;font-weight:900}.btn.ok{border-color:#49a875;color:#b5ffd2}.btn:disabled{opacity:.45}#status{margin-top:8px;padding:8px;border-radius:10px;background:#08050e;color:#d9cde9;font:10px/1.35 ui-monospace,monospace;min-height:30px}#gate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 30%,#251039,#050208 55%,#020104)}.gateCard{width:min(430px,94vw);padding:22px;border:1px solid #7444ad;border-radius:18px;background:#09050f}.gateCard h1{font-size:21px;margin:0 0 8px}.gateCard p{font-size:12px;color:#bbaed0;line-height:1.45}.gateCard input{width:100%;padding:13px;border:1px solid #7444ad;border-radius:10px;background:#0d0814;color:#fff}.gateCard button{width:100%;margin-top:9px;padding:12px;border:1px solid #8550c4;border-radius:10px;background:#211132;color:#fff;font-weight:900}#gateError{color:#ff91a1;font-size:11px;min-height:18px;margin-top:6px}@media(max-width:560px){.buttons{grid-template-columns:1fr 1fr}.buttons #vrMount{grid-column:1/-1}.head strong{font-size:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div>
<div id="gate"><div class="gateCard"><h1>SVR Scorpion Poker Test</h1><p>Private Oculus test: your seat + two bots + Eric as the house dealer. Uses the same temporary Dealer Lab key and remembered Oculus unlock.</p><input id="key" type="password" inputmode="numeric" placeholder="Test key" autocomplete="off"/><button id="unlock">Open Scorpion Test</button><div id="gateError"></div></div></div>
<div id="panel" style="display:none"><div class="head"><strong>SCORPION • THREE-HANDED TEST</strong><span class="badge">YOU + 2 BOTS • ERIC DEALER</span></div><div class="buttons"><button class="btn ok" id="startHandBtn">START HAND</button><button class="btn" id="resetBtn">RESET TABLE</button><div id="vrMount"></div></div><div id="status">Loading…</div></div>
<script type="module">
const HASH='15e2b0d3c33891ebb0f1ef609ec419420c20e320ce94c65fbc8c3312448eb225';
const REMEMBER='svrDealerLabRememberedV1';
const gate=document.getElementById('gate'),panel=document.getElementById('panel'),key=document.getElementById('key'),err=document.getElementById('gateError');
async function digest(text){const data=new TextEncoder().encode(text);const hash=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function remembered(){try{const r=JSON.parse(localStorage.getItem(REMEMBER)||'null');return r&&Number(r.expiresAt)>Date.now()}catch{return false}}
async function launch(){gate.style.display='none';panel.style.display='block';await import('./scorpion-threehand.js?v=phase436')}
async function unlock(){err.textContent='';if(await digest(key.value.trim())!==HASH){err.textContent='Key not accepted.';return}try{localStorage.setItem(REMEMBER,JSON.stringify({version:1,unlockedAt:Date.now(),expiresAt:Date.now()+30*24*60*60*1000}))}catch{}await launch()}
document.getElementById('unlock').addEventListener('click',unlock);key.addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});if(remembered())launch();else requestAnimationFrame(()=>key.focus());
</script>
</body></html>
