<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SVR Poker Android Responsive Tabletop</title>
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040a;color:#fff;font-family:system-ui,Arial}#androidTabletopFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#02040a}#phase389Loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#16393b,#07101a 46%,#02040a 82%);transition:.28s opacity}.card{width:min(430px,88vw);padding:22px;border:1px solid #7ffcff;border-radius:22px;background:#050a14ef;text-align:center;box-shadow:0 28px 90px #000}.card img{width:72px;height:72px;object-fit:contain}.card strong{display:block;color:#8dffb4;letter-spacing:.08em;margin-top:8px}.ready #phase389Loading{opacity:0;pointer-events:none}</style>
</head>
<body data-build="PHASE-389-ANDROID-RESPONSIVE-TABLE-LAYOUT-LOCK" data-predecessor="PHASE-385-ANDROID-ORIGINAL-TABLETOP-GYRO-UI-LOCK">
<div id="phase389Loading"><div class="card"><img src="/logo.png" alt="SVR Poker"><strong>PHASE 389 ANDROID TABLETOP</strong><p>Loading a responsive portrait and landscape table with larger actions, safe-area spacing, readable cards, compact seats, visible pot chips, and gyroscope view.</p></div></div>
<iframe id="androidTabletopFrame" title="SVR Poker Android game" allow="accelerometer; gyroscope; fullscreen" src="./android-stable.html?v=phase389&deploy=phase389&presentation=responsive-tabletop"></iframe>
<script>
(()=>{
const BUILD='PHASE-389-ANDROID-RESPONSIVE-TABLE-LAYOUT-LOCK';
const frame=document.getElementById('androidTabletopFrame');
const state={build:BUILD,frameLoads:0,baseCssInjected:false,responsiveCssInjected:false,tableModuleInjected:false,responsiveModuleInjected:false,orientationRelayed:false,lastError:null,checkedAt:null};
function addStyle(doc,id,href){if(doc.getElementById(id))return false;const link=doc.createElement('link');link.id=id;link.rel='stylesheet';link.href=href;doc.head.appendChild(link);return true}
function addModule(doc,id,src){if(doc.getElementById(id))return false;const script=doc.createElement('script');script.id=id;script.type='module';script.src=src;doc.body.appendChild(script);return true}
function inject(){
 try{
  const doc=frame.contentDocument;if(!doc?.head||!doc?.body)return;
  state.frameLoads++;
  state.baseCssInjected=addStyle(doc,'phase385AndroidTabletopCss','./styles/phase385_android_tabletop.css?v=phase389')||state.baseCssInjected;
  state.responsiveCssInjected=addStyle(doc,'phase389AndroidResponsiveCss','./styles/phase389_android_responsive_layout.css?v=phase389')||state.responsiveCssInjected;
  state.tableModuleInjected=addModule(doc,'phase385AndroidTabletopModule','./modules/phase385_android_tabletop_3d.js?v=phase389')||state.tableModuleInjected;
  state.responsiveModuleInjected=addModule(doc,'phase389AndroidResponsiveModule','./modules/phase389_android_responsive_layout.js?v=phase389')||state.responsiveModuleInjected;
  doc.body.dataset.presentationBuild=BUILD;
  const buildLabel=doc.querySelector('.build');if(buildLabel)buildLabel.textContent='PHASE 389 ANDROID RESPONSIVE TABLE';
  const gateStatus=doc.querySelector('#gateStatus');if(gateStatus)gateStatus.textContent='Responsive table, larger actions, compact seats, readable cards, pot chips, and gyro view ready.';
  document.body.classList.add('ready');state.checkedAt=new Date().toISOString();
 }catch(error){state.lastError=String(error?.stack||error?.message||error);state.checkedAt=new Date().toISOString()}
}
frame.addEventListener('load',()=>{setTimeout(inject,0);setTimeout(inject,250);setTimeout(inject,900)});
window.addEventListener('deviceorientation',event=>{try{frame.contentWindow?.dispatchEvent(new CustomEvent('svr:deviceorientation',{detail:{alpha:event.alpha,beta:event.beta,gamma:event.gamma,absolute:event.absolute}}));state.orientationRelayed=true}catch{}},{passive:true});
setTimeout(inject,700);
window.SVR_PHASE389_ANDROID_WRAPPER_QA=()=>{let frameUrl=frame.src,childQa=null;try{frameUrl=frame.contentWindow?.location?.href||frame.src;childQa=frame.contentWindow?.SVR_PHASE389_ANDROID_LAYOUT_QA?.()||null}catch{}return{...state,frameUrl,childQa,pass:Boolean(state.responsiveCssInjected&&state.responsiveModuleInjected),checkedAt:new Date().toISOString()}};
})();
</script>
</body>
</html>
