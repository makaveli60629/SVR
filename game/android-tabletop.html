<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>SVR Poker Android Tabletop</title>
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#02040a;color:#fff;font-family:system-ui,Arial}#androidTabletopFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#02040a}#phase385Loading{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#16393b,#07101a 46%,#02040a 82%);transition:.28s opacity}.card{width:min(420px,88vw);padding:22px;border:1px solid #7ffcff;border-radius:22px;background:#050a14ef;text-align:center;box-shadow:0 28px 90px #000}.card img{width:72px;height:72px;object-fit:contain}.card strong{display:block;color:#8dffb4;letter-spacing:.08em;margin-top:8px}.ready #phase385Loading{opacity:0;pointer-events:none}
</style>
</head>
<body data-build="PHASE-385-ANDROID-ORIGINAL-TABLETOP-GYRO-UI-LOCK">
<div id="phase385Loading"><div class="card"><img src="/logo.png" alt="SVR Poker"><strong>PHASE 385 ANDROID TABLETOP</strong><p>Loading the original SVR table, compact seats, larger cards, visible pot chips, and gyroscope view.</p></div></div>
<iframe id="androidTabletopFrame" title="SVR Poker Android game" allow="accelerometer; gyroscope; fullscreen" src="./android-stable.html?v=phase380&deploy=phase385&presentation=tabletop"></iframe>
<script>
(()=>{
const BUILD='PHASE-385-ANDROID-ORIGINAL-TABLETOP-GYRO-UI-LOCK';
const frame=document.getElementById('androidTabletopFrame');
const state={build:BUILD,frameLoads:0,cssInjected:false,moduleInjected:false,orientationRelayed:false,lastError:null,checkedAt:null};
function inject(){
  try{
    const doc=frame.contentDocument;
    if(!doc?.head||!doc?.body)return;
    state.frameLoads+=1;
    if(!doc.getElementById('phase385AndroidTabletopCss')){
      const link=doc.createElement('link');
      link.id='phase385AndroidTabletopCss';
      link.rel='stylesheet';
      link.href='./styles/phase385_android_tabletop.css?v=phase385';
      doc.head.appendChild(link);
      state.cssInjected=true;
    }
    if(!doc.getElementById('phase385AndroidTabletopModule')){
      const script=doc.createElement('script');
      script.id='phase385AndroidTabletopModule';
      script.type='module';
      script.src='./modules/phase385_android_tabletop_3d.js?v=phase385';
      doc.body.appendChild(script);
      state.moduleInjected=true;
    }
    doc.body.dataset.presentationBuild=BUILD;
    document.body.classList.add('ready');
    state.checkedAt=new Date().toISOString();
  }catch(error){
    state.lastError=String(error?.stack||error?.message||error);
    state.checkedAt=new Date().toISOString();
  }
}
frame.addEventListener('load',()=>{setTimeout(inject,0);setTimeout(inject,250)});
window.addEventListener('deviceorientation',event=>{
  try{
    frame.contentWindow?.dispatchEvent(new CustomEvent('svr:deviceorientation',{detail:{alpha:event.alpha,beta:event.beta,gamma:event.gamma,absolute:event.absolute}}));
    state.orientationRelayed=true;
  }catch{}
},{passive:true});
setTimeout(inject,900);
window.SVR_PHASE385_ANDROID_WRAPPER_QA=()=>({...state,frameUrl:frame.contentWindow?.location?.href||frame.src,childQa:frame.contentWindow?.SVR_PHASE385_ANDROID_TABLETOP_QA?.()||null,checkedAt:new Date().toISOString()});
})();
</script>
</body>
</html>
