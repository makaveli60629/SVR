<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SVR App Hub / Store Room</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="svr-phase" content="250-app-hub-store-room-stabilization" />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05010c;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    .fallback {
      position: fixed;
      left: 14px;
      bottom: 14px;
      z-index: 10;
      color: #ffffff;
      background: rgba(5,1,12,0.75);
      border: 1px solid rgba(159,252,255,0.42);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 13px;
      box-shadow: 0 0 22px rgba(125,250,255,0.18);
    }

    .fallback a {
      color: #9ffcff;
      text-decoration: none;
      font-weight: 700;
      margin-right: 8px;
    }
  </style>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="./modules/svr_quest_locomotion_teleport.js"></script>

  <script>
    (function () {
      "use strict";

      var LINK_DATA = {"game":[{"label":"MAIN LOBBY","href":"./index.html","status":"live"},{"label":"SCORPION POKER","href":"./scorpion.html","status":"live"},{"label":"PGA HUB","href":"./pga.html","status":"live"},{"label":"SMOKER LOUNGE","href":"./smoker-lounge.html","status":"live"},{"label":"REIKI PLACEHOLDER","href":"./reiki.html","status":"live"}],"store":[{"label":"PUBLIC HOME / MATRIX","href":"../index.html","status":"live"},{"label":"WEB STORE PAGE","href":"../site/store.html","status":"live"},{"label":"SHOP PAGE - PLACEHOLDER","href":"","status":"placeholder"},{"label":"SUPPORT PAGE - PLACEHOLDER","href":"","status":"placeholder"},{"label":"SPONSOR / PARTNER PAGE - PLACEHOLDER","href":"","status":"placeholder"}],"apps":[{"label":"POKER APP TILE - DRAFT","href":"./scorpion.html","status":"live"},{"label":"VR STORE PORTAL - EDIT ME","href":"./store-room.html","status":"live"},{"label":"SPONSOR CONSOLE - PLACEHOLDER","href":"","status":"placeholder"},{"label":"CHARITY / GIVEBACK - PLACEHOLDER","href":"","status":"placeholder"},{"label":"ADMIN / ANALYTICS - LOCKED","href":"","status":"placeholder"}]};
      var PHASE_LABEL = "Phase 250 App Hub Test Build";

      function waitForAFrame(callback) {
        if (window.AFRAME) {
          callback();
        } else {
          window.setTimeout(function () {
            waitForAFrame(callback);
          }, 80);
        }
      }

      waitForAFrame(function () {
        if (!AFRAME.components["svr-open-link"]) {
          AFRAME.registerComponent("svr-open-link", {
            schema: {
              href: { type: "string", default: "" },
              label: { type: "string", default: "" }
            },

            init: function () {
              var el = this.el;
              var href = this.data.href;

              var open = function () {
                if (!href) {
                  el.setAttribute("material", "color: #44324f; emissive: #331022; emissiveIntensity: 0.7");
                  window.setTimeout(function () {
                    el.setAttribute("material", "color: #261b32; emissive: #100914; emissiveIntensity: 0.35");
                  }, 220);
                  return;
                }

                window.location.href = href;
              };

              el.addEventListener("click", open);
              el.addEventListener("mouseup", open);
              el.addEventListener("triggerup", open);
              el.addEventListener("selectend", open);
              el.addEventListener("touchend", open);
            }
          });
        }

        if (!AFRAME.components["svr-app-hub-builder"]) {
          AFRAME.registerComponent("svr-app-hub-builder", {
            init: function () {
              var scene = this.el;

              function make(name, attrs, parent) {
                var e = document.createElement(name);
                Object.keys(attrs || {}).forEach(function (key) {
                  e.setAttribute(key, attrs[key]);
                });
                (parent || scene).appendChild(e);
                return e;
              }

              function addText(parent, value, position, width, color, wrap) {
                return make("a-text", {
                  value: value,
                  position: position,
                  width: width || "4",
                  align: "center",
                  color: color || "#ffffff",
                  "wrap-count": wrap || "30"
                }, parent);
              }

              function panel(id, title, subtitle, position, rotation, color) {
                var root = make("a-entity", {
                  id: id,
                  position: position,
                  rotation: rotation || "0 0 0"
                }, scene);

                make("a-plane", {
                  width: "3.9",
                  height: "3.35",
                  position: "0 0 0",
                  color: color || "#17102a",
                  material: "shader: standard; roughness: 0.55; metalness: 0.05; emissive: #080314; emissiveIntensity: 0.28"
                }, root);

                make("a-plane", {
                  width: "3.68",
                  height: "3.12",
                  position: "0 0 0.014",
                  color: "#090415",
                  material: "transparent: true; opacity: 0.8"
                }, root);

                addText(root, title, "0 1.34 0.04", "3.55", "#9ffcff", "24");
                addText(root, subtitle, "0 1.08 0.04", "3.45", "#e9defc", "34");

                return root;
              }

              function button(parent, item, y, accent) {
                var href = item.href || "";
                var live = !!href;
                var label = item.label || "PLACEHOLDER";

                var plane = make("a-plane", {
                  class: "clickable",
                  position: "0 " + y + " 0.06",
                  width: "3.22",
                  height: "0.39",
                  color: live ? (accent || "#2d1f55") : "#261b32",
                  material: "shader: standard; roughness: 0.45; emissive: " + (live ? "#12364a" : "#100914") + "; emissiveIntensity: " + (live ? "0.42" : "0.28"),
                  "svr-open-link": "href: " + href + "; label: " + label
                }, parent);

                addText(plane, label, "0 -0.055 0.028", "3.0", live ? "#ffffff" : "#cfc7df", "34");

                if (!live) {
                  addText(plane, "awaiting route", "1.12 -0.155 0.029", "1.0", "#9b8fb3", "18");
                }

                return plane;
              }

              make("a-sky", { color: "#05010c" }, scene);

              make("a-plane", {
                id: "svr-app-hub-floor",
                position: "0 0 0",
                rotation: "-90 0 0",
                width: "13",
                height: "13",
                color: "#0b0716",
                material: "shader: standard; roughness: 0.92; metalness: 0.02"
              }, scene);

              make("a-plane", {
                id: "svr-app-hub-back-wall",
                position: "0 2 -5.35",
                width: "13",
                height: "4.3",
                color: "#120920",
                material: "shader: standard; roughness: 0.82; emissive: #06020c; emissiveIntensity: 0.36"
              }, scene);

              make("a-plane", {
                id: "svr-app-hub-left-wall",
                position: "-6.5 2 0",
                rotation: "0 90 0",
                width: "10.5",
                height: "4.3",
                color: "#10081c",
                material: "shader: standard; roughness: 0.84"
              }, scene);

              make("a-plane", {
                id: "svr-app-hub-right-wall",
                position: "6.5 2 0",
                rotation: "0 -90 0",
                width: "10.5",
                height: "4.3",
                color: "#10081c",
                material: "shader: standard; roughness: 0.84"
              }, scene);

              make("a-entity", {
                light: "type: ambient; color: #8a78b8; intensity: 0.58"
              }, scene);

              make("a-entity", {
                light: "type: directional; color: #ffffff; intensity: 0.72",
                position: "1 5 2"
              }, scene);

              make("a-entity", {
                light: "type: point; color: #7dfaff; intensity: 0.9; distance: 9",
                position: "0 2.9 -1.5"
              }, scene);

              var title = make("a-entity", { position: "0 3.45 -5.05" }, scene);
              addText(title, "SVR APP HUB / STORE ROOM", "0 0 0", "6.2", "#ffffff", "26");
              addText(title, PHASE_LABEL + " - editable Quest check room", "0 -0.42 0", "5.8", "#9ffcff", "40");

              var gamePanel = panel(
                "svr-game-room-panel",
                "GAME ROOMS",
                "Current private scene portals",
                "-4.15 2.0 -3.28",
                "0 35 0",
                "#18102d"
              );

              LINK_DATA.game.forEach(function (item, i) {
                button(gamePanel, item, 0.62 - i * 0.43, "#263d8f");
              });

              var storePanel = panel(
                "svr-store-site-panel",
                "STORE / SITE PAGES",
                "Website pages surfaced as safe VR launch panels",
                "0 2.0 -4.55",
                "0 0 0",
                "#15132c"
              );

              LINK_DATA.store.forEach(function (item, i) {
                button(storePanel, item, 0.62 - i * 0.43, "#194a55");
              });

              var appPanel = panel(
                "svr-app-placeholder-panel",
                "APP HUB DRAFT",
                "Temporary modules you can edit after Quest review",
                "4.15 2.0 -3.28",
                "0 -35 0",
                "#18102d"
              );

              LINK_DATA.apps.forEach(function (item, i) {
                button(appPanel, item, 0.62 - i * 0.43, item.href ? "#244d5a" : "#2d1f55");
              });

              make("a-ring", {
                position: "0 0.026 -1.15",
                rotation: "-90 0 0",
                "radius-inner": "0.82",
                "radius-outer": "0.87",
                color: "#7dfaff",
                material: "shader: standard; emissive: #1dd6ff; emissiveIntensity: 0.78"
              }, scene);

              addText(scene, "Stand here. Use Quest controller ray/click, hand pinch, or desktop mouse to open panels.", "0 0.08 -1.15", "4.7", "#e9defc", "44");

              make("a-sphere", {
                id: "svr-store-room-moon",
                position: "-4.9 4.5 -6.2",
                radius: "0.44",
                color: "#d7d4c2",
                material: "shader: standard; emissive: #4d4b3d; emissiveIntensity: 0.36"
              }, scene);

              make("a-sphere", {
                id: "svr-store-room-mars",
                position: "4.9 4.28 -6.35",
                radius: "0.37",
                color: "#b75635",
                material: "shader: standard; emissive: #5c2115; emissiveIntensity: 0.36"
              }, scene);

              make("a-text", {
                id: "svr-phase-250-version-sign",
                value: PHASE_LABEL,
                position: "0 0.22 1.0",
                rotation: "-70 0 0",
                width: "3.8",
                align: "center",
                color: "#9ffcff"
              }, scene);
            }
          });
        }
      });
    })();
  </script>
</head>

<body>
  <div class="fallback">
    <a href="./index.html">Lobby</a>
    <a href="./scorpion.html">Scorpion</a>
    <a href="./app-hub.html">App Hub</a>
    <span>Phase 250 App Hub Test Build</span>
  </div>

  <a-scene
    id="svr-app-hub-scene"
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: true"
    webxr="optionalFeatures: hand-tracking, local-floor, bounded-floor"
    background="color: #05010c"
    svr-quest-locomotion-teleport
    svr-app-hub-builder>

    <a-entity id="svr-player-rig" position="0 0 2.25">
      <a-entity
        id="svr-player-camera"
        camera
        look-controls
        wasd-controls
        position="0 1.6 0">

        <a-cursor
          id="svr-desktop-cursor"
          raycaster="objects: .clickable"
          fuse="false"
          material="color: #9ffcff; shader: flat">
        </a-cursor>
      </a-entity>

      <a-entity
        id="svr-hub-right-ray"
        laser-controls="hand: right"
        raycaster="objects: .clickable"
        line="color: #7dfaff; opacity: .85">
      </a-entity>

      <a-entity
        id="svr-hub-left-ray"
        laser-controls="hand: left"
        raycaster="objects: .clickable"
        line="color: #b68cff; opacity: .65">
      </a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
