<body data-build="PHASE-395-QUEST-BROWSER-TABLE-GAMEPLAY-FIX-LOCK"><div id="status">Preparing the close seated Quest table, stable Eric dealer, visible card play, and improved table lighting…</div><script>
(async()=>{const status=document.getElementById('status'),query=new URLSearchParams(location.search),alreadyClean=query.get('clean')==='1';try{if(!alreadyClean){status.textContent='Clearing the previous Quest table and seating cache…';try{if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(registration=>registration.unregister()))}}catch{}try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)))}}catch{}try{localStorage.setItem('svr_public_cache_epoch','phase395-quest-browser-table-gameplay-fix');localStorage.setItem('svr_quest_cache_epoch','phase395-quest-browser-table-gameplay-fix')}catch{}location.replace(`/game/quest.html?v=phase395&clean=1&t=${Date.now()}`);return}status.textContent='Opening the Phase 395 Quest gameplay test…';const target=new URL('/game/index.html',location.origin);target.searchParams.set('platform','quest');target.searchParams.set('v','phase395');target.searchParams.set('direct','1');target.searchParams.set('autoseat','1');target.searchParams.set('questfix','1');target.searchParams.set('clean','1');target.searchParams.set('t',String(Date.now()));location.replace(target.pathname+target.search)}catch(error){status.textContent='Quest recovery failed to redirect. Reload this page once.';console.error(error)}})();
