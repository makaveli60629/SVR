<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SVR Poker Quest Recovery</title>
<style>
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center}
#status{max-width:560px;padding:22px;text-align:center;font-weight:800;line-height:1.45;color:#dffcff}
</style>
</head>
<body data-build="PHASE-387-QUEST-DIRECT-SEAT-RECOVERY-LOCK">
<div id="status">Loading the direct Oculus table seat…</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const query=new URLSearchParams(location.search);
  const alreadyClean=query.get('clean')==='1';
  try{
    if(!alreadyClean){
      status.textContent='Clearing the old Oculus game cache…';
      try{
        if('serviceWorker' in navigator){
          const registrations=await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration=>registration.unregister()));
        }
      }catch{}
      try{
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.map(key=>caches.delete(key)));
        }
      }catch{}
      try{
        localStorage.setItem('svr_public_cache_epoch','phase387-quest-direct-seat-recovery');
        localStorage.setItem('svr_quest_cache_epoch','phase387-quest-direct-seat-recovery');
      }catch{}
      location.replace(`/game/quest.html?v=phase387&clean=1&t=${Date.now()}`);
      return;
    }
    status.textContent='Opening the seated Quest table…';
    const target=new URL('/game/index.html',location.origin);
    target.searchParams.set('platform','quest');
    target.searchParams.set('v','phase387');
    target.searchParams.set('direct','1');
    target.searchParams.set('autoseat','1');
    target.searchParams.set('questfix','1');
    target.searchParams.set('clean','1');
    target.searchParams.set('t',String(Date.now()));
    location.replace(target.pathname+target.search);
  }catch(error){
    status.textContent='Quest recovery failed to redirect. Reload this page once.';
    console.error(error);
  }
})();
</script>
</body>
</html>
