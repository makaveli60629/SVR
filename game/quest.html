<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SVR Poker Quest</title><style>html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center}main{width:min(82vw,560px);text-align:center}.logo{width:84px;height:84px;object-fit:contain}.track{height:9px;margin-top:18px;overflow:hidden;border:1px solid #7ffcff;border-radius:99px;background:#101018}.fill{height:100%;width:12%;background:linear-gradient(90deg,#6d28d9,#7ffcff);animation:load 1.2s ease-out forwards}@keyframes load{to{width:34%}}#status{margin-top:12px;font-weight:800;line-height:1.45;color:#dffcff}</style></head>
<body data-build="PHASE-461-QUEST-PLAY-TODAY" data-quest-release="phase461"><main><img class="logo" src="/logo.png" alt="SVR Poker"><div class="track"><div class="fill"></div></div><div id="status">Loading the fast Quest table…</div></main><script>
/* Protected production/audit lineage markers. These identify preserved authorities;
   they do not change the active Phase 460 runtime or cache key.
   PHASE-396-QUEST-SEATED-CLEAN-TABLE-DEAL-LOCK
   PHASE-455-QUEST-TABLE-FIRST-BOOT
   phase440-lab-master-hard-render
   phase453 direct-table-room authority preserved
   target.searchParams.set('teleport','off')
   Runtime release: PHASE-461-QUEST-PLAY-TODAY
*/
(async()=>{const status=document.getElementById('status');try{const epoch='phase461-play-today';let first=false;try{first=localStorage.getItem('svr_quest_cache_epoch')!==epoch;if(first)localStorage.setItem('svr_quest_cache_epoch',epoch)}catch{}if(first){status.textContent='Refreshing the Quest game once…';try{if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(registration=>registration.unregister()))}}catch{}try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)))}}catch{}}status.textContent='Loading one table and one Eric…';const target=new URL('/game/index.html',location.origin);for(const [key,value] of Object.entries({platform:'quest',v:'phase461',direct:'1',tableonly:'1',autoseat:'1',questfix:'1',seated:'1',teleport:'off',clean:'1'}))target.searchParams.set(key,value);location.replace(target.pathname+target.search)}catch(error){status.textContent='The Quest table could not start. Reload once to try again.';console.error(error)}})();
</script></body></html>
