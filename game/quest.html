<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>SVR Poker Quest</title><style>html,body{height:100%;margin:0;background:#000;color:#fff;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center}main{width:min(82vw,560px);text-align:center}.logo{width:84px;height:84px;object-fit:contain}.track{height:9px;margin-top:18px;overflow:hidden;border:1px solid #7ffcff;border-radius:99px;background:#101018}.fill{height:100%;width:12%;background:linear-gradient(90deg,#6d28d9,#7ffcff);animation:load 1.2s ease-out forwards}@keyframes load{to{width:34%}}#status{margin-top:12px;font-weight:800;line-height:1.45;color:#dffcff}</style></head>
<body data-build="PHASE-455-QUEST-TABLE-FIRST-BOOT"><main><img class="logo" src="/logo.png" alt="SVR Poker"><div class="track"><div class="fill"></div></div><div id="status">Loading the SVR poker table…</div></main><script>
/* Preserved deployment baseline markers: phase440-lab-master-hard-render, phase453 */
(async()=>{const status=document.getElementById('status'),query=new URLSearchParams(location.search),alreadyClean=query.get('clean')==='1';try{if(!alreadyClean){status.textContent='Starting a fresh table session…';try{if('serviceWorker'in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(registration=>registration.unregister()))}}catch{}try{if('caches'in window){const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)))}}catch{}try{localStorage.setItem('svr_public_cache_epoch','phase455-table-first');localStorage.setItem('svr_quest_cache_epoch','phase455-table-first')}catch{}location.replace(`/game/quest.html?v=phase455&clean=1&t=${Date.now()}`);return}status.textContent='Loading table, Eric, and players…';const target=new URL('/game/index.html',location.origin);for(const [key,value] of Object.entries({platform:'quest',v:'phase455',direct:'1',tableonly:'1',autoseat:'1',questfix:'1',seated:'1',teleport:'off',clean:'1'}))target.searchParams.set(key,value);target.searchParams.set('t',String(Date.now()));location.replace(target.pathname+target.search)}catch(error){status.textContent='The table could not start. Reload once to try again.';console.error(error)}})();
</script></body></html>
