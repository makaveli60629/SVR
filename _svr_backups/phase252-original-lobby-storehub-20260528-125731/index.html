<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SVR Lobby / Store Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="./modules/svr_quest_locomotion_teleport.js"></script>
<script src="./modules/svr_lobby_store_hub.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#05010c;overflow:hidden}
.fallback{position:fixed;left:16px;bottom:16px;z-index:5;color:white;font:14px system-ui;background:rgba(0,0,0,.6);padding:10px 12px;border-radius:12px}
.fallback a{color:#9ffcff}
</style>
</head>
<body>
<div class="fallback">
SVR Lobby Restored |
<a href="../site/store.html">Store</a> |
<a href="../site/profile.html">Profile</a> |
<a href="../index.html">Public</a>
</div>

<a-scene background="color:#05010c" vr-mode-ui="enabled:true" webxr="optionalFeatures: hand-tracking, local-floor, bounded-floor">
<a-sky color="#05010c"></a-sky>

<a-plane position="0 0 0" rotation="-90 0 0" width="14" height="14" color="#0b0716"></a-plane>
<a-plane position="0 2 -5.05" width="14" height="4" color="#120920"></a-plane>
<a-plane position="-7 2 0" rotation="0 90 0" width="10" height="4" color="#10081c"></a-plane>
<a-plane position="7 2 0" rotation="0 -90 0" width="10" height="4" color="#10081c"></a-plane>

<a-text value="SVR ORIGINAL LOBBY / STORE FRONT" position="0 3.25 -4.9" align="center" color="#fff" width="7"></a-text>
<a-text value="Private rooms, portal hub, example store items, Quest locomotion repaired." position="0 2.9 -4.9" align="center" color="#9ffcff" width="6"></a-text>

<a-entity position="-3.8 1.7 -3.7" rotation="0 35 0">
<a-plane width="3.4" height="2.8" color="#18102d"></a-plane>
<a-text value="PRIVATE VR ROOMS" position="0 1 .05" align="center" color="#9ffcff" width="3"></a-text>
<a-text value="Scorpion Poker\nPGA Hub\nSmoker Lounge\nReiki Room\nVR Store Portal" position="0 .25 .05" align="center" color="#fff" width="3"></a-text>
</a-entity>

<a-entity position="0 1.7 -4.35">
<a-plane width="3.6" height="2.8" color="#15132c"></a-plane>
<a-text value="STORE HUB" position="0 1 .05" align="center" color="#9ffcff" width="3"></a-text>
<a-text value="Example Items:\nAvatar Watch Skin\nPremium Chip Set\nCard Back Pack\nLobby Table Theme\nEvent Drop Pass" position="0 .15 .05" align="center" color="#fff" width="3"></a-text>
</a-entity>

<a-entity position="3.8 1.7 -3.7" rotation="0 -35 0">
<a-plane width="3.4" height="2.8" color="#18102d"></a-plane>
<a-text value="SITE MODULES" position="0 1 .05" align="center" color="#9ffcff" width="3"></a-text>
<a-text value="Profile\nInventory\nDashboard\nMembership\nSponsor Hub" position="0 .25 .05" align="center" color="#fff" width="3"></a-text>
</a-entity>

<a-ring position="0 .03 -1.25" rotation="-90 0 0" radius-inner=".78" radius-outer=".83" color="#7dfaff"></a-ring>
<a-text value="Stand here. Right controller moves forward where camera faces. Grip = fist move. Trigger release = leap." position="0 .12 -1.25" align="center" color="#fff" width="5"></a-text>

<a-sphere position="-4.8 4.5 -6" radius=".42" color="#d7d4c2"></a-sphere>
<a-sphere position="4.8 4.25 -6.2" radius=".36" color="#b75635"></a-sphere>

<a-entity light="type:ambient;color:#8a78b8;intensity:.55"></a-entity>
<a-entity light="type:directional;color:#fff;intensity:.7" position="1 5 2"></a-entity>

<a-entity id="svr-player-rig" position="0 0 2.25" svr-camera-forward-driver>
<a-entity id="svr-player-camera" camera look-controls wasd-controls position="0 1.6 0">
<a-cursor raycaster="objects:.clickable" fuse="false"></a-cursor>
</a-entity>
<a-entity laser-controls="hand:right" raycaster="objects:.clickable" line="color:#7dfaff"></a-entity>
<a-entity laser-controls="hand:left" raycaster="objects:.clickable" line="color:#b68cff"></a-entity>
</a-entity>
</a-scene>
</body>
</html>
