<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>SVR Poker • Phase 253 Full Boot Fix</title>
<meta name="theme-color" content="#050508"/>
<link rel="manifest" href="./manifest.json"/>
<style>
html,body{height:100%;margin:0;background:#000;overflow:hidden;font-family:system-ui,Segoe UI,Arial,sans-serif}
#app{position:fixed;inset:0}
#hud{position:fixed;left:12px;right:12px;top:12px;z-index:10;display:flex;gap:10px;justify-content:space-between;pointer-events:none}
.pill,.btn{border:1px solid rgba(180,140,255,.45);background:rgba(0,0,0,.58);color:#fff;border-radius:999px;padding:8px 12px;font-size:12px}
.btn{pointer-events:auto;cursor:pointer}
#sceneNav{position:fixed;left:12px;right:12px;bottom:12px;z-index:12;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.scene-btn{border:1px solid rgba(120,255,186,.42);background:rgba(2,10,8,.72);color:#eafff4;border-radius:999px;padding:8px 12px;cursor:pointer;font-size:12px}
#log{position:fixed;left:12px;right:12px;bottom:60px;z-index:20;display:none;max-height:38vh;overflow:auto;background:rgba(0,0,0,.75);color:#d7d7ff;border:1px solid rgba(180,140,255,.3);border-radius:14px;padding:10px;font:12px monospace;white-space:pre-wrap}
#err{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.92);color:white;padding:18px;font:13px monospace;white-space:pre-wrap;overflow:auto}
#storeHub{position:fixed;right:14px;bottom:58px;z-index:15;width:min(360px,calc(100vw - 28px));color:white;background:rgba(5,2,15,.72);border:1px solid rgba(127,250,255,.35);border-radius:18px;padding:12px;backdrop-filter:blur(10px)}
#storeHub h2{margin:0 0 6px;color:#9ffcff;font-size:15px;letter-spacing:.08em}
#storeHub p{margin:0 0 10px;line-height:1.35}
#storeHub a{display:inline-block;margin:2px;color:#9ffcff;text-decoration:none;border:1px solid rgba(159,252,255,.28);border-radius:999px;padding:6px 9px;background:rgba(0,0,0,.35)}
</style>

</script>
</head>

  <button class="scene-btn" data-scene="seat">Seat</button>
  <button class="scene-btn" data-scene="reiki">Reiki Hub</button>
  <button class="scene-btn" data-route="./reiki.html">Reiki Room</button>
  <button class="scene-btn" data-scene="pga">PGA Hub</button>
  <button class="scene-btn" data-route="./pga-drive.html">PGA Drive</button>
  <button class="scene-btn" data-route="./chip-putt.html">Chip/Putt</button>
  <button class="scene-btn" data-route="./store-room.html">VR Store</button>
  <button class="scene-btn" data-scene="sponsor">Sponsor</button>
  <button class="scene-btn" data-route="./scorpion.html">Scorpion</button>
