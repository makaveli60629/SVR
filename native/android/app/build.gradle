plugins {
    id 'com.android.application'
}

android {
    namespace 'com.svrpoker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.svrpoker.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.0-rc2'
    }

    buildTypes {
        debug {
            debuggable false
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}
