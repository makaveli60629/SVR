plugins {
    id 'com.android.application'
}

android {
    namespace 'com.svrpoker.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.svrpoker.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.0-rc2'
    }

    signingConfigs {
        svrTest {
            storeFile file('svr-demo-debug.keystore')
            storePassword 'android'
            keyAlias 'svrdebug'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.svrTest
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}
